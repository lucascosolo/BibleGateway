<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Jot">
  <!--
    The app icon is the wordmark's own j: the first path and the tittle of WORDMARK_GEOMETRY in
    components/Wordmark.tsx, stroke width 8 with round caps, scaled 6x and centred. Same two brand
    colours as the wordmark, resolved from the globals.css tokens (see app/og/route.tsx for the
    conversions): color-bg #fbf6ee, color-brand #14655d (the stroke), color-rubric #be260b (the
    tittle, never fused with the letter). Edit the geometry in Wordmark.tsx and regenerate the
    PNGs under public/icons with the magick commands recorded in docs/brand.md.
    The mark sits inside the central 80 percent so a maskable crop keeps it whole.
  -->
  <rect width="512" height="512" rx="116" fill="#fbf6ee"/>
  <g transform="translate(190 68) scale(6)">
    <path d="M20 20 V48 Q20 60 8 60 Q3 60 1 57" fill="none" stroke="#14655d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="9" r="5" fill="#be260b"/>
  </g>
</svg>
