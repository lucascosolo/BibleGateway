id = "gallio-inscription"
name = "Delphi inscription of Claudius naming Gallio"
kind = "inscription"
status = "draft"
language = "Greek"
summary = """
An inscription places Gallio as proconsul of Achaea (Acts 18:12) in the twelfth year of Claudius, which began on 25 January 52. Carson and Moo say inscriptions fix his term from July 51 to July 52. The inscription's find-spot, publication and holding museum are not given in the filed sources."""
citations = [{ source = "brown-1997", locator = "ch. 16, Second and Third Missionary Journeys" }, { source = "carson-moo-2005", locator = "p. 366 and n. 38" }]
verses = [{ ref = "Acts.18.12", link = "dates", note = "Acts 18:12 names Gallio as proconsul of Achaia when Paul is brought before him, which lets the inscription date that scene." }]
