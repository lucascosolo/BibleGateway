id = "gallio-inscription"
name = "Delphi inscription of Claudius naming Gallio"
kind = "inscription"
status = "draft"
language = "Greek"
summary = """
An inscription places Gallio as proconsul of Achaea (Acts 18:12) in the twelfth year of Claudius, which began on 25 January 52. Carson and Moo say inscriptions fix his term from July 51 to July 52. Deissmann's 1912 study notes that Bourguet published the fragments in 1905 (Nikitsky had printed one in 1894-95); the decisive figure is Claudius's twenty-sixth acclamation as imperator, which puts the letter between the end of 51 (more probably the start of 52) and 1 August 52 (pp. 240, 248-250). Deissmann concluded that Gallio took office about midsummer 51, so Paul reached Corinth early in 50 (p. 256). The holding museum is not given in the filed sources."""
citations = [{ source = "brown-1997", locator = "ch. 16, Second and Third Missionary Journeys" }, { source = "carson-moo-2005", locator = "p. 366 and n. 38" }, { source = "deissmann-1912-paul", locator = "pp. 240, 248-250, 256 (Appendix I, the proconsulate of Gallio)" }]
verses = [{ ref = "Acts.18.12", link = "dates", note = "Acts 18:12 names Gallio as proconsul of Achaia when Paul is brought before him, which lets the inscription date that scene." }]
