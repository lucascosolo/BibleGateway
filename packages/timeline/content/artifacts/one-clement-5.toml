summary = """
A letter to the church at Corinth names Peter, who "endured not one or two but many labours" and, "having delivered his testimony, departed unto the place of glory due to him", and Paul, a herald "both in the East and in the West", who "having borne witness before rulers, he departed at length out of the world" (Hoole translation). It gives no place or year."""
