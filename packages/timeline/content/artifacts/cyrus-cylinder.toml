summary = """
A clay cylinder of Cyrus after his conquest of Babylon. It speaks of restoring deities and returning displaced peoples to Mesopotamian sites but, as Wikipedia summarises, mentions no Jews, Jerusalem or Judea; whether it bears on Ezra 1 is disputed (Kuhrt calls the restoration passage a literary device)."""
