id = "cyrus-cylinder"
name = "Cyrus Cylinder"
kind = "inscription"
status = "draft"
made = { earliest = -539, latest = -530 }
language = "Akkadian (cuneiform)"
summary = """
A clay cylinder of Cyrus, made after he conquered Babylon. It speaks of restoring gods and sending displaced peoples back to sites in Mesopotamia. As Wikipedia summarises, it mentions no Jews, Jerusalem or Judea. Whether it bears on Ezra 1 is disputed. Kuhrt calls the restoration passage a literary device."""
discovered = { year = 1879, place = "Babylon (Hormuzd Rassam)" }
held_by = { institution = "British Museum", accession = "BM 90920" }
citations = [
  { source = "wikipedia-cyrus-cylinder" },
  { source = "livius-cyrus-cylinder" },
]
verses = [{ ref = "Ezra.1.1-Ezra.1.4", link = "background", note = "Cyrus's proclamation" }]
