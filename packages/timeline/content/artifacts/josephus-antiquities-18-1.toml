name = "Josephus, Antiquities 18.1–2 (the census of Cyrenius)"
kind = "literary-text"
status = "draft"
language = "Greek"
summary = """
Josephus says Cyrenius (Quirinius), a Roman senator, came into Syria, and that Caesar sent him "to take an account of their substance". Coponius was sent to hold supreme power over the Jews, since Judea had been added to the province of Syria after Archelaus was removed. Antiquities 17.342–355 puts that removal in the tenth year of Archelaus's rule."""
