summary = """
Josephus says Cyrenius (Quirinius), a Roman senator, came into Syria sent by Caesar "to take an \
account of their substance", with Coponius sent to hold supreme power over the Jews; Judea had \
been added to the province of Syria after Archelaus's removal. Antiquities 17.342–355 puts that \
removal in the tenth year of Archelaus's rule."""
