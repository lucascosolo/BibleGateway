language = "Latin"
summary = """
A triumphal arch on the Via Sacra in Rome, southeast of the Forum, built by Domitian c. 81 CE after Titus's death. One panel shows the spoils taken from the Temple in Jerusalem, with the golden menorah in front, and the other shows Titus as the victor in his triumph. The inscription dedicates the arch to the deified Titus Vespasian Augustus, son of the deified Vespasian."""
