  { ref = "Ezra.7.6", link = "background", note = "Ezra 7:6 introduces Ezra as a ready scribe in the law of Moses, the figure the apocalypse makes the restorer of all scripture." },
  { ref = "Neh.8.1-Neh.8.3", link = "background", note = "Nehemiah 8:1-3 has Ezra read the law to the assembled people, the public reading that 4 Ezra turns into a public and a secret collection." },
