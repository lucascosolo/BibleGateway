summary = """
A Jewish apocalypse written between 70 and 100 CE, after the destruction of the Temple, and preserved in Latin and other versions, 4 Ezra closes with a legend in which Ezra, inspired by God, dictates the lost scriptures afresh to five scribes. In the King James Apocrypha the scribes write for forty days "two hundred and four books", the Vulgate's reading, where the Syriac, Ethiopic, Arabic and Armenian versions read ninety-four, as Ryle (1892) noted; God then tells Ezra, "The first that thou hast written publish openly, that the worthy and unworthy may read it" ... "But keep the seventy last, that thou mayest deliver them only to such as be wise among the people" ... "For in them is the spring of understanding, the fountain of wisdom, and the stream of knowledge." Lim calls the twenty-four public books the twenty-four-book canon "attested for the first time" here, the count that became normative in rabbinic Judaism and that Jerome reports "some" used. Ryle (1892) gives this chapter as the source of the later legend that Ezra dictated from memory the books destroyed with Jerusalem."""
