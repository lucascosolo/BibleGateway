made = { earliest = 70, latest = 100 }
summary = """
A Jewish apocalypse written between 70 and 100 CE, after the destruction of the Temple, and preserved in Latin and other versions, 4 Ezra closes with a legend in which Ezra, inspired by God, dictates the lost scriptures afresh to five scribes. In the King James Apocrypha the scribes write for forty days "two hundred and four books", a corruption of the ninety-four of the older versions; God then tells Ezra, "The first that thou hast written publish openly, that the worthy and unworthy may read it" ... "But keep the seventy last, that thou mayest deliver them only to such as be wise among the people" ... "For in them is the spring of understanding, the fountain of wisdom, and the stream of knowledge." Twenty-four books for everyone and seventy for the wise is the earliest explicit count of twenty-four, the number that the rabbis and Jerome also use, and the passage is the classic statement of the tradition that Ezra restored the scriptures after the exile."""
