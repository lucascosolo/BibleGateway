id = "origen-list-of-the-books"
name = "Origen on the twenty-two books and the four Gospels, quoted by Eusebius"
kind = "literary-text"
status = "claims-checked"
language = "Greek"
summary = """
Eusebius quotes two passages of Origen, the scholar of Alexandria and Caesarea, about 185-254. From the commentary on the first Psalm: "It should be stated that the canonical books, as the Hebrews have handed them down, are twenty-two; corresponding with the number of their letters." Origen then lists them with their Hebrew titles transliterated into Greek, from "Genesis, but by the Hebrews, from the beginning of the book, Bresith" through Esther, adding "And besides these there are the Maccabees, which are entitled Sarbeth Sabanaiel." From the commentary on Matthew, Eusebius reports that Origen, "maintaining the Canon of the Church, he testifies that he knows only four Gospels", and quotes him on their order and authors, Matthew first "for the converts from Judaism", then Mark, Luke and John. Origen counts Peter's second letter doubtful and reports the uncertainty about who wrote Hebrews: "who wrote the epistle, in truth, God knows.""""
