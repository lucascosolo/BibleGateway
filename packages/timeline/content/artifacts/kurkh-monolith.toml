made = { earliest = -853, latest = -852 }
language = "Akkadian (cuneiform)"
summary = """
An Assyrian stele recording Shalmaneser III's campaign of 853 BCE and the battle of Qarqar. \
Among the coalition ranged against him it lists "Ahab the Israelite" (A-ha-ab-bu Sir-ila-a-a) \
with 2,000 chariots and 10,000 foot soldiers."""
