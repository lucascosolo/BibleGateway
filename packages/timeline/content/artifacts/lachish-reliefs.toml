summary = """
These carved wall panels from Room XXXVI of Sennacherib's South-West Palace at Nineveh show the Assyrian siege and capture of the Judahite city of Lachish: siege ramps and engines, the fall of the city, and its people led away as captives."""
discovered = { place = "South-West Palace, Nineveh (excavated by Austen Henry Layard)" }
