id = "caiaphas-ossuary"
name = "Caiaphas ossuary"
kind = "inscription"
status = "draft"
language = "Hebrew script"
summary = """
An ornate limestone bone box found in December 1990 in a burial cave in south Jerusalem. One side is inscribed "Yehosef bar Qayafa" ("Joseph son of Caiaphas"). Another side reads "Yehosef bar Qafa". Many identify it with the high priest Joseph Caiaphas. Others point to the spelling, the lack of a priestly title and the plain tomb."""
discovered = { year = 1990, place = "Jerusalem, Peace Forest / North Talpiot" }
held_by = { institution = "Israel Museum, Jerusalem" }
