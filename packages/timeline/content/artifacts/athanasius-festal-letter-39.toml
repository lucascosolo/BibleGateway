made = { earliest = 367, latest = 367 }
summary = """
In his Easter letter for the year 367, Athanasius, bishop of Alexandria, set out the books to be read in his churches. For the Old Testament: "There are, then, of the Old Testament, twenty-two books in number; for, as I have heard, it is handed down that this is the number of the letters among the Hebrews", and the list that follows runs from Genesis to Daniel, counting Ruth with Judges and Baruch and the Letter with Jeremiah, and omitting Esther. For the New Testament: "These are, the four Gospels, according to Matthew, Mark, Luke, and John. Afterwards, the Acts of the Apostles and Epistles (called Catholic), seven, viz. of James, one; of Peter, two; of John, three; after these, one of Jude. In addition, there are fourteen Epistles of Paul... And besides, the Revelation of John." He concludes: "These are fountains of salvation, that they who thirst may be satisfied with the living words they contain. In these alone is proclaimed the doctrine of godliness. Let no man add to these, neither let him take ought from these." A further group, "not indeed included in the Canon, but appointed by the Fathers to be read by those who newly join us", names the Wisdom of Solomon, Sirach, Esther, Judith, Tobit, the Didache and the Shepherd. This is the first surviving list whose New Testament exactly matches the twenty-seven books used today."""
