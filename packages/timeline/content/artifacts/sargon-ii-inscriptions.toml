id = "sargon-ii-inscriptions"
name = "Inscriptions of Sargon II (Samaria claim)"
kind = "inscription"
status = "sources-located"
language = "Akkadian (cuneiform)"
summary = """
Sargon II's royal inscriptions claim he conquered Samaria and led away 27,290 people. Who actually captured the city is argued under the event. Luckenbill's Ancient Records prints two of the texts, and Oppenheim's ANET translation (pp. 284-285) gives the same figure. In the Annals, first year, the figure is restored: "[27,290 people, who lived therein] I carried away; 50 chariots for my royal equipment, I selected from [among them]" (the bracketed words are the editor's restoration). The Display Inscription has it intact: "I besieged and captured Samaria, carrying off 27,290 of the people who dwelt therein.""""
citations = [
  { source = "luckenbill-arab-2", locator = "§ 4 (Annals, year 1, restored); § 55 (Display Inscription)" },
  { source = "pritchard-1969", locator = "pp. 284–285 (Annals, first year; Display Inscription), trans. A. Leo Oppenheim" }]
verses = [{ ref = "2Kgs.17.6", link = "background" }]
