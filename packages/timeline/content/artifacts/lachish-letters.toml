id = "lachish-letters"
name = "Lachish Letters"
kind = "ostracon"
status = "claims-checked"
made = { earliest = -589, latest = -588 }
language = "Hebrew (paleo-Hebrew script)"
summary = """
These are messages written in ink on pieces of broken pottery, found in the gate area of Lachish and dated to the last years before the Babylonian conquest, "perhaps in the autumn of 589 (or 588) B.C." in Albright's ANET wording (p. 322). In Ostracon IV an officer writes: "we are watching for the signals of Lachish, according to all the indications which my lord hath given, for we cannot see Azekah" (Albright's ANET translation, p. 322). This matches Jeremiah 34:7, where Lachish and Azekah are the last fortified cities of Judah still holding out."""
discovered = { year = 1935, place = "Tell ed-Duweir (Lachish), excavated by James Leslie Starkey" }
citations = [{ source = "pritchard-1969", locator = "pp. 321–322 (introduction p. 321: Tell ed-Duweir, Starkey 1935; p. 322: the Israelite gate-tower, autumn 589 (or 588), Ostracon IV), trans. W. F. Albright" }]
verses = [{ ref = "Jer.34.7", link = "background", note = "Jeremiah 34:7 says Lachish and Azekah were the fortified cities of Judah still holding out against Babylon, the situation the Lachish letters reflect." }]
