id = "lachish-letters"
name = "Lachish Letters"
kind = "ostracon"
status = "draft"
made = { earliest = -590, latest = -586 }
language = "Hebrew (paleo-Hebrew script)"
summary = """
Messages written in ink on pieces of broken pottery, found in the gate area of Lachish. They date from the last years before the Babylonian conquest (c. 590 BCE). In Letter 4 an officer writes: "we are watching for the fire signals of Lachish … because we cannot see Azekah". Albright's ANET translation reads: "we are watching for the signals of Lachish, according to all the indications which my lord hath given, for we cannot see Azekah" (p. 322). This matches Jeremiah 34:7, where Lachish and Azekah are the last fortified cities of Judah still holding out."""
discovered = { year = 1935, place = "Tell ed-Duweir (Lachish), excavated by James Leslie Starkey" }
held_by = { institution = "British Museum (most); Israel Museum (Letter 6 and others)", accession = "ME 125701–125707, 125715a" }
citations = [{ source = "wikipedia-lachish-letters" }, { source = "pritchard-1969", locator = "pp. 321–322 (introduction p. 321; Ostracon IV p. 322), trans. W. F. Albright" }]
verses = [{ ref = "Jer.34.7", link = "background", note = "Lachish and Azekah remain" }]
