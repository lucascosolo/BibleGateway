id = "black-obelisk"
name = "Black Obelisk of Shalmaneser III"
kind = "inscription"
status = "draft"
made = { earliest = -827, latest = -824 }
language = "Akkadian (cuneiform)"
summary = """
A black limestone obelisk about 1.98 m high from Nimrud. It records the tribute of 'Iaua (Jehu) son of (the people of the land of) Omri' and pictures a tribute-bearer, the only portrayal in ancient Near Eastern art of an Israelite or Judaean monarch (Wikipedia's wording). Luckenbill's translation of the second epigraph reads: "Tribute of Iaua (Jehu), son of Omri (mâr Humri). Silver, gold, a golden bowl, a golden beaker, golden goblets, pitchers of gold, lead, staves for the hand of the king, javelins, I received from him." The epigraph gives no regnal year; a separate Shalmaneser text in the same volume records tribute from "Tyre, Sidon and of Jehu, son of Omri" after a march to Mount Ba'li-ra'si, and the annals' eighteenth year (the sixteenth Euphrates crossing, against Hazael) is the campaign modern scholars usually attach it to, a step Luckenbill's text itself does not take."""
discovered = { year = 1846, place = "Nimrud (ancient Kalhu), northern Iraq (A. H. Layard)" }
held_by = { institution = "British Museum", accession = "ME 118885" }
citations = [
  { source = "wikipedia-black-obelisk" },
  { source = "luckenbill-arab-1", locator = "§ 590 (epigraph II); § 575 (year 18, Hazael); the Ba'li-ra'si passage before § 673" },
]
verses = [{ ref = "2Kgs.9.1-2Kgs.9.13", link = "background" }]
