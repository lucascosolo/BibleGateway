id = "black-obelisk"
name = "Black Obelisk of Shalmaneser III"
kind = "inscription"
status = "sources-located"
made = { earliest = -827, latest = -824 }
language = "Akkadian (cuneiform)"
summary = """
A black limestone obelisk about 1.98 m high, from Nimrud, records the tribute of 'Iaua (Jehu) son of (the people of the land of) Omri and also pictures a tribute-bearer. Wikipedia's wording is that this is the only portrayal in ancient Near Eastern art of an Israelite or Judaean monarch. Luckenbill's translation of the second epigraph reads: "Tribute of Iaua (Jehu), son of Omri (mâr Humri). Silver, gold, a golden bowl, a golden beaker, golden goblets, pitchers of gold, lead, staves for the hand of the king, javelins, I received from him." The epigraph gives no regnal year, but a separate Shalmaneser text in the same volume records tribute from "Tyre, Sidon and of Jehu, son of Omri" after a march to Mount Ba'li-ra'si. Modern scholars usually attach it to the campaign of the annals' eighteenth year (the sixteenth Euphrates crossing, against Hazael), and Pritchard's ANET prints the passage under its heading for that eighteenth year. Luckenbill's text itself does not take that step; Thiele does, dating the tribute to "841 B.C., the eighteenth year of Shalmaneser III". Oppenheim's ANET translation of that Ba'li-ra'si passage reads: "At that time I received the tribute of the inhabitants of Tyre, Sidon, and of Jehu, son of Omri" (p. 280). Grayson's translation of the epigraph reads: "I received tribute from Jehu (Iaua) of the house of Omri (Humrî)" (A.0.102.88, p. 149), and he dates it to Shalmaneser's eighteenth regnal year, 841 BC, citing the annals passages A.0.102.8, A.0.102.10 and A.0.102.12. His annals say of that year: "In my eighteenth regnal year I crossed the Euphrates for the sixteenth time" (A.0.102.10 iii 45b)."""
discovered = { year = 1846, place = "Nimrud (ancient Kalhu), northern Iraq (A. H. Layard)" }
