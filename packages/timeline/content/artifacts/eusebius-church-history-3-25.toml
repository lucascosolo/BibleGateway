id = "eusebius-church-history-3-25"
name = "Eusebius, Church History 3.25: the accepted, disputed and spurious writings"
kind = "literary-text"
status = "claims-checked"
language = "Greek"
made = { earliest = 320, latest = 330 }
summary = """
Eusebius of Caesarea, writing in the early fourth century, sorts the Christian writings into classes. "First then must be put the holy quaternion of the Gospels", then the Acts of the Apostles, "the epistles of Paul", the first epistle of John and the epistle of Peter, and "if it really seem proper, the Apocalypse of John", concerning which he promises to give the different opinions later. "These then belong among the accepted writings." Then come the writings "Among the disputed", which are nevertheless "recognized" by many: "the so-called epistle of James", with Jude, 2 Peter and 2 and 3 John. A third class, the rejected writings in McGiffert's translation, holds the Acts of Paul, the Shepherd, the Apocalypse of Peter, Barnabas, the Didache and, "if it seem proper", the Apocalypse of John again, and a fourth holds the heretical gospels. Of Revelation he says that "some, as I said, reject, but which others class with the accepted books." McDonald dates the Church History to about 320-330."""
citations = [
  { source = "npnf2-01-ccel", locator = "Church History 3.25.1-7" },
  { source = "mcdonald-2017-vol1", locator = "p. 95" },
]
verses = [
  { ref = "Jas.1.1", link = "names", note = "James is the first of the letters Eusebius lists as disputed yet recognized by many." },
  { ref = "Rev.1.1", link = "names", note = "Revelation is the book Eusebius places both among the accepted and among the spurious writings." },
  { ref = "Jude.1.1", link = "names", note = "Jude is among the disputed letters in Eusebius's classification." },
]
