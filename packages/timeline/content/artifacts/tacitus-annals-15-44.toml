summary = """
The Roman historian Tacitus is describing Nero's persecution of Christians after the fire of Rome when he explains the name: "auctor nominis eius Christus Tibero imperitante per procuratorem Pontium Pilatum supplicio adfectus erat". In English, Christus, the founder of the name, suffered the extreme penalty in the reign of Tiberius at the hands of the procurator Pontius Pilate. The two online Latin texts cited differ in one word: the Latin Library prints "Tibero" and Perseus prints "Tiberio"."""
