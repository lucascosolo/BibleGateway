summary = """
The Roman historian Tacitus, describing Nero's persecution of Christians after the fire of \
Rome, explains the name: "auctor nominis eius Christus Tiberio imperitante per procuratorem \
Pontium Pilatum supplicio adfectus erat" — Christus, the founder of the name, suffered the \
extreme penalty in the reign of Tiberius at the hands of the procurator Pontius Pilate."""
