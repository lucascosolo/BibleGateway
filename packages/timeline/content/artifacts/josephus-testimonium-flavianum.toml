summary = """
Josephus's paragraph on Jesus begins: "Now there was about this time Jesus, a wise man…". It says Pilate condemned him to the cross "at the suggestion of the principal men amongst us". John P. Meier (1991) reports that most recent opinion holds it is partly genuine, with Christian additions (such as "He was [the] Christ") worked into an original notice, and he offers a reconstruction of that core."""
