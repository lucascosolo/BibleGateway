id = "josephus-antiquities-19-343"
name = "Josephus, Antiquities 19.343–352 (the death of Agrippa I)"
kind = "literary-text"
status = "draft"
language = "Greek"
summary = """
At Caesarea Agrippa appears in a garment wholly of silver; flatterers cry that he is a god; he \
sees an owl on a rope, takes it for a messenger of ill tidings, is seized by a violent pain in \
the belly and dies after five days, in the fifty-fourth year of his age, having reigned four \
years under Caius and three under Claudius (Whiston's translation)."""
