made = { earliest = 26, latest = 37 }
language = "Latin"
summary = """
A limestone block from Caesarea Maritima records a building put up for Tiberius, and its inscription names "[Ponti]us Pilatus … [Praef]ectus Iuda[ea]e", Pontius Pilate, prefect of Judaea. Maria Teresa Fortuna Canivet found it in 1961 in the theatre area, during excavations led by Antonio Frova, and a replica stands at Caesarea. It is dated by Pilate's time as governor (26/27–36/37 CE)."""
discovered = { year = 1961, place = "Caesarea Maritima (theatre area)" }
held_by = { institution = "Israel Museum, Jerusalem" }
