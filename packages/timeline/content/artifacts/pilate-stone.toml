summary = """
A limestone dedication block from Caesarea Maritima recording a building for Tiberius by \
"[Ponti]us Pilatus … [Praef]ectus Iuda[ea]e" — Pontius Pilate, prefect of Judaea. Found in 1961 \
in the theatre area by Maria Teresa Fortuna Canivet, during excavations led by Antonio Frova; a \
replica stands at Caesarea. Dated by Pilate's governorship (26/27–36/37 CE)."""
