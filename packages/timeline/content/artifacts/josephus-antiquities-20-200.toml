summary = """
Josephus reports that the high priest Ananus had "the brother of Jesus who was called Christ, whose name was James" stoned. Modern scholars almost all accept the passage as genuine. (Section 20.200 in the Niese numbering; 20.9.1 in Whiston's.)"""
