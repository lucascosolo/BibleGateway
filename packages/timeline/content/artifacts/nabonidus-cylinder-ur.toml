id = "nabonidus-cylinder-ur"
name = "Nabonidus Cylinder from Ur"
kind = "inscription"
status = "sources-located"
made = { earliest = -556, latest = -539 }
language = "Akkadian (cuneiform)"
summary = """
A clay cylinder buried in the foundations of the ziggurat at Ur was made for Nabonidus, the last king of Babylon. Its closing prayer asks the moon-god to instil reverence in "Belshazzar, the eldest son, my offspring", so it names Belshazzar as the son of Nabonidus."""
discovered = { year = 1854, place = "Ur, southern Iraq (J. G. Taylor)" }
held_by = { institution = "British Museum", accession = "BM 91125" }
citations = [
