id = "bava-batra-14b-order-of-the-books"
name = "Babylonian Talmud, Bava Batra 14b-15a: the order and authors of the books"
kind = "literary-text"
status = "claims-checked"
language = "Hebrew and Aramaic"
made = { earliest = 150, latest = 200 }
summary = """
A baraita, a teaching from the period of the Mishnah, is quoted in the Babylonian Talmud with the earliest rabbinic statement of the order of the prophetic books and the Writings and of who wrote each book. It orders the Prophets as Joshua and Judges, Samuel and Kings, Jeremiah and Ezekiel, and Isaiah and the Twelve Prophets, and the Writings as Ruth and Psalms, Job and Proverbs, Ecclesiastes, Song of Songs and Lamentations, Daniel and Esther, and Ezra and Chronicles. On authorship it says that "Moses wrote his own book, i.e., the Torah, and the portion of Balaam in the Torah, and the book of Job", that Joshua wrote his own book and the eight verses of the Torah that describe the death of Moses, that Samuel wrote his own book, Judges and Ruth, and that Hezekiah's circle and the Men of the Great Assembly wrote out Isaiah, Proverbs, Ezekiel, the Twelve, Daniel and Esther. The Talmud then records the dispute whether Moses or Joshua wrote the last eight verses of the Torah. The list has twenty-four books and no sign of any dispute about which books belong."""
