id = "sennacherib-taylor-prism"
name = "Taylor Prism (annals of Sennacherib)"
kind = "inscription"
status = "draft"
made = { earliest = -691, latest = -691 }
language = "Akkadian (cuneiform)"
summary = """
A clay prism recording Sennacherib's campaigns, including his third campaign into Judah. Two \
parallel copies survive, the Oriental Institute (Chicago) Prism and the Jerusalem Prism (Israel \
Museum). The annals say he besieged and took 46 walled cities of Judah, and that he shut \
Hezekiah up in Jerusalem "like a bird in a cage". They claim tribute from Hezekiah but do not \
claim that Jerusalem was taken."""
