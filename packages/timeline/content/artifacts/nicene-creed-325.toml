id = "nicene-creed-325"
name = "The creed of the council of Nicaea (325)"
kind = "literary-text"
status = "draft"
language = "Greek"
made = { earliest = 325, latest = 325 }
summary = """
The statement of faith the bishops at Nicaea signed. It confesses one God the Father, maker of all things, and one Lord Jesus Christ, "the only-begotten begotten from the Father, that is from the substance of the Father, God from God, light from light, true God from true God, begotten not made, consubstantial [homoousios] with the Father, through whom all things came to be", who came down for our salvation, suffered, rose on the third day and is coming to judge the living and the dead; "and in the holy Spirit". A closing clause anathematises those who say "there once was when he was not", "before he was begotten he was not", or that the Son came to be from nothing or from another substance, or can change. Two phrases quote scripture: "through whom all things came to be" (John 1:3, 1 Corinthians 8:6) and "to judge the living and the dead" (2 Timothy 4:1, 1 Peter 4:5). The word homoousios is not in the Bible, and that was the objection to it. The creed said in church today as "the Nicene Creed" is the revised text of 381, not this one."""
citations = [
  { source = "tanner-1990-nicaea", locator = "The profession of faith of the 318 fathers" },
  { source = "npnf2-14-ccel", locator = "The Nicene Creed (The Ecthesis of the Synod at Nice)" },
  { source = "lyman-2024-nicaea", locator = "section 2.2, The synodal creed of 325" },
]
verses = [
  { ref = "John.1.3", link = "alludes", note = "The creed's 'through whom all things came to be' quotes this verse, as Lyman notes." },
  { ref = "1Cor.8.6", link = "alludes", note = "One God the Father and one Lord Jesus Christ, 'through whom are all things': the creed's opening and its 'through whom' clause follow this verse." },
  { ref = "2Tim.4.1", link = "alludes", note = "'To judge the living and the dead', the phrase the creed uses for the second coming." },
  { ref = "1Pet.4.5", link = "alludes", note = "The second source of 'judge the living and the dead'." },
  { ref = "Ps.2.7", link = "background", note = "'Today I have begotten you', the usual proof text for the Son as begotten. Lyman notes the creed goes beyond it with 'from the substance of the Father'." },
  { ref = "1John.5.20", link = "background", note = "'True God', which Lyman links to the creed's 'true God from true God'." },
  { ref = "Col.1.15", link = "background", note = "'Firstborn of all creation' was in Eusebius of Caesarea's creed and was left out at Nicaea, Lyman says, because 'firstborn' put the Son in an order with creatures." },
]
