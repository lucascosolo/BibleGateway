id = "nabonidus-chronicle-abc7"
name = "Nabonidus Chronicle (ABC 7)"
kind = "chronicle"
status = "draft"
language = "Akkadian (cuneiform)"
summary = """
A Babylonian chronicle of the reign of Nabonidus. For his seventeenth year it records the battle at Opis, and the capture of Sippar "without a battle". It says "Ugbaru, governor of Gutium, and the army of Cyrus, without battle they entered Babylon". It also says Cyrus entered Babylon on the third of Arahsamna. Oppenheim's ANET translation reads: "Gobryas (Ugbaru), the governor of Gutium and the army of Cyrus entered Babylon without battle" (p. 306). The tablet's museum number was not shown on the page read."""
citations = [{ source = "livius-abc7" }, { source = "pritchard-1969", locator = "pp. 305–306, trans. A. Leo Oppenheim" }]
verses = [{ ref = "Dan.5.30-Dan.5.31", link = "background", note = "The night Babylon fell" }]
