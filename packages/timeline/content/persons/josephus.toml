  { source = "josephus-whiston", locator = "Jewish War, Preface 1" },
  { source = "josephus-whiston", locator = "Antiquities 20.11.3" },
  { source = "brown-1997", locator = "ch. 4, The Last Third of the 1st Century AD" },
  { source = "meier-1991", locator = "ch. 3" },
]

[[attestations]]
artifact = "josephus-war-6-249"
relation = "corroborates"
note = """
The Jewish War is Josephus's own account of the war in which he served, first on the Jewish side and then in the Roman camp. Its narrative of the temple's burning is that of a witness, written from the Roman side."""
citations = [
  { source = "josephus-whiston", locator = "Jewish War, Preface 1; 6.4.5" },
  { source = "lexundria-josephus-war-6-249", locator = "6.249–250" },
]

[[attestations]]
artifact = "josephus-against-apion-1-38"
relation = "corroborates"
note = """
Against Apion is Josephus's defence of the antiquity of the Jews. Its count of twenty-two sacred books is the earliest statement of a closed Jewish canon."""
citations = [{ source = "josephus-whiston", locator = "Against Apion 1.8 (sections 37-43 in Niese's numbering)" }]
