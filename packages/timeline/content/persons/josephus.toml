id = "josephus"
name = "Josephus"
also_known_as = ["Flavius Josephus", "Joseph son of Matthias"]
role = "Jewish priest, commander in the revolt against Rome, and historian"
summary = """
Josephus describes himself as Joseph son of Matthias, a priest by birth, who "at first fought against the Romans" and was then "forced to be present at what was done afterwards", the siege and fall of Jerusalem in 70 CE. In his Life he says he was born in the first year of Gaius Caesar. Under the patronage of the Flavian emperors, whose family name he took, he wrote the Jewish War at Rome and, in the early 90s on Brown's dating, the Antiquities, which he says he finished in the thirteenth year of Domitian and the fifty-sixth year of his life. He is the main outside source for the period of the New Testament: Herod's temple, John the Baptist, Pilate, Caiaphas, James the brother of Jesus, Quirinius's census and the burning of the temple. His passage on Jesus survives in a form most scholars hold Christian scribes expanded."""
status = "draft"
events = ["second-temple-destruction"]
