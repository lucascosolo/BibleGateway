id = "elijah"
name = "Elijah"
also_known_as = ["Elijah the Tishbite"]
role = "prophet in the northern kingdom under Ahab and Ahaziah (as Kings tells it)"
summary = """
Kings sets Elijah against Ahab and Jezebel: he announces a drought, defeats the prophets of Baal on Mount Carmel, flees to Horeb, where he is told to anoint Hazael, Jehu and Elisha, and condemns Ahab over Naboth's vineyard before being taken up in a whirlwind. Finkelstein and Silberman call the fall of the house of Omri, in which his prophecies are fulfilled "to the letter", a literary classic, and say that once the anachronisms and the stories of threats issued and prophecies fulfilled are removed, little verifiable history is left beyond the sequence of kings, their building and their wars. They say the cycle of Elijah and Elisha stories was set down in writing long after the fall of the Omrides, and that it expresses the insistence on the worship of YHWH alone that arose in the late eighth century. Malachi and the Gospels look for his return."""
status = "draft"
