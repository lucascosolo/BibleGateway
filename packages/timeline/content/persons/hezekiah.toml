id = "hezekiah"
name = "Hezekiah"
role = "king of Judah (sole reign from 716/715 BCE)"
summary = """
King of Judah during Sennacherib's invasion of 701 BCE. Named in the Assyrian king's own annals \
and on a royal seal impression from Jerusalem. His accession is a known chronological \
problem: Young reconstructs a coregency with Ahaz from 729/728 BCE, a sole reign from 716/715 \
and his death in 687, and notes that Thiele did not recognise the Ahaz–Hezekiah coregency."""
status = "draft"
verses = [{ ref = "2Kgs.18.1-2Kgs.20.21", link = "describes" }]
events = ["sennacherib-campaign-judah"]
citations = [
  { source = "cojs-sennacherib-prisms" },
  { source = "young-2005", locator = "Table 2, p. 246; §3, p. 227" },
  { source = "young-2003", locator = "p. 589" },
]

[[attestations]]
artifact = "sennacherib-taylor-prism"
relation = "corroborates"
note = """
Sennacherib names "Hezekiah the Judahite", who had not submitted to his yoke, and says he \
shut him up in Jerusalem "like a bird in a cage"."""
citations = [
  { source = "bm-taylor-prism" },
  { source = "cojs-sennacherib-prisms" },
]

[[attestations]]
artifact = "hezekiah-bulla-ophel"
relation = "corroborates"
note = """
