[[attestations]]
artifact = "tel-dan-stele"
relation = "in-tension"
note = """
The stele does not name Jehu. As restored, Hazael claims to have killed "[Jeho]ram son of [Ahab] king of Israel" and "[Ahaz]iahu son of [Jehoram kin]g of the House of David", the two kings 2 Kings 9 has Jehu kill. Finkelstein and Silberman suggest Hazael may have seen Jehu as his instrument, or that the two events blurred in memory before Kings was compiled."""
citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 201-202" }]
