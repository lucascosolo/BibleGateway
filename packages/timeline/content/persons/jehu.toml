id = "jehu"
name = "Jehu"
also_known_as = ["Jehu son of Nimshi"]
role = "king of Israel (841–814 BCE in Thiele)"
summary = """
Kings tells how Jehu, an army commander anointed at Elisha's word, killed Jehoram of Israel and Ahaziah of Judah, had Jezebel thrown down, wiped out the house of Ahab and purged Baal worship, while leaving Jeroboam's calves at Bethel and Dan. Outside the Bible, the Black Obelisk shows a figure bowing before Shalmaneser III and records the tribute of "Jehu, son of Omri", which Thiele and Grayson date to Shalmaneser III's eighteenth year, 841 BCE. Thiele dates his reign 841–814, Finkelstein and Silberman 842–814. They read "son of Omri" as naming a vassal of the kingdom Omri founded, not a descendant. The Tel Dan stele, as usually restored, has Hazael of Damascus claim to have killed both kings himself; Finkelstein and Silberman leave open whether it was Hazael or Jehu."""
status = "draft"
verses = [
  { ref = "1Kgs.19.16-1Kgs.19.17", link = "background", note = "1 Kings 19:16–17 has Elijah commanded to anoint Jehu king of Israel." },
  { ref = "2Kgs.9.1-2Kgs.10.36", link = "describes", note = "2 Kings 9–10 tells of Jehu's anointing, his coup and his reign." },
  { ref = "2Kgs.9.24-2Kgs.9.27", link = "describes", note = "2 Kings 9:24–27 has Jehu kill Jehoram of Israel and Ahaziah of Judah, the deaths the Tel Dan stele credits to Hazael." },
  { ref = "2Kgs.10.29-2Kgs.10.33", link = "describes", note = "2 Kings 10:29–33 says Jehu kept Jeroboam's calves and that Hazael took Israel's land east of the Jordan in his days." },
  { ref = "2Kgs.10.36", link = "dates", note = "2 Kings 10:36 gives Jehu a reign of twenty-eight years in Samaria." },
  { ref = "Hos.1.4", link = "alludes", note = "Hosea 1:4 speaks of punishing the house of Jehu for the blood of Jezreel." },
]
events = ["jehu-tribute-841"]
