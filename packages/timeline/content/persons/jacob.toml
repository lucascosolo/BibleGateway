id = "jacob"
name = "Jacob"
also_known_as = ["Israel"]
role = "patriarch, ancestor of the twelve tribes"
summary = """
Jacob, Isaac's son, is renamed Israel and fathers the ancestors of the twelve tribes; at Joseph's invitation he takes his household of seventy into Egypt and settles in Goshen. Whether he was a historical person is argued in the patriarchs issue. Friedman notes that his stories come in pairs, with two revelations at Beth-El and two renamings of Jacob, each pair drawn from a different written source. Finkelstein and Silberman place the writing of the descent and Goshen traditions in the seventh and sixth centuries BCE. Among those who accept the setting, Wood ties an Asiatic settlement at Pi-Ramesse of the mid-19th century BCE to Jacob's family, and Ussher's traditional count, which adds up the Bible's own life-spans, has Jacob go down into Egypt in 1706 BC."""
status = "claims-checked"
verses = [
