id = "james-son-of-zebedee"
name = "James, son of Zebedee"
role = "one of the Twelve; brother of John; executed by Herod Agrippa I"
summary = """
James and his brother John are called sons of Zebedee in Mark, and Meier sees no reason to doubt it: the detail is not used for theology or embroidered with legend, and the final editor of John 21:2 also mentions "the sons of Zebedee". Both brothers stand in the first group of four in all four lists of the Twelve (Mark 3:17, Matt 10:2, Luke 6:14, Acts 1:13). The Synoptic lists put James before John, which many take to mean he was the elder. Mark says Jesus gave the pair the name Boanerges, "sons of thunder". Meier finds the reason for the name unrecoverable: the stories that suggest hot tempers (Mark 9:38-39, Luke 9:52-56) are of doubtful historicity, and he ends with "mere conjecture".

Meier treats the request for seats at Jesus' right and left (Mark 10:35-40) as having a historical core, partly because it shows the brothers in a poor light and Jesus without knowledge or power to grant it. James is the only one of the Twelve whose death the New Testament narrates: Herod Agrippa I had him killed around 44 CE (Acts 12:1-2). Apart from James and Peter, Meier says there is no solid proof that any of the Twelve were martyred. The title "the Great" and the link to Spain are later tradition, the Spain link not before the sixth or seventh century."""
