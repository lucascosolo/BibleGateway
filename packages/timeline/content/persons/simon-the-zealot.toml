id = "simon-the-zealot"
name = "Simon the Zealot"
also_known_as = ["Simon the Cananean"]
role = "one of the Twelve"
summary = """
Simon appears only in the lists of the Twelve. Mark 3:18 and Matt 10:4 call him "the Cananean" (Greek Kananaios, from Aramaic qan'ana', "zealous"); Luke 6:15 and Acts 1:13 translate it as "the Zealot" (Greek zelotes). Critics agree that the two labels name the same man. The designation probably served to tell him apart from the other Simon, Peter.

Meier rejects the claim that Simon belonged to the Zealots, the organized rebel faction that Josephus describes, since that group arose only in the winter of 67-68 CE during the First Jewish War, so the idea is anachronistic. The label instead reflects an older and broader use: a Jew intensely zealous for the Mosaic Law, as Paul was before his call (Gal 1:13-14; Phil 3:6). Meier says we cannot know how Simon showed his zeal or whether it involved violence. His point is that Simon's place in the Twelve beside the toll collector Levi shows Jesus calling people from opposite ends of Israel, not recruiting revolutionaries. Nothing else is known of Simon, and later legends add nothing."""
