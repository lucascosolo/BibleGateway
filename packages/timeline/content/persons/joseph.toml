id = "joseph"
name = "Joseph"
role = "son of Jacob, vizier in Egypt"
summary = """
Joseph, Jacob's son, is sold by his brothers, rises from slavery and prison to be Pharaoh's vizier, and saves Egypt and his family from famine. The story is usually treated apart from the other patriarchal stories, as a single composition (see the patriarchs issue). Finkelstein and Silberman point to Egyptian names in it, such as Potiphar and Asenath, that were most popular in the seventh and sixth centuries. Kitchen, who defends the Bible's reliability, sets the story in the East Delta of about 1860 to 1540 BCE. Ussher's traditional count makes Joseph governor in 1715 BC."""
