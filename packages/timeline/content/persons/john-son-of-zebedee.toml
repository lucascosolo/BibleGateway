id = "john-son-of-zebedee"
name = "John, son of Zebedee"
role = "one of the Twelve; traditional author of the Gospel of John"
summary = """
John appears in Mark as a fisherman called with his brother James, and again when the two brothers ask for places beside Jesus in his glory. Paul names a John among the pillars of the Jerusalem church in Galatians 2:9. No New Testament book says what became of him.

The tradition that he wrote the Fourth Gospel comes from Irenaeus around 180 CE. Irenaeus says John lived at Ephesus until the reign of Trajan. Brown notes that late second-century guesses about figures a century earlier were often simplified. He says most scholars doubt an eyewitness of the ministry wrote the Gospel.

Brown himself thinks the unnamed Beloved Disciple was a minor figure in Jesus' ministry, probably the founder of the Johannine community, and that a later evangelist and redactor from that community wrote the Gospel. On Brown's preferred view the Beloved Disciple was a minor figure in the ministry and not one of the Twelve, which excludes John by implication. Brown still finds an Ephesus-area origin traditional and plausible, though some scholars prefer Syria. Meier finds no firm evidence that John was martyred or persecuted alone, and says that after his role as a Jerusalem pillar around 49 CE we are ignorant of his life and fate."""
