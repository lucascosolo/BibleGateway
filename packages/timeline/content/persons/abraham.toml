id = "abraham"
name = "Abraham"
also_known_as = ["Abram"]
role = "patriarch"
summary = """
Abraham, first called Abram, is the ancestor with whom Genesis begins Israel's story: called from Haran to Canaan, promised land and descendants in a covenant, and father of Isaac. Whether he was a historical person is argued in the patriarchs issue. Critical textual scholars long held that the patriarchal stories were written down under the monarchy or later; Finkelstein and Silberman date their writing to the eighth and seventh centuries BCE from anachronisms such as camels as pack animals and Philistines at Gerar. Albright placed the patriarchs in the 2nd millennium BCE, and Kitchen still argues that many details fit 1900 to 1600 BCE. Ussher's traditional count, which adds up the Bible's own life-spans, has Abraham called from Ur in the Year of the World 2083, the year its margin labels 1921 before Christ."""
status = "claims-checked"
