id = "isaiah"
name = "Isaiah"
also_known_as = ["Isaiah son of Amoz"]
role = "prophet in Jerusalem in the late eighth century BCE; traditionally the author of the book of Isaiah"
summary = """
The book opens by dating Isaiah son of Amoz to the reigns of Uzziah, Jotham, Ahaz and Hezekiah, and Kings and Isaiah 36–37 make him Hezekiah's counsellor during Sennacherib's siege, dated 701 BCE by Thiele. Finkelstein and Silberman treat him as a contemporary witness who was in Jerusalem at the time of the siege. Critical scholarship separates the prophet from most of the book. Friedman says most of chapters 1–39 can fit the eighth-century prophet but chapters 40–66 appear to be by someone about two centuries later; Barton and Finkelstein and Silberman place chapters 40–55, "Second Isaiah", among the exiles of the sixth century, and Barton adds that the eighth-century prophets' words have been overlaid with later additions. The traditional rabbinic attribution, in Bava Batra, does not credit Isaiah with writing the book down but Hezekiah and his colleagues."""
status = "draft"
verses = [
  { ref = "Isa.1.1", link = "dates", note = "Isaiah 1:1 dates the prophet's visions to the reigns of Uzziah, Jotham, Ahaz and Hezekiah." },
  { ref = "Isa.6.1", link = "dates", note = "Isaiah 6:1 dates his call vision to the year King Uzziah died." },
  { ref = "Isa.10.28-Isa.10.32", link = "describes", note = "Isaiah 10:28–32 describes an advance on Jerusalem from the north, which Finkelstein and Silberman read as an eyewitness picture of the Assyrian campaign." },
  { ref = "Isa.22.10", link = "describes", note = "Isaiah 22:10 speaks of houses broken down to fortify the wall, which Finkelstein and Silberman connect with Jerusalem's broad wall." },
  { ref = "2Kgs.19.1-2Kgs.19.7", link = "describes", note = "2 Kings 19:1–7 has Hezekiah send to Isaiah, who answers with an oracle against Sennacherib." },
  { ref = "2Kgs.20.1-2Kgs.20.11", link = "describes", note = "2 Kings 20:1–11 has Isaiah announce Hezekiah's illness and recovery." },
  { ref = "Isa.40.1-Isa.40.2", link = "background", note = "Isaiah 40:1–2 opens the chapters critical scholars attribute to an exilic 'Second Isaiah'." },
  { ref = "Isa.45.1", link = "background", note = "Isaiah 45:1 names Cyrus, the Persian king of the sixth century, as the Lord's anointed." },
]
events = ["sennacherib-campaign-judah"]
