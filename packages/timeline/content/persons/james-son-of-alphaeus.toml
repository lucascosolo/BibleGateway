id = "james-son-of-alphaeus"
name = "James, son of Alphaeus"
role = "one of the Twelve"
summary = """
James "of Alphaeus", probably meaning James the son of Alphaeus, always begins the third group of four names in the lists of the Twelve (Mark 3:18, Matt 10:3, Luke 6:15, Acts 1:13), and the lists agree on him. Meier says that is all we know about him.

Because so many New Testament people are named James (the English name renders Greek Iakobos, "Jacob"), critics have identified him with several of them. Meier finds no grounds for the church tradition that makes him "James the Less" of Mark 15:40. A more tantalizing suggestion is that he and Levi the toll collector, who is also called "of Alphaeus" in Mark 2:14, were brothers. Meier says that is possible but not provable, and that it tells us nothing more unless one assumes Levi is the same man as Matthew."""
