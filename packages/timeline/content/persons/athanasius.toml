id = "athanasius"
name = "Athanasius of Alexandria"
role = "Deacon at Nicaea, later bishop of Alexandria, the creed's chief defender"
summary = """
Athanasius came to Nicaea as deacon to his bishop Alexander, did not sign the creed and probably did not speak. He was later elected bishop of Alexandria, was deposed and exiled to the West in 335, and spent much of his life in and out of exile. Lyman says the picture of the fourth century as "Arians" against defenders of Nicaea was largely his creation, made during his exile in Rome around 340, and that he only began to defend the creed's own wording in the 350s, in On the Decrees of the Council of Nicaea, which preserves Eusebius of Caesarea's letter about the creed. His Easter letter of 367 is the first list of exactly the twenty-seven New Testament books."""
status = "draft"
events = ["council-of-nicaea", "canon-athanasius-festal-letter-39", "council-of-constantinople-381"]
citations = [
