id = "jehoiachin"
name = "Jehoiachin"
role = "king of Judah"
summary = """
Jehoiachin was king of Judah for three months. He surrendered Jerusalem to Nebuchadnezzar in 597 BCE and was taken to Babylon, and 2 Kings ends with him released from prison and given a daily allowance. Babylonian ration lists name him as king of Judah, receiving oil in Babylon. Young dates the capture, using the Babylonian Chronicle, to 2 Adar 597 BCE."""
status = "sources-located"
verses = [
  { ref = "2Kgs.24.8-2Kgs.24.17", link = "describes" },
  { ref = "2Kgs.25.27-2Kgs.25.30", link = "describes" },
]
events = ["jerusalem-capture-597"]
citations = [
  { source = "pritchard-1969", locator = "p. 308, Babylonian administrative texts, trans. A. Leo Oppenheim" },
  { source = "young-2004", locator = "pp. 21, 25" },
]

[[attestations]]
artifact = "jehoiachin-ration-tablet"
relation = "corroborates"
note = """
The Babylon ration texts list oil for Jehoiachin (Ia-'-u-kin, called "king") and for five sons of the king of Judah. This is the captive king of 2 Kings 24:15 and 25:27–30, still called king."""
citations = [
  { source = "pritchard-1969", locator = "p. 308, Babylonian administrative texts, trans. A. Leo Oppenheim" },
  { source = "weidner-1939", locator = "pp. 923–935" },
]

[[attestations]]
artifact = "babylonian-chronicle-abc5"
relation = "consistent"
note = """
The Chronicle records that Nebuchadnezzar "captured the king" of Jerusalem in 597 BCE and appointed a king of his own choice. It names neither man, but it fits Jehoiachin's surrender and Zedekiah's installation."""
citations = [{ source = "kitchen-2003", locator = "p. 44" }]
