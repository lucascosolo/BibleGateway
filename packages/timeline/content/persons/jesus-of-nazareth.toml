id = "jesus-of-nazareth"
name = "Jesus of Nazareth"
also_known_as = ["Jesus Christ"]
role = "Jewish teacher from Galilee, crucified under Pontius Pilate"
summary = """
Most historians of antiquity, Bart Ehrman prominent among them, conclude that Jesus existed and \
was crucified under Pontius Pilate, whatever they make of the Gospels' further claims. Two Roman-era \
historians outside the Christian tradition mention him: Tacitus explicitly, and Josephus in two \
passages, one of which was expanded by later Christian copyists."""
status = "draft"
verses = [{ ref = "Mark.15.1-Mark.15.15", link = "describes", note = "handed over by Pilate" }]
citations = [{ source = "ehrman-2012" }]

[[attestations]]
artifact = "tacitus-annals-15-44"
relation = "corroborates"
note = """
Names "Christus" as executed by the procurator Pontius Pilate in the reign of Tiberius — a \
hostile Roman source, writing of Christians, not for them."""
citations = [{ source = "tacitus-annals-15-latin", locator = "15.44" }]

[[attestations]]
artifact = "josephus-testimonium-flavianum"
relation = "partially-corroborates"
note = """
Probably mentions Jesus and his crucifixion under Pilate in its original form, but the \
passage as transmitted contains Christian additions, so how much of it Josephus wrote is \
disputed; the majority view keeps a reconstructed core."""
citations = [
  { source = "meier-1991", locator = "ch. 3" },
  { source = "wikipedia-josephus-on-jesus" },
]

[[attestations]]
artifact = "josephus-antiquities-20-200"
relation = "corroborates"
note = """
Identifies James as "the brother of Jesus who was called Christ" in passing, in a passage \
almost universally accepted as authentic."""
citations = [{ source = "wikipedia-josephus-on-jesus" }]
