id = "bartholomew"
name = "Bartholomew"
role = "one of the Twelve"
summary = """
Bartholomew appears in all four lists of the Twelve (Mark 3:18, Matt 10:3, Luke 6:14, Acts 1:13) and nowhere else in the New Testament. The lists agree on him; he stands in the second group of four, next to Philip in Matthew and Luke. His name is possibly a patronymic, Aramaic Bar Talmai, "son of Tolmi", which Meier says tells us nothing.

From about the ninth century Christian writers often identified him with Nathanael, who appears only in John (1:45-51; 21:2). Meier calls this a late tradition and says there is no basis for it unless one wrongly assumes that John thinks of most disciples as members of the Twelve. Meier's verdict on Bartholomew is that he is an absolute dead end: nothing is known of him as an individual, and the legends that fill the gap are later."""
