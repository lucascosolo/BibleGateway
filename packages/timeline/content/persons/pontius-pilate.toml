id = "pontius-pilate"
name = "Pontius Pilate"
role = "Roman prefect of Judaea (26–36 CE)"
summary = """
Pilate was the Roman governor who sentenced Jesus to crucifixion. An inscription carries his name and title, and two Roman-era historians also mention him."""
status = "sources-located"
verses = [
  { ref = "Luke.3.1", link = "describes" },
  { ref = "Mark.15.1-Mark.15.15", link = "describes" },
]
citations = [
  { source = "meier-1991", locator = "p. 373 (office 26–36); p. 100 n. 8 (title prefect)" },
  { source = "josephus-whiston", locator = "Antiquities 18.3.1" },
]

[[attestations]]
artifact = "pilate-stone"
relation = "corroborates"
note = """
The Pilate Stone is a building dedication by "[Ponti]us Pilatus, [Praef]ectus Iuda[ea]e". It gives his name and his title, prefect of Judaea, carved in his own time."""
citations = [
  { source = "ae-1963-104", locator = "no. 104" },
  { source = "meier-1991", locator = "p. 256" },
]

[[attestations]]
artifact = "tacitus-annals-15-44"
relation = "corroborates"
note = "Tacitus names Pontius Pilate as the procurator under whom Christus was executed. This is a Roman writer's statement, made independently of the Gospels, that Pilate held office in Judaea in the reign of Tiberius."
citations = [{ source = "tacitus-annals-15-latin", locator = "15.44" }]

[[attestations]]
artifact = "josephus-antiquities-18-55"
relation = "corroborates"
note = "Josephus narrates several episodes from Pilate's governorship of Judaea. These accounts are outside evidence for the office he held and for how he governed."
citations = [{ source = "josephus-whiston", locator = "Antiquities 18.3.1" }]
