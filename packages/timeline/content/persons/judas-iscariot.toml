name = "Judas Iscariot"
role = "one of the Twelve who handed Jesus over to the authorities"
summary = """
Judas is named last in the lists of the Twelve (Mark 3:19, Matt 10:4, Luke 6:16), described as the one who handed Jesus over. Acts 1:13 lists the Eleven without him, and Acts 1:15-26 tells of Matthias taking his place. Meier says only two basic facts are known: Jesus chose him as one of the Twelve, and he handed Jesus over to the Jerusalem authorities. Both are supported by multiple attestation (Mark, John, and separate traditions behind Matthew's and Luke's accounts of his death) and by the criterion of embarrassment, since the church had no reason to invent a traitor among the Twelve. Meier argues this also supports the existence of the Twelve during the ministry. He notes the Greek verb means "hand over", and probably refers to telling the authorities where to arrest Jesus quietly.

The motives and the death are expanded later. Mark gives no motive (14:10-11). Matthew adds money (26:15) and a suicide (27:3-5), Luke and John add Satan's entry into him (Luke 22:3, John 13:2, 27), John calls him a thief (12:4-6), and Acts has a different death account (1:16-20). Meier says these reflect theology and imagination, and that rehabilitating Judas is as imaginative as demonizing him. The name Iscariot is unexplained. Meier discusses the dagger-men (sicarii), "liar", "hand over", a trade, and a place such as Kerioth. He thinks the John tradition of "Judas, son of Simon Iscariot" slightly favours a place name, and concludes the nickname, like the man, remains an enigma."""
