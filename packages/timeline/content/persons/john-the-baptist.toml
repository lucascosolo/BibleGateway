id = "john-the-baptist"
name = "John the Baptist"
also_known_as = ["John the Baptizer"]
role = "Jewish prophet and baptizer (active c. 28 CE)"
summary = """
Josephus describes John independently of the Gospels. He calls him "a good man" who urged the Jews to virtue and to baptism, and says Herod Antipas, fearing his influence, imprisoned him at Machaerus and had him killed. Luke dates the start of his preaching to the fifteenth year of Tiberius, which Meier takes as most likely 28 CE, with John beginning around the end of 27 or early 28 and Jesus baptized by him soon after. Meier treats Josephus as the main source for John's death, finds errors and folkloric traits in Mark's story of Herodias's daughter, and dates the execution only to before 36 CE."""
status = "claims-checked"
verses = [
  { ref = "Luke.1.5-Luke.1.25", link = "describes", note = "Luke 1:5–25 tells of the announcement of John's birth to Zechariah, a priest, in the days of Herod." },
  { ref = "Luke.3.1-Luke.3.2", link = "dates", note = "Luke 3:1–2 dates John's call to the fifteenth year of Tiberius." },
  { ref = "Mark.1.4-Mark.1.9", link = "describes", note = "Mark 1:4–9 tells of John's baptism of repentance in the Jordan and his baptizing of Jesus." },
  { ref = "Matt.3.1-Matt.3.12", link = "describes", note = "Matthew 3:1–12 tells of John's preaching in the wilderness of Judea." },
  { ref = "John.1.19-John.1.28", link = "describes", note = "John 1:19–28 gives John's testimony at Bethany beyond the Jordan." },
  { ref = "Mark.6.17-Mark.6.29", link = "describes", note = "Mark 6:17–29 tells of John's imprisonment and execution by Herod Antipas." },
]
events = ["john-baptist-ministry"]
# Meier locators carried over from events/john-baptist-ministry.toml for the same claims.
# Antiquities 18.5.2 read in Whiston (~/.cache/jot/sources/josephus-whiston/embedded.txt).
citations = [
  { source = "meier-1991", locator = "pp. 383–386, 407" },
  { source = "meier-1994", locator = "pp. 22, 172–175" },
  { source = "josephus-whiston", locator = "Antiquities 18.5.2" },
]

[[attestations]]
artifact = "josephus-antiquities-18-116"
relation = "corroborates"
note = """
Josephus names "John, that was called the Baptist", describes his preaching and baptism, and reports his execution by Herod at Machaerus. He gives no date and does not mention Jesus in this passage, so he corroborates John's existence, preaching and death but not Luke's chronology."""
citations = [
  { source = "josephus-whiston", locator = "Antiquities 18.5.2" },
]
