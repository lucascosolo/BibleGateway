[[attestations]]
artifact = "irenaeus-four-gospels"
relation = "consistent"
note = """
Irenaeus, about 180 CE, already treats the Gospel according to Mark as one of exactly four. This shows the attribution to Mark was settled in Gaul by then; it is evidence for the tradition, not independent evidence of who wrote the book."""
