[[attestations]]
artifact = "muratorian-fragment"
relation = "consistent"
note = """
The fragment says "the well-known physician Luke" wrote the third Gospel in his own name after the ascension. It records the attribution as a church holds it; Carson and Moo date the fragment c. 180–200 with a question mark, and it is not independent evidence of who wrote the book."""
citations = [
  { source = "anf05-salmond-muratorian", locator = "Fragments of Caius, Canon Muratorianus" },
  { source = "carson-moo-2005", locator = "p. 205" },
]

[[attestations]]
artifact = "irenaeus-four-gospels"
relation = "consistent"
note = """
Irenaeus, about 180 CE, counts Luke among exactly four Gospels and notes that Marcion used Luke alone. Brown names Irenaeus among the late-second-century witnesses to the attribution."""
citations = [
  { source = "anf01-ccel", locator = "Against Heresies 3.11.8" },
  { source = "brown-1997", locator = "ch. 9, Authorship" },
]
