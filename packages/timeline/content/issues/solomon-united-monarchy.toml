id = "solomon-united-monarchy"
kind = "historical"
title = "Solomon's kingdom: an empire or a highland chiefdom?"
status = "draft"
summary = """
The Bible describes Solomon ruling a wealthy, united kingdom from Jerusalem. No inscription names him. So the debate turns on archaeology, above all on the date of the large gates and buildings once credited to him."""
persons = ["solomon", "david"]
verses = [{ ref = "1Kgs.9.15", link = "describes", note = "Solomon builds Hazor, Megiddo and Gezer" }]
citations = [
  { source = "cline-2009" },
  { source = "wikipedia-solomon" },
]

[[views]]
label = "No inscription names him"
text = """
Eric Cline: there is still not a single contemporary or near-contemporary inscription that mentions Solomon."""
citations = [{ source = "cline-2009" }]

[[views]]
label = "Solomonic gates"
text = """
Yigael Yadin dug up large gates and buildings at Hazor, Megiddo and Gezer. He credited them to Solomon's building programme, reading them alongside 1 Kings 9:15."""
citations = [{ source = "wikipedia-solomon" }]

[[views]]
label = "A modest chiefdom; the gates are later"
text = """
Finkelstein and Silberman move those buildings to the Omride kings of the 9th century BCE. They see 10th-century Jerusalem as the rough hilltop stronghold of a local family of tribal chiefs, not the capital of an empire."""
citations = [
  { source = "finkelstein-silberman-2006" },
  { source = "klein-2006-review" },
  { source = "wikipedia-solomon" },
]

[[views]]
label = "Finkelstein and Silberman: a highland village, then Omride Israel"
text = """
Israel Finkelstein and Neil Asher Silberman accept that David and Solomon existed ("There is hardly a reason to doubt the historicity of David and Solomon", p. 142) but not the empire. Tenth-century Jerusalem was "at best, no more than a typical highland village" (p. 142), and Judah had about twenty small villages (p. 133). They redate the "Solomonic" gates and palaces at Megiddo, Hazor and Gezer to the early ninth century BCE (p. 141), so that "the Omrides, not Solomon, established the first fully developed monarchy in Israel" (p. 187). On their account Israel was a fully developed state no later than the beginning of the ninth century, while Judah changed little (p. 159)."""
citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 133, 141-142" }, { source = "finkelstein-silberman-2002", locator = "pp. 187-189" }, { source = "finkelstein-silberman-2002", locator = "p. 159" }]
