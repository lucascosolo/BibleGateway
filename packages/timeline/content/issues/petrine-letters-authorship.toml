id = "petrine-letters-authorship"
kind = "historical"
title = "Did Peter write the letters in his name?"
status = "sources-located"
summary = """
Two New Testament letters name Peter as their author, and Ehrman argues that neither was written by Peter. Only 1 and 2 Peter are entered here; Jude is treated in the issue james-and-jude-authorship."""
events = ["1-peter-composition", "2-peter-composition"]
citations = [{ source = "ehrman-2013", locator = "ebook pp. 293, 295" }]

[[views]]
label = "Forgeries written after Peter's death"
text = """
Ehrman says 2 Peter is, "more than any other New Testament writing", widely recognised as forged. He argues 1 Peter is forged too, which "would necessarily make 2 Peter a forgery as well"."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 293, 295" }]

[[views]]
label = "1 Peter is genuine (scholars not named)"
text = """
Ehrman calls 1 Peter "the one book scholars have been most inclined to consider authentic", although in the passages read he names no scholar for that view."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 294" }]

[[views]]
label = "Carson and Moo: Peter wrote both letters"
text = """
Carson and Moo, authors of a standard evangelical introduction, defend Peter as the author of both. For 1 Peter they call the case against him "not at all a strong one" and suggest Silvanus (1 Peter 5:12) as a secretary who shaped the Greek. For 2 Peter they say the doubts about attestation are exaggerated and that forged letters were rejected by the early church."""
citations = [
  { source = "carson-moo-2005", locator = "pp. 645–646" },
  { source = "carson-moo-2005", locator = "pp. 659–662" },
]

[[views]]
label = "Ehrman (Brief Introduction): 1 Peter probably pseudepigraphic, 2 Peter certainly so"
text = """
In his textbook, Ehrman says many scholars doubt Peter wrote 1 Peter, and that "on balance" it is "probably best to regard 1 Peter as yet another example of Christian pseudepigraphy". For 2 Peter he says "the vast majority of critical scholars agree" Peter did not write it, citing its borrowing from Jude and the lack of any mention of it before about 220."""
citations = [{ source = "ehrman-brief-intro-2017", locator = "pp. 320-328 approx." }]
