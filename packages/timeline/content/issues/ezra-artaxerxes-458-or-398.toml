id = "ezra-artaxerxes-458-or-398"
kind = "chronology"
title = "Ezra's seventh year: 458 or 398 BCE?"
status = "draft"
summary = """
Ezra 7:7-8 dates Ezra's arrival to the seventh year of "Artaxerxes the king" without saying which. Three views are summarised in the sources read: the seventh year of Artaxerxes I (458/457 BCE), of Artaxerxes II (398 BCE), or a corrupted number."""
events = ["ezra-mission"]
verses = [
  { ref = "Ezra.7.7", link = "dates" },
  { ref = "Ezra.7.8", link = "dates" },
  { ref = "Neh.2.1", link = "dates" },
]
citations = [{ source = "wikipedia-ezra" }, { source = "preceptaustin-ezra-7" }]

[[views]]
label = "458/457 BCE (Artaxerxes I)"
text = """
Yamauchi holds Artaxerxes I, "the traditional view", correct: Ezra arrived in 458 (457). Wikipedia calls it the most widely accepted."""
citations = [{ source = "preceptaustin-ezra-7" }, { source = "wikipedia-ezra" }]

[[views]]
label = "398 BCE (Artaxerxes II)"
text = """
Nehemiah precedes Ezra, who came in 398 BCE, the seventh year of Artaxerxes II; proposed in 1890."""
citations = [{ source = "wikipedia-ezra" }, { source = "preceptaustin-ezra-7" }]

[[views]]
label = "428 BCE (thirty-seventh year of Artaxerxes I)"
text = """
The letter of Ezra 7:11-26 is from the thirty-seventh year of Artaxerxes I, 428 BCE."""
citations = [{ source = "preceptaustin-ezra-7" }]

[[views]]
label = "Scribal error; Ezra and Nehemiah contemporaries"
text = """
A last group of scholars regards "the seventh year" as a scribal error and treats the two men as contemporaries."""
citations = [{ source = "wikipedia-ezra" }]
