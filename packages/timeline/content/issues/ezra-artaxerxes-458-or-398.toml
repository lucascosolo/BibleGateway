id = "ezra-artaxerxes-458-or-398"
kind = "chronology"
title = "Ezra's seventh year: 458 or 398 BCE?"
status = "sources-located"
summary = """
Ezra 7:7-8 dates Ezra's arrival to the seventh year of "Artaxerxes the king" but does not say which Artaxerxes, and the sources read give three views: the seventh year of Artaxerxes I (458/457 BCE), the seventh year of Artaxerxes II (398 BCE), or a copyist's wrong number."""
events = ["ezra-mission"]
verses = [
  { ref = "Ezra.7.7", link = "dates" },
  { ref = "Ezra.7.8", link = "dates" },
  { ref = "Neh.2.1", link = "dates" },
]
citations = [{ source = "wikipedia-ezra" }, { source = "preceptaustin-ezra-7" }]
persons = ["ezra", "nehemiah"]

[[views]]
label = "458/457 BCE (Artaxerxes I)"
text = """
Yamauchi holds that Artaxerxes I, "the traditional view", is correct, so Ezra arrived in 458 (457). Wikipedia calls this the most widely accepted view."""
citations = [{ source = "preceptaustin-ezra-7" }, { source = "wikipedia-ezra" }]

[[views]]
label = "398 BCE (Artaxerxes II)"
text = """
On this view Nehemiah came before Ezra, and Ezra arrived in 398 BCE, the seventh year of Artaxerxes II. Albin van Hoonacker proposed it (1890 hypothesis; 1892 "Esdras en l'an 7 d'Artaxerxes II", per Wikipedia's list of his works)."""
citations = [{ source = "wikipedia-albin-van-hoonacker" }, { source = "wikipedia-ezra" }, { source = "preceptaustin-ezra-7" }]

[[views]]
label = "428 BCE (thirty-seventh year of Artaxerxes I)"
text = """
The letter in Ezra 7:11-26 comes from the thirty-seventh year of Artaxerxes I, 428 BCE."""
citations = [{ source = "preceptaustin-ezra-7" }]

[[views]]
label = "Scribal error; Ezra and Nehemiah contemporaries"
text = """
A last group of scholars thinks "the seventh year" is a copyist's mistake, and so treats Ezra and Nehemiah as men who lived at the same time."""
citations = [{ source = "wikipedia-ezra" }]
