id = "ezra-artaxerxes-458-or-398"
kind = "chronology"
title = "Ezra's seventh year: 458 or 398 BCE?"
status = "sources-located"
summary = """
Ezra 7:7-8 dates Ezra's arrival to the seventh year of "Artaxerxes the king" but does not say which Artaxerxes. The seventh year of Artaxerxes I gives 458/457 BCE; that of Artaxerxes II gives 398 BCE."""
events = ["ezra-mission"]
verses = [
  { ref = "Ezra.7.7", link = "dates" },
  { ref = "Ezra.7.8", link = "dates" },
  { ref = "Neh.2.1", link = "dates" },
]
citations = [{ source = "kitchen-2003", locator = "p. 74" }, { source = "lim-2013", locator = "p. 60" }, { source = "mcdonald-2017-vol1", locator = "p. 52" }]
persons = ["ezra", "nehemiah"]

[[views]]
label = "458/457 BCE (Artaxerxes I)"
text = """
Kitchen puts Ezra in Year 7 of Artaxerxes I, 458, and Nehemiah's governorship in Years 20-32 of the same king, 445-433. Lim reports Lee's dating of Ezra 7:8 to 458 from the Persian-Egyptian conflict."""
citations = [{ source = "kitchen-2003", locator = "p. 74" }, { source = "lim-2013", locator = "p. 60" }]

[[views]]
label = "398 BCE (Artaxerxes II)"
text = """
McDonald gives 398 BCE, the seventh year of Artaxerxes II, as the alternative to 458, without choosing between them. Kitchen notes that alternatives to 458 are often proposed and holds that none explains the evidence better."""
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 52" }, { source = "kitchen-2003", locator = "p. 74" }]

[[views]]
label = "Josephus: the seventh year of Xerxes"
text = """
Josephus, following the Greek form of the story, has Ezra leave Babylon in the seventh year of "Xerxes" and Nehemiah come in that king's twenty-fifth year, which fits neither the 458 nor the 398 count."""
citations = [{ source = "josephus-whiston", locator = "Antiquities 11.5.1-2; 11.5.6-7" }]
