id = "judges-historicity"
kind = "historical"
title = "How historical is the Book of Judges?"
status = "draft"
summary = """
Do the stories of Deborah, Gideon, Samson and the other judges keep real memories from before the kings? Scholars disagree. The book was edited long after the events. No judge is named in an inscription from their own time. The dating views on the individual events only record the date ranges offered by those who accept the setting."""
events = ["judges-period", "deborah-barak", "gideon", "samson"]
verses = [{ ref = "Judg.2.16-Judg.2.19", link = "describes" }]
citations = [{ source = "wikipedia-book-of-judges", locator = "sections on dating and historicity" }]

