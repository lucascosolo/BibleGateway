id = "judges-historicity"
kind = "historical"
title = "How historical is the Book of Judges?"
status = "draft"
summary = """
Do the stories of Deborah, Gideon, Samson and the other judges keep real memories from before the kings? Scholars disagree, and the book was edited long after the events; no judge is named in an inscription from their own time. The dating views on the individual events therefore only record the date ranges offered by those who accept the setting."""
events = ["judges-period", "deborah-barak", "gideon", "samson"]
verses = [{ ref = "Judg.2.16-Judg.2.19", link = "describes" }]
citations = [{ source = "wikipedia-book-of-judges", locator = "sections on dating and historicity" }]

[[views]]
label = "Plausible, with the ring of truth"
text = """
William G. Dever finds the accounts historically plausible, with "the ring of truth for an archaeologist"."""
citations = [{ source = "wikipedia-book-of-judges", locator = "section on historicity" }]

[[views]]
label = "Cannot be assessed"
text = """
Israel Finkelstein holds that it is impossible to know how far the tales rest on real memories. Lester Grabbe likewise calls the book too problematic to use as a historical source, although he allows that a real historical core cannot be ruled out."""
citations = [{ source = "wikipedia-book-of-judges", locator = "section on historicity" }]

[[views]]
label = "Samson as a folk hero"
text = """
Many current scholars compare Samson with the Near Eastern folk hero behind Enkidu, and with Heracles, while conservative scholars regard him as a real historical person."""
citations = [{ source = "wikipedia-samson" }]

[[views]]
label = "Israel Finkelstein and Neil Asher Silberman: early Israel grew out of the Canaanite highlands"
text = """
Finkelstein and Silberman describe a third wave of highland settlement beginning "around 1200 BCE" with about 250 sites and some 45,000 people (p. 115), after two earlier waves (table, p. 114). They hold that many early Israelites "were thus apparently nomads who gradually became farmers" (p. 113). Their conclusion: "There was no mass Exodus from Egypt. There was no violent conquest of Canaan. Most of the people who formed early Israel were local people" who were "themselves originally Canaanites" (p. 118). The emergence of Israel was "an outcome of the collapse of the Canaanite culture, not its cause" (p. 118)."""
citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 113-118" }]
