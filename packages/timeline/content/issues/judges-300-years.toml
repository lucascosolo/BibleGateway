id = "judges-300-years"
kind = "chronology"
title = "How do the 300 years of Judges 11:26 fit the chronology?"
status = "claims-checked"
summary = """
Jephthah tells the king of Ammon that Israel had held the land along the Arnon for three hundred years. Wood takes this as support for a 15th-century conquest. Kitchen sees it as the bluster of an ignorant man, not a real date."""
events = ["conquest-of-canaan", "judges-period"]
verses = [{ ref = "Judg.11.26", link = "dates" }]
citations = [{ source = "wood-2005", locator = "pp. 477–478, 486–487" }]

[[views]]
label = "A chronological datum"
text = """
Wood argues that estimates for the start of Jephthah's time as judge fall between 1130 and 1073 BCE, so three hundred years before that means Reuben had held the area since c. 1400 BCE. On his reading Judges 11:26 fits the other dates in the Bible and the evidence outside it for a 15th-century exodus and conquest."""
citations = [{ source = "wood-2005", locator = "pp. 477–478, 487" }]

[[views]]
label = "Hyperbole"
text = """
Kitchen, quoted by Wood, calls Jephthah's claim "propagandistic" and "a brave man's bold bluster", and says it is fatuous to use it as a serious date."""
citations = [{ source = "wood-2005", locator = "p. 486" }]
