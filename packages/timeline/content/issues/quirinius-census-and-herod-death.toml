id = "quirinius-census-and-herod-death"
kind = "chronology"
title = "Herod's death and Quirinius's census"
status = "draft"
summary = """
Matthew places Jesus's birth in the days of Herod the king. Luke 2:1–2 ties it to a registration "while Quirinius was governor of Syria". Josephus dates Quirinius's census to 6 CE, when Archelaus was removed. The usual date for Herod's death is 4 BCE. So the two Gospel clues are about ten years apart."""
events = ["birth-of-jesus"]
verses = [
  { ref = "Luke.2.1-Luke.2.2", link = "dates" },
  { ref = "Matt.2.1", link = "dates" },
]
citations = [
  { source = "wikipedia-census-of-quirinius" },
  { source = "wikipedia-herod-the-great" },
  { source = "lexundria-josephus-ant-18-1", locator = "18.1–2" },
]

[[views]]
label = "The two anchors conflict"
text = """
Josephus says Quirinius was sent to Syria to assess Judea after Archelaus was removed. He places that in the tenth year of Archelaus's rule, 6 CE. Schürer's chronology puts Herod's death in 4 BCE by working back from that same date. Read plainly, Luke's census comes after Herod's death."""
citations = [
  { source = "lexundria-josephus-ant-17-342", locator = "17.342–355" },
  { source = "lexundria-josephus-ant-18-1", locator = "18.1–2" },
  { source = "wikipedia-herod-the-great" },
]

[[views]]
label = "Luke says 'before', not 'first' (I. Howard Marshall, 1978; Brook W. R. Pearson, 1999)"
text = """
Marshall argued that the Greek of Luke 2:2 should be read "before" rather than "first". The verse would then speak of a registration before Quirinius was governor. Pearson made a similar argument about the translation."""
citations = [{ source = "wikipedia-census-of-quirinius" }]

[[views]]
label = "A census in Herod's last years (Colin Humphreys, 1995; Wayne Brindle, 1984; James Nollet, 2012)"
text = """
Humphreys proposed a census, without taxes, dated to Herod's final years. Brindle theorized a census under Herod, with two governors sharing the post. Nollet asserted that Quirinius held two governorships, with a census in 2 BCE."""
citations = [{ source = "wikipedia-census-of-quirinius" }]

[[views]]
label = "Herod died in 1 BCE (Andrew Steinmann, Rodger Young; Filmer)"
text = """
Steinmann and Young argue from the coins of Herod's sons. Their reigns began in 5 BCE while Herod was alive, so Herod died in 1 BCE. They add that the eclipse of 13 March 4 BCE leaves too little time before the next Passover for the events Josephus records."""
citations = [{ source = "wikipedia-herod-the-great" }]
