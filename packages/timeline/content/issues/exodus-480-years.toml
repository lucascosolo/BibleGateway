id = "exodus-480-years"
kind = "chronology"
title = "The 480 years of 1 Kings 6:1"
status = "draft"
summary = """
1 Kings 6:1 says Solomon's temple was founded in the 480th year after the Exodus. Counted straight, that puts the Exodus in the 15th century BCE. Many scholars argue from archaeology for the 13th century instead, and that does not fit the count. So how you read the number largely decides the date."""
events = ["exodus"]
verses = [{ ref = "1Kgs.6.1", link = "dates" }]
citations = [
  { source = "wood-2005" },
  { source = "kitchen-2003" },
]

[[views]]
label = "A literal count"
text = """
The 480 years are a date to be counted back from Solomon's fourth year. That gives an Exodus in the middle of the 15th century BCE."""
citations = [{ source = "wood-2005" }]

[[views]]
label = "Not a straight count"
text = """
An Exodus in the 13th century under Ramesses II needs the 480 years to be read as something other than an exact span of time."""
citations = [{ source = "kitchen-2003" }]
