id = "exodus-480-years"
kind = "chronology"
title = "How do the 480 years of 1 Kings 6:1 fit the chronology?"
status = "claims-checked"
summary = """
1 Kings 6:1 says Solomon's temple was founded in the 480th year after the Exodus. Counted straight, that puts the Exodus in the 15th century BCE. Others, Kitchen among them, argue from archaeology for the 13th century instead, and that does not fit the count. So how you read the number largely decides the date."""
events = ["exodus"]
verses = [{ ref = "1Kgs.6.1", link = "dates" }]
citations = [
  { source = "wood-2005", locator = "p. 477" },
  { source = "kitchen-2003", locator = "pp. 255–259" },
]

[[views]]
label = "A literal count"
text = """
The 480 years are a date to be counted back from Solomon's fourth year. That gives an Exodus in the middle of the 15th century BCE."""
citations = [{ source = "wood-2005", locator = "p. 477" }]

[[views]]
label = "Not a straight count"
text = """
An Exodus in the 13th century under Ramesses II needs the 480 years to be read as something other than an exact span of time. Kitchen shows that adding up every period given from Exodus to Kings yields not 480 but "554 + x + y + z years", so overlaps between judges are needed on any reading. He offers two origins for the 480: twelve "full generations" of 40 years (12 x 40), or a selection from the aggregate that leaves out the foreign oppressions, which his Table 28 brings to 475 years plus about 5 for Joshua and the elders. Either way the real elapsed time from an exodus "about 1260/1250" to Solomon's fourth year in 967 is about 300 years."""
citations = [{ source = "kitchen-2003", locator = "pp. 202–203; pp. 307–309 with Table 28 on p. 309" }]
