id = "belshazzar-king-and-father"
kind = "historical"
title = "Belshazzar: king, and son of Nebuchadnezzar?"
status = "draft"
summary = """
Daniel 5 calls Belshazzar king and speaks of him as Nebuchadnezzar's son (5:2, 5:22). Babylonian sources say he was the eldest son of Nabonidus, the last king of Babylon, so on the cylinder he is the king's son, not the king. Another Babylonian text says Nabonidus handed the kingship to his eldest son before leaving Babylon, which helps explain the title "king". Whose son he was remains a discrepancy."""
persons = ["belshazzar", "nebuchadnezzar", "daniel"]
verses = [
  { ref = "Dan.5.2", link = "describes", note = "Daniel 5:2 calls Nebuchadnezzar the father of Belshazzar, the claim this issue weighs against the Babylonian records." },
  { ref = "Dan.5.22", link = "describes", note = "Daniel 5:22 addresses Belshazzar as the son of Nebuchadnezzar, the same family claim this issue weighs against the Babylonian records." },
]
citations = [{ source = "wikipedia-cylinders-of-nabonidus" }]

[[views]]
label = "The Babylonian record"
text = """
The Nabonidus Cylinder from Ur calls Belshazzar "the eldest son, my offspring" of Nabonidus."""
citations = [{ source = "wikipedia-cylinders-of-nabonidus" }]

[[views]]
label = "Kingship entrusted to the eldest son"
text = """
The Verse Account of Nabonidus, in Oppenheim's translation, says that as the third year was about to begin Nabonidus "entrusted the army [?] to his oldest son, his first born". It adds that he "let everything go, entrusted the kingship to him, and, himself, he started out for a long journey". Read with the cylinder, this shows Belshazzar ruling in Babylon under his father. That bears on why Daniel calls him king. It says nothing about Nebuchadnezzar."""
citations = [{ source = "livius-verse-account", locator = "column ii, lines 5–6" }]
