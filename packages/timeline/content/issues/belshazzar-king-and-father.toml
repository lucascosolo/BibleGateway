id = "belshazzar-king-and-father"
kind = "historical"
title = "Belshazzar: king, and son of Nebuchadnezzar?"
status = "claims-checked"
summary = """
Daniel 5 calls Belshazzar king and speaks of him as Nebuchadnezzar's son (5:2, 5:22). Babylonian sources say he was the eldest son of Nabonidus, the last king of Babylon, so on the cylinder he is the king's son, not the king. Another Babylonian text says Nabonidus handed the kingship to his eldest son before leaving Babylon, which helps explain the title "king". Whose son he was remains a discrepancy."""
persons = ["belshazzar", "nebuchadnezzar", "daniel"]
verses = [
  { ref = "Dan.5.2", link = "describes", note = "Daniel 5:2 calls Nebuchadnezzar the father of Belshazzar, the claim this issue weighs against the Babylonian records." },
  { ref = "Dan.5.22", link = "describes", note = "Daniel 5:22 addresses Belshazzar as the son of Nebuchadnezzar, the same family claim this issue weighs against the Babylonian records." },
]
citations = [{ source = "kitchen-2003", locator = "pp. 73-74" }, { source = "pritchard-1969", locator = "p. 313, Verse Account of Nabonidus, trans. A. Leo Oppenheim" }]

[[views]]
label = "The Babylonian record"
text = """
The closing prayer of the Nabonidus Cylinder from Ur names Belshazzar as the eldest son of Nabonidus."""
citations = [{ source = "kitchen-2003", locator = "p. 517, n. 22" }, { source = "livius-nabonidus-cylinder-ur", locator = "col. iii, lines 3–31 (the closing prayer)" }, { source = "rogers-1912", locator = "p. 379 (four clay cylinders of Nabonidus from Ur, closing prayer, lines 24–31 in Rogers' numbering)" }]

[[views]]
label = "Kingship entrusted to the eldest son"
text = """
The Verse Account of Nabonidus, in Oppenheim's ANET translation, says that when the third year was about to begin Nabonidus entrusted the "Camp" to his oldest son, the first-born. It adds that he let everything go, entrusted the kingship to him, and himself started out for a long journey. Read with the cylinder, this shows Belshazzar ruling in Babylon under his father. That bears on why Daniel calls him king. It says nothing about Nebuchadnezzar."""
citations = [{ source = "pritchard-1969", locator = "p. 313, Verse Account of Nabonidus, trans. A. Leo Oppenheim" }]
