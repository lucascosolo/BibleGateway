id = "conquest-historicity"
kind = "historical"
title = "Did Israel conquer Canaan as Joshua describes?"
status = "draft"
summary = """
Did Israel conquer Canaan by force, and did Jericho fall as the story says? That is a separate question from when it would have happened. Evangelical defenders of a conquest argue about its date. Most archaeologists no longer defend the conquest model at all."""
events = ["conquest-of-canaan", "judges-period"]
verses = [{ ref = "Josh.6.20", link = "describes" }]
citations = [
  { source = "wikipedia-battle-of-jericho" },
  { source = "wikipedia-historicity-of-the-bible" },
]

[[views]]
label = "No conquest model"
text = """
William G. Dever: "No mainstream biblicist or archaeologist any longer espouses the conquest model." Kathleen Kenyon showed that Jericho was destroyed at the end of the Middle Bronze Age, not the Late Bronze Age. Radiocarbon testing in 1995 dated the destruction layer to the late 17th or 16th centuries BCE."""
citations = [
  { source = "wikipedia-battle-of-jericho", locator = "section on academic consensus and radiocarbon testing" },
  { source = "wikipedia-joshua" },
]

[[views]]
label = "A conquest at the end of the Late Bronze Age"
text = """
Albright studied Tell Beit Mirsim, Beitin and Lachish. He argued for a conquest in the late 13th century BCE. Wood reports that after Albright died in 1971 the evidence for this faded, and most Palestinian archaeologists dropped the idea. Kitchen still defends it."""
citations = [{ source = "wood-2005", locator = "pp. 475–476" }]

[[views]]
label = "A conquest c. 1400 BCE"
text = """
Wood argues that the biblical data put the exodus and conquest in the 15th century BCE. He says Jericho was destroyed c. 1400 BCE. He thinks the 13th-century theory should be dropped."""
citations = [{ source = "wood-2005", locator = "pp. 488–489" }]

[[views]]
label = "Israel Finkelstein and Neil Asher Silberman: no conquest; Joshua as a Josianic epic"
text = """
Finkelstein and Silberman say the evidence for a historical conquest "is, as we will see, weak" (p. 73). Late Bronze Canaan was an Egyptian province whose cities were mostly unwalled (pp. 77-78). At Jericho "there was no trace of a settlement of any kind in the thirteenth century BCE" (pp. 81-82), and at Ai the excavations found no Late Bronze settlement ("Not a single pottery sherd", p. 82). The destruction of Hazor, Aphek, Lachish and Megiddo was spread over more than a century: "No single military force did it, and certainly not in one military campaign" (p. 90). They date Joshua to the seventh century. Its Judah town list matches the borders under Josiah, and Jericho and Ai were the first targets of Josianic expansion (pp. 92-93). Earlier, from the 1920s to the 1950s, excavations at Tell Beit Mirsim, Bethel, Lachish and Hazor had seemed to confirm the conquest (pp. 79-81). Albright's rescue of Ai by moving the story to Bethel is also recorded (p. 82)."""
citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 73" }, { source = "finkelstein-silberman-2002", locator = "pp. 77-93" }]

[[views]]
label = "K. A. Kitchen: raids, not an occupation, and no Jericho left to find"
text = """
Kitchen, an Egyptologist who defends the Bible's reliability, says Joshua's campaigns were "disabling raids", not territorial conquests: the army kept returning to Gilgal (Josh. 10:15, 43) and burned only Jericho, Ai and Hazor (pp. 160-162). Middle Bronze Jericho fell about 1550, its ruins lay barren for about 200 years, and erosion has removed almost all of the Late Bronze town, so "We will never find 'Joshua's Jericho'" (pp. 187-188)."""
citations = [
  { source = "kitchen-2003", locator = "pp. 160–162" },
  { source = "kitchen-2003", locator = "pp. 187–188" },
]
