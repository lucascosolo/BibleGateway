id = "pauline-pseudepigrapha"
kind = "historical"
title = "Are the disputed letters of Paul forgeries?"
status = "draft"
summary = """
Some letters that name Paul as their author may have been written by others, and Ehrman argues that 2 Thessalonians is a deliberate forgery. Only 2 Thessalonians has been entered so far."""
events = ["2-thessalonians-composition", "colossians-composition", "ephesians-composition", "pastoral-epistles-composition"]
citations = [{ source = "ehrman-2013", locator = "ebook pp. 211, 225" }]

[[views]]
label = "Forgeries, written in Paul's name to deceive"
text = """
Ehrman says 2 Thessalonians was "written by someone intent on authorizing a non-Pauline view in the name of the apostle himself", and argues that it is a forgery and a counterforgery."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 211, 225" }]

[[views]]
label = "Paul wrote it (Jewett, Malherbe)"
text = """
Ehrman names Robert Jewett and Abraham Malherbe as holdouts for Pauline authorship. Malherbe claims a "majority" of scholars still hold to authenticity, but Ehrman says that is only because many hold views that rule out forgeries in scripture."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 210" }]

[[views]]
label = "Carson and Moo: the disputed letters are Paul's"
text = """
Carson and Moo, the authors of a standard evangelical introduction, defend Pauline authorship of Ephesians, Colossians, 2 Thessalonians and the Pastoral Epistles. Their general argument is that the search for parallels showing readers would have understood a letter to be pseudonymous "has proved a failure". They conclude that either some documents are pseudonymous and their authors meant to deceive, or the authors meant to tell the truth and "pseudonymity is not attested in the New Testament". They also say no church father knowingly accepted a pseudonymous book into the canon, and that "school" theories fit the neo-Pythagoreans poorly."""
citations = [{ source = "carson-moo-2005", locator = "pp. 349-350" }]
