id = "jehoiachin-year-seven-or-eight"
kind = "chronology"
title = "Nebuchadnezzar's seventh or eighth year?"
status = "draft"
summary = """
2 Kings 24:12 dates the capture of Jehoiachin to Nebuchadnezzar's eighth year. The Babylonian Chronicle puts it in his seventh. Jeremiah 52:28 also dates the deportation to the seventh. The gap is usually put down to different ways of counting a king's years. This entry does not yet document those explanations."""
events = ["jerusalem-capture-597"]
verses = [
  { ref = "2Kgs.24.12", link = "dates" },
  { ref = "Jer.52.28", link = "dates" },
]
citations = [{ source = "livius-abc5" }]

[[views]]
label = "Seventh year"
text = """
The Babylonian Chronicle dates the capture of Jerusalem to Nebuchadnezzar's seventh year. This agrees with Jeremiah 52:28."""
