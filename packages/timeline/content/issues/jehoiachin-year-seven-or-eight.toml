id = "jehoiachin-year-seven-or-eight"
kind = "chronology"
title = "Nebuchadnezzar's seventh or eighth year?"
status = "sources-located"
summary = """
2 Kings 24:12 dates the capture of Jehoiachin to Nebuchadnezzar's eighth year, while the Babylonian Chronicle puts it in his seventh and Jeremiah 52:28 also dates the deportation to the seventh. The gap is usually put down to different ways of counting a king's years, but this entry does not yet document those explanations."""
events = ["jerusalem-capture-597"]
verses = [
  { ref = "2Kgs.24.12", link = "dates" },
  { ref = "Jer.52.28", link = "dates" },
]
citations = [{ source = "livius-abc5" }]
persons = ["nebuchadnezzar"]

[[views]]
label = "Seventh year"
text = """
The Babylonian Chronicle dates the capture of Jerusalem to Nebuchadnezzar's seventh year, which agrees with Jeremiah 52:28."""
citations = [{ source = "livius-abc5" }]

[[views]]
label = "Eighth year"
text = """
2 Kings 24:12 says the king of Babylon took Jehoiachin "in the eighth year of his reign"."""
citations = [{ source = "livius-abc5" }]

[[views]]
label = "Both are right: Nisan years in Babylon, Tishri years in Kings"
text = """
Thiele resolves the two numbers by the two calendars. Babylon counted regnal years from Nisan in spring; the book of Kings counted Nebuchadnezzar's years from Tishri in autumn. "The last half of the Babylonian Nisan year overlaps the first half of the Hebrew Tishri year. Thus Jerusalem fell to Nebuchadnezzar in his seventh year according to his own reckoning but in his eighth year according to the reckoning in Kings. The overlap was from Tishri in the fall of 598 to Nisan in the spring of 597. Since Jerusalem fell in Adar, the last month of the Babylonian year, this was in the spring of 597.\""""
citations = [{ source = "thiele-1983", locator = "p. 186" }]
