id = "moses-historicity"
kind = "historical"
title = "Is there a historical Moses?"
status = "draft"
summary = """
No source outside the Bible from Moses' own time names him, and no Egyptian record mentions him. Scholars split into two camps: some see a figure of tradition with no recoverable history, others a real leader of some kind behind the story."""
persons = ["moses"]
events = ["exodus"]
verses = [{ ref = "Exod.2.10", link = "describes" }]
citations = [{ source = "wikipedia-moses" }]

[[views]]
label = "No trace outside the tradition"
text = """
No Egyptian source from his time mentions Moses, and none mentions him before the 4th century BCE. Jan Assmann accordingly describes him as a figure of memory with no traces outside the tradition."""
citations = [{ source = "wikipedia-moses" }]

[[views]]
label = "A leader behind the story"
text = """
William Dever has early Israel growing mostly out of Canaanite villages but including some people who had left Egypt, and he allows for a Moses-like leader among that group."""
citations = [
  { source = "dever-2003" },
  { source = "coogan-2003-review" },
]

[[views]]
label = "An Egyptian name"
text = """
The name Moses is commonly linked to the Egyptian msy / mose, "born of" or "child of", which appears in names such as Thutmose and Ramose. Some read this as a sign that the tradition has a genuine Egyptian setting."""
citations = [
  { source = "griffiths-1953", locator = "p. 223" },
  { source = "wikipedia-moses" },
]

[[views]]
label = "Israel Finkelstein and Neil Asher Silberman: the Moses story as seventh-century political saga"
text = """
Finkelstein and Silberman do not identify a historical Moses. Having found no archaeological support for the Exodus and wandering (pp. 60-64), they read the confrontation of Moses and pharaoh as a story shaped in the seventh century BCE: "The confrontation between Moses and pharaoh mirrored the momentous confrontation between the young King Josiah and the newly crowned Pharaoh Necho" (p. 71). They add that "To pin this biblical image down to a single date is to betray the story's deepest meaning" (p. 71). Older legends of liberation from Egypt may lie underneath (p. 68)."""
citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 68-71" }]
