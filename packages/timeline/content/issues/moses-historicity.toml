id = "moses-historicity"
kind = "historical"
title = "Is there a historical Moses?"
status = "sources-located"
summary = """
Finkelstein and Silberman report that the Egyptian sources of the thirteenth century never mention the Israelites, so no outside record anchors Moses. Scholars split into two camps: some see a figure of tradition with no recoverable history, others a real leader of some kind behind the story."""
persons = ["moses", "josiah"]
events = ["exodus"]
verses = [{ ref = "Exod.2.10", link = "describes" }]
citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 59-60" }]

[[views]]
label = "No trace outside the tradition"
text = """
Finkelstein and Silberman find in the abundant Egyptian sources of the New Kingdom "no reference to the Israelites, not even a single clue" (p. 59), and say Israel is absent from monuments, tombs and papyri alike (p. 60). On their account there is nothing outside the tradition to anchor a Moses."""
citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 59-60" }]

[[views]]
label = "A leader behind the story"
text = """
Kitchen argues that foreigners at the Egyptian court were common in the thirteenth century, so "A Moses would be simply one among many" (p. 297). He also holds that the covenant forms of Exodus-Leviticus and Deuteronomy fit a West Semite in Moses' role at the Egyptian court (p. 331)."""
citations = [{ source = "kitchen-2003", locator = "p. 297" }, { source = "kitchen-2003", locator = "p. 331" }]

[[views]]
label = "An Egyptian name"
text = """
The name Moses is commonly linked to the Egyptian msy / mose, "born of" or "child of", which appears in names such as Thutmose and Ramose. Some read this as a sign that the tradition has a genuine Egyptian setting. Kitchen disagrees: the sibilants do not match as they should, he says, and the name is most likely not Egyptian (p. 297)."""
citations = [
  { source = "griffiths-1953", locator = "p. 223" },
  { source = "kitchen-2003", locator = "p. 297" },
]

[[views]]
label = "Israel Finkelstein and Neil Asher Silberman: the Moses story as seventh-century political saga"
text = """
Finkelstein and Silberman do not identify a historical Moses. Having found no archaeological support for the Exodus and wandering (pp. 60-64), they read the confrontation of Moses and pharaoh as a story shaped in the seventh century BCE: "The confrontation between Moses and pharaoh mirrored the momentous confrontation between the young King Josiah and the newly crowned Pharaoh Necho" (p. 71). They add that "To pin this biblical image down to a single date is to betray the story's deepest meaning" (p. 71). Older legends of liberation from Egypt may lie underneath (p. 68)."""
citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 68-71" }]
