id = "moses-historicity"
kind = "historical"
title = "Is there a historical Moses?"
status = "draft"
summary = """
No source outside the Bible from Moses' own time names him, and no Egyptian record mentions him. \
Scholars divide between seeing him as a figure of tradition with no recoverable history, and \
seeing a historical leader of some kind behind the story."""
persons = ["moses"]
events = ["exodus"]
verses = [{ ref = "Exod.2.10", link = "describes" }]
citations = [{ source = "wikipedia-moses" }]

[[views]]
label = "No trace outside the tradition"
text = """
No contemporary Egyptian source mentions Moses, and no reference to him appears in any Egyptian \
source before the 4th century BCE; Jan Assmann describes him as a figure of memory with no \
traces outside the tradition."""
citations = [{ source = "wikipedia-moses" }]

[[views]]
label = "A leader behind the story"
text = """
William Dever has early Israel emerging largely from Canaanite villages, but including some \
who had left Egypt, and allows for a Moses-like leader among such a group."""
citations = [
  { source = "dever-2003" },
  { source = "coogan-2003-review" },
]

[[views]]
label = "An Egyptian name"
text = """
The name Moses is commonly connected with Egyptian msy / mose, "born of" or "child of", as in \
names such as Thutmose and Ramose — read by some as a detail pointing to a genuine Egyptian \
setting for the tradition."""
citations = [
  { source = "griffiths-1953", locator = "p. 223" },
  { source = "wikipedia-moses" },
]
