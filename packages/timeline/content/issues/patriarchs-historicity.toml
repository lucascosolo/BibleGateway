id = "patriarchs-historicity"
kind = "historical"
title = "Were Abraham, Isaac, Jacob and Joseph historical figures of a patriarchal age?"
status = "draft"
summary = """
This question comes before any date. For much of the twentieth century scholars spoke of a "patriarchal age" in the early second millennium BCE and read the Genesis stories as memories of it, supported by newly found tablets from Nuzi and Mari that seemed to share the patriarchs' customs. Since the 1970s most scholars have read the stories instead as literature of the kingdoms of Israel and Judah, written between the ninth and the sixth centuries BCE, and the Nuzi argument has been dropped. The question is still argued. Finkelstein and Silberman date the writing from the stories' anachronisms; Friedman shows two written versions, J and E, each shaped by its own kingdom; Barton treats the stories as legend with perhaps a folk memory behind them; Kitchen, against the current, lists some twenty features that he says fit only the period 1900 to 1600 BCE. The dating views on the patriarchal events record only the dates offered by people who accept the setting."""
events = ["abraham-migration", "abraham-covenant", "jacob-descent-egypt", "joseph-in-egypt"]
verses = [
  { ref = "Gen.12.1-Gen.12.9", link = "describes", note = "Genesis 12:1-9 sends Abram from Haran to Canaan, the journey with which the patriarchal stories begin." },
  { ref = "Gen.12.10-Gen.12.20", link = "describes", note = "Genesis 12:10-20 is the first of three stories in which a patriarch passes his wife off as his sister, a repetition that source critics use to separate the written versions." },
  { ref = "Gen.20.1-Gen.20.18", link = "describes", note = "Genesis 20 tells the wife-sister story a second time, with Abraham and Abimelech of Gerar." },
  { ref = "Gen.26.1-Gen.26.11", link = "describes", note = "Genesis 26:1-11 tells the wife-sister story a third time, with Isaac, and names Abimelech king of the Philistines at Gerar, a detail argued over as an anachronism." },
  { ref = "Gen.11.28", link = "describes", note = "Genesis 11:28 calls Abraham's home Ur of the Chaldees, a label that both sides agree is later than the setting." },
  { ref = "Gen.11.24-Gen.11.26", link = "describes", note = "Genesis 11:24-26 names Abraham's forefathers Serug, Nahor and Terah, names that Assyrian texts also give to towns near Haran." },
  { ref = "Gen.14.1-Gen.14.16", link = "describes", note = "Genesis 14 has four eastern kings, one of them from Elam, raid the Jordan valley, a campaign that Kitchen takes as early and Finkelstein reads against late Iron Age sites." },
  { ref = "Gen.16.1-Gen.16.4", link = "describes", note = "Genesis 16:1-4 has the childless Sarai give her maid to Abram to bear a child, a custom once compared with a Nuzi marriage contract." },
  { ref = "Gen.21.22-Gen.21.32", link = "describes", note = "Genesis 21:22-32 records a sworn treaty between Abraham and Abimelech, one of three patriarchal treaties whose form Kitchen compares with Mari and Tell Leilan." },
  { ref = "Gen.23.1-Gen.23.20", link = "describes", note = "Genesis 23 has Abraham buy a burial cave from the sons of Heth at Hebron, the Hittites whose presence there is debated." },
  { ref = "Gen.24.10", link = "describes", note = "Genesis 24:10 sends Abraham's servant to Mesopotamia with ten camels, the animal at the centre of the anachronism argument." },
  { ref = "Gen.31.19", link = "describes", note = "Genesis 31:19 has Rachel steal her father's household gods, which the Nuzi tablets were once thought to explain." },
  { ref = "Gen.31.44-Gen.31.54", link = "describes", note = "Genesis 31:44-54 sets up a boundary marker between Jacob and Laban in Gilead, which Finkelstein reads as the border between Israel and Aram." },
  { ref = "Gen.19.30-Gen.19.38", link = "describes", note = "Genesis 19:30-38 gives Moab and Ammon an incestuous origin, which Finkelstein reads as a seventh-century Judahite's view of rival kingdoms." },
  { ref = "Gen.36.31", link = "describes", note = "Genesis 36:31 speaks of kings reigning in Edom before any king reigned in Israel, a line weighed against the Assyrian evidence for when Edom became a kingdom." },
  { ref = "Gen.37.28", link = "describes", note = "Genesis 37:28 prices Joseph at twenty shekels of silver, a figure Kitchen matches to slave prices of the eighteenth century BCE." },
  { ref = "Gen.50.26", link = "describes", note = "Genesis 50:26 gives Joseph's age at death as 110, the Egyptian ideal lifespan." },
]
