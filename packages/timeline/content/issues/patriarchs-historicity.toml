[[views]]
label = "The older consensus: a patriarchal age confirmed by Nuzi and Mari"
text = """
For much of the twentieth century the leading view was that the patriarchs were real people of the early second millennium BCE. Finkelstein and Silberman quote Albright's judgement that "as a whole, the picture in Genesis is historical". Barton describes the supporting argument: "in the twentieth century some biblical archaeologists developed the theory that the stories of the patriarchs reflected customs known from second-millennium BCE texts", the tablets from the cities of Mari and Nuzi. The Nuzi tablets are in Pritchard's collection, where the translator's notes make the comparison explicit. In one adoption contract the adopted heir is told that "the son of Nashwi shall take the gods of Nashwi", and the note explains that "possession of the household gods marked a person as the legitimate heir, which explains Laban's anxiety in Gen. 31:26 f. to recover his household gods from Jacob". Another contract provides that "if Kelim-ninu does not bear, Kelim-ninu shall acquire a woman of the land of Lullu as wife for Shennima", the arrangement that was compared with Sarai giving Hagar to Abram. Two further Nuzi documents record people called Hebrews entering a household as slaves "on his own initiative"."""
citations = [
  { source = "finkelstein-silberman-2002", locator = "p. 34" },
  { source = "barton-2019", locator = "p. 26" },
  { source = "pritchard-1969", locator = "pp. 219-220 (Nuzi Akkadian documents, translated by Theophile J. Meek)" },
]

[[views]]
label = "The turn of the 1970s: Thompson, Van Seters and the end of the Nuzi argument"
text = """
Thomas L. Thompson's The Historicity of the Patriarchal Narratives (1974) and John Van Seters's Abraham in History and Tradition (1975) argued that the Nuzi parallels were loose and that the stories' names, customs and concerns fitted the first millennium rather than the second. Finkelstein and Silberman report the outcome: the search for the historical patriarchs "was ultimately unsuccessful", Albright's Amorite migration was "later shown to be illusory", and the second-millennium parallels were too general to fix a date. Barton reports the same from the literary side: the Nuzi and Mari argument has been dropped, and the books that describe the patriarchs "almost certainly do not date back in written form to such remote antiquity themselves". Even Kitchen, who defends the early setting, concedes the point about Nuzi: "the overambitious and misleading Hurrian/Nuzi-customs hypotheses of Speiser and Gordon" failed "to distinguish between false and valid parallels", and the valid ones belong to the Old Babylonian period rather than to Nuzi."""
citations = [
  { source = "finkelstein-silberman-2002", locator = "pp. 35-36" },
  { source = "barton-2019", locator = "pp. 21, 26-27" },
  { source = "kitchen-2003", locator = "p. 476" },
]

[[views]]
label = "Finkelstein and Silberman: the anachronisms date the writing to the eighth and seventh centuries"
text = """
Finkelstein and Silberman date the writing of the stories from details that do not fit the early second millennium. Camels "were not domesticated as beasts of burden earlier than the late second millennium", and the caravan of "gum, balm, and myrrh" in the Joseph story reflects the Arabian trade of the eighth and seventh centuries BCE. Isaac's meeting with "Abimelech, king of the Philistines" at Gerar suits a Gerar that was an Assyrian stronghold in the late eighth and seventh centuries, not the small Iron Age I village. The family trees of Genesis, they argue, "offer a colorful human map of the ancient Near East from the unmistakable viewpoint of the kingdom of Israel and the kingdom of Judah in the eighth and seventh centuries BCE": the Jacob and Laban cycle "metaphorically expresses the complex and often stormy relations between Aram and Israel over many centuries", the boundary marker in Gilead "reflects the territorial partition between Aram and Israel in the ninth-eighth centuries BCE", the incestuous origin of Moab and Ammon reads as a Judahite's contempt for rival kingdoms, and "from the Assyrian sources we know that there were no real kings and no state in Edom before the late eighth century BCE". The southern sites of Genesis 14, Kadesh and Tamar, were occupied mainly in the late Iron Age, and the names of Abraham's forefathers match towns near Haran in Assyrian texts. They conclude that "these and other anachronisms suggest an intensive period of writing the patriarchal narratives in the eighth and seventh centuries BCE", with a basic framework pointing to a seventh-century origin. They do not deny older material: "it is entirely possible and even probable that the individual episodes in the patriarchal narratives are based on ancient local traditions", and the narrative "was stitched together from memory, snatches of ancient customs, legends of the birth of peoples, and the concerns aroused by contemporary conflicts". Following Noth, they take Abraham and Isaac as southern figures of Hebron and Beersheba and Jacob as a northern one, so that "the figure of Abraham therefore functions as the unifier of northern and southern traditions"."""
citations = [
  { source = "finkelstein-silberman-2002", locator = "pp. 37-40" },
  { source = "finkelstein-silberman-2002", locator = "pp. 42-46" },
]

[[views]]
label = "Friedman: two written versions, each shaped by its own kingdom"
text = """
Friedman approaches the question through the written sources rather than the setting. The patriarchal stories come in pairs: "two stories of Abraham's claiming to a foreign king that his wife Sarah is his sister, two stories of Isaac's son Jacob making a journey to Mesopotamia", two covenants with Abraham, two namings of Isaac, two revelations at Beth-El and two renamings of Jacob, and each member of a pair uses a different name for God. From this he holds that "the first two sources, J and E, were written by two persons who lived during the period" of the divided monarchy. "In stories that call God Yahweh, the patriarch Abraham lives in Hebron", Judah's capital, and in E it is Jacob who names Peni-El, a city Jeroboam built. In the Joseph story "in E it is Reuben, the oldest, who saves him. But in J it is Judah who saves him." The Jacob and Esau stories are J's account of Judah's relations with Edom, which broke free under Jehoram: "the J author composed the stories of his people's ancestors with an eye to explaining and justifying the world situation in which he lived." On the dates: "this would put the author of J between 848 and 722. The author of E composed in Israel, which stood from 922 to 722 B.C." On whether the patriarchs themselves lived, Friedman says only that "we have little historical information about this from archeology or other ancient sources", since usable evidence begins in the twelfth century."""
citations = [
  { source = "friedman-1987", locator = "p. 22; p. 35" },
  { source = "friedman-1987", locator = "pp. 61-69; p. 87" },
]

[[views]]
label = "Barton: legend, with perhaps a folk memory behind it"
text = """
Barton's position is the cautious middle of current scholarship. The Abraham and Jacob stories are probably folk tales written down later, and nothing in them was probably written before the ninth century; some scholars go further and call them deliberate fiction. He finds it "more challenging to think that the stories of Abraham or Jacob or Moses are also essentially legends, even though people bearing those names may well have existed". The patriarchs' unusual names, which do not recur in the monarchy, still suggest to him a memory from before the kings: "we may still think that the patriarchal stories preserve some kind of folk-memory of earlier times. But exactly how old they are we cannot tell." The stories of Jacob's sons may reflect the period of the judges and the settlement of the land, "rather than telling us much about the second millennium BCE"."""
citations = [
  { source = "barton-2019", locator = "pp. 21, 25-27" },
  { source = "barton-2019", locator = "p. 33" },
]

[[views]]
label = "Kitchen: some twenty features that fit only 1900 to 1600 BCE"
text = """
Kitchen argues the opposite case at length and on the evidence rather than on the consensus. More than half of the patriarchs' names beginning with i or y are of the "Amorite imperfective" type, a share that falls to a quarter or a third at Ugarit and to about an eighth in the Iron Age; he calls the claim that such names had not diminished after the Middle Bronze Age "pure nonsense". Joseph's price matches the slave prices of the eighteenth century BCE, with "20 shekels for Joseph in the early second millennium, 30 shekels under Moses in the later second millennium, and 50 shekels for Assyria under Menahem in the eighth century". The treaties of Genesis 21, 26 and 31 follow the format, witnesses, stipulations and curses, of the almost a dozen treaties from Mari and Tell Leilan of 2000 to 1500 BCE. Genesis 14 fits because "it is only in this particular period (2000-1700) that the eastern realm of Elam intervened extensively in the politics of Mesopotamia", and a year-name of Yahdun-lim of Mari is a close literary parallel. Early-second-millennium tribes moved in several directions, not only from northwest to southeast, so the patriarchal journeys need no single migration. Joseph's 110 years is the Egyptian ideal, while the other lifespans "may allow for possible inflation of these figures in tradition, while keeping the overall profile". On the anachronisms he answers directly. Camels "are clearly attested in contexts of third, early second, late second, as well as early first millennia. Hence they are not anachronistic and have no bearing on date". "Philistines" at Gerar is a later name put in for an obsolete one, as Dan was for Laish, so "it is fatally easy to scream 'anachronism' at this term in the patriarchal narratives"; "Chaldees" in Ur of the Chaldees "is a qualification of later date than the pre-Mosaic period; it may have been added between 1000 and 500". Such late touches are few: "only six later retouches against twenty-four (seventeen clear, seven early or late second millennium) is quite an impressive result." He concludes that "almost a score of very varied lines of evidence" tie the four patriarchs to about 1900 to 1600 BCE, so that "it is wholly reasonable to speak, once more, of a 'patriarchal age' in biblical terms, but on a far sounder basis than was formerly the case", and he calls the attempts by Thompson and Van Seters to dismiss the date and possible historicity of Genesis 14 "wildly mistaken"."""
citations = [
  { source = "kitchen-2003", locator = "pp. 316-327" },
  { source = "kitchen-2003", locator = "pp. 338-345" },
  { source = "kitchen-2003", locator = "pp. 355-359" },
  { source = "kitchen-2003", locator = "pp. 475-476" },
]

[[views]]
label = "Where the disagreement actually lies"
text = """
The two sides are partly answering different questions. Finkelstein and Silberman, Friedman and Barton ask when the stories were written and whose world they describe, and they agree that the answer is the kingdoms of Israel and Judah, from the ninth century to the seventh. Kitchen asks whether the stories' details can be matched to an earlier period, and answers that most of them can. Both sides allow some of what the other says: Finkelstein and Silberman grant that individual episodes may rest on ancient local traditions, and Kitchen grants that "Chaldees" and "Philistines" are later labels and that the Nuzi parallels were overdone. The real dispute is over which details decide the matter. For the majority, place names and political geography are decisive, since a storyteller reproduces the world he knows; for Kitchen, prices, name types and treaty forms are decisive, since a late writer could not have invented details that match the early second millennium and nothing later. A reader who wants a date for Abraham should therefore first decide whether a seventh-century author could have preserved such details across a thousand years, which is where the sources above part company."""
citations = [
  { source = "finkelstein-silberman-2002", locator = "p. 45" },
  { source = "kitchen-2003", locator = "pp. 359, 476" },
]

[[views]]
label = "The Joseph story on its own"
text = """
The Joseph story is usually treated apart, as a single composition. Donald B. Redford dated its writing to between the seventh century and the third quarter of the fifth century BCE, and by the early 1990s most scholars read it as a wisdom novella by one author; Thomas Römer argues for the late Persian period. Kitchen's reply rests on the price of twenty shekels and the age of 110, both of which he reads as early Egyptian and Mesopotamian details."""
citations = [
  { source = "wikipedia-joseph-genesis" },
  { source = "kitchen-2003", locator = "pp. 344-345, 351" },
]
