id = "exodus-historicity"
kind = "historical"
title = "Did the Exodus happen as described?"
status = "draft"
summary = """
This question comes before the date. No Egyptian record mentions an Israelite exodus. Scholars disagree about what that silence and the archaeology mean. This entry is kept apart from the dating views. If the event did not happen as described, there is no date to offer."""
events = ["exodus"]
persons = ["moses"]
verses = [{ ref = "Exod.12.40-Exod.12.41", link = "describes" }]
citations = [
  { source = "finkelstein-silberman-2001" },
  { source = "hoffmeier-1997" },
]

[[views]]
label = "Not as described"
text = """
Finkelstein and Silberman find no convincing archaeological evidence for an exodus as told. They see perhaps a distant memory of the Hyksos being driven out of Egypt. They think the story took its present form in the late 7th century BCE, in Josiah's time, as a reply to Egyptian rule. On their reading, the early Israelites came from within Canaan."""
citations = [{ source = "finkelstein-silberman-2001" }]

[[views]]
label = "An authentic tradition"
text = """
Hoffmeier studies the Egyptian evidence, including a Semitic presence in the Nile Delta. He argues that it supports the Exodus tradition as authentic."""
citations = [{ source = "hoffmeier-1997" }]
