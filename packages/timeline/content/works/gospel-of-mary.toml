note = "Papyrus codex dated to the fifth century, converted to 401-500; it preserves about half the gospel (codex pages 1-19, with pages 1-6 and 11-14 lost). Losekam reports that Lundhaug and Jenott question the fifth-century date of the codex and date its cover to the sixth or seventh century."
