id = "1-enoch"
title = "1 Enoch"
also_known_as = ["Ethiopic Enoch", "The Book of Enoch"]
books = ["1En"]
canon = "pseudepigrapha"
status = "sources-located"
original_language = "Aramaic"
summary = """
1 Enoch is a collection of five booklets (the Watchers, the Parables, the Astronomical Book, the Dream Visions and the Epistle of Enoch) with three appendices, all put under the name of Enoch, the ancestor of Noah. Lim dates the pieces to between about 350 BCE and 75 CE. The Aramaic fragments from Qumran point to Aramaic as the original language; the complete text survives only in Ethiopic. Jude quotes it, and the Ethiopian church still counts it as Scripture. The English text here is Charles's translation, and the one dating table quoted below is Charles's own, as reported by Oesterley in 1917."""
citations = [
  { source = "lim-2013", locator = "p. 143" },
  { source = "satlow-2014", locator = "p. 118" },
  { source = "vanderkam-2012", locator = "chapter 2, section on older literature outside the Hebrew Bible, note 14" },
]

verses = [
  { ref = "Jude.1.14-Jude.1.15", link = "alludes", note = "Jude quotes 1 Enoch 1:9 here and says Enoch prophesied (McDonald p. 311; Lim p. 238 n. 35)." },
  { ref = "2Pet.2.4", link = "alludes", note = "2 Peter 2:4 shows awareness of 1 Enoch's fallen angels, according to McDonald (p. 311)." },
  { ref = "Gen.6.1-Gen.6.4", link = "background", note = "1 Enoch 6–11 tell this story of the sons of God at length; VanderKam (ch. 2) reads it as the earliest interpretation of these verses, though which text came first is disputed." },
]

[[composed]]
id = "lim-350bce-75ce"
label = "About 350 BCE to 75 CE (the whole collection)"
tradition = "critical"
earliest = -350
latest = 75
held_by = "Timothy H. Lim (2013)"
summary = """
Lim describes 1 Enoch as a composite document whose parts date to different periods, from about 350 BCE to 75 CE. The latest end is set by the Parables, which have no copy at Qumran."""
citations = [{ source = "lim-2013", locator = "p. 143" }]

[[composed]]
id = "charles-oesterley-1917"
label = "About 200 BCE to 64 BCE, by Charles's table (1917)"
tradition = "critical"
earliest = -200
latest = -64
held_by = "R. H. Charles, reported by W. O. E. Oesterley (1917)"
summary = """
This is the translator's view as of 1917; scholarship has moved since. Oesterley reports Charles's table: the Apocalypse of Weeks and chapters 12 to 36 are the oldest, pre-Maccabean pieces; the Dream Visions date to 165 to 161 BCE; the Astronomical Book is before 110 BCE; the Parables are about 105 to 64 BCE. Oesterley says the earliest portions belong to about 200 to 150 BCE and that the book as a whole is pre-Christian. Chapter 108 is called a later appendix and chapter 105 cannot be dated, so the end date here covers the dated parts only."""
citations = [{ source = "charles-1917-enoch", locator = "intro., pp. xiii-xv" }]

[[provenance]]
place = "Northern Palestine, near the sources of the Jordan below Mount Hermon"
note = """
Oesterley, following Burkitt, places the author of the earliest portions there (1917 view). He notes this shows the book is Palestinian."""
citations = [{ source = "charles-1917-enoch", locator = "intro., p. xv" }]

