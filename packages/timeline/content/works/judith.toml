id = "judith"
title = "Judith"
books = ["Jdt"]
canon = "deuterocanon"
status = "draft"
summary = "Judith is a story of Jewish resistance. No filed critical source dates it; Brown says only that all the deuterocanonical books were composed before Jesus' time. The unsigned preface to the Apocrypha in the Brenton edition calls it a sacred historical novel written in the Maccabean age, with 'Nebuchadrezzar' probably standing for Antiochus Epiphanes, and thinks the Greek and Aramaic forms came from a Hebrew original. Athanasius lists it among the books to be read but not canonical; Jerome says it is not in the canon. The Roman Catholic, Orthodox and Ethiopian churches hold it as scripture."
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on Judith" }, { source = "mcdonald-2017-vol1", locator = "p. 142, n. 49" }, { source = "brown-1997", locator = "Introductory Background, Useful Information about the Bible as a Whole" }]
original_language = "Hebrew (probably; the Greek form survives)"
composed_undated = "Not dated by any source filed here. The earliest copies the filed sources date are Codex Vaticanus (fourth century, about 350 CE) and Codex Sinaiticus (about 350-400 CE). Brown says only that all the deuterocanonical books were composed before Jesus' time; an unsigned, undated preface to the Apocrypha in the eBible Brenton edition says 'the Maccabean age', without years."

[[witnesses]]
name = "Codex Vaticanus (B)"
siglum = "B"
earliest = 301
latest = 400
language = "Greek"
note = "McDonald dates it to the fourth century (p. 497; 'ca. 350 CE' on p. 427); the range is the century. His list of its Old Testament has Wisdom, Sirach, Esther, Judith and Tobit. No holding institution is stated on the pages read."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 427" }, { source = "mcdonald-2017-vol1", locator = "p. 497" }]

[[witnesses]]
name = "Codex Sinaiticus (01)"
siglum = "01"
earliest = 350
latest = 400
language = "Greek"
note = "McDonald dates it 'ca. 350-400 CE' (p. 427). His list of its Old Testament has Judith after Tobit."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 427" }]

[[witnesses]]
name = "Codex Alexandrinus (A)"
siglum = "A"
earliest = 401
latest = 500
language = "Greek"
note = "McDonald dates it to the fifth century (pp. 428, 497), here converted to 401-500. His list of its Old Testament has Judith after Tobit."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 428" }, { source = "mcdonald-2017-vol1", locator = "p. 497" }]

[[held_canonical_by]]
tradition = "Roman Catholic Church"
note = "McDonald lists it among the deuterocanonical books of the Roman Catholic Old Testament (p. 142, n. 49; p. 10, n. 14)."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 142, n. 49" }, { source = "mcdonald-2017-vol1", locator = "p. 10, n. 14" }]

[[held_canonical_by]]
tradition = "Eastern Orthodox churches"
note = "McDonald lists it among the books the Roman Catholic and Orthodox canons include beyond the Hebrew Bible; the Orthodox settled the scope of their canon at the Council of Jerusalem in 1672 (p. 142, n. 49)."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 142, n. 49" }]

[[held_canonical_by]]
tradition = "Ethiopian Orthodox Tewahedo Church"
note = "McDonald reports Judith in both Ethiopian Old Testament lists (p. 457)."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 457" }]

