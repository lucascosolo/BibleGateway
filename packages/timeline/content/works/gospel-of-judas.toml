note = "Papyrus codex dated to the late fourth or early fifth century, read here as 351-450; it preserves more than 90% of the gospel. Fragments recovered after National Geographic's first edition have since been photographed, and Gregor Wurst has made provisional digital reconstructions of several pages."
citations = [{ source = "mattison-gospels-net", locator = "Manuscript Information page" }]

