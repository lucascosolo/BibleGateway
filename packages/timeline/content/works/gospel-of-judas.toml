id = "gospel-of-judas"
title = "Gospel of Judas"
also_known_as = ["Codex Tchacos, tractate 3"]
books = ["GJudas"]
canon = "nt-apocrypha"
status = "draft"
original_language = "Unknown; the only surviving text is Coptic"
composed_undated = "Not dated by any source filed here. The only copy, Codex Tchacos, is dated to the late fourth or early fifth century. Ehrman reports that Irenaeus, in the second century, knew a 'Gospel of Judas', but no filed page says it is this text."
summary = """
A gnostic gospel in which Jesus gives his secret revelation principally to Judas Iscariot, who alone understands that Jesus comes from a realm above the creator god; Ehrman notes that Jesus laughs at the other disciples' misunderstanding four times. No filed source dates its composition, so the record is a draft. Its only manuscript, Codex Tchacos, is dated to the late fourth or early fifth century. Ehrman reports that Irenaeus, in the second century, accused the Cainites of using a forged Gospel of Judas; that page does not say whether it is this text."""
citations = [
  { source = "ehrman-brief-intro-2017", locator = "Box 8.3, p. 116 approx." },
  { source = "ehrman-2013", locator = "PDF p. 203" },
  { source = "mattison-gospels-net", locator = "Manuscript Information page" },
]

