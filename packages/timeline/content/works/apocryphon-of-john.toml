held_by = "Bruce M. Metzger (1987)"
summary = """
Metzger says the Greek originals of the Nag Hammadi Gnostic treatises may be as early as the second or third century, and that the Coptic manuscripts date from about 400. This is a general range for the library, not a date for this work in particular. Burns and Goff note that Irenaeus's account of a version of the myth in Against Heresies 1.29 shows it was known to him."""
