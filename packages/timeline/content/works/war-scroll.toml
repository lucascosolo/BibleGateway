id = "war-scroll"
title = "War Scroll (1QM)"
also_known_as = ["The War of the Sons of Light against the Sons of Darkness", "War Rule", "Milhamah"]
canon = "described"
status = "sources-located"
original_language = "Hebrew"
summary = """
The War Scroll is a sectarian work from Qumran describing a final war between the 'Sons of Light' and the 'Sons of Darkness'. McDonald describes the Cave 1 copy as a nineteen-column document of instructions for preparing the great eschatological battle. Cave 4 copies of a War Rule also exist, and Lim says it is uncertain when they were composed."""
contents = """
McDonald says the scroll gives instructions for the preparations for the great eschatological battle (compare Ezekiel 38 to 39 and Daniel). VanderKam adds that it speaks at length of the final war between the sons of light and the sons of darkness, led by the Prince of the Congregation, with a priest performing scriptural duties in war. Burns and Goff note that Michael, as head of the heavenly host that destroys the forces of Belial, is called "the Prince of all the Congregation" (1QM V,1)."""
citations = [
  { source = "mcdonald-2017-vol1", locator = "p. 241" },
  { source = "vanderkam-2012", locator = "chapter 6, section Messiahs" },
  { source = "dss-nag-hammadi-codices", locator = "p. 23" },
]

[[composed]]
id = "qumran-occupation-window"
label = "During the Qumran community's occupation, about 100 BCE to 68 CE"
tradition = "archaeological"
earliest = -100
latest = 68
held_by = "Southwestern Journal of Theology 53/1 (2010)"
summary = """
No filed source dates the writing of the War Scroll itself. McDonald counts it among the sectarian writings of the Qumran community, and a 2010 survey gives that community's span as about 100 BCE to 68 CE; this range is only that window and is not a date given for the text. Lim writes that it is uncertain when the Cave 4 War Rule copies were originally composed, and the relationship between those fragments and the Cave 1 scroll is not settled in the sources read."""
citations = [
  { source = "swjt-2010-dss", locator = "p. 39" },
  { source = "mcdonald-2017-vol1", locator = "p. 241" },
  { source = "lim-2013", locator = "p. 128" },
]

