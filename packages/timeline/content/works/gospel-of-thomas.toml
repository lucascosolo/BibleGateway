id = "gospel-of-thomas"
title = "Gospel of Thomas"
also_known_as = ["Coptic Gospel of Thomas", "Nag Hammadi Codex II,2"]
books = ["GThom"]
canon = "nt-apocrypha"
status = "sources-located"
original_language = "Greek"
summary = """
A collection of 114 sayings of Jesus, almost all introduced by 'Jesus said', said in its opening line to be the secret words written down by Didymus Judas Thomas. It survives complete in Coptic in Nag Hammadi Codex II and in part in Greek papyri from Oxyrhynchus. Metzger finds parallels mostly with Matthew's Sermon on the Mount and parables and with parts of Luke, and judges Thomas's forms of the sayings usually secondary, some perhaps from a source shared with the Gospels. He dates it to Syria about 140 CE. Eusebius named a Gospel of Thomas among works used by heretics under an apostle's name."""
citations = [
  { source = "metzger-1987-canon", locator = "pp. 85-86" },
  { source = "mattison-gospels-net", locator = "Manuscript Information page" },
]
verses = [
  { ref = "Matt.5.1-Matt.7.29", link = "alludes", note = "Many sayings in the Gospel of Thomas resemble this Sermon on the Mount (Metzger p. 85)." },
  { ref = "Matt.13.3-Matt.13.52", link = "alludes", note = "The Gospel of Thomas has parallels to this chapter of parables (Metzger p. 85)." },
  { ref = "Luke.6.1-Luke.6.49", link = "alludes", note = "The Gospel of Thomas is closest to the sayings collected in this chapter and in Luke 11 and 12 (Metzger p. 85)." },
  { ref = "Luke.11.1-Luke.11.54", link = "alludes", note = "The Gospel of Thomas is closest to the sayings collected in this chapter and in Luke 6 and 12 (Metzger p. 85)." },
  { ref = "Luke.12.1-Luke.12.59", link = "alludes", note = "The Gospel of Thomas is closest to the sayings collected in this chapter and in Luke 6 and 11 (Metzger p. 85)." },
  { ref = "John.4.1-John.4.42", link = "alludes", note = "The Gospel of Thomas's few parallels to John centre on this conversation with the woman of Samaria (Metzger p. 85)." },
]

[[composed]]
id = "syria-about-140"
label = "About 140 CE, in Syria"
tradition = "critical"
earliest = 140
latest = 140
held_by = "Bruce M. Metzger (1987)"
summary = """
Metzger says the compiler seems to have written in Syria about 140 CE, drawing on the Gospel of the Egyptians and the Gospel according to the Hebrews as well as the church's Gospels. He adds that the Greek originals of Nag Hammadi works may be as early as the second or third century, and that the Coptic manuscripts date from about 400. Metzger wrote in 1987; the Greek papyri below show the Greek text existed by about 200."""
citations = [{ source = "metzger-1987-canon", locator = "pp. 84-86" }]

