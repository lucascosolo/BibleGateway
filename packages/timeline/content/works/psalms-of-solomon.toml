id = "psalms-of-solomon"
title = "Psalms of Solomon"
books = ["PssSol"]
canon = "pseudepigrapha"
status = "claims-checked"
original_language = "Hebrew"
summary = """
The Psalms of Solomon are eighteen psalms. McDonald, after Charlesworth, dates them about 55-50 BCE, and Brown to 65-40 BCE, composed in Hebrew in Jerusalem. Gray, the translator, said in 1913 that they were composed in the middle of the first century BCE: the state of society they reflect, and their allusions to Pompey's actions in Palestine and his death in Egypt in 48 BCE, fit that period. Only Greek and Syriac texts survive.
"""
citations = [
  { source = "charles-1913-apot-2", locator = "Psalms of Solomon, intro., p. 625" },
  { source = "charles-1913-apot-2", locator = "Psalms of Solomon, intro., p. 628" },
  { source = "mcdonald-2017-vol1", locator = "p. 140" }, { source = "brown-1997", locator = "Appendix II, Jewish and Christian Writings Pertinent to the New Testament, entry on Psalms of Solomon" }
]

