label = "Middle of the first century BCE, about 63 to 48 BCE (Gray, 1913)"
tradition = "critical"
earliest = -63
latest = -48
held_by = "George Buchanan Gray (1913)"
summary = """
This is the translator's view as of 1913. Gray says the psalms fit the middle of the first century BCE and that most were probably written soon after Pompey's invasion of Palestine in 63 BCE. Psalm 2 was written after, and probably soon after, Pompey's death in 48 BCE. He notes that Psalms 4 and 12 may be the earliest and may predate the invasion, so the start of this range is a cautious reading of his main case."""
