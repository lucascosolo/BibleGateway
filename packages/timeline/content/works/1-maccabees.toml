id = "1-maccabees"
title = "1 Maccabees"
books = ["1Macc"]
canon = "deuterocanon"
status = "claims-checked"
summary = "1 Maccabees is a history of the Maccabean revolt. Satlow reads it as a court history written in John Hyrcanus's reign (135-104 BCE); McDonald dates it about 135 BCE in one place and about 100 BCE in another. The unsigned preface to the Apocrypha in the Brenton edition calls it a trustworthy record written originally in Hebrew by an orthodox Jew, in the early first century BCE. Jerome says he found it in Hebrew and 2 Maccabees in Greek. The Catholic, Orthodox and Ethiopian churches hold it as scripture."
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on Maccabees" }, { source = "mcdonald-2017-vol1", locator = "p. 179" }, { source = "satlow-2014", locator = "p. 124" }, { source = "satlow-2014", locator = "p. 144" }]
original_language = "Hebrew (the Greek text survives)"


[[composed]]
id = "hyrcanus-court"
label = "John Hyrcanus's reign, 135 to 104 BCE (Satlow, 2014)"
tradition = "critical"
earliest = -135
latest = -104
held_by = "Michael L. Satlow (2014)"
summary = "Satlow calls 1 Maccabees a court history of the Hasmoneans 'written about fifty years after the events of the revolt' (p. 124) and suggests its author was a Sadducee writing in John Hyrcanus's court (p. 144). The range is the span of his chapter on Hyrcanus's Judea, 135-104 BCE (p. 136). McDonald gives two dates at either end of it: 'ca. 135 BCE' (p. 62) and 'ca. 100 BCE' (p. 179)."
citations = [{ source = "satlow-2014", locator = "p. 124" }, { source = "satlow-2014", locator = "p. 144" }, { source = "satlow-2014", locator = "p. 136" }, { source = "mcdonald-2017-vol1", locator = "p. 62" }, { source = "mcdonald-2017-vol1", locator = "p. 179" }]

[[composed]]
id = "first-century-bce-opening"
label = "Early first century BCE, about 100 BCE (unsigned preface)"
tradition = "traditional"
earliest = -100
latest = -81
held_by = "Unsigned preface to the Apocrypha in the eBible Brenton edition (undated; not Brenton's own 1851 text)"
summary = "The preface says it was 'probably during the first or second decade of the first century b.c.'; the range converts those two decades to 100-81 BCE. The preface mentions the recovery of Hebrew Sirach and so is later than Brenton's 1851 translation; scholarship has moved since."
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on Maccabees" }]

