id = "1-maccabees"
title = "1 Maccabees"
books = ["1Macc"]
canon = "deuterocanon"
status = "sources-located"
summary = "1 Maccabees is a history of the Maccabean revolt. The unsigned preface to the Apocrypha in the Brenton edition calls it a trustworthy record written originally in Hebrew by an orthodox Jew, in the early first century BCE. McDonald gives its date as about 100 BCE. Jerome says he found it in Hebrew and 2 Maccabees in Greek. The Catholic, Orthodox and Ethiopian churches hold it as scripture."
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on Maccabees" }, { source = "mcdonald-2017-vol1", locator = "p. 179" }]
original_language = "Hebrew (the Greek text survives)"

[[composed]]
id = "first-century-bce-opening"
label = "Early first century BCE (about 100 BCE)"
tradition = "critical"
earliest = -100
latest = -81
summary = "The preface says it was 'probably during the first or second decade of the first century b.c.'; the range converts those two decades to 100-81 BCE. McDonald's 'ca. 100 BCE' lies inside it. This is the view of that unsigned preface, which mentions the recovery of Hebrew Sirach and so is later than Brenton's 1851 translation; scholarship has moved since."
held_by = "Unsigned preface to the Apocrypha in the eBible Brenton edition (undated; not Brenton's own 1851 text)"
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on Maccabees" }, { source = "mcdonald-2017-vol1", locator = "p. 179" }]

