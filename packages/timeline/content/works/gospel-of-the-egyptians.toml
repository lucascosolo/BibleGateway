id = "gospel-of-the-egyptians"
title = "Gospel of the Egyptians (Nag Hammadi)"
also_known_as = ["Coptic Gospel of the Egyptians"]
canon = "described"
status = "sources-located"
original_language = "Greek"
summary = """
An esoteric treatise preserved in two Coptic versions in the Nag Hammadi library. It is a different book from the Greek Gospel of the Egyptians, which Clement of Alexandria quoted and which Metzger dates after 150 CE; Metzger flags the difference in a footnote. No filed source gives a date for the Coptic work in particular; Metzger's general range for the Greek originals of the Nag Hammadi tractates is the second or third century. It has no verses in the corpus and no full English text in this app."""
contents = """
An esoteric treatise, known in two Coptic copies. Not to be confused with the Greek Gospel of the Egyptians quoted by Clement of Alexandria."""
citations = [
  { source = "metzger-1987-canon", locator = "pp. 84, 171 n. 14" },
]

