tradition = "critical"
earliest = 101
latest = 300
held_by = "Bruce M. Metzger (1987)"
summary = """
Metzger says the Greek originals of the Nag Hammadi Gnostic treatises may be as early as the second or third century, and that the Coptic manuscripts date from about 400. This is a general range for the library, not a date for this work in particular."""
citations = [{ source = "metzger-1987-canon", locator = "p. 84" }]

