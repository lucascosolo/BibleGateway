note = "Athanasius's list reads 'Jeremiah with Baruch, Lamentations, and the epistle'; the translator's note identifies the epistle as Baruch vi."
citations = [{ source = "npnf2-04-ccel", locator = "Festal Letter 39, section 4" }]

[[events]]
event = "canon-origen-lists"
note = "Origen's list, as Eusebius gives it, has 'Jeremiah, with Lamentations and the epistle in one'; the text says only 'the epistle'."
citations = [{ source = "npnf2-01-ccel", locator = "Church History 6.25" }]
