id = "letter-of-jeremiah"
title = "Letter of Jeremiah"
also_known_as = ["Epistle of Jeremiah", "Epistle of Jeremy"]
books = ["EpJer"]
canon = "deuterocanon"
status = "draft"
summary = "The Letter of Jeremiah is a short attack on idolatry, purportedly sent to the captives about to be exiled to Babylon; VanderKam gives it 73 verses. No filed critical source dates its composition; Lim lists a Greek papyrus from Qumran cave 7 (7Q2) as a copy of about 100 BCE. The unsigned preface to the Apocrypha in the Brenton edition says it was written in Greek, probably by an Alexandrian Jew of the first century BCE, and forms the last chapter of Baruch in the King James Apocrypha."
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on the Epistle of Jeremiah" }, { source = "vanderkam-2012", locator = "ch. 4, section 'Epistle of Jeremiah'" }, { source = "lim-2013", locator = "p. 86" }]
original_language = "Greek"
composed_undated = "Not dated by any source filed here. The earliest copy is the Greek papyrus 7QpapEpJer (7Q2) from Qumran cave 7, which Lim lists at 100 BCE, so the book is no later than about then. An unsigned, undated preface to the Apocrypha in the eBible Brenton edition says the first century BCE."

[[provenance]]
place = "Alexandria"
note = "The preface says it was probably written by a Jew of Alexandria."
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on the Epistle of Jeremiah" }]

[[witnesses]]
name = "7QpapEpJer (7Q2)"
siglum = "7Q2"
earliest = -100
latest = -100
language = "Greek"
note = "Lim dates it 100 BCE (a single approximate date). VanderKam notes only 22 letters survive over five lines, so the identification rests on little text."
citations = [{ source = "lim-2013", locator = "p. 86" }, { source = "vanderkam-2012", locator = "ch. 4, section 'Epistle of Jeremiah'" }]

[[witnesses]]
name = "Codex Vaticanus (B)"
siglum = "B"
earliest = 301
latest = 400
language = "Greek"
note = "McDonald dates it to the fourth century (p. 497; 'ca. 350 CE' on p. 427); the range is the century. His list of its Old Testament has Baruch, Lamentations and the Epistle of Jeremiah after Jeremiah. No holding institution is stated on the pages read."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 427" }, { source = "mcdonald-2017-vol1", locator = "p. 497" }]

[[witnesses]]
name = "Codex Alexandrinus (A)"
siglum = "A"
earliest = 401
latest = 500
language = "Greek"
note = "McDonald dates it to the fifth century (pp. 428, 497), here converted to 401-500. His list of its Old Testament has Epistle of Jeremiah after Lamentations."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 428" }, { source = "mcdonald-2017-vol1", locator = "p. 497" }]

[[witnesses]]
name = "Coptic papyrus codices from the Pachomian monastery collection"
earliest = 301
latest = 700
language = "Coptic"
note = "McDonald lists the Epistle of Jeremiah (Coptic) among manuscripts 'produced from the beginning of the fourth century CE to around the seventh century' (p. 427); the range is that span."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 427" }]

[[held_canonical_by]]
tradition = "Roman Catholic Church"
note = "McDonald lists the Epistle of Jeremiah with Baruch among the Catholic books (p. 142, n. 49)."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 142, n. 49" }, { source = "mcdonald-2017-vol1", locator = "p. 10, n. 14" }]

[[held_canonical_by]]
tradition = "Eastern Orthodox churches"
note = "McDonald lists Baruch plus the Epistle of Jeremiah among the books the Orthodox canon includes (p. 142, n. 49)."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 142, n. 49" }]

[[translations]]
