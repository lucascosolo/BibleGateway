id = "shepherd-of-hermas"
title = "Shepherd of Hermas"
also_known_as = ["The Shepherd", "Pastor of Hermas"]
books = ["Herm"]
canon = "apostolic"
status = "sources-located"
original_language = "Greek"
summary = """
A long allegorical call to repentance, written at Rome by a freedman called Hermas. It has five Visions, twelve Mandates and ten Similitudes, and is named for the shepherd who guides Hermas. It was one of the most popular books of the early church and some, such as Irenaeus and Clement of Alexandria, treated it as inspired. Its date is unresolved: its mention of a Clement points to about 96 CE, while the Muratorian Fragment says Hermas was the brother of Pius, bishop of Rome around the middle of the second century. Metzger suggests the book grew over a long period and was gathered toward the middle of the second century. The Muratorian Fragment says it should be read but not read publicly in church; Athanasius and Eusebius both place it outside the canon."""
citations = [
  { source = "metzger-1987-canon", locator = "pp. 63-67" },
  { source = "lightfoot-harmer-1891", locator = "intro., pp. 291-294" },
]
verses = [
  { ref = "John.3.18", link = "alludes", note = "Hermas, Similitude 9.12, seems to remember this verse: one enters the kingdom only by receiving the Name of the Son of God (Metzger p. 66)." },
  { ref = "Eph.4.3-Eph.4.6", link = "alludes", note = "Hermas, Similitudes 9.13, 17 and 18, probably draws on these verses for “one spirit and one body” (Metzger p. 66)." },
  { ref = "Jas.1.8", link = "alludes", note = "Hermas uses this verse's rare word “double-minded” dozens of times (Metzger pp. 66-67)." },
  { ref = "Jas.4.8", link = "alludes", note = "Hermas uses this verse's rare word “double-minded” dozens of times (Metzger p. 67)." },
  { ref = "Rom.16.14", link = "background", note = "Origen and Jerome identified the author of the Shepherd with the Hermas greeted here, but Metzger (p. 64) says the evidence points to a later author." },
]

[[composed]]
id = "gathered-to-mid-second-century"
label = "About 96 to the middle of the second century CE"
tradition = "critical"
earliest = 96
latest = 150
held_by = "Bruce M. Metzger (1987)"
summary = """
Metzger weighs two lines of evidence: the author's contemporary Clement, if the Clement of Rome who wrote about 96, would put the book at the end of the first century, while the Muratorian Fragment puts Hermas under Pius, who died about 154. He offers as the least unsatisfactory solution that Hermas wrote sections over a long period and gathered them toward the middle of the second century, but says the problem is unresolved. The range here runs from his date for Clement (96) to the middle of the second century, read as 150."""
citations = [{ source = "metzger-1987-canon", locator = "pp. 64-65" }]

[[composed]]
id = "time-of-pius"
label = "Bishop Pius of Rome, about 140 to 155 CE"
tradition = "critical"
earliest = 140
latest = 155
held_by = "J. B. Lightfoot and J. R. Harmer (1891)"
summary = """
Lightfoot and Harmer adopt, with some diffidence, the Muratorian Fragment's statement that Hermas wrote while his brother Pius was bishop of Rome, which they date 140 to 155, though they grant that a date about 90 to 100 fits the mention of Clement better. This is the translators' view as of 1891; scholarship has moved since."""
citations = [{ source = "lightfoot-harmer-1891", locator = "intro., p. 293-294" }]

[[provenance]]
place = "Rome"
note = "Hermas says he was sold at Rome as a slave and his home and the road to Cumae are named; the work was evidently written there."
citations = [
  { source = "metzger-1987-canon", locator = "p. 65" },
  { source = "lightfoot-harmer-1891", locator = "intro., p. 292" },
]

