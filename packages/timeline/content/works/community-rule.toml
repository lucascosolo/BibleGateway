id = "community-rule"
title = "Community Rule (1QS)"
also_known_as = ["Rule of the Community", "Serekh ha-Yahad", "Manual of Discipline"]
canon = "described"
status = "sources-located"
original_language = "Hebrew"
summary = """
The Community Rule sets out how the sectarian community at Qumran lived: who could join, how members were ranked, how they shared meals, and the beliefs behind it, including a teaching on two spirits of good and evil. The best-preserved copy, 1QS, was one of the first seven scrolls found in Cave 1 in 1947. Further copies from Cave 4 show that the text circulated in several versions, and the Cave 1 copy is not the oldest form."""
contents = """
McDonald lists six parts: the community's aims and ideals; an annual census of members, with a moral charge to humility; a treatise on the spirits of good and evil; rules on obedience; an oath of allegiance; and a closing hymn that mentions calendar details and the secrecy of the community's teaching. VanderKam says it is widely believed to have regulated the life of the Qumran group, which practised a pooling of goods."""
citations = [
  { source = "mcdonald-2017-vol1", locator = "p. 241" },
  { source = "vanderkam-2012", locator = "chapter 7, section Community of Goods" },
]

[[composed]]
id = "satlow-earliest-copies"
label = "By the late second to early first century BCE (date of the earliest copies)"
tradition = "critical"
earliest = -150
latest = -76
held_by = "Michael L. Satlow (2014)"
summary = """
Satlow says the earliest fragments of the Community Rule and the Damascus Document date to the late second or early first century BCE. That dates the surviving copies, not the writing of the text, and VanderKam notes that a passage on two messiahs (1QS 9:9-11) is missing from the oldest copy but present in the Cave 1 copy, so the text changed over time and the first version may be older. The range converts 'late second to early first century' to 150 to 76 BCE."""
citations = [
  { source = "satlow-2014", locator = "p. 176" },
  { source = "vanderkam-2012", locator = "chapter 6, section Messiahs" },
]

