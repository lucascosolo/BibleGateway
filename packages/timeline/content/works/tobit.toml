note = "The oldest of five Tobit copies from cave 4 and the earliest of the Aramaic ones; VanderKam gives 'ca. 100 B.C.E.' (a single approximate date, so earliest and latest are equal), the dates being Fitzmyer's."
citations = [{ source = "vanderkam-2012", locator = "ch. 4, section 'Tobit'" }]

