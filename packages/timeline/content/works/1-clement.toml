tradition = "critical"
earliest = 69
latest = 70
held_by = "A. E. Wilhelm-Hooijbergh (1975) and J. A. T. Robinson (1976), as reported by Metzger (1987)"
summary = """
Metzger notes that the usual date is disputed. Wilhelm-Hooijbergh dates the letter to 69 and Robinson to early 70."""
citations = [{ source = "metzger-1987-canon", locator = "p. 40 n. 5" }]

