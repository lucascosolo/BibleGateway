id = "1-clement"
title = "1 Clement"
also_known_as = ["The Epistle of Clement to the Corinthians", "First Epistle of Clement"]
books = ["1Clem"]
canon = "apostolic"
status = "claims-checked"
original_language = "Greek"
summary = """
A long letter sent in the name of the church at Rome to the church at Corinth, where some younger members had ousted certain presbyters. The writer, traditionally Clement of Rome, calls the factions to repentance and tells the Corinthians to reinstate the deposed leaders. Metzger dates it about 95 to 96 CE. For the history of the canon its value is that it quotes the Old Testament as Scripture more than a hundred times, recalls the words of the Lord Jesus twice without naming a written gospel, and knows several of Paul's letters and Hebrews without calling them Scripture."""
citations = [
  { source = "metzger-1987-canon", locator = "pp. 40-43" },
  { source = "lightfoot-harmer-1891", locator = "intro., p. 3" },
]
verses = [
  { ref = "Matt.5.7", link = "alludes", note = "1 Clement 13.2 strings together sayings of Jesus that Metzger (p. 41) traces partly to this verse." },
  { ref = "Luke.6.36-Luke.6.38", link = "alludes", note = "1 Clement 13.2 includes sayings that Metzger (p. 41) traces partly to these verses." },
  { ref = "Mark.9.42", link = "alludes", note = "1 Clement 46.7-8 recalls this millstone saying, which Metzger (p. 42) compares with its parallels in Matthew and Luke." },
  { ref = "Matt.18.6-Matt.18.7", link = "alludes", note = "1 Clement 46.7-8 recalls the millstone saying found here (Metzger p. 42)." },
  { ref = "Luke.17.1-Luke.17.2", link = "alludes", note = "1 Clement 46.7-8 recalls the millstone saying found here (Metzger p. 42)." },
  { ref = "Matt.13.3", link = "alludes", note = "1 Clement 24.5 uses imagery from this parable of the sower (Metzger p. 42)." },
  { ref = "Rom.1.29-Rom.1.32", link = "alludes", note = "1 Clement 35.5-6 paraphrases these verses (Metzger p. 43)." },
  { ref = "Heb.1.1-Heb.1.3", link = "alludes", note = "1 Clement 36.2-5 consists almost entirely of echoes of these verses (Metzger p. 43)." },
]

[[composed]]
id = "ad-95-96"
label = "About 95 to 96 CE"
tradition = "critical"
earliest = 95
latest = 96
held_by = "Bruce M. Metzger (1987); Lightfoot and Harmer (1891) place it near 95"
summary = """
Metzger gives about 95 to 96 CE for the letter. Lightfoot and Harmer (1891) tie it to the end of Domitian's reign and the year 95, when Flavius Clemens was put to death."""
citations = [
  { source = "metzger-1987-canon", locator = "p. 40" },
  { source = "lightfoot-harmer-1891", locator = "intro., p. 3" },
]

[[composed]]
