id = "protevangelium-of-james"
title = "Protevangelium of James"
also_known_as = ["Infancy Gospel of James", "Birth of Mary"]
books = ["ProtJas"]
canon = "nt-apocrypha"
status = "sources-located"
original_language = "Greek"
summary = """
An infancy gospel attributed to James that deals with the history of Joseph and the Virgin Mary before the birth of Christ. McDonald dates it to the second century CE, and Brown says it was in circulation by the middle of that century. Metzger lists it among the apocryphal gospels about Jesus' early years produced in the second, third and following centuries; the translator Walker (1870) reckoned it one of the origins of the infancy traditions and of undoubted antiquity. The name Protevangelium was first given by Postel, whose Latin version appeared in 1552. Over 140 Greek manuscripts survive, the most important being Papyrus Bodmer V.
"""
citations = [
  { source = "metzger-1987-canon", locator = "p. 167" },
  { source = "anf08-ccel", locator = "Translator's Introductory Notice, pp. 351-352" },
  { source = "mattison-gospels-net", locator = "Manuscript Information page" },
  { source = "mcdonald-2017-vol1", locator = "p. 289" }, { source = "brown-1997", locator = "Appendix II, PDF p. 888" }
]

[[composed]]
id = "second-century"
label = "Second century CE (McDonald, 2017; Brown, 1997)"
tradition = "critical"
earliest = 101
latest = 200
held_by = "Lee Martin McDonald (2017); Raymond E. Brown (1997)"
summary = "McDonald calls it 'the second-century CE Protevangelium of James' (p. 289) and in his foreword one of the earliest books of the New Testament Apocrypha, which may contain first-century sources (p. xviii). Brown says it was in circulation by the middle of the second century, with Greek manuscripts beginning in the third."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 289" }, { source = "mcdonald-2017-vol1", locator = "p. xviii" }, { source = "brown-1997", locator = "Appendix II, PDF p. 888" }]

[[composed]]
id = "walker-first-four-centuries"
label = "Within the first four centuries CE (Walker, 1870)"
tradition = "critical"
earliest = 1
latest = 400
held_by = "Alexander Walker (1870)"
summary = """
Walker's introduction to the Ante-Nicene Fathers volume says most authorities assign the Protevangelium to the first four Christian centuries, that the traditions behind it were in circulation in the second century, and that Justin Martyr refers to the cave of the birth while it is unclear whether Origen's 'book of James' is this work. This is the translator's view as of 1870; scholarship has moved since."""
citations = [{ source = "anf08-ccel", locator = "Translator's Introductory Notice, pp. 351-352" }]

