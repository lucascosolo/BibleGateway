id = "infancy-gospel-of-thomas"
title = "Infancy Gospel of Thomas"
also_known_as = ["Gospel of Thomas (Greek infancy gospel)", "Childhood Deeds of Jesus"]
books = ["InfThom"]
canon = "nt-apocrypha"
status = "sources-located"
original_language = "Greek"
composed_undated = "Not dated by any critical source filed here: Brown notes only that the original Greek survives in very late manuscripts and that Latin and Syriac texts go back to the fifth century. Its translator Alexander Walker (1870) judged it of undoubted antiquity and used in the second century; that is a nineteenth-century translator's view, not critical scholarship. Metzger confirms that the Alpha story Irenaeus reports from the Marcosians is also in this Greek gospel."
summary = """
Stories of Jesus as a boy, found in several Greek forms and in Latin. It is a different book from the Coptic Gospel of Thomas, a collection of sayings. No filed critical source dates its composition: Brown notes only that the original Greek survives in very late manuscripts and that Latin and Syriac texts go back to the fifth century. Walker (1870) judged it of undoubted antiquity, a work of a Gnostic, Docetic, Marcosian author known to Origen, Irenaeus and the Gnostic Nachashenes of the second century. Metzger notes that the story of the boy Jesus and the teacher who asked him to say 'Alpha', which Irenaeus reports as told by the Marcosians, is also in the Greek Gospel of Thomas. Its earliest Greek manuscript is of the eleventh century, and the earliest manuscripts in other languages come closer to it.
"""
