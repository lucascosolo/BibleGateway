id = "prayer-of-azariah"
title = "Prayer of Azariah"
also_known_as = ["Song of the Three Children", "Song of the Three Young Men"]
books = ["PrAzar"]
canon = "deuterocanon"
status = "sources-located"
summary = "The Prayer of Azariah and the Song of the Three Jews is placed in the furnace scene of Daniel: a prayer put in the mouth of Azarias (Abed-Nego) and the psalm of thanksgiving known as the Benedicite. The unsigned preface to the Apocrypha in the Brenton edition says the three additions to Daniel (the Song of the Three Children, Susanna, and Bel and the Dragon) were probably composed in the Maccabean age and that their original language is much disputed. They are in the Septuagint's Daniel; the Catholic and Orthodox churches hold them as scripture."
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on the Additions to Daniel" }, { source = "mcdonald-2017-vol1", locator = "p. 227" }]
original_language = "Disputed (Semitic or Greek)"

[[composed]]
id = "maccabean-age"
label = "The Maccabean age"
tradition = "critical"
earliest = -175
latest = -63
summary = "The preface says only 'the Maccabean age', for all three additions together. The range is a conversion made for this record: from 175 BCE, when Antiochus Epiphanes began his Hellenizing policies (Lim, p. 96), to 63 BCE, when the Romans took control (McDonald, p. 175). This is the view of that unsigned preface, which mentions the recovery of Hebrew Sirach and so is later than Brenton's 1851 translation; scholarship has moved since."
held_by = "Unsigned preface to the Apocrypha in the eBible Brenton edition (undated; not Brenton's own 1851 text)"
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on the Additions to Daniel" }, { source = "lim-2013", locator = "p. 96" }, { source = "mcdonald-2017-vol1", locator = "p. 175" }]

[[held_canonical_by]]
tradition = "Roman Catholic Church"
note = "McDonald says the Roman Catholic Old Testament has the additions to Daniel (p. 10, n. 14; p. 142, n. 49)."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 142, n. 49" }, { source = "mcdonald-2017-vol1", locator = "p. 10, n. 14" }]

[[held_canonical_by]]
tradition = "Eastern Orthodox churches"
note = "McDonald lists the Prayer of Azariah and the Song of the Three among the books the Orthodox canon includes (p. 142, n. 49)."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 142, n. 49" }]

