id = "prayer-of-azariah"
title = "Prayer of Azariah"
also_known_as = ["Song of the Three Children", "Song of the Three Young Men"]
books = ["PrAzar"]
canon = "deuterocanon"
status = "draft"
summary = "No filed critical source dates the additions to Daniel; Brown says only that all the deuterocanonical books were composed before Jesus' time. The Prayer of Azariah and the Song of the Three Jews is placed in the furnace scene of Daniel: a prayer put in the mouth of Azarias (Abed-Nego) and the psalm of thanksgiving known as the Benedicite. The unsigned preface to the Apocrypha in the Brenton edition says the three additions to Daniel (the Song of the Three Children, Susanna, and Bel and the Dragon) were probably composed in the Maccabean age and that their original language is much disputed. They are in the Septuagint's Daniel; the Catholic and Orthodox churches hold them as scripture."
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on the Additions to Daniel" }, { source = "mcdonald-2017-vol1", locator = "p. 227" }, { source = "brown-1997", locator = "Introductory Background, Useful Information about the Bible as a Whole" }]
original_language = "Disputed (Semitic or Greek)"
composed_undated = "Not dated by any source filed here, and no filed source dates a manuscript of it. Brown says only that all the deuterocanonical books were composed before Jesus' time; an unsigned, undated preface to the Apocrypha in the eBible Brenton edition says 'the Maccabean age', without years."

[[held_canonical_by]]
tradition = "Roman Catholic Church"
note = "McDonald says the Roman Catholic Old Testament has the additions to Daniel (p. 10, n. 14; p. 142, n. 49)."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 142, n. 49" }, { source = "mcdonald-2017-vol1", locator = "p. 10, n. 14" }]

[[held_canonical_by]]
tradition = "Eastern Orthodox churches"
note = "McDonald lists the Prayer of Azariah and the Song of the Three among the books the Orthodox canon includes (p. 142, n. 49)."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 142, n. 49" }]

