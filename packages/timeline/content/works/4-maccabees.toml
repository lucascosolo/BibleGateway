label = "Mid first century CE"
tradition = "critical"
earliest = 40
latest = 54
summary = "McDonald: 'ca. 40-54 CE', calling it difficult to date but likely a diaspora Jew in the mid-first century, following Anderson."
held_by = "Lee Martin McDonald (2017)"
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 384, n. 32" }]

[[composed]]
id = "century-before-70-ce"
label = "The century before the fall of Jerusalem"
tradition = "critical"
earliest = -30
latest = 70
summary = "The preface says it was 'written during the century before the fall of Jerusalem'; converted here to 30 BCE-70 CE. This is the view of that unsigned preface, which mentions the recovery of Hebrew Sirach and so is later than Brenton's 1851 translation; scholarship has moved since."
held_by = "Unsigned preface to the Apocrypha in the eBible Brenton edition (undated; not Brenton's own 1851 text)"
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on Maccabees" }]

