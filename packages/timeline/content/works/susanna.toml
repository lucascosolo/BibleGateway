id = "susanna"
title = "Susanna"
also_known_as = ["History of Susanna"]
books = ["Sus"]
canon = "deuterocanon"
status = "draft"
summary = "No filed critical source dates the additions to Daniel; Brown says only that all the deuterocanonical books were composed before Jesus' time. Susanna is one of several anecdotes told of Daniel, which the preface calls simple historical parables. McDonald notes that Hippolytus of Rome (about 180-200 CE) used sections of Susanna in his Commentary on Daniel. The unsigned preface to the Apocrypha in the Brenton edition says the three additions to Daniel (the Song of the Three Children, Susanna, and Bel and the Dragon) were probably composed in the Maccabean age and that their original language is much disputed. They are in the Septuagint's Daniel; the Catholic and Orthodox churches hold them as scripture."
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on the Additions to Daniel" }, { source = "mcdonald-2017-vol1", locator = "p. 227" }, { source = "mcdonald-2017-vol1", locator = "p. 336" }, { source = "brown-1997", locator = "PDF p. 41" }]
original_language = "Disputed (Semitic or Greek)"


[[composed]]
id = "maccabean-age-preface"
label = "The Maccabean age, per the unsigned preface (no filed critical dating)"
tradition = "critical"
earliest = -175
