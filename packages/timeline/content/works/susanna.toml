held_by = "Unsigned preface to the Apocrypha in the eBible Brenton edition (undated; not Brenton's own 1851 text)"
summary = "No filed critical source dates the additions to Daniel, so this record stays a draft. The only dated statement filed is the unsigned preface's 'the Maccabean age', with no years. The range reads that phrase through Satlow's dating of the Maccabean revolt, 175-135 BCE (p. 124); it is this record's conversion, not a scholar's date for the book. Brown says only that all the deuterocanonical books were composed before Jesus' time. The preface mentions the recovery of Hebrew Sirach and so is later than Brenton's 1851 translation; scholarship has moved since."
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on the Additions to Daniel" }, { source = "satlow-2014", locator = "p. 124" }, { source = "brown-1997", locator = "PDF p. 41" }]

