id = "testaments-of-the-twelve-patriarchs"
title = "Testaments of the Twelve Patriarchs"
also_known_as = ["Testaments of the Twelve Patriarchs"]
books = ["TReu", "TSim", "TLevi", "TJud", "TIss", "TZeb", "TDan", "TNaph", "TGad", "TAsh", "TJos", "TBenj"]
canon = "pseudepigrapha"
status = "claims-checked"
original_language = "Hebrew"
summary = """
The Testaments are twelve separate writings, one for each son of Jacob (Reuben, Simeon, Levi, Judah, Issachar, Zebulun, Dan, Naphtali, Gad, Asher, Joseph and Benjamin). McDonald, after Charlesworth, gives the present form as Christian, about 150-200 CE, with Jewish sources behind Levi, Judah and Naphtali; Brown reports a divided field. The translator's introduction of 1917 is the older view: W. O. E. Oesterley, following R. H. Charles, held that the book was written in Hebrew, that the earliest form known is a Greek translation, that the original belongs to the time of John Hyrcanus, that further passages were added in the middle of the first century BCE, and that Christian additions came later.
"""
citations = [
  { source = "charles-1917-testaments", locator = "intro., p. viii" },
  { source = "charles-1917-testaments", locator = "intro., pp. xvii-xviii" },
  { source = "mcdonald-2017-vol1", locator = "p. 139" }, { source = "brown-1997", locator = "Appendix II, PDF p. 887" }
]

[[composed]]
id = "present-form-150-200"
label = "Present Christian form, about 150 to 200 CE (Charlesworth, listed by McDonald)"
tradition = "critical"
earliest = 150
latest = 200
held_by = "James H. Charlesworth, as listed by McDonald (2017)"
summary = "McDonald, following Charlesworth, lists the Testaments as 'present form is Christian, ca. 150-200 CE', with Levi, Judah and Naphtali drawing on Jewish sources before 70 CE and probably of the second or first century BCE (p. 139). Lim puts the work in the second century CE (p. 169). Brown says it was composed before 200 CE and that scholars are divided between Christian additions to a Jewish original written just before 100 BCE and a Jewish Christian composition drawing on earlier sources, the view of Hollander and de Jonge."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 139" }, { source = "lim-2013", locator = "p. 169" }, { source = "brown-1997", locator = "Appendix II, PDF p. 887" }]

[[composed]]
id = "charles-oesterley-original"
label = "About 135 to 104 BCE, the original book (Charles, 1917)"
tradition = "critical"
earliest = -135
latest = -104
held_by = "R. H. Charles, reported by W. O. E. Oesterley (1917)"
summary = """
This is the translator's view as of 1917. Oesterley takes Charles's reading that a verse in the Testament of Levi (8:14-15) is aimed at John Hyrcanus, who reigned 135 to 104 BCE, so the book in its original form may well belong to that period. He adds that a somewhat later date is not excluded."""
citations = [{ source = "charles-1917-testaments", locator = "intro., p. xvii" }]

[[composed]]
id = "charles-oesterley-additions"
label = "Middle of the first century BCE, later additions (Charles, 1917)"
tradition = "critical"
earliest = -60
latest = -40
held_by = "R. H. Charles, reported by W. O. E. Oesterley (1917)"
summary = """
Oesterley reports that Charles assigns a set of passages, mainly in Levi, Judah, Zebulun, Dan, Naphtali, Gad and Asher, to additions made 'during the middle of the last century B.C.', attacking the Maccabean high priesthood. The range reads 'the middle' as 60 to 40 BCE. Christian additions, such as in Simeon 6:7 and Benjamin 9:3-5, are later still and are not dated on that page."""
citations = [{ source = "charles-1917-testaments", locator = "intro., pp. xvii-xviii" }]

