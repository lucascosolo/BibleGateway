id = "ignatius"
title = "The Seven Letters of Ignatius"
also_known_as = ["Letters of Ignatius of Antioch", "Epistles of Ignatius"]
books = ["IgnEph", "IgnMagn", "IgnTrall", "IgnRom", "IgnPhld", "IgnSmyrn", "IgnPol"]
canon = "apostolic"
status = "claims-checked"
original_language = "Greek"
summary = """
Seven letters written by Ignatius, bishop of Antioch, while under guard on his way to martyrdom in Rome. From Smyrna he wrote to the churches of Ephesus, Magnesia, Tralles and Rome, and from Troas to the churches of Philadelphia and Smyrna and to Polycarp. Metzger dates the journey about 110 CE. The letters rarely quote, and echo Paul's letters often, especially 1 Corinthians. Metzger judges it probable that Ignatius knew Matthew and John, and perhaps Luke, and finds no sign he called any of them Scripture."""
citations = [
  { source = "metzger-1987-canon", locator = "pp. 43-49, 59" },
  { source = "lightfoot-harmer-1891", locator = "intro., p. 99" },
]
verses = [
  { ref = "1Cor.4.13", link = "alludes", note = "Ignatius applies this verse's “offscouring of all things” to himself in Ephesians 8.1 and 18.1 (Metzger pp. 44-45)." },
  { ref = "1Cor.9.27", link = "alludes", note = "Ignatius uses this verse's “lest I be found a castaway” in Trallians 12.3 (Metzger p. 45)." },
  { ref = "1Cor.4.4", link = "alludes", note = "Ignatius reuses this verse's “but not by this am I justified” in Romans 5.1 (Metzger p. 45)." },
  { ref = "1Cor.15.8-1Cor.15.10", link = "alludes", note = "Ignatius echoes these verses in five of his letters (Metzger p. 45)." },
  { ref = "Matt.3.15", link = "alludes", note = "Ignatius, Smyrnaeans 1.1, says Jesus was baptized by John “so that all righteousness might be fulfilled”, a phrase only Matthew has (Metzger pp. 45-46)." },
  { ref = "Matt.19.12", link = "alludes", note = "Ignatius, Smyrnaeans 6.1, echoes this verse's “let him receive it” (Metzger p. 46)." },
  { ref = "Matt.10.16", link = "alludes", note = "Ignatius, To Polycarp 2.2, echoes this verse (Metzger p. 46)." },
  { ref = "Matt.18.19-Matt.18.20", link = "alludes", note = "Ignatius, Ephesians 5.2, echoes these verses (Metzger p. 46)." },
  { ref = "Luke.24.39", link = "alludes", note = "Ignatius, Smyrnaeans 3.1-2, resembles this “handle me and see”, though Metzger (p. 46) finds it hard to say whether he depends on Luke." },
]

[[composed]]
id = "about-110"
label = "About 110 CE"
tradition = "critical"
earliest = 110
latest = 110
held_by = "Bruce M. Metzger (1987)"
summary = """
Metzger places the journey from Antioch to Rome, during which the seven letters were written, about 110, under the emperor Trajan; he notes elsewhere that the difference between 110 and 135 is not great for the related letter of Polycarp. Lightfoot and Harmer (1891) say only that the letters were written in the early years of the second century."""
citations = [
  { source = "metzger-1987-canon", locator = "pp. 43, 59-60" },
  { source = "lightfoot-harmer-1891", locator = "intro., p. 99" },
]

[[provenance]]
place = "Smyrna and Alexandria Troas"
note = "Ephesians, Magnesians, Trallians and Romans were written at Smyrna; Philadelphians, Smyrnaeans and Polycarp at Troas."
citations = [
  { source = "metzger-1987-canon", locator = "pp. 43-44" },
  { source = "lightfoot-harmer-1891", locator = "intro., p. 99" },
]

[[translations]]
ledger = "lightfoot-ignatius"
note = "Lightfoot 1891, the seven letters of the middle recension at chapter level (prologue and chapters); verse numbers are not carried. The seven letters are filed as one text with seven books."
