id = "2-baruch"
title = "2 Baruch"
also_known_as = ["Syriac Apocalypse of Baruch", "The Apocalypse of Baruch"]
books = ["2Bar"]
canon = "pseudepigrapha"
status = "claims-checked"
original_language = "Hebrew"
summary = """
2 Baruch is an apocalypse in the name of Baruch, the scribe of Jeremiah, written after the fall of Jerusalem. Brown dates it to 95-120 CE and ties it to IV Ezra; McDonald gives about 100 CE and Lim the second century CE. It survives complete only in Syriac, translated from Greek. Its translator's introduction, by W. O. E. Oesterley in 1918, dated it after 70 CE and probably not much after 100, and Charles held that the original was Hebrew.
"""
