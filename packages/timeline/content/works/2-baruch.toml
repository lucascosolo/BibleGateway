held_by = "W. O. E. Oesterley (1918)"
summary = """
This is the translator's introducer's view as of 1918. Oesterley says that Jerusalem has fallen (32:2-4), so the book was written after 70 CE, though some parts may be slightly earlier. He thinks it improbable that it was written much later than 100 CE, because of its likeness to 2 (4) Esdras, and he treats 100 CE as the practical limit."""
