held_by = "Raymond E. Brown (1997)"
summary = "Brown dates 2 Baruch, a Jewish work preserved in a Syriac translation from Greek, to 95-120 CE and makes it dependent on IV Ezra or a source common to both. McDonald's list, after Charlesworth, gives 'ca. 100 CE' (p. 139), and Meier places it in the early second century CE (pp. 283, 363)."
