Qumran Cave 4, the oldest copy. VanderKam dates its earlier hand to about 125 BCE, or 100 BCE to be cautious. Its first columns were later recopied in a late Hasmonean hand and sewn on."""
citations = [{ source = "vanderkam-2012", locator = "chapter 4, section Jubilees" }]

