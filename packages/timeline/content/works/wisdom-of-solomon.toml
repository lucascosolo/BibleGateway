id = "wisdom-of-solomon"
title = "Wisdom of Solomon"
also_known_as = ["Book of Wisdom"]
books = ["Wis"]
canon = "deuterocanon"
status = "sources-located"
summary = "Wisdom of Solomon is a Greek book that McDonald calls clearly pseudonymous: it is written in Solomon's name, yet he lists it among the deuterocanonical books of the Catholic and Orthodox Old Testaments. Meier dates it to the first century BCE and Brown to about 100 BCE. The unsigned preface to the Apocrypha in the Brenton edition says it was written in Greek by an Alexandrian Jew, probably a short while before the Christian era, with a first part (1-11:4) of great stylistic beauty praising Wisdom and teaching immortality, and a weaker second part that retells the Exodus. Athanasius places it among the books to be read; Jerome says it is not in the canon."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 136" }, { source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on the Book of Wisdom" }, { source = "meier-1994", locator = "p. 244" }, { source = "brown-1997", locator = "ch. 25, PDF p. 635" }]
original_language = "Greek"
verses = [
  { ref = "1Pet.1.6-1Pet.1.7", link = "alludes", note = "These verses allude to Wisdom 3:5-7, a parallel McDonald (p. 334) reports from Stendebach." },
  { ref = "Heb.1.3", link = "alludes", note = "This verse parallels Wisdom 7:26, as does Colossians 1:15 (McDonald p. 335, reporting Stendebach)." },
  { ref = "Col.1.15", link = "alludes", note = "This verse parallels Wisdom 7:26, as does Hebrews 1:3 (McDonald p. 335, reporting Stendebach)." },
  { ref = "Rom.1.18-Rom.1.21", link = "alludes", note = "These verses parallel Wisdom 13:1-9 (McDonald p. 335, reporting Stendebach)." },
]


[[composed]]
id = "meier-first-century-bce"
label = "First century BCE (Meier, 1994)"
tradition = "critical"
earliest = -100
latest = -1
held_by = "John P. Meier (1994)"
summary = "Meier says the Book of Wisdom was 'composed in Greek probably in the 1st century B.C.', which makes it the last book written in the larger Alexandrian canon of the Old Testament. Brown puts it at 'ca. 100 BC', the start of this range."
citations = [{ source = "meier-1994", locator = "p. 244" }, { source = "brown-1997", locator = "ch. 25, PDF p. 635" }]

[[composed]]
id = "preface-before-christian-era"
label = "Shortly before the Christian era (unsigned preface)"
tradition = "critical"
earliest = -100
latest = -1
held_by = "Unsigned preface to the Apocrypha in the eBible Brenton edition (undated; not Brenton's own 1851 text)"
summary = "The preface says the book was 'probably a short while before the Christian era' and gives no years; the range reads that phrase as the first century BCE. The preface mentions the recovery of Hebrew Sirach and so is later than Brenton's 1851 translation; scholarship has moved since."
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on the Book of Wisdom" }]

[[provenance]]
place = "Alexandria"
note = "The preface says it was written in Greek by an Alexandrian Jew."
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on the Book of Wisdom" }]

