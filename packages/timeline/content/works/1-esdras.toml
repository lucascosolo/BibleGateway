id = "1-esdras"
title = "1 Esdras"
also_known_as = ["3 Esdras"]
books = ["1Esd"]
canon = "deuterocanon"
status = "draft"
summary = "1 Esdras is largely a free version of parts of 2 Chronicles and Ezra-Nehemiah. No filed critical source dates it. The unsigned preface to the Apocrypha in the Brenton edition dates it within the first century BCE and singles out 'The Three Wise Sayings' (3:1-5:6) as its peculiar part. McDonald lists it among books the Orthodox include in their Old Testament and calls it 3 Esdras in one list."
citations = [{ source = "ebible-brenton", locator = "Appendix, 'The Books of the Apocrypha' (Apoc. Pref.), paragraph on Esdras" }, { source = "mcdonald-2017-vol1", locator = "p. 9, n. 13" }]
original_language = "Greek (possibly from a Hebrew source)"
composed_undated = "Not dated by any source filed here, and no filed source dates a manuscript of it. An unsigned, undated preface to the Apocrypha in the eBible Brenton edition says 'some time within the first century b.c.'"

[[held_canonical_by]]
tradition = "Eastern Orthodox churches"
note = "McDonald lists 1 Esdras among the books the Orthodox include in their Old Testament (p. 9, n. 13)."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 9, n. 13" }]

[[held_canonical_by]]
tradition = "Ethiopian Orthodox Tewahedo Church"
note = "McDonald's lists for the Ethiopian church include 1 Esdras (p. 457)."
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 457" }]

