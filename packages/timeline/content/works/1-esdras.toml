summary = "1 Esdras is largely a free version of parts of 2 Chronicles and Ezra-Nehemiah. No filed critical source dates it. The unsigned preface to the Apocrypha in the Brenton edition dates it within the first century BCE and singles out 'The Three Wise Sayings' (3:1-5:6) as its peculiar part. McDonald lists it among books the Orthodox include in their Old Testament and calls it 3 Esdras in one list."
