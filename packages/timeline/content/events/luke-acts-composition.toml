id = "luke-acts-composition"
title = "Composition of Luke and Acts"
axis = "composition"
category = "composition"
confidence = "contested"
status = "sources-located"
books = ["Luke", "Acts"]
summary = """
This asks who wrote the Gospel of Luke and the Acts of the Apostles and when. The two books are one work in two parts, and the Gospel draws on Mark. Critical scholars usually date the work to the 80s or 90s; church tradition names Luke, a companion of Paul, as the author. Whether the author really travelled with Paul is not settled."""
verses = [
  { ref = "Luke.1.1-Luke.1.4", link = "describes", note = "The author says many have already written accounts and that he follows them." },
  { ref = "Acts.1.1", link = "describes", note = "Acts looks back to the first book." },
  { ref = "Luke.19.41-Luke.19.44", link = "background", note = "Jesus predicts the destruction of Jerusalem." },
]

[[positions]]
id = "brown-85"
label = "About 85 CE, give or take five to ten years"
tradition = "critical"
earliest = 75
latest = 95
held_by = "Raymond E. Brown"
summary = """
Brown, a critical scholar, dates Luke with a margin: "85, give or take five to ten years." For Acts he gives the same date and author, and he holds that a date no later than 100 is indicated. The span shown here is the editor's reading of that margin."""
citations = [
  { source = "brown-1997", locator = "ch. 9, Summary of Basic Information" },
  { source = "brown-1997", locator = "ch. 10, Summary of Basic Information" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown reasons from Luke's use of Mark: "if Mark is to be dated in the period 68–73, a date earlier than 80 for Luke is unlikely"."""
  citations = [{ source = "brown-1997", locator = "ch. 9, Date of Writing" }]
  verses = [{ ref = "Luke.1.1-Luke.1.4", link = "dates", note = "The author builds on earlier written accounts." }]

[[positions]]
id = "carson-moo-mid-60s"
label = "The mid- to late 60s for Luke, the mid-60s for Acts"
tradition = "critical"
earliest = 62
latest = 69
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo write the standard evangelical introduction to the New Testament. They defend Luke, Paul's companion, as the author of Acts, and prefer the 60s for the Gospel over the 75-85 CE range most scholars hold. They conclude that "Acts should be dated in the mid–60s". They are uncertain where Luke wrote, and Achaia in Greece is a reasonable conjecture. The year span shown here is the editor's reading of their dates."""
citations = [
  { source = "carson-moo-2005", locator = "pp. 207–210" },
  { source = "carson-moo-2005", locator = "pp. 296–300" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
They say Jesus' predictions of Jerusalem's fall in Luke are "remarkably vague", using standard siege language, so they need not be written after the event. They also note that Acts, which Luke wrote after the Gospel, reports no event later than 62, omits Nero's persecution, and shows no knowledge of Paul's letters, all of which they take as pointing to a date not long after 62."""
  citations = [
    { source = "carson-moo-2005", locator = "pp. 208–209" },
    { source = "carson-moo-2005", locator = "p. 300" },
  ]
  verses = [{ ref = "Luke.21.20", link = "dates", note = "'Surrounded by armies' is read as stock siege language, not a report of 70 CE." }]

[[positions]]
id = "ehrman-intro-80-85"
label = "Around 80 to 85 CE, by a Greek-speaking Christian not shown to be Paul's companion"
tradition = "critical"
earliest = 80
latest = 85
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook says Luke "was written around 80-85 ce, by a Greek-speaking Christian, probably outside Palestine", and that Acts was written in the same years. He says the traditional ascription to Luke, Paul's traveling companion, rests on a tradition with "reasons to suspect" it, and he calls the author "Luke" for convenience. The span shown here is the range he states."""
citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 110 approx.; Acts p. 182 approx." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman reads the preface as saying the author had several predecessors in writing about Jesus (v. 1) and drew on stories from "eyewitnesses and ministers of the word" (v. 2). So the author concedes he was not himself an eyewitness, and he used earlier sources, including Mark."""
  citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 96 approx." }]
  verses = [{ ref = "Luke.1.1-Luke.1.4", link = "describes", note = "The preface names earlier narratives and eyewitness sources." }]

[[positions]]
id = "streeter-80-90"
label = "About 80 for the Gospel, Acts by about 90; Luke the companion of Paul"
tradition = "critical"
earliest = 80
latest = 90
held_by = "B. H. Streeter (1924)"
summary = """
Streeter's The Four Gospels (1924) is the landmark 1924 study of the Gospels' sources. He dates the Gospel of Luke to "not later than A.D. 85, more likely about A.D. 80" and thinks Acts is not likely to be later than 90; the range runs from the Gospel's likely date to the Acts limit. He suggests the Gospel was written at Corinth, as a hypothesis, and that Acts took shape at Rome. He accepts Luke, the companion of Paul, as the author, reading the "we" passages as the author's own claim to be an eyewitness."""
citations = [{ source = "streeter-1924", locator = "pp. 532–535, 540, 548–553" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Streeter argues that Luke, who follows Mark closely, suddenly rewrites Mark 13's Anti-Christ prophecy into one of Jerusalem's destruction and enslavement. He reads this as knowledge of the events of 70, so the Gospel cannot be earlier. The Fourth Gospel's use of Luke then keeps it from running much past 85."""
  citations = [{ source = "streeter-1924", locator = "p. 540" }]
  verses = [{ ref = "Luke.21.20", link = "dates", note = "Luke speaks of armies surrounding Jerusalem, which is taken as a reworking of Mark 13 after the event." }]
