id = "jacob-descent-egypt"
title = "Jacob's family descends into Egypt"
axis = "narrative"
category = "biblical-narrative"
confidence = "speculative"
status = "draft"
summary = """
Jacob and his household, seventy persons in all, move to Egypt at Joseph's invitation during the famine and settle in Goshen. The date depends on how the exodus is dated; historicity is a separate question (see the patriarchs issue)."""
verses = [
  { ref = "Gen.45.9-Gen.45.28", link = "describes", note = "Joseph invites his father; Jacob resolves to go" },
  { ref = "Gen.46.1-Gen.46.34", link = "describes", note = "God's reassurance at Beersheba; the list of those who went down; arrival in Goshen" },
  { ref = "Gen.47.1-Gen.47.12", link = "describes", note = "Presented to Pharaoh and settled in the land of Rameses" },
  { ref = "Exod.1.1-Exod.1.7", link = "describes", note = "The sons of Israel who came to Egypt with Jacob, and their increase" },
  { ref = "Deut.26.5", link = "alludes", note = "A wandering Aramean was my father; he went down to Egypt few in number" },
  { ref = "Josh.24.4", link = "alludes", note = "Jacob and his children went down to Egypt" },
  { ref = "Ps.105.23", link = "alludes", note = "Israel came to Egypt; Jacob lived as a foreigner in the land of Ham" },
  { ref = "Acts.7.14-Acts.7.15", link = "alludes", note = "Stephen: Joseph sent for Jacob and seventy-five persons; Jacob went down to Egypt" },
]

