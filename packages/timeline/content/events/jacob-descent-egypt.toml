id = "jacob-descent-egypt"
title = "Jacob's family descends into Egypt"
axis = "narrative"
category = "biblical-narrative"
confidence = "speculative"
status = "draft"
summary = """
Jacob and his household, seventy people in all, move to Egypt at Joseph's invitation during the famine. They settle in Goshen. The date depends on how the exodus is dated. Whether this happened historically is a separate question (see the patriarchs issue)."""
verses = [
  { ref = "Gen.45.9-Gen.45.28", link = "describes", note = "Joseph invites his father, and Jacob decides to go" },
  { ref = "Gen.46.1-Gen.46.34", link = "describes", note = "God reassures Jacob at Beersheba. The list of those who went down. Arrival in Goshen" },
  { ref = "Gen.47.1-Gen.47.12", link = "describes", note = "Jacob is presented to Pharaoh and settled in the land of Rameses" },
  { ref = "Exod.1.1-Exod.1.7", link = "describes", note = "The sons of Israel who came to Egypt with Jacob, and how they multiplied" },
  { ref = "Deut.26.5", link = "alludes", note = "A wandering Aramean was my father. He went down to Egypt with few people" },
  { ref = "Josh.24.4", link = "alludes", note = "Jacob and his children went down to Egypt" },
  { ref = "Ps.105.23", link = "alludes", note = "Israel came to Egypt. Jacob lived as a foreigner in the land of Ham" },
  { ref = "Acts.7.14-Acts.7.15", link = "alludes", note = "Stephen says Joseph sent for Jacob and seventy-five persons, and Jacob went down to Egypt" },
]

[[positions]]
id = "mt-1928"
label = "Masoretic Text chronology: 1928 BCE"
tradition = "traditional"
earliest = -1928
latest = -1928
held_by = "the Masoretic Text chronology as tabulated by Wikipedia"
summary = """
In the Wikipedia article's table for the Masoretic Text (the traditional Hebrew text of the Bible), Jacob enters Egypt in 1928 BCE (AM 2236). AM means years counted from creation."""
citations = [{ source = "wikipedia-chronology-of-the-bible" }]

[[positions]]
id = "mid-19th-century"
label = "Mid-19th century BCE (with a 15th-century exodus)"
tradition = "archaeological"
earliest = -1860
latest = -1840
held_by = "Bryant G. Wood"
summary = """
Wood links an Asiatic settlement at Pi-Ramesse from the mid-19th century BC with a 15th-century exodus. He says it "could well be that of Jacob and his family shortly after their arrival in Egypt". Wood gives no exact years, so the span shown here is the editor's reading of "mid-19th century"."""
citations = [{ source = "wood-2005", locator = "p. 488" }]

[[positions]]
id = "c-1700"
label = "c. 1700 BCE (with a 13th-century exodus)"
tradition = "chronological"
earliest = -1700
latest = -1700
held_by = "advocates of a 13th-century exodus, as characterised by Bryant G. Wood"
summary = """
Wood says that with a 13th-century exodus, Jacob would have had to enter Egypt much later, about 1700 BC. That is later than the settlement he identifies."""
citations = [{ source = "wood-2005", locator = "p. 488" }]

[[positions]]
id = "ussher-1706"
label = "Ussher, Annals: Jacob goes down into Egypt, 1706 BC"
tradition = "traditional"
earliest = -1706
latest = -1706
held_by = "James Ussher"
summary = """
Ussher has Jacob, aged 130, go down into Egypt at the start of the third year of the famine, in 1706 BC. His 1650s count adds up the Bible's own life-spans and reign-lengths. It is not an archaeological date."""
citations = [{ source = "ussher-annals", locator = "paragraphs 135-138" }]

[[positions]]
id = "finkelstein-silberman"
label = "Descent to Egypt written in the 7th-6th centuries BCE (Finkelstein and Silberman)"
tradition = "critical"
earliest = -700
latest = -550
held_by = "Israel Finkelstein and Neil Asher Silberman"
summary = """
Finkelstein and Silberman accept that immigration from Canaan to the eastern Nile delta is well attested, as at Tell ed-Daba, but find no evidence of Israelites there. They place the writing of the descent and Goshen traditions in the seventh and sixth centuries."""
citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 52-55" }, { source = "finkelstein-silberman-2002", locator = "pp. 66-67" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Goshen is a Semitic, not an Egyptian, name. They follow Redford in deriving it from Geshem, a Qedarite dynastic name, and the Qedarites reached the delta only from the sixth century."""
  citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 66-67" }]
  verses = [{ ref = "Gen.45.10", link = "alludes" }]
