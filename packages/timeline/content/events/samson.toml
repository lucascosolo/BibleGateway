summary = """
Samson of Dan, a Nazirite from birth, fights the Philistines single-handed, is betrayed by Delilah and dies pulling down the temple of Dagon at Gaza. His exploits are set in the Philistine oppression; the sources read give no scholarly date for him, and his historicity is debated (see the linked issue)."""
