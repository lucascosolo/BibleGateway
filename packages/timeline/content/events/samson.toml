summary = """
The chronologist James Ussher tells the angel's appearance to Manoah's wife after the start of the Philistine oppression, which his margin labels "Year before Christ 1156". He has Samson born in the Year of the World 2849, beside which the margin prints "Year before Christ 1155"."""
