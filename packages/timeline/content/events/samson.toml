summary = """
A bracket from one object, not a date for Samson: a circular seal about 15 mm across, from \
Beth Shemesh and dated to the 11th-12th century BCE, shows a long-haired figure with a lion, \
which suggests hero stories of this kind circulated then; scholars explicitly say it does not \
confirm Samson as a historical figure."""
