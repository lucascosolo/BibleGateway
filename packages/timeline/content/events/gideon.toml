id = "gideon"
title = "Gideon"
axis = "narrative"
category = "biblical-narrative"
confidence = "speculative"
status = "sources-located"
summary = """
Gideon of Manasseh, also called Jerubbaal, tears down his father's altar to Baal and, with 300 men, routs the Midianite and Amalekite raiders. He refuses to be king, but his son Abimelech later seizes the kingship. The sources read give no date for Gideon himself."""
verses = [
  { ref = "Judg.6.1-Judg.6.40", link = "describes", note = "Judges 6 tells of Midianite oppression, Gideon's call, the altar of Baal and the fleece." },
  { ref = "Judg.7.1-Judg.7.25", link = "describes", note = "Judges 7 tells how 300 men make the night attack." },
  { ref = "Judg.8.1-Judg.8.35", link = "describes", note = "Judges 8 tells of the chase after the kings, the ephod, the refused kingship and Gideon's death." },
  { ref = "Judg.9.1-Judg.9.57", link = "describes", note = "Judges 9 continues with Abimelech, Jerubbaal's son." },
  { ref = "1Sam.12.11", link = "alludes", note = "1 Samuel 12:11 recalls that the Lord sent Jerubbaal and Barak, Jephthah and Samuel." },
  { ref = "Isa.9.4", link = "alludes", note = "Isaiah 9:4 refers to the day of Midian." },
  { ref = "Isa.10.26", link = "alludes", note = "Isaiah 10:26 recalls the slaughter of Midian at the rock of Oreb." },
  { ref = "Ps.83.9-Ps.83.12", link = "alludes", note = "Psalm 83:9-12 asks God to do to them as he did to Midian, and to Oreb, Zeeb, Zebah and Zalmunna." },
  { ref = "Heb.11.32", link = "alludes", note = "Hebrews 11:32 names Gideon among the faithful." },
]

[[positions]]
id = "between-anchors"
label = "Between Deborah (c. 1230) and Jephthah (1130-1073)"
tradition = "chronological"
earliest = -1230
latest = -1073
summary = """
This is a bracket from the order of the book, not a date offered by any scholar. Gideon comes after Deborah and Barak (about 1230 BC in Wood's scheme) and, as Kitchen reads the sequence of links in Judges, before Jephthah, whose time as judge is estimated to begin between 1130 and 1073 BC."""
citations = [
  { source = "wood-2005", locator = "pp. 477, 488" },
  { source = "kitchen-2003", locator = "p. 208" },
]

[[positions]]
id = "ussher-1245"
label = "Ussher, Annals: Gideon called, 1245 BC"
tradition = "traditional"
earliest = -1245
latest = -1245
held_by = "James Ussher"
summary = """
Ussher dates Gideon's call to 1245 BC, after the fourth oppression, by the Midianites. His 1650s count adds up the Bible's own life-spans and reign-lengths, so it is not an archaeological date."""
citations = [{ source = "ussher-annals", locator = "paragraph 356" }]
