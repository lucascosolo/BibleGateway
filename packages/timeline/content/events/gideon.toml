id = "between-anchors"
label = "Between Deborah (c. 1230) and Jephthah (1130-1073)"
tradition = "chronological"
earliest = -1230
latest = -1073
summary = """
A bracket from the order of the book, not a date offered by any scholar: Gideon follows Deborah \
and Barak (c. 1230 BC in Wood's scheme) and precedes Jephthah, whose judgeship is estimated to \
begin between 1130 and 1073 BC. Separately, a 3,100-year-old inscription fragment appearing to \
represent the name Jerubbaal is reported; it supports only the antiquity of the name."""
citations = [
  { source = "wood-2005", locator = "pp. 477, 488" },
  { source = "wikipedia-gideon" },
]

