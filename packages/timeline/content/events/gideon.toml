status = "draft"
summary = """
Gideon of Manasseh, also called Jerubbaal, tears down his father's altar to Baal. With 300 men he routs the Midianite and Amalekite raiders. He refuses to be king, but his son Abimelech later seizes the kingship. The sources read give no date for Gideon himself."""
verses = [
  { ref = "Judg.6.1-Judg.6.40", link = "describes", note = "Midianite oppression, the call, the altar of Baal and the fleece" },
  { ref = "Judg.7.1-Judg.7.25", link = "describes", note = "The 300 men and the night attack" },
  { ref = "Judg.8.1-Judg.8.35", link = "describes", note = "The chase after the kings, the ephod, the kingship refused and Gideon's death" },
  { ref = "Judg.9.1-Judg.9.57", link = "describes", note = "Abimelech, Jerubbaal's son" },
  { ref = "1Sam.12.11", link = "alludes", note = "The Lord sent Jerubbaal and Barak, Jephthah and Samuel" },
  { ref = "Isa.9.4", link = "alludes", note = "As on the day of Midian" },
  { ref = "Isa.10.26", link = "alludes", note = "The slaughter of Midian at the rock of Oreb" },
  { ref = "Ps.83.9-Ps.83.12", link = "alludes", note = "Do to them as you did to Midian, and to Oreb, Zeeb, Zebah and Zalmunna" },
  { ref = "Heb.11.32", link = "alludes", note = "Gideon is named among the faithful" },
]

[[positions]]
id = "between-anchors"
label = "Between Deborah (c. 1230) and Jephthah (1130-1073)"
tradition = "chronological"
earliest = -1230
latest = -1073
summary = """
This is a bracket from the order of the book, not a date offered by any scholar. Gideon comes after Deborah and Barak (about 1230 BC in Wood's scheme) and before Jephthah. Jephthah's time as judge is estimated to begin between 1130 and 1073 BC. Separately, a 3,100-year-old inscription fragment is reported that seems to show the name Jerubbaal. It shows only that the name is ancient."""
citations = [
  { source = "wood-2005", locator = "pp. 477, 488" },
  { source = "wikipedia-gideon" },
]

