id = "ussher-1245"
label = "Ussher, Annals: Gideon called, 1245 BC"
tradition = "traditional"
earliest = -1245
latest = -1245
held_by = "James Ussher"
summary = """
Ussher dates Gideon's call to 1245 BC, after the fourth oppression, by the Midianites. His 1650s count adds up the Bible's own life-spans and reign-lengths. It is not an archaeological date."""
citations = [{ source = "ussher-annals", locator = "paragraph 356" }]
