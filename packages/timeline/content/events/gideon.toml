summary = """
Gideon of Manasseh, called Jerubbaal, destroys his father's altar to Baal and, with 300 men, routs the Midianite and Amalekite raiders; he refuses the kingship, but his son Abimelech later seizes it. The sources read give no date for Gideon himself."""
verses = [
  { ref = "Judg.6.1-Judg.6.40", link = "describes", note = "Midianite oppression; the call; the altar of Baal; the fleece" },
  { ref = "Judg.7.1-Judg.7.25", link = "describes", note = "The 300 and the night attack" },
  { ref = "Judg.8.1-Judg.8.35", link = "describes", note = "Pursuit of the kings; the ephod; kingship refused; Gideon's death" },
  { ref = "Judg.9.1-Judg.9.57", link = "describes", note = "Abimelech, Jerubbaal's son" },
  { ref = "1Sam.12.11", link = "alludes", note = "The Lord sent Jerubbaal and Barak, Jephthah and Samuel" },
  { ref = "Isa.9.4", link = "alludes", note = "As on the day of Midian" },
  { ref = "Isa.10.26", link = "alludes", note = "The slaughter of Midian at the rock of Oreb" },
  { ref = "Ps.83.9-Ps.83.12", link = "alludes", note = "Do to them as to Midian; Oreb, Zeeb, Zebah and Zalmunna" },
  { ref = "Heb.11.32", link = "alludes", note = "Gideon named among the faithful" },
]

