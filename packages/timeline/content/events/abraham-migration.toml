id = "abraham-migration"
title = "Abraham's migration to Canaan"
axis = "narrative"
category = "biblical-narrative"
confidence = "speculative"
status = "draft"
summary = """
Abraham travels from Haran to Canaan. He stops first at Shechem, goes down to Egypt during a famine, then returns. Whether there was a historical age of the patriarchs at all is a separate question (see the linked issue). The positions here give the dates offered by people who accept that setting."""
verses = [
  { ref = "Gen.11.31-Gen.11.32", link = "describes", note = "Terah's family leaves Ur for Haran" },
  { ref = "Gen.12.1-Gen.12.9", link = "describes", note = "The call, and the journey to Shechem, Bethel and the Negeb" },
  { ref = "Gen.12.10-Gen.12.20", link = "describes", note = "Famine and the stay in Egypt" },
  { ref = "Gen.13.1-Gen.13.4", link = "describes", note = "Return from Egypt to the Negeb and Bethel" },
  { ref = "Josh.24.2-Josh.24.3", link = "alludes", note = "Joshua recalls that God took Abraham from beyond the River and led him through Canaan" },
  { ref = "Neh.9.7-Neh.9.8", link = "alludes", note = "A prayer recalls that God chose Abram and brought him out of Ur of the Chaldeans" },
  { ref = "Acts.7.2-Acts.7.5", link = "alludes", note = "Stephen says the God of glory appeared to Abraham in Mesopotamia. Abraham then moved to Haran, then Canaan" },
  { ref = "Heb.11.8-Heb.11.10", link = "alludes", note = "By faith Abraham obeyed and set out, not knowing where he was going" },
  { ref = "Ps.105.9-Ps.105.15", link = "alludes", note = "The covenant with Abraham, and God's protection of the wandering patriarchs" },
]

[[positions]]
id = "ussher"
label = "Ussher: 1922 BC"
tradition = "traditional"
earliest = -1922
latest = -1922
held_by = "James Ussher"
summary = """
Ussher counted 2082 years from creation to Abraham's move, from 4004 to 1922 BC. His 1650s count adds up the Bible's own life-spans and reign-lengths. It is not an archaeological date."""
citations = [{ source = "wikipedia-ussher-chronology" }]

