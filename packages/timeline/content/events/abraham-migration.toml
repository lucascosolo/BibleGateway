id = "abraham-migration"
title = "Abraham's migration to Canaan"
axis = "narrative"
category = "biblical-narrative"
confidence = "speculative"
status = "claims-checked"
summary = """
Abraham travels from Haran to Canaan, stopping first at Shechem, then goes down to Egypt during a famine and returns. Whether there was a historical age of the patriarchs at all is a separate question (see the linked issue). The positions here give the dates offered by people who accept that setting, along with one that dates the stories' writing instead."""
verses = [
  { ref = "Gen.11.31-Gen.11.32", link = "describes", note = "Genesis 11:31-32 tells how Terah's family leaves Ur for Haran." },
  { ref = "Gen.12.1-Gen.12.9", link = "describes", note = "Genesis 12:1-9 tells the call of Abram and his journey to Shechem, Bethel and the Negeb." },
  { ref = "Gen.12.10-Gen.12.20", link = "describes", note = "Genesis 12:10-20 tells of a famine and the stay in Egypt." },
  { ref = "Gen.13.1-Gen.13.4", link = "describes", note = "Genesis 13:1-4 tells the return from Egypt to the Negeb and Bethel." },
  { ref = "Josh.24.2-Josh.24.3", link = "alludes", note = "In Joshua 24:2-3 Joshua recalls that God took Abraham from beyond the River and led him through Canaan." },
  { ref = "Neh.9.7-Neh.9.8", link = "alludes", note = "Nehemiah 9:7-8 is a prayer recalling that God chose Abram and brought him out of Ur of the Chaldeans." },
  { ref = "Acts.7.2-Acts.7.5", link = "alludes", note = "Stephen says the God of glory appeared to Abraham in Mesopotamia. Abraham then moved to Haran, then Canaan." },
  { ref = "Heb.11.8-Heb.11.10", link = "alludes", note = "Hebrews 11:8-10 says that by faith Abraham obeyed and set out, not knowing where he was going." },
  { ref = "Ps.105.9-Ps.105.15", link = "alludes", note = "Psalm 105:9-15 recalls the covenant with Abraham and God's protection of the wandering patriarchs." },
]

[[positions]]
id = "second-millennium"
label = "A 2nd-millennium BCE patriarchal age"
tradition = "archaeological"
earliest = -2000
latest = -1001
held_by = "William F. Albright"
summary = """
Albright and his colleagues believed the age of the patriarchs was a real one, in the 2nd millennium BCE (Finkelstein and Silberman report this view on pp. 34-36). The sources read give no narrower claim, so the span shown is the whole thousand years."""
citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 34-36" }]

[[positions]]
id = "ussher-annals"
label = "Ussher, Annals: Abraham called from Ur, Year of the World 2083 (1921 BC)"
tradition = "traditional"
earliest = -1921
latest = -1921
held_by = "James Ussher"
summary = """
Ussher puts the call of Abraham out of Ur (the 1658 printing reads "Uz") in the Year of the World 2083, and Terah's death at Haran in the same year, beside which the margin prints "Year before Christ 1921". After Terah's death he places a second call. His Annals use the same Bible-based count as for his other dates."""
citations = [{ source = "ussher-annals", locator = "p. 5 (1658 printing; Year of the World 2083, Year before Christ 1921)" }]

[[positions]]
id = "finkelstein-silberman"
label = "Patriarchal stories written in the 8th-7th centuries BCE (Finkelstein and Silberman)"
tradition = "critical"
dates = "composition"
earliest = -700
latest = -600
held_by = "Israel Finkelstein and Neil Asher Silberman"
summary = """
Finkelstein and Silberman do not date the migration itself; they date the writing of the patriarchal stories. Camels as pack animals, Arabian trade goods, Philistines at Gerar and peoples such as the Edomites and Qedarites point, they say, to an intensive period of writing in the eighth and seventh centuries BCE, with the basic framework from the seventh. The span shown here is that seventh century."""
citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 37-38" }, { source = "finkelstein-silberman-2002", locator = "pp. 40-41 (Edom; the Qedarites)" }, { source = "finkelstein-silberman-2002", locator = "p. 45 n. (the basic framework from the seventh century)" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Their first clue is the camel. Camels were not used as beasts of burden before the late second millennium and not widely until well after 1000 BCE, and camel bones at Tell Jemmeh rise in the seventh century."""
  citations = [{ source = "finkelstein-silberman-2002", locator = "p. 37" }]
  verses = [{ ref = "Gen.37.25", link = "alludes" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Their second clue is the Philistines. Isaac meets "Abimelech, king of the Philistines" at Gerar, yet the Philistines settled the coast only after 1200 BCE, and Gerar (Tel Haror) became a strong Assyrian stronghold only in the late eighth and seventh centuries."""
  citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 37-38" }]
  verses = [{ ref = "Gen.26.1", link = "alludes" }, { ref = "Gen.20.1", link = "alludes" }]

  [[positions.arguments]]
  stance = "against"
  text = """
Earlier scholars such as Albright held that the picture in Genesis is historical and sought a setting around 2000 BCE. Finkelstein and Silberman report that none of the proposed periods gave a convincing match (pp. 34-36)."""
  citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 34-36" }]
