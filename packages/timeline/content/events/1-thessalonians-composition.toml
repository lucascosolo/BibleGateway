id = "1-thessalonians-composition"
title = "Composition of 1 Thessalonians"
axis = "composition"
category = "composition"
confidence = "firm"
status = "draft"
books = ["1Thess"]
summary = """
Paul wrote 1 Thessalonians from Corinth to the new Christian community at Thessalonica, a few months after he first preached there. It is the oldest preserved Christian document. Its authorship is not seriously doubted, and Raymond Brown dates it to 50 or 51 on the traditional chronology of Paul's career. A revisionist chronology that puts Paul's work before the Jerusalem meeting would move it to 41-43."""
verses = [
  { ref = "1Thess.1.1", link = "describes", note = "Paul, Silvanus and Timothy write to the church of the Thessalonians." },
  { ref = "1Thess.3.6", link = "dates", note = "Timothy has just returned with good news about the Thessalonians, the point from which Paul writes." },
  { ref = "1Thess.2.9", link = "background", note = "Paul recalls his labor and toil night and day while preaching there." },
]

