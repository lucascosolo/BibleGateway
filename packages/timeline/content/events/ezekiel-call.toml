id = "ezekiel-call"
title = "Ezekiel's call by the Chebar canal"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
Ezekiel is among the exiles by the river Chebar. He sees visions of God in the fifth year of Jehoiachin's captivity. The standard modern date is 593 BCE (July, by one commentary summary). What the "thirtieth year" in Ezekiel 1:1 is counting is unsettled."""
verses = [
  { ref = "Ezek.1.1", link = "describes", note = "The thirtieth year, fourth month, fifth day, by the river Chebar" },
  { ref = "Ezek.1.2", link = "describes", note = "The fifth year of King Jehoiachin's captivity" },
  { ref = "Ezek.1.3", link = "describes", note = "The word of Yahweh comes to Ezekiel the priest" },
]

[[positions]]
id = "593"
label = "593 BCE (fifth year of Jehoiachin's exile)"
tradition = "chronological"
earliest = -593
latest = -593
held_by = "Edwin R. Thiele; Walther Eichrodt (as cited by Wikipedia, footnote 6)"
summary = """
The fifth year of Jehoiachin's exile is 593 BCE. The "thirtieth year" is read in two ways. One reading takes it as Ezekiel's age. The other, found in rabbinic sources, counts it from the discovery of the Book of the Law in 622 BCE. Thiele's Chart 31 fixes the day: "593—31 July—Ezekiel has vision on 4/5/5—Ezek. 1:1–2"."""
citations = [
