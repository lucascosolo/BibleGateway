summary = """
Ezekiel, among the exiles by the river Chebar, sees the visions of God in the fifth year of Jehoiachin's captivity. The standard modern dating is 593 BCE (July, by one commentary summary); what the "thirtieth year" of Ezekiel 1:1 counts is unsettled."""
verses = [
  { ref = "Ezek.1.1", link = "describes", note = "Thirtieth year, fourth month, fifth day; by the river Chebar" },
  { ref = "Ezek.1.2", link = "describes", note = "Fifth year of King Jehoiachin's captivity" },
  { ref = "Ezek.1.3", link = "describes", note = "The word of Yahweh comes to Ezekiel the priest" },
]

