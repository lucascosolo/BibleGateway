summary = """
Ezekiel dates his visions by the years of Jehoiachin's exile (Kitchen), and the fifth year is 593 BCE. What the "thirtieth year" counts is unsettled, and no filed source resolves it. Edwin Thiele's Chart 31 fixes the day: "593—31 July—Ezekiel has vision on 4/5/5—Ezek. 1:1–2"."""
