id = "ezekiel-call"
title = "Ezekiel's call by the Chebar canal"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "sources-located"
summary = """
Ezekiel is among the exiles by the river Chebar, where he sees visions of God in the fifth year of Jehoiachin's captivity. The standard modern date is 593 BCE (July, by one commentary summary). What the "thirtieth year" in Ezekiel 1:1 is counting is unsettled."""
verses = [
  { ref = "Ezek.1.1", link = "describes", note = "Ezekiel 1:1 dates the vision to the thirtieth year, fourth month, fifth day, by the river Chebar." },
  { ref = "Ezek.1.2", link = "describes", note = "Ezekiel 1:2 gives the fifth year of King Jehoiachin's captivity as the date." },
  { ref = "Ezek.1.3", link = "describes", note = "Ezekiel 1:3 says the word of Yahweh came to Ezekiel the priest." },
]

[[positions]]
id = "593"
label = "593 BCE (fifth year of Jehoiachin's exile)"
tradition = "chronological"
earliest = -593
latest = -593
held_by = "Edwin R. Thiele; Walther Eichrodt (as cited by Wikipedia, footnote 6)"
summary = """
The fifth year of Jehoiachin's exile is 593 BCE, but the "thirtieth year" is read in two ways. One reading takes it as Ezekiel's age, and the other, found in rabbinic sources, counts it from the discovery of the Book of the Law in 622 BCE. Edwin Thiele's Chart 31 fixes the day: "593—31 July—Ezekiel has vision on 4/5/5—Ezek. 1:1–2"."""
citations = [
  { source = "thiele-1983", locator = "p. 184, Chart 31" },
  { source = "wikipedia-ezekiel", locator = "Chronology section, footnote 6: Eichrodt, Ezekiel: A Commentary (2003), p. 407, not checked directly" },
  { source = "wikipedia-book-of-ezekiel" },
]
