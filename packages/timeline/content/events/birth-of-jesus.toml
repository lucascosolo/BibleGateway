id = "birth-of-jesus"
title = "The birth of Jesus"
axis = "narrative"
category = "political"
confidence = "contested"
status = "draft"
summary = """
Matthew sets Jesus's birth in the reign of Herod the king. Luke ties it to a census under Quirinius. Most scholars infer a date between 6 and 4 BCE from the date of Herod's death. Josephus dates the Quirinius census to 6 CE, which does not fit that window. The tension is unresolved."""
verses = [
  { ref = "Matt.1.18-Matt.2.23", link = "describes", note = "The birth at Bethlehem in the days of Herod" },
  { ref = "Luke.2.1-Luke.2.2", link = "dates", note = "A decree of Augustus, while Quirinius is governor of Syria" },
  { ref = "Luke.2.3-Luke.2.20", link = "describes", note = "The registration, the birth and the shepherds" },
  { ref = "Luke.3.23", link = "alludes", note = "Jesus is about thirty years old when his ministry begins" },
  { ref = "Gal.4.4", link = "alludes", note = "Born of a woman, born under the law" },
]

[[positions]]
id = "6-4-bce"
label = "6–4 BCE"
tradition = "chronological"
earliest = -6
latest = -4
held_by = "Emil Schürer"
summary = """
Schürer dated Herod's death to 4 BCE, working back from Archelaus's removal in 6 CE. That is the latest point for a birth in Herod's days. Wikipedia reports that most scholars assume a birth between 6 and 4 BCE on this basis. Schürer's own date is for Herod's death. The birth range is an inference from it."""
citations = [
  { source = "wikipedia-herod-the-great" },
  { source = "wikipedia-chronology-of-jesus" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
  Matthew 2 places the birth in the days of Herod the king, so it cannot fall after his death."""
  citations = [{ source = "wikipedia-chronology-of-jesus" }]
  verses = [{ ref = "Matt.2.1", link = "dates" }]

  [[positions.arguments]]
  stance = "against"
  text = """
  Luke 2:2 links the birth to a registration under Quirinius. Josephus dates that to the removal of Archelaus in 6 CE, about ten years later."""
  citations = [{ source = "wikipedia-census-of-quirinius" }, { source = "lexundria-josephus-ant-18-1", locator = "18.1–2" }]
  verses = [{ ref = "Luke.2.2", link = "dates" }]

[[positions]]
id = "2-bce"
label = "2 BCE"
tradition = "traditional"
earliest = -2
latest = -2
held_by = "Clement of Alexandria"
summary = """
Clement of Alexandria's date of 2 BCE comes from subtracting thirty years from the start of the ministry, in about 29 CE. Eusebius also places the birth in the forty-second year of Augustus, which is 2 BCE. Here traditional means the dating of early church writers."""
citations = [{ source = "wikipedia-chronology-of-jesus" }]

[[attestations]]
artifact = "josephus-antiquities-18-1"
relation = "in-tension"
note = """
Josephus says Cyrenius came to Syria to assess Judea after Archelaus's removal. He places that census in 6 CE. That is after the death of Herod, the king under whom Matthew sets the birth."""
citations = [
  { source = "lexundria-josephus-ant-18-1", locator = "18.1–2" },
  { source = "wikipedia-census-of-quirinius" },
]
