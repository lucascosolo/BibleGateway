id = "birth-of-jesus"
title = "The birth of Jesus"
axis = "narrative"
category = "political"
confidence = "contested"
status = "draft"
summary = """
Matthew sets Jesus's birth under Herod the king and Luke ties it to a census under Quirinius. \
Most scholars infer a date between 6 and 4 BCE from Herod's death; the Quirinius census that \
Josephus dates to 6 CE does not fit that window, and the tension is unresolved."""
verses = [
  { ref = "Matt.1.18-Matt.2.23", link = "describes", note = "birth at Bethlehem in the days of Herod" },
  { ref = "Luke.2.1-Luke.2.2", link = "dates", note = "decree of Augustus; Quirinius governor of Syria" },
  { ref = "Luke.2.3-Luke.2.20", link = "describes", note = "the registration, the birth and the shepherds" },
  { ref = "Luke.3.23", link = "alludes", note = "about thirty years old at the start of his ministry" },
  { ref = "Gal.4.4", link = "alludes", note = "born of a woman, born under the law" },
]

[[positions]]
id = "6-4-bce"
label = "6–4 BCE"
tradition = "chronological"
earliest = -6
latest = -4
held_by = "Emil Schürer"
summary = """
Takes Herod's death in 4 BCE (Schürer's chronology, worked back from Archelaus's removal in 6 CE) \
as the latest point for a birth in Herod's days; Wikipedia reports that most scholars assume a \
birth between 6 and 4 BCE on this basis. Schürer's own date concerns Herod's death, and the \
birth range is the inference from it."""
citations = [
  { source = "wikipedia-herod-the-great" },
  { source = "wikipedia-chronology-of-jesus" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
  Matthew 2 places the birth in the days of Herod the king, so it cannot fall after his death."""
  citations = [{ source = "wikipedia-chronology-of-jesus" }]
  verses = [{ ref = "Matt.2.1", link = "dates" }]

  [[positions.arguments]]
  stance = "against"
  text = """
  Luke 2:2 links the birth to a registration under Quirinius, which Josephus dates to the \
  removal of Archelaus in 6 CE, about a decade later."""
  citations = [{ source = "wikipedia-census-of-quirinius" }, { source = "lexundria-josephus-ant-18-1", locator = "18.1–2" }]
  verses = [{ ref = "Luke.2.2", link = "dates" }]

[[positions]]
id = "2-bce"
label = "2 BCE"
tradition = "traditional"
earliest = -2
latest = -2
held_by = "Clement of Alexandria"
summary = """
Clement of Alexandria's figure of 2 BCE comes from subtracting thirty years from the start of \
the ministry in about 29 CE; Eusebius likewise places the birth in the forty-second year of \
Augustus, 2 BCE."""
citations = [{ source = "wikipedia-chronology-of-jesus" }]

[[attestations]]
artifact = "josephus-antiquities-18-1"
relation = "in-tension"
note = """
Josephus has Cyrenius come to Syria to assess Judea after Archelaus's removal, a census he \
places at 6 CE, after the death of Herod under whom Matthew sets the birth."""
citations = [
  { source = "lexundria-josephus-ant-18-1", locator = "18.1–2" },
  { source = "wikipedia-census-of-quirinius" },
]
