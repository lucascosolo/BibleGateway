id = "birth-of-jesus"
title = "The birth of Jesus"
axis = "narrative"
category = "political"
confidence = "contested"
status = "sources-located"
summary = """
Matthew sets Jesus's birth in the reign of Herod the king, while Luke ties it to a census under Quirinius. Most scholars infer a date between 6 and 4 BCE from the date of Herod's death, but Josephus dates the Quirinius census to 6 CE, which does not fit that window. The tension is unresolved."""
verses = [
  { ref = "Matt.1.18-Matt.2.23", link = "describes", note = "Matthew 1:18-2:23 tells the birth of Jesus at Bethlehem in the days of Herod." },
  { ref = "Luke.2.1-Luke.2.2", link = "dates", note = "Luke 2:1-2 mentions a decree of Augustus while Quirinius is governor of Syria, a synchronism used to date the birth." },
  { ref = "Luke.2.3-Luke.2.20", link = "describes", note = "Luke 2:3-20 tells the registration, the birth and the shepherds." },
  { ref = "Luke.3.23", link = "alludes", note = "Luke 3:23 says Jesus is about thirty years old when his ministry begins, which gives a way to estimate the birth." },
  { ref = "Gal.4.4", link = "alludes", note = "Galatians 4:4 says Jesus was born of a woman, born under the law." },
]

[[positions]]
id = "6-4-bce"
label = "6–4 BCE"
tradition = "chronological"
earliest = -6
latest = -4
held_by = "John P. Meier; Raymond E. Brown (for the 4 BCE death date)"
summary = """
Herod's death in 4 BCE is the latest point for a birth in his days. Meier treats 4 BCE as the settled year, noting that Herod's successors counted their reigns from 5-4 BCE and that proposals for 1 BCE have not won acceptance, and Brown likewise says Jesus was born before Herod's death in 4 BC. The 6 to 4 BCE range is an inference from that death date."""
citations = [
  { source = "meier-1991", locator = "p. 375; p. 414 n. 18" },
  { source = "brown-1997", locator = "ch. 4, What Preceded the 1st Century AD (63–4 BC: Roman Dominance, Herod the Great, Augustus); ch. 4, The First Third of the 1st Century AD" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
The Gospel of Matthew sets the limit. Matthew 2 places the birth in the days of Herod the king, so it cannot fall after his death."""
  citations = [{ source = "meier-1991", locator = "p. 375 (Matt 2:1; Luke 1:5)" }]
  verses = [{ ref = "Matt.2.1", link = "dates" }]

  [[positions.arguments]]
  stance = "against"
  text = """
The census in Luke pulls the other way. Luke 2:2 links the birth to a registration under Quirinius, which Josephus dates to the removal of Archelaus in 6 CE, about ten years later."""
  citations = [{ source = "meier-1991", locator = "pp. 212–213" }, { source = "josephus-whiston", locator = "Antiquities 18.1.1" }]
  verses = [{ ref = "Luke.2.2", link = "dates" }]

[[attestations]]
artifact = "josephus-antiquities-18-1"
relation = "in-tension"
note = """
Josephus says Cyrenius came to Syria to assess Judea after Archelaus's removal, and he places that census in 6 CE. That is after the death of Herod, the king under whom Matthew sets the birth, which is why the two accounts are in tension."""
citations = [
  { source = "josephus-whiston", locator = "Antiquities 18.1.1" },
  { source = "meier-1991", locator = "pp. 212–213" },
]

[[positions]]
id = "brown-ca-6-bce"
label = "ca. 6 BCE (Brown, Table 1)"
tradition = "chronological"
earliest = -6
latest = -6
held_by = "Raymond E. Brown (Table 1)"
summary = """
Raymond Brown's Table 1, "Chronology of People and Events Pertinent to the New Testament", lists "Jesus born ca. 6 BC", in the reign of Herod the Great (37-4 BC)."""
citations = [{ source = "brown-1997", locator = "Table 1 (Chronology of People and Events)" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown's table sets Herod the Great's reign at 37-4 BC and the birth ca. 6 BC, inside that reign, as Matthew 2 requires."""
  citations = [{ source = "brown-1997", locator = "Table 1 (Chronology of People and Events)" }]
  verses = [
    { ref = "Matt.2.1", link = "dates" },
  ]

[[positions]]
id = "meier-ca-7-6-bce"
label = "ca. 7 or 6 BCE (Meier)"
tradition = "critical"
earliest = -7
latest = -6
held_by = "John P. Meier"
summary = """
John Meier places Jesus's birth ca. 7 or 6 BCE, a few years before Herod the Great died in 4 BCE, and thinks it most likely took place in Nazareth, not Bethlehem. He holds this as a probability only: the Magi and flight-into-Egypt stories are, in his view, highly questionable history. He calls the match of Matthew 2 with Luke 3:23 "likely—though not certain"."""
citations = [
  { source = "meier-1991", locator = "pp. 375–377, 407" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
Meier argues that Matthew and Luke independently place the birth in Herod's reign, and that Matthew's impression of a child one to two years old at the Magi's visit suggests the last years of that reign. Luke 3:23 ("about thirty") for a ministry beginning around 28 CE fits a birth a few, but only a few, years before 4 BCE."""
  citations = [{ source = "meier-1991", locator = "pp. 375–377" }]
  verses = [{ ref = "Matt.2.1", link = "dates" }, { ref = "Luke.3.23", link = "dates" }]
