id = "exodus"
title = "The Exodus from Egypt"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
This is Israel's departure from Egypt under Moses. Scholars who date it as an event favor one of two dates. One is in the 15th century BCE, read from 1 Kings 6:1. The other is in the 13th century, in the reign of Ramesses II. Whether it happened as described at all is a separate question, kept apart from the dating (see the linked historicity issue). Either way it comes before about 1208 BCE, when the Merneptah Stele already names Israel as a people in Canaan."""
verses = [
  { ref = "Exod.12.40-Exod.12.41", link = "dates", note = "430 years in Egypt" },
  { ref = "Exod.1.11", link = "background", note = "The store cities Pithom and Raamses" },
]

[[positions]]
id = "early"
label = "Early date (c. 1446 BCE)"
tradition = "traditional"
earliest = -1450
latest = -1440
held_by = "Bryant G. Wood"
summary = """
Wood takes the 480 years of 1 Kings 6:1 as a plain count back from the fourth year of Solomon. That puts the Exodus in the middle of the 15th century BCE. Traditional here means the date that follows the Bible's own numbers."""
citations = [{ source = "wood-2005", locator = "pp. 475–489" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  1 Kings 6:1 dates the start of the temple to the 480th year after Israel came out of Egypt. That year is Solomon's fourth. Counting back from a fourth year of about 967/966 BCE gives about 1446 BCE. Young says the fourth year is the spring of 967 or 966, depending on the counting rule."""
  citations = [
    { source = "wood-2005" },
    { source = "young-2003", locator = "pp. 599, 601" },
  ]
  verses = [{ ref = "1Kgs.6.1", link = "dates" }]

  [[positions.arguments]]
  stance = "against"
  text = """
  Exodus 1:11 has the Israelites building a store city called Raamses. That name is linked with the Ramesside pharaohs of the 13th century."""
  citations = [{ source = "kitchen-2003" }]
  verses = [{ ref = "Exod.1.11", link = "dates" }]

[[positions]]
id = "late"
label = "Late date (13th century BCE, reign of Ramesses II)"
tradition = "critical"
earliest = -1279
latest = -1213
held_by = "K. A. Kitchen"
summary = """
Kitchen places the Exodus in the 13th century BCE under Ramesses II. Ramesses reigned about 1279-1213 BCE on the dating most Egyptologists follow. Critical here means the date that leans on Egyptian evidence."""
citations = [
  { source = "kitchen-2003" },
  { source = "wikipedia-ramesses-ii" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
  The store city "Raamses" of Exodus 1:11 fits the building program of the Ramesside kings in the eastern Nile Delta."""
  citations = [{ source = "kitchen-2003" }]
  verses = [{ ref = "Exod.1.11", link = "dates" }]

  [[positions.arguments]]
  stance = "against"
  text = """
  Read literally, the 480 years of 1 Kings 6:1 point to the 15th century, not the 13th. A late date has to treat the figure as something other than a plain count."""
  citations = [{ source = "wood-2005" }]
  verses = [{ ref = "1Kgs.6.1", link = "dates" }]

[[attestations]]
artifact = "merneptah-stele"
relation = "consistent"
note = """
The Stele does not mention an exodus. It shows Israel already living in Canaan as a people by Merneptah's fifth year, about 1208 BCE. So any exodus came before that. This fits either date above."""
citations = [{ source = "cos-2", locator = "pp. 40–41" }]
