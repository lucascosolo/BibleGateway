id = "antiochus-desecration-maccabean-revolt"
title = "Antiochus IV desecrates the temple; the Maccabean revolt"
axis = "narrative"
category = "political"
confidence = "contested"
status = "claims-checked"
summary = """
Antiochus IV bans Jewish practice, and the Jerusalem temple is turned over to the worship of Zeus (167 BCE). The Maccabees resist and cleanse the temple on 25 Kislev 164 BCE, which is the origin of Hanukkah. First Maccabees, the main account, is read here among the outside books, in Brenton's Septuagint and the King James Apocrypha. Satlow reads the visions of Daniel 7-12 as veiled allusions to Antiochus IV and the revolt."""
verses = [
  { ref = "Dan.8.9-Dan.8.14", link = "describes", note = "Daniel 8:9-14 describes a little horn that attacks the sanctuary and the daily burnt offering." },
  { ref = "Dan.11.31", link = "describes", note = "Daniel 11:31 says the sanctuary is profaned, the daily offering is taken away and the abomination is set up." },
  { ref = "John.10.22", link = "alludes", note = "John 10:22 mentions the Feast of the Dedication at Jerusalem (Hanukkah), which looks back to the rededication of the temple." },
]

[[positions]]
id = "167-164"
label = "167-164 BCE"
tradition = "chronological"
earliest = -167
latest = -164
held_by = "First Maccabees (author unnamed)"
summary = """
First Maccabees dates both ends of the crisis by the Seleucid calendar. Of the desecration, 1:54 (Brenton's English) says: "Now the fifteenth day of the month Casleu, in the hundred forty and fifth year, they set up the abomination of desolation upon the altar". Of the cleansing, 4:52 says: "Now on the five and twentieth day of the ninth month, which is called the month Casleu, in the hundred forty and eighth year, they rose up betimes in the morning". Years 145 and 148 of the Seleucid count are 167 and 164 BCE; that conversion is the cataloguer's. Josephus, who follows First Maccabees here, gives the same two Seleucid years (145 and 148) and says Antiochus forbade the daily sacrifices. Satlow dates the first sacrifices in the restored temple to Kislev 164 BCE, and says the wider conflict was settled around 135 BCE."""
citations = [
  { source = "ebible-brenton", locator = "1 Maccabees 1:54; 4:52" },
  { source = "josephus-whiston", locator = "Antiquities 12.5.4 (145th year, 25 Chasleu; daily sacrifices forbidden); 12.7.6 (rededication on 25 Apelleus, 148th year, after three years)" },
  { source = "satlow-2014", locator = "pp. 125–128 (revolt and the 164 BCE rededication); p. 127 (the \"abomination of desolation\" on the altar); pp. 130–131 (Daniel 7-12 and Antiochus IV)" },
]
