id = "antiochus-desecration-maccabean-revolt"
title = "Antiochus IV desecrates the temple; the Maccabean revolt"
axis = "narrative"
category = "political"
confidence = "contested"
status = "sources-located"
summary = """
Antiochus IV bans Jewish practice, and the Jerusalem temple is turned over to the worship of Zeus (167 BCE). The Maccabees resist and cleanse the temple on 25 Kislev 164 BCE, which is the origin of Hanukkah. First Maccabees, the main account, is not in this corpus. Scholars take the King of the North in Daniel to be Antiochus IV."""
verses = [
  { ref = "Dan.8.9-Dan.8.14", link = "describes", note = "Daniel 8:9-14 describes a little horn that attacks the sanctuary and the daily burnt offering." },
  { ref = "Dan.11.31", link = "describes", note = "Daniel 11:31 says the sanctuary is profaned, the daily offering is taken away and the abomination is set up." },
  { ref = "John.10.22", link = "alludes", note = "John 10:22 mentions the Feast of the Dedication at Jerusalem (Hanukkah), which looks back to the rededication of the temple." },
]

[[positions]]
id = "167-164"
label = "167-164 BCE"
tradition = "chronological"
earliest = -167
latest = -164
held_by = "First Maccabees (author unnamed)"
summary = """
First Maccabees dates both ends of the crisis by the Seleucid calendar. Of the desecration, 1:54 (NRSVUE) says: "Now on the fifteenth day of Chislev, in the one hundred forty-fifth year, they erected a desolating sacrilege on the altar of burnt offering". Of the cleansing, 4:52 says: "Early in the morning on the twenty-fifth day of the ninth month, which is the month of Chislev, in the one hundred forty-eighth year". Years 145 and 148 of the Seleucid count are 167 and 164 BCE; that conversion is the cataloguer's and Wikipedia's, and no scholar who made it was found. The main phase of the revolt ran 167-164 BCE, with fighting until 141 BCE. The temple was rededicated on 25 Kislev 164 BCE, and the abomination is dated to 167 BCE, when Antiochus ended the twice-daily sacrifice."""
citations = [
  { source = "biblegateway-1-maccabees-nrsvue", locator = "1:54; 4:52" },
  { source = "wikipedia-maccabean-revolt" },
  { source = "wikipedia-abomination-of-desolation" },
  { source = "wikipedia-antiochus-iv" },
]
