id = "second-temple-destruction"
title = "The destruction of the Second Temple"
axis = "narrative"
category = "political"
confidence = "firm"
status = "sources-located"
summary = """
The Roman army under Titus besieged Jerusalem from 13 April to 8 September 70 CE. The Second Temple burned on 10 Av. Jesus's words about the temple, in Matthew, Mark and Luke, point to this event. Josephus tells it from the Roman side, and the Arch of Titus in Rome shows the loot."""
verses = [
  { ref = "Mark.13.1-Mark.13.2", link = "alludes", note = "Mark records the saying that not one stone will be left on another, which alludes to the destruction." },
  { ref = "Matt.24.1-Matt.24.2", link = "alludes", note = "Matthew gives the same saying, that the temple buildings will be thrown down." },
  { ref = "Luke.21.5-Luke.21.6", link = "alludes", note = "Luke gives the same saying, that the days will come when not one stone is left." },
  { ref = "Luke.21.20-Luke.21.24", link = "alludes", note = "Luke speaks of Jerusalem surrounded by armies, which alludes to the siege." },
  { ref = "Luke.19.43-Luke.19.44", link = "alludes", note = "Luke says enemies will not leave one stone on another, which alludes to the destruction." },
]

[[positions]]
id = "70"
label = "70 CE (10 Av)"
tradition = "chronological"
earliest = 70
latest = 70
summary = """
The siege lasted from 13 April to 8 September 70 CE. The Second Temple was destroyed on 10 Av. Josephus says it burned on the tenth of Lous. That was the same day the king of Babylon had burned the first temple."""
citations = [
  { source = "wikipedia-siege-of-jerusalem-70" },
  { source = "lexundria-josephus-war-6-249", locator = "6.249–250" },
]

[[attestations]]
artifact = "josephus-war-6-249"
relation = "corroborates"
note = """
In the Jewish War, Josephus, who saw it, describes the burning of the temple on the tenth of Lous. This corroborates the destruction dated here."""
citations = [{ source = "lexundria-josephus-war-6-249", locator = "6.249–250" }]

[[attestations]]
artifact = "arch-of-titus"
relation = "corroborates"
note = """
One carved panel shows the loot taken from the Temple in Jerusalem. The menorah, the temple lampstand, is its main focus."""
citations = [{ source = "wikipedia-arch-of-titus" }]
