id = "second-temple-destruction"
title = "The destruction of the Second Temple"
axis = "narrative"
category = "political"
confidence = "firm"
status = "sources-located"
summary = """
The Roman army under Titus took Jerusalem in 70 CE. The Second Temple burned on the tenth of Lous (Av). Jesus's words about the temple, in Matthew, Mark and Luke, point to this event. Josephus tells it from the Roman side, and the Arch of Titus in Rome depicts the sacred objects carried in triumph."""
verses = [
  { ref = "Mark.13.1-Mark.13.2", link = "alludes", note = "Mark records the saying that not one stone will be left on another, which alludes to the destruction." },
  { ref = "Matt.24.1-Matt.24.2", link = "alludes", note = "Matthew gives the same saying, that the temple buildings will be thrown down." },
  { ref = "Luke.21.5-Luke.21.6", link = "alludes", note = "Luke gives the same saying, that the days will come when not one stone is left." },
  { ref = "Luke.21.20-Luke.21.24", link = "alludes", note = "Luke speaks of Jerusalem surrounded by armies, which alludes to the siege." },
  { ref = "Luke.19.43-Luke.19.44", link = "alludes", note = "Luke says enemies will not leave one stone on another, which alludes to the destruction." },
]

[[positions]]
id = "70"
label = "70 CE (10 Av)"
tradition = "chronological"
earliest = 70
latest = 70
summary = """
Brown dates the fall of Jerusalem and the destruction of the Temple to 70 under Titus. Josephus says the Temple burned on the tenth of Lous (Av). That was the same day the king of Babylon had burned the first temple."""
citations = [
  { source = "brown-1997", locator = "ch. 4, The Last Third of the 1st Century AD and the Beginning of the 2d" },
  { source = "josephus-whiston", locator = "Jewish War 6.4.5" },
]

[[attestations]]
artifact = "josephus-war-6-249"
relation = "corroborates"
note = """
In the Jewish War, Josephus, who saw it, describes the burning of the temple on the tenth of Lous. This corroborates the destruction dated here."""
citations = [{ source = "josephus-whiston", locator = "Jewish War 6.4.5" }]

[[attestations]]
artifact = "arch-of-titus"
relation = "corroborates"
note = """
The arch in the Roman forum depicts the Jewish sacred paraphernalia and captives brought to Rome in triumph in 71, as Brown describes it."""
citations = [{ source = "brown-1997", locator = "ch. 4, The Last Third of the 1st Century AD and the Beginning of the 2d" }]
