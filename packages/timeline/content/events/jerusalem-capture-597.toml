id = "jerusalem-capture-597"
title = "Nebuchadnezzar takes Jerusalem and Jehoiachin"
axis = "narrative"
category = "political"
confidence = "firm"
status = "draft"
summary = """
Babylon captures Jerusalem for the first time. Jehoiachin surrenders and is taken to Babylon, and Zedekiah is made king in his place. The Babylonian Chronicle, an ancient Babylonian record, gives the date down to the month."""
verses = [{ ref = "2Kgs.24.10-2Kgs.24.17", link = "describes" }]

[[positions]]
id = "chronicle"
label = "February/March 597 BCE (2 Addaru, Nebuchadnezzar's 7th year)"
tradition = "chronological"
earliest = -597
latest = -597
summary = """
The Babylonian Chronicle dates the seizure of the city and the capture of its king to the second day of Addaru, in Nebuchadnezzar's seventh year. Thiele converts the date: Nebuchadnezzar "besieged Jerusalem and captured the city on 2 Adar (Saturday, 16 March) 597", after an expedition begun in Kislev (17 December 598 to 15 January 597)."""
held_by = "Edwin R. Thiele"
citations = [
  { source = "thiele-1983", locator = "p. 186; p. 180, table of fixed dates" },
  { source = "grayson-1975", locator = "Chronicle 5" },
  { source = "livius-abc5" },
]

[[attestations]]
artifact = "babylonian-chronicle-abc5"
relation = "corroborates"
note = """
The Chronicle says Nebuchadnezzar "seized the city and captured the king" on 2 Addaru of his seventh year. It says he then appointed a king of his own choice. This matches 2 Kings 24:12-17."""
citations = [{ source = "livius-abc5" }]
