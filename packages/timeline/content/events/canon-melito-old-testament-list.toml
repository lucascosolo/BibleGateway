id = "canon-melito-old-testament-list"
title = "Melito of Sardis sends the first Christian list of Old Testament books"
axis = "canon"
category = "canon"
confidence = "firm"
status = "claims-checked"
summary = """
Asked by a fellow Christian, Onesimus, how many the ancient books were and in what order, Melito, bishop of Sardis, travelled east to the place where these things were preached and done and sent back a list. Eusebius preserves it. It runs from the five books of Moses, with Numbers before Leviticus, through Joshua, Judges, Ruth, Kingdoms, Chronicles, Psalms, Proverbs, Ecclesiastes, Song of Songs, Job, the prophets and Daniel and Ezekiel, to Esdras. Esther is missing. McDonald calls it the earliest Christian list of Old Testament books and notes that its order does not follow the later Hebrew Bible."""
verses = [
  { ref = "Num.1.1", link = "names", note = "Numbers, which Melito places before Leviticus." },
  { ref = "Ezra.1.1", link = "names", note = "Ezra, the book Melito calls Esdras, which closes his list." },
]

[[positions]]
id = "about-170-180"
label = "About 170-180 CE"
tradition = "critical"
earliest = 170
latest = 180
held_by = "Lee Martin McDonald"
summary = """
McDonald dates Melito's list to about 170-180 CE. He is not fully consistent, giving about 170-175 and about 180 elsewhere in the same volume; the range here spans those."""
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 188; p. 317; p. 33" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Lim notes that Onesimus's question presupposes uncertainty about the Old Testament books, and reports Audet's case that such fluid lists could circulate only before Origen's influence took hold."""
  citations = [{ source = "lim-2013", locator = "p. 43" }]

