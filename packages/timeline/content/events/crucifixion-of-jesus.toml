id = "crucifixion-of-jesus"
title = "The crucifixion of Jesus"
axis = "narrative"
category = "political"
confidence = "contested"
status = "sources-located"
summary = """
All four Gospels place the crucifixion at Passover, on a Friday, under Pontius Pilate, and scholars generally agree on a date between 30 and 36 CE. The Friday-Passover rule leaves two plausible years by the astronomy, 30 CE and 33 CE, and which of the two is right is still open."""
verses = [
  { ref = "Matt.27.11-Matt.27.56", link = "describes", note = "Matthew 27:11-56 tells the trial before Pilate, the crucifixion and the death of Jesus." },
  { ref = "Mark.15.1-Mark.15.41", link = "describes", note = "Jesus is handed over to Pilate and crucified at Golgotha." },
  { ref = "Luke.23.1-Luke.23.49", link = "describes", note = "Jesus appears before Pilate and Herod, then is crucified." },
  { ref = "John.18.28-John.19.37", link = "describes", note = "John 18:28-19:37 runs from Pilate's judgment hall to the spear in Jesus's side." },
  { ref = "Acts.2.23", link = "alludes", note = "In Acts 2:23 Peter speaks of the crucifixion at Pentecost." },
  { ref = "1Cor.15.3-1Cor.15.4", link = "alludes", note = "1 Corinthians 15:3-4 says Christ died for our sins, was buried and was raised." },
  { ref = "1Tim.6.13", link = "alludes", note = "1 Timothy 6:13 refers to the good confession Christ made before Pontius Pilate." },
]

[[positions]]
id = "33"
label = "Friday 3 April 33 CE"
tradition = "chronological"
earliest = 33
latest = 33
held_by = "Colin J. Humphreys and W. G. Waddington"
summary = """
Colin Humphreys and W. G. Waddington reconstruct the first-century Jewish calendar by computing when the new crescent could first be seen from Jerusalem. Their Table 1 gives the date of 14 Nisan for every year of Pilate's term, 26 to 36 CE, and only three years put 14 Nisan on a Friday: 11 April 27, 7 April 30 and 3 April 33. They rule out 27 as too early for a ministry that began after Tiberius's fifteenth year, and 34 (possible only with a leap month) as too late for Paul's conversion. That leaves "the only two plausible years for the Crucifixion are AD 30 and AD 33", and they prefer 33. As a second argument, a partial lunar eclipse was visible at moonrise over Jerusalem on the evening of 3 April 33, which they read as the "moon turned to blood" that Peter quotes from Joel at Pentecost (Acts 2:20)."""
citations = [
  { source = "humphreys-waddington-1992", locator = "Table 1 on p. 335; Table 2 on p. 337; pp. 337–340 for the elimination; conclusion p. 350" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
Humphreys and Waddington argue that with 27 and 34 eliminated, the crucifixion must fall on 14 Nisan, so the Last Supper "cannot have been a Passover meal held at the official Passover meal time". John's three Passovers and a ministry beginning no earlier than autumn 28 then exclude 30 CE; John 2:20's forty-six years puts the first Passover of the ministry in 30 or 31; and the Gospels' weak Pilate fits the period after Sejanus's fall in October 31."""
  citations = [{ source = "humphreys-waddington-1992", locator = "pp. 338–340" }]
  verses = [
    { ref = "John.18.28", link = "dates", note = "John 18:28 is read as placing the crucifixion on the day before Passover." },
    { ref = "John.19.31", link = "dates" },
    { ref = "Luke.3.1-Luke.3.2", link = "dates", note = "Luke 3:1-2 gives the fifteenth year of Tiberius, a synchronism used to date Jesus's ministry and so his death." },
    { ref = "John.2.20", link = "dates", note = "John 2:20 says the temple took forty-six years to build, a number used to date the start of Jesus's ministry." },
    { ref = "1Cor.5.7", link = "alludes", note = "1 Corinthians 5:7 calls Christ our Passover, linking his death to the Passover." },
  ]

  [[positions.arguments]]
  stance = "for"
  text = """
The eclipse is their second argument. Their calculations show a lunar eclipse visible from Jerusalem at moonrise on 3 April 33, with most of the rising moon "turned to blood". Jews waiting for moonrise to begin the Passover meal would have seen it, and Peter's audience seven weeks later would have understood Joel's "moon to blood" as that eclipse. They also cite the apocryphal "Report of Pilate" and Cyril of Alexandria as textual echoes."""
  citations = [{ source = "humphreys-waddington-1992", locator = "pp. 340–347, 350" }]
  verses = [
    { ref = "Acts.2.19-Acts.2.21", link = "alludes", note = "Acts 2:19-21 speaks of the sun turned to darkness and the moon to blood, language linked here to the darkness at the crucifixion." },
    { ref = "Matt.27.45", link = "background", note = "Matthew 27:45 reports darkness from the sixth to the ninth hour during the crucifixion." },
  ]

  [[positions.arguments]]
  stance = "against"
  text = """
The authors are candid about the limits of their case. They grant that "the date 7 April AD 30 is also strongly supported" and that "without further evidence it does not seem possible to decide conclusively between these two dates". The eclipse argument depends on reading Acts 2:20 as a report of a recent event rather than a future prophecy, which, they note, commentators dispute."""
  citations = [{ source = "humphreys-waddington-1992", locator = "pp. 340–341" }]
  verses = [{ ref = "Acts.2.16-Acts.2.17", link = "alludes" }]

[[positions]]
id = "30"
label = "Friday 7 April 30 CE"
tradition = "chronological"
earliest = 30
latest = 30
summary = """
Humphreys and Waddington find that the Jewish lunar calendar leaves two plausible Fridays, 7 April 30 CE and 3 April 33 CE, and they themselves prefer 33. Meier, who prefers 30, notes that 7 April 30 is supported by a wide range of scholars who differ on many other questions, and Carson and Moo find 30 slightly preferable because a crucifixion as late as 33 might leave too little time before Paul's conversion."""
held_by = "John P. Meier; D. A. Carson and Douglas J. Moo"
citations = [
  { source = "meier-1991", locator = "p. 402; p. 431 n. 114" },
  { source = "carson-moo-2005", locator = "p. 127" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
Either 7 April 30 CE or 3 April 33 CE meets the Friday-Passover rule. Humphreys and Waddington's own Table 1 gives Friday 7 April for 14 Nisan in 30 CE, and they concede that this date "is also strongly supported"."""
  citations = [
    { source = "humphreys-waddington-1992", locator = "Table 1 on p. 335; p. 340" },
  ]

[[positions]]
id = "chadwick-thursday-30"
label = "Thursday 6 April 30 CE"
tradition = "traditional"
earliest = 30
latest = 30
held_by = "Jeffrey R. Chadwick"
summary = """
Jeffrey Chadwick, writing for a Latter-day Saint journal, concludes that "Jesus died on Thursday, April 6 (Julian), AD 30", the 14th of Nisan, and was raised on Sunday 9 April. Two things set his view apart. He puts the crucifixion on a Thursday rather than the Friday every other position here assumes, and part of his case for the year rests on the Book of Mormon, which he reads as saying Jesus lived thirty-three full years, so that 33 CE "is too late a year to accommodate his lifespan". He states that the New Testament, Mishnah, historical and astronomical evidence alone would be enough for 30 CE; readers who do not accept the Book of Mormon will want to weigh that claim for themselves. Chadwick also surveys the field: he reports Blinzler's count of scholars favoring 30 CE, adds Murphy-O'Connor, Fitzmyer, Pixner and Ehrman to it, and notes that Raymond Brown left the choice between 30 and 33 open."""
citations = [
  { source = "chadwick-2015", locator = "conclusion pp. 188, 190; survey of scholars p. 142; Book of Mormon lifespan pp. 143, 158 and Figure 4 on p. 159" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
Chadwick reads Tiberius's fifteenth year (Luke 3:1) as autumn 27 to autumn 28, which with John's three named Passovers gives a two-year ministry from Passover 28 to Passover 30. He calls this "the model supported by the chronological allusion in Luke 3:1, the three specific Passovers mentioned by John", and adds Josephus on the temple's forty-six years."""
  citations = [{ source = "chadwick-2015", locator = "pp. 150–153" }]
  verses = [
    { ref = "Luke.3.1", link = "dates" },
    { ref = "John.2.13", link = "dates" },
    { ref = "John.2.20", link = "dates" },
    { ref = "John.6.4", link = "dates" },
    { ref = "John.12.1", link = "dates" },
  ]

  [[positions.arguments]]
  stance = "for"
  text = """
Chadwick accepts Humphreys and Waddington's new-moon calculations but not their extra day for 30 CE. He argues the new moon of 22 March 30 at 19:55 was visible that evening in Jerusalem, so 14 Nisan fell on Thursday 6 April, not Friday 7 April. Only 27, 30 and 33 CE put 14 Nisan within three days before a Sunday under Pilate, and he rules out 27 as too early for the ministry and 33 as too late."""
  citations = [{ source = "chadwick-2015", locator = "pp. 154–157, Figure 3 on p. 157" }]
  verses = [{ ref = "John.19.14", link = "dates", note = "John 19:14 calls the day the preparation of the Passover, a phrase that bears on when the crucifixion fell." }]

  [[positions.arguments]]
  stance = "against"
  text = """
The Thursday rests on reading the Gospels' three days as three full days and on his new-moon visibility claim. The Friday of all four Gospel accounts (the day before the Sabbath) is the reading other scholars keep, and the lifespan argument from the Book of Mormon is not evidence outside Latter-day Saint tradition."""
  citations = [{ source = "chadwick-2015", locator = "pp. 156–159, 190" }]
  verses = [{ ref = "Mark.15.42", link = "dates", note = "Mark 15:42 calls the day the day before the Sabbath, a phrase that bears on when the crucifixion fell." }]

[[attestations]]
artifact = "tacitus-annals-15-44"
relation = "corroborates"
note = """
Tacitus says Christus suffered the extreme penalty in Tiberius's reign at the hands of the procurator Pontius Pilate. That fixes a window of 26-37 CE, not the year."""
citations = [{ source = "tacitus-annals-15-latin", locator = "15.44" }]

[[attestations]]
artifact = "josephus-testimonium-flavianum"
relation = "partially-corroborates"
note = """
The original text probably mentioned Jesus's crucifixion under Pilate, but the text we have contains Christian additions, so the passage can only partly corroborate the event."""
citations = [
  { source = "josephus-whiston", locator = "Antiquities 18.3.3" },
  { source = "meier-1991", locator = "pp. 59–66" },
]

[[positions]]
id = "meier-30"
label = "Friday 7 April 30 CE (Meier)"
tradition = "critical"
earliest = 30
latest = 30
held_by = "John P. Meier"
summary = """
Meier prefers Friday 7 April 30 CE, with the Last Supper on Thursday evening 6 April as the start of 14 Nisan, not a Passover meal. He treats the Johannine chronology as more likely than the Synoptic one and calls the date a "tentative conclusion". He finds 33 CE the only real alternative: "In my opinion, a.d. 30 is the more likely date.""""
citations = [
  { source = "meier-1991", locator = "pp. 402, 407" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
John has the Jewish authorities avoid the praetorium so they could still eat the Passover, and calls the day of Jesus's trial the Day of Preparation. Meier judges this the likelier chronology, since a night Sanhedrin trial and execution on Passover Day itself is improbable, and the Last Supper then falls on the evening starting 14 Nisan."""
  citations = [{ source = "meier-1991", locator = "pp. 388–389, 395–396" }]
  verses = [{ ref = "John.18.28", link = "dates" }, { ref = "John.19.14", link = "dates" }, { ref = "Mark.15.42", link = "dates" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Of the years in Pilate's term, only 30 and 33 CE probably put 14 Nisan on a Friday. Starting from 28 CE, a death in 33 CE would mean a ministry of four to five years, more than either the Synoptics or John suggest."""
  citations = [{ source = "meier-1991", locator = "p. 402" }]
  verses = [{ ref = "Luke.3.1-Luke.3.2", link = "dates" }]
