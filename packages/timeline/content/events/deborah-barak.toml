id = "deborah-barak"
title = "Deborah and Barak"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
The prophet Deborah and Barak of Naphtali defeat the Canaanite general Sisera, who served Jabin king of Hazor, at the Kishon; Jael kills Sisera, and Judges 5 celebrates the victory in verse. The date is contested between the late 13th century and the 11th."""
verses = [
  { ref = "Judg.4.1-Judg.4.24", link = "describes", note = "Deborah, Barak, Sisera, Jael: the prose account" },
  { ref = "Judg.5.1-Judg.5.31", link = "describes", note = "The Song of Deborah, the poetic account" },
  { ref = "1Sam.12.9-1Sam.12.11", link = "alludes", note = "Samuel: the Lord sent Jerubbaal, Barak and Jephthah; Sisera is named as the earlier oppressor" },
  { ref = "Ps.83.9-Ps.83.10", link = "alludes", note = "Do to them as to Sisera and Jabin at the river Kishon" },
  { ref = "Heb.11.32", link = "alludes", note = "Barak named among those the writer has no time to tell of" },
]

