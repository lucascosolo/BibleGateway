id = "david-anointed"
title = "Samuel anoints David"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
Samuel secretly anoints Jesse's youngest son during Saul's reign. The Bible gives no year. The only limits available are those of Saul's reign."""
verses = [
  { ref = "1Sam.16.1-1Sam.16.13", link = "describes", note = "A private anointing at Bethlehem" },
  { ref = "2Sam.2.1-2Sam.2.4", link = "describes", note = "Later anointed king over Judah at Hebron" },
  { ref = "2Sam.5.1-2Sam.5.5", link = "describes", note = "Anointed king over all Israel" },
  { ref = "1Chr.11.1-1Chr.11.3", link = "describes", note = "The parallel in Chronicles: anointed at Hebron" },
  { ref = "Ps.89.20", link = "alludes", note = "'I have anointed him with my holy oil'" },
  { ref = "Acts.13.22", link = "alludes", note = "In Paul's sermon, God raised up David as king" },
]

