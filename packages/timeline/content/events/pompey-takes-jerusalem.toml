id = "pompey-takes-jerusalem"
title = "Pompey takes Jerusalem"
axis = "narrative"
category = "political"
confidence = "contested"
status = "claims-checked"
summary = """
In 63 BCE the Roman general Pompey steps into a quarrel between two rivals, Hyrcanus II and Aristobulus II. He takes the city and, after three months, the Temple area. He enters the part of the Temple that only the high priests were allowed to see, and Judea becomes a Roman client kingdom, ruled under Rome's control. No passage in the Bible text here tells this story."""

[[positions]]
id = "63"
label = "63 BCE"
tradition = "chronological"
earliest = -63
latest = -63
held_by = "Flavius Josephus"
summary = """
Josephus, Antiquities 14.66 (Whiston): "the city was taken on the third month, on the day of the fast, upon the hundred and seventy-ninth olympiad, when Caius Antonius and Marcus Tullius Cicero were consuls". Brown also dates Pompey's entry into Jerusalem and the Temple to 63 BC. Turning the consuls' names into a year is the cataloguer's own reading. Pompey besieged Jerusalem in 63 BCE. The siege lasted three months before the Temple area was broken into."""
citations = [{ source = "josephus-whiston", locator = "Antiquities 14.4.3-4" }, { source = "brown-1997", locator = "ch. 4, What Preceded the 1st Century AD (Pompey enters Jerusalem in 63 BC)" }]

