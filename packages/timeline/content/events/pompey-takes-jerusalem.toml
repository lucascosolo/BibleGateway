id = "pompey-takes-jerusalem"
title = "Pompey takes Jerusalem"
axis = "narrative"
category = "political"
confidence = "contested"
status = "draft"
summary = """
In 63 BCE Pompey intervenes in the dispute between Hyrcanus II and Aristobulus II, takes the upper city and, after three months, the Temple precinct; he enters the Holy of Holies and Judea becomes a Roman client kingdom. No passage in the corpus narrates this."""

[[positions]]
id = "63"
label = "63 BCE"
tradition = "chronological"
earliest = -63
latest = -63
held_by = "Flavius Josephus"
summary = """
Josephus, Antiquities 14.66 (Whiston): "the city was taken on the third month, on the day of the fast, upon the hundred and seventy-ninth olympiad, when Caius Antonius and Marcus Tullius Cicero were consuls". Wikipedia gives the year as 63 BC (the consular year is the cataloguer's reading). Pompey's siege of Jerusalem took place in 63 BCE and lasted three months before the Temple precinct was breached."""
citations = [{ source = "lexundria-josephus-ant-14-66", locator = "Ant. 14.66" }, { source = "wikipedia-siege-jerusalem-63bc" }]

