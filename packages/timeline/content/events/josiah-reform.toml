id = "josiah-reform"
title = "Josiah's reform"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "sources-located"
summary = """
In his eighteenth year Josiah repairs the temple. The book of the law is found, and he clears out the forbidden worship. Whether this really happened is debated. This file only dates it. Thiele uses the episode to show how Judah counted years: everything from the repair funds to the Passover (2 Kings 22:3 to 23:23) falls in the eighteenth year, and the Passover is on 14 Nisan, so the year "must have commenced before 1 Nisan and been carried over beyond 1 Nisan", which means Judah's regnal year began in Tishri."""
verses = [
  { ref = "2Kgs.22.3-2Kgs.23.25", link = "describes", note = "Kings describes how the book is found, the covenant renewed and the cult purged." },
  { ref = "2Chr.34.8-2Chr.35.19", link = "describes", note = "Chronicles gives the parallel account of the reform, including the Passover." },
  { ref = "Jer.1.2", link = "alludes", note = "Jeremiah 1:2 says Jeremiah is called in Josiah's thirteenth year, which places a date within Josiah's reign." },
  { ref = "Zeph.1.1", link = "alludes", note = "Zephaniah's opening places the prophet in Josiah's days." },
  { ref = "Zeph.1.4-Zeph.1.6", link = "alludes", note = "Zephaniah delivers a message against Baal worship, which alludes to the abuses the reform addressed." },
]

[[positions]]
id = "623-622"
