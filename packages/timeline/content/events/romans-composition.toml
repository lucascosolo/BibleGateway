id = "romans-composition"
title = "Composition of Romans"
axis = "composition"
category = "composition"
confidence = "firm"
status = "draft"
books = ["Rom"]
summary = """
Paul wrote Romans from Corinth, in the winter of 57/58, to Christians in Rome, a church he had never visited but where he had friends. He was about to carry the collection to Jerusalem and hoped to go on to Spain by way of Rome. Its authorship is not seriously disputed. A revisionist chronology would put it in 55-56."""
verses = [
  { ref = "Rom.1.1", link = "describes", note = "Paul names himself as the sender." },
  { ref = "Rom.15.25-Rom.15.26", link = "dates", note = "Paul is about to go to Jerusalem with the collection from Macedonia and Achaia." },
  { ref = "Rom.16.1", link = "describes", note = "Phoebe of Cenchreae, near Corinth, commended to the Romans." },
]

[[positions]]
id = "brown-corinth-57-58"
label = "Brown: winter 57/58 from Corinth"
tradition = "critical"
earliest = 57
latest = 58
held_by = "Raymond E. Brown"
summary = """
Brown, a critical scholar, gives his dating in one line: "In the winter of 57/58 from Corinth (55/56 in the Revisionist Chronology)." On authenticity he writes: "Not seriously disputed." He notes that a larger minority holds that chapter 16 was added later."""
citations = [{ source = "brown-1997", locator = "ch. 24, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown takes the place of writing from the letter's own details: Phoebe, "a woman deacon of the church at Cenchreae a few miles from where Paul is writing", is going to Rome and perhaps carrying the letter."""
  citations = [{ source = "brown-1997", locator = "ch. 24, General Analysis of the Message" }]
  verses = [{ ref = "Rom.16.1", link = "describes", note = "Phoebe of Cenchreae." }]

[[positions]]
id = "carson-moo-corinth-57"
label = "Carson and Moo: from Corinth, A.D. 57"
tradition = "critical"
earliest = 57
latest = 57
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo, authors of the standard evangelical introduction to the New Testament, hold that Paul wrote Romans near the end of his third missionary journey, in Corinth during the three months of Acts 20:3. They say that "A.D. 57 is the best alternative", while admitting they cannot be certain within a year or two."""
citations = [{ source = "carson-moo-2005", locator = "p. 394" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Carson and Moo point to Paul's plans to go to Jerusalem and then Rome (Acts 19:21; 20:16), to Phoebe of Cenchrea near Corinth (Romans 16:1-2), and to Gaius and Erastus (16:23), all of which fit Corinth."""
  citations = [{ source = "carson-moo-2005", locator = "p. 394" }]
  verses = [{ ref = "Rom.16.1", link = "describes", note = "Phoebe of Cenchreae, near Corinth." }, { ref = "Rom.15.19", link = "dates", note = "The eastern mission complete." }]

[[positions]]
id = "ehrman-intro-50s"
label = "Ehrman (textbook): a Pauline letter of the 50s, from Corinth"
tradition = "critical"
earliest = 50
latest = 59
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook counts Romans among the undisputed letters and says Paul wrote it from Corinth. It gives no year in the passages read, so the span of 50 to 59 shown here is the editor's reading of his "50s of the Common Era.""""
citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 267 approx." }]
