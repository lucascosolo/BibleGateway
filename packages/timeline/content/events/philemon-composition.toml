id = "philemon-composition"
title = "Composition of Philemon"
axis = "composition"
category = "composition"
confidence = "contested"
status = "sources-located"
books = ["Phlm"]
summary = """
Paul wrote this short letter from prison to Philemon, with Apphia, Archippus and the church in Philemon's house, urging him to receive back the slave Onesimus. Its authorship is not seriously disputed. Where Paul was held, and so when, is open: Raymond Brown gives about 55 from Ephesus, and 61-63 from Rome or 58-60 from Caesarea as alternatives."""
verses = [
  { ref = "Phlm.1.1", link = "describes", note = "Paul and Timothy write to Philemon and the church in his house." },
  { ref = "Phlm.1.9-Phlm.1.10", link = "describes", note = "Paul, now a prisoner, appeals on behalf of Onesimus." },
  { ref = "Phlm.1.22", link = "background", note = "Paul asks Philemon to prepare a guest room, hoping to visit." },
]

[[positions]]
id = "brown-ephesus-55"
label = "Brown: ca. 55 from Ephesus (or 58-63 from Caesarea or Rome)"
tradition = "critical"
earliest = 55
latest = 63
held_by = "Raymond E. Brown"
summary = """
Brown, a critical scholar, dates the letter by where Paul was held: "ca. 55 if from Ephesus; 58–60 if from Caesarea (unlikely); 61–63 if from Rome." On authenticity, unity and integrity he writes: "Not seriously disputed." The span of 55 to 63 shown here covers his three options, with 55 as his lead date."""
citations = [{ source = "brown-1997", locator = "ch. 21, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown argues that Ephesus deserves a hearing here as it does for Philippians, since several of the factors favouring Ephesus for Philippians are met here too: "if Ephesus was the more probable candidate there, it might be considered that here as well.""""
  citations = [{ source = "brown-1997", locator = "ch. 21, Place of writing" }]
  verses = [{ ref = "Phlm.1.9-Phlm.1.10", link = "describes", note = "Paul writes as a prisoner; where he was held bears on the date." }]

[[positions]]
id = "carson-moo-rome-early-60s"
label = "Carson and Moo: probably from Rome in the early 60s, with Colossians"
tradition = "critical"
earliest = 60
latest = 62
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo, authors of the standard evangelical introduction to the New Testament, treat the date of Philemon as bound up with that of Colossians, and hold that both were written together and sent to Colosse. They see "no reason to deny that Philemon might have been written in Rome", in the early 60s."""
citations = [{ source = "carson-moo-2005", locator = "pp. 591-592" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Carson and Moo answer the Ephesus case point by point. Onesimus could have fled to Rome to hide, and Paul's request for a guest room in Philemon 22 is not decisive, since he could reach Colosse in about five weeks from Rome."""
  citations = [{ source = "carson-moo-2005", locator = "p. 592" }]
  verses = [{ ref = "Phlm.1.22", link = "dates", note = "Paul's request for a guest room is treated as the strongest argument for Ephesus." }]

[[positions]]
id = "ehrman-intro-50s"
label = "Ehrman (textbook): a Pauline letter of the 50s, from prison"
tradition = "critical"
earliest = 50
latest = 59
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook counts Philemon among the undisputed letters, written by Paul from prison, location unknown. It gives no year, so the span of 50 to 59 shown here is the editor's reading of his "50s of the Common Era.""""
citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 250 approx." }]
