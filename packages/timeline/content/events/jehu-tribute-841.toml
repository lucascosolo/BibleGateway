id = "jehu-tribute-841"
title = "Jehu's tribute to Shalmaneser III"
axis = "narrative"
category = "political"
confidence = "firm"
status = "draft"
summary = """
Jehu, called 'son of Omri' by the Assyrians, pays tribute to Shalmaneser III about 841 BCE. The Bible does not mention the tribute."""
verses = [
  { ref = "2Kgs.9.1-2Kgs.10.36", link = "background", note = "Jehu's revolt. The tribute is not mentioned" },
  { ref = "2Kgs.10.32-2Kgs.10.33", link = "background", note = "Hazael cuts off parts of Israel's territory in his reign" },
  { ref = "Hos.1.4", link = "alludes", note = "'the house of Jehu'" },
]

[[positions]]
id = "841"
label = "841 BCE"
tradition = "chronological"
earliest = -841
latest = -841
held_by = "Edwin R. Thiele"
summary = """
Thiele's chronology agrees with the tribute of Jehu in 841. Young's tables begin Jehu's reign in 841n/841t, meaning the Nisan and Tishri counts."""
citations = [
  { source = "thiele-1983", locator = "pp. 17–18 and p. 37 (page images supplied by the user, 2026-10-07). On pp. 17–18 Thiele recounts finding that \"841 rather than 842 was the true date for the eighteenth year of Shalmaneser III\". On p. 37, Thiele: \"There are only 120 years from 841 B.C., the eighteenth year of Shalmaneser III, when the latter reported having received tribute from Jehu—usually conceded to be very early in Jehu's reign—to the accession of Sargon in 722/21, when the latter claimed to have captured Samaria.\"" },
  { source = "young-2005", locator = "p. 232; Table 1, p. 245" },
  { source = "wikipedia-mysterious-numbers", locator = "Jehu 841 in the chronology table; second-hand" },
]

[[attestations]]
artifact = "black-obelisk"
relation = "corroborates"
note = """
The inscription reads: 'I received the tribute of Iaua (Jehu) son of (the people of the land of) Omri'. It is dated in or around 841. Grayson's translation of the epigraph: "I received tribute from Jehu (Iaua) of the house of Omri (Humrî)"; he assigns it to the eighteenth regnal year, 841 BC."""
citations = [{ source = "wikipedia-black-obelisk" }, { source = "grayson-1996", locator = "p. 149, A.0.102.88 (epigraph); p. 54, A.0.102.10 iv 10–12; p. 48, A.0.102.8 lines 26\"–27\"; p. 60, A.0.102.12 lines 29–30" }]
