id = "jehu-tribute-841"
title = "Jehu's tribute to Shalmaneser III"
axis = "narrative"
category = "political"
confidence = "firm"
status = "sources-located"
summary = """
Jehu, called 'son of Omri' by the Assyrians, pays tribute to Shalmaneser III about 841 BCE. The Bible does not mention the tribute."""
verses = [
  { ref = "2Kgs.9.1-2Kgs.10.36", link = "background", note = "Kings tells the story of Jehu's revolt as background, but it does not mention the tribute dated here." },
  { ref = "2Kgs.10.32-2Kgs.10.33", link = "background", note = "Kings reports that Hazael cut off parts of Israel's territory in Jehu's reign, which gives background to the period of the tribute." },
  { ref = "Hos.1.4", link = "alludes", note = "Hosea speaks of 'the house of Jehu,' a phrase that refers to Jehu's dynasty." },
]

[[positions]]
id = "841"
label = "841 BCE"
tradition = "chronological"
earliest = -841
latest = -841
held_by = "Edwin R. Thiele"
summary = """
Thiele's chronology fits Shalmaneser's record of Jehu's tribute in 841, and Young's tables, which follow the same system, begin Jehu's reign in 841n/841t, meaning the Nisan and Tishri counts."""
citations = [
  { source = "thiele-1983", locator = "pp. 17–18 and p. 37. On pp. 17–18 Thiele recounts finding that \"841 rather than 842 was the true date for the eighteenth year of Shalmaneser III\". On p. 37 Thiele counts \"only 120 years\" from Jehu's tribute in 841 B.C., the eighteenth year of Shalmaneser III and usually conceded to be very early in Jehu's reign, to the accession of Sargon in 722/21, when Sargon claimed to have captured Samaria." },
  { source = "young-2005", locator = "p. 232; Table 1, p. 245" },
]

[[attestations]]
artifact = "black-obelisk"
relation = "corroborates"
note = """
The Black Obelisk epigraph, in Oppenheim's ANET translation, reads "The tribute of Jehu (Ia-u-a), son of Omri (Hu-um-ri)", followed by a list of silver, gold and vessels. It is dated in or around 841. Grayson's translation of the epigraph: "I received tribute from Jehu (Iaua) of the house of Omri (Humrî)"; he assigns it to the eighteenth regnal year, 841 BC."""
citations = [{ source = "pritchard-1969", locator = "p. 281 (epigraph II of the Black Obelisk), trans. A. Leo Oppenheim" }, { source = "grayson-1996", locator = "p. 149, A.0.102.88 (epigraph); p. 54, A.0.102.10 iv 10–12; p. 48, A.0.102.8 lines 26\"–27\"; p. 60, A.0.102.12 lines 29–30" }]
