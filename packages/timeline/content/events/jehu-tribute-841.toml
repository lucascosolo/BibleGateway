  { ref = "2Kgs.9.1-2Kgs.10.36", link = "background", note = "Jehu's revolt. The tribute is not mentioned" },
  { ref = "2Kgs.10.32-2Kgs.10.33", link = "background", note = "Hazael cuts off parts of Israel's territory in his reign" },
  { ref = "Hos.1.4", link = "alludes", note = "'the house of Jehu'" },
]

