id = "hebrews-composition"
title = "Composition of Hebrews"
axis = "composition"
category = "composition"
confidence = "contested"
status = "sources-located"
books = ["Heb"]
summary = """
This asks who wrote the letter to the Hebrews and when. The letter does not name its author, and the older church view that Paul wrote it is now abandoned by critical scholars. Its date is debated between the 60s, before the Temple fell, and the 80s, after it, and the writer never mentions the Temple's destruction either way."""
verses = [
  { ref = "Heb.13.24", link = "describes", note = "Hebrews 13:24 sends greetings from those from Italy, a clue to the letter's setting." },
  { ref = "Heb.13.23", link = "describes", note = "Hebrews 13:23 says Timothy has been released, a detail used to place the letter." },
  { ref = "Heb.8.13", link = "dates", note = "The first covenant is obsolete, which Brown reads as a replacement theme of the 80s." },
  { ref = "Heb.12.4", link = "background", note = "Hebrews 12:4 tells the readers they have not yet resisted to the point of shedding blood." },
]

[[positions]]
id = "brown-60s-or-80s"
label = "The 60s, or more likely the 80s"
tradition = "critical"
earliest = 60
latest = 89
held_by = "Raymond E. Brown"
summary = """
Raymond Brown dates Hebrews to the 60s or, more likely, the 80s, and he does not name an author. His summary line reads: "60s or more likely 80s." Of authorship he writes: "Author not identified; later church attribution to Paul now abandoned." The upper bound of the span is the editor's reading of "80s"."""
citations = [{ source = "brown-1997", locator = "ch. 32, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown finds the strongest support for the later date in the letter's theme: "A supporting factor for a writing date in the 80s is the strong emphasis on the replacement of the Jewish feasts, sacrifices, priesthood, and earthly place of worship""""
  citations = [{ source = "brown-1997", locator = "ch. 32, From and to whom, where, and when" }]
  verses = [{ ref = "Heb.8.7-Heb.8.13", link = "dates", note = "The old covenant is being replaced by the new." }]

[[positions]]
id = "carson-moo-before-70"
label = "Before 70 CE, after about 60"
tradition = "critical"
earliest = 60
latest = 69
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo write the standard evangelical introduction to the New Testament. They call the date hard to fix and cannot rule out any year from about 60 to 100, though they say most would insist on not before 60. They conclude that "the preponderance of evidence favors a date before 70". They give no place of writing and say a place cannot be settled even if the author were known. The bounds shown are the editor's reading."""
citations = [{ source = "carson-moo-2005", locator = "pp. 605–608" }]

  [[positions.arguments]]
  stance = "for"
  text = """
They argue that Hebrews builds its case on the old sacrifices being replaced by Christ's. They find it hard to believe the author could write this way, with no mention of their end, if the sacrifices had already stopped when the Temple fell in 70. They call this an argument from silence, but a strong one."""
  citations = [{ source = "carson-moo-2005", locator = "p. 607" }]
  verses = [{ ref = "Heb.8.13", link = "dates", note = "The old covenant is 'obsolete', with no hint that the sacrifices had ended." }]

[[positions]]
id = "ehrman-intro-final-quarter-first-century"
label = "Probably the last quarter of the first century, by an anonymous author"
tradition = "critical"
earliest = 75
latest = 100
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook says Hebrews is anonymous and that modern scholars are "unified in thinking that he did not" write it, meaning Paul. He weighs a pre-70 date, and then says the community's history "suggest a somewhat later date, possibly during the final quarter of the first century." The span of 75 to 100 is the editor's reading of "final quarter", since his summary box says only "near the end of the first century"."""
citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 310 approx." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman says present-tense talk of Temple sacrifice does not prove a date before 70, because later Jewish writers did the same and the sacrifices described come from the Old Testament, not current practice. He adds that the readers had earlier suffered persecution but were now complacent, which suggests a later date."""
  citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 310 approx." }]
  verses = [{ ref = "Heb.10.32-Heb.10.34", link = "background", note = "The readers' earlier suffering, which Ehrman reads as a past episode in the community's history." }]
