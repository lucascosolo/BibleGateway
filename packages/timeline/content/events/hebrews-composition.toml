books = ["Heb"]
summary = """
This asks who wrote the letter to the Hebrews and when. The letter does not name its author, and the older church view that Paul wrote it is now abandoned by critical scholars. Its date is debated between the 60s, before the Temple fell, and the 80s, after it; the writer never mentions the Temple's destruction either way."""
verses = [
  { ref = "Heb.13.24", link = "describes", note = "Greetings from those from Italy." },
  { ref = "Heb.13.23", link = "describes", note = "Timothy has been released." },
  { ref = "Heb.8.13", link = "dates", note = "The first covenant is obsolete, which Brown reads as a replacement theme of the 80s." },
  { ref = "Heb.12.4", link = "background", note = "Readers have not yet resisted to the point of shedding blood." },
]

