id = "jerusalem-council"
title = "The Jerusalem council"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
Apostles and elders meet in Jerusalem on whether Gentile converts must be circumcised and keep the \
law, and issue a decree. It is dated about 48–50 CE; an overwhelming majority of scholars identify \
Acts 15 with Paul's account in Galatians 2:1–10."""
verses = [
  { ref = "Acts.15.1-Acts.15.35", link = "describes", note = "the debate, Peter and James, the apostolic decree" },
  { ref = "Gal.2.1-Gal.2.10", link = "describes", note = "Paul's own account; most identify it with Acts 15" },
  { ref = "Acts.16.4", link = "alludes", note = "the decrees delivered to the churches" },
  { ref = "Acts.21.25", link = "alludes", note = "James recalls the decree for Gentile believers" },
]

