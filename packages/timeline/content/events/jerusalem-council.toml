[[positions]]
id = "brown-traditional-49"
label = "49 CE (Brown, Traditional Chronology)"
tradition = "chronological"
earliest = 49
latest = 49
held_by = "Raymond E. Brown (Traditional Chronology)"
summary = """
Brown, following the traditional chronology of Paul's career, dates the council to the year 49: "a meeting was held in Jerusalem ca. 49" (Acts 15:1-29 and Gal 2:1-10). His Table 6 lists the Jerusalem conference under that year."""
citations = [{ source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Gal 2:1 puts a Jerusalem visit fourteen years after Paul's first visit or, Brown thinks more likely, after his conversion. Brown reconciles this with a Jerusalem meeting ca. 49 after the first missionary journey."""
  citations = [{ source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" }]
  verses = [
    { ref = "Gal.2.1", link = "dates" },
    { ref = "Acts.15.1-Acts.15.29", link = "dates" },
  ]

[[positions]]
id = "brown-revisionist-46-52"
label = "46-52 CE (Revisionist chronology, per Brown)"
tradition = "critical"
earliest = 46
latest = 52
held_by = "Revisionist chronology (Knox, Lüdemann, Jewett, Murphy-O'Connor, Donfried, as summarized by Brown)"
summary = """
Brown's Table 6 gives the Revisionist conference as 47/51. Individual dates: Buck/Taylor 46-47, Lüdemann 47 (50), Donfried ca. 50, Knox 51, Jewett Oct. 51, Murphy-O'Connor 51-52. Brown himself follows the Traditional column "because it seems more reasonable to me"."""
citations = [{ source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Brown notes Lüdemann places the Antioch confrontation of Paul and Peter before the conference, and Jewett after it. The scholars also differ on when Paul first reached Corinth relative to the conference."""
  citations = [{ source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" }]
  verses = [
    { ref = "Gal.2.1", link = "dates" },
    { ref = "Acts.15.1-Acts.15.29", link = "dates" },
  ]
