id = "jerusalem-council"
title = "The Jerusalem council"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
Apostles and elders meet in Jerusalem to decide whether non-Jewish converts must be circumcised and keep the Jewish law. They issue a decree. It is dated to about 48-50 CE. An overwhelming majority of scholars identify Acts 15 with Paul's own account in Galatians 2:1-10."""
verses = [
  { ref = "Acts.15.1-Acts.15.35", link = "describes", note = "The debate, Peter and James, and the apostles' decree" },
  { ref = "Gal.2.1-Gal.2.10", link = "describes", note = "Paul's own account. Most scholars identify it with Acts 15" },
  { ref = "Acts.16.4", link = "alludes", note = "The decrees are delivered to the churches" },
  { ref = "Acts.21.25", link = "alludes", note = "James recalls the decree for non-Jewish believers" },
]

