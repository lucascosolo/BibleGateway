id = "sennacherib-campaign-judah"
title = "Sennacherib's campaign against Judah"
axis = "narrative"
category = "political"
confidence = "firm"
status = "sources-located"
summary = """
On his third military campaign, the Assyrian king Sennacherib took the walled cities of Judah, besieged Lachish, and faced King Hezekiah at Jerusalem. It is one of the best-confirmed events in the Hebrew Bible. Assyria's own records and the carved palace walls at Nineveh describe it from the Assyrian side."""
verses = [
  { ref = "2Kgs.18.13-2Kgs.19.37", link = "describes" },
  { ref = "Isa.36.1-Isa.37.38", link = "describes" },
  { ref = "2Chr.32.1-2Chr.32.23", link = "describes" },
  { ref = "2Kgs.18.13", link = "dates", note = "Kings places Sennacherib's attack in Hezekiah's fourteenth year, which is the date linked here." },
]

[[positions]]
id = "consensus"
label = "701 BCE"
tradition = "chronological"
earliest = -701
latest = -701
summary = """
The Assyrian records date the campaign to 701 BCE. Kitchen and Galil both take 701 as a fixed point."""
citations = [{ source = "kitchen-2003", locator = "pp. 40–42 (Sennacherib's campaign)" }, { source = "galil-1996", locator = "p. 98" }, { source = "thiele-1983", locator = "Preface to the Third Edition, pp. 23–24: \"The year 701, when Sennacherib came against Jerusalem in the fourteenth year of Hezekiah, is a major anchor point in my pattern.\"" }]

[[attestations]]
artifact = "sennacherib-taylor-prism"
relation = "in-tension"
note = """
Sennacherib's own account says he took 46 walled cities of Judah and shut Hezekiah up in Jerusalem "like a bird in a cage". It claims payment from Hezekiah but not the capture of the city, as in 2 Kings 18:13–16. But it gives the payment as 30 talents of gold and 800 talents of silver, sent later to Nineveh, where 2 Kings 18:14 has 30 talents of gold and 300 of silver."""
citations = [
  { source = "pritchard-1969", locator = "p. 288, trans. A. Leo Oppenheim (Oriental Institute Prism)" },
  { source = "luckenbill-arab-2", locator = "§ 240 (Taylor Prism: 46 walled cities, 'caged bird', 30 talents of gold and 800 of silver)" },
]

[[attestations]]
artifact = "lachish-reliefs"
relation = "corroborates"
note = """
These carvings show the siege and fall of Lachish. 2 Kings 18:14 and 18:17 place Sennacherib there during the campaign."""
citations = [{ source = "pritchard-1969", locator = "p. 288 (epigraph on the relief of the conquest of Lachish), trans. A. Leo Oppenheim" }, { source = "luckenbill-arab-2", locator = "§ 489 (epigraph: Sennacherib at Lachish)" }, { source = "finkelstein-silberman-2002", locator = "p. 261" }, { source = "kitchen-2003", locator = "p. 42" }]

[[positions]]
id = "galil-701-year-25"
label = "701 BCE, Hezekiah's twenty-fifth year"
tradition = "critical"
earliest = -701
latest = -701
held_by = "Gershon Galil"
summary = """
Galil accepts 701 from the Assyrian records but holds that the "fourteenth year of Hezekiah" in 2 Kings 18:13 is not an original date. In his view the editor of Kings, who knew Hezekiah reigned twenty-nine years and that "in those days" he was granted fifteen more years of life (2 Kings 20:1-6), subtracted and assigned the campaign to year fourteen. On Galil's count Hezekiah was crowned in 726, so 701 was his twenty-fifth year, "ca. 4 years before he died"."""
citations = [{ source = "galil-1996", locator = "pp. 102–104" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Galil lists the proposals for the "fourteenth year" (a corruption of 24; a reference to Sargon's campaign of 713–712; a new count from a reform in 715; a derived figure) and concludes that "the third campaign of Sennacherib most likely was not conducted in year 14 of Hezekiah". The date, he argues, "is not original" but the redactor's calculation."""
  citations = [{ source = "galil-1996", locator = "pp. 102–103" }]
  verses = [
    { ref = "2Kgs.18.13", link = "dates", note = "Kings dates the invasion to the fourteenth year of Hezekiah." },
    { ref = "2Kgs.20.1-2Kgs.20.6", link = "background", note = "Kings says fifteen years were added to Hezekiah's life, which gives background to the dating." },
    { ref = "2Kgs.18.2", link = "dates", note = "Kings gives Hezekiah's reign as twenty-nine years, a figure used in the dating." },
  ]
