id = "herod-reign-temple"
title = "Herod the Great: reign and the rebuilding of the temple"
axis = "narrative"
category = "political"
confidence = "contested"
status = "sources-located"
summary = """
On the usual count, Herod reigns from 37 BCE until his death in 4 BCE. In his eighteenth year (20-19 BCE) he sets out to rebuild the temple, and John 2:20 says the work had taken forty-six years, so it was still going."""
verses = [
  { ref = "Matt.2.1", link = "alludes", note = "Matthew 2:1 says Jesus is born in the days of King Herod." },
  { ref = "Luke.1.5", link = "alludes", note = "Luke 1:5 places its story in the days of Herod, king of Judea." },
  { ref = "John.2.20", link = "alludes", note = "John 2:20 says it took forty-six years to build this temple, a number used to date Herod's temple work." },
]

[[positions]]
id = "schurer-37-4"
label = "37-4 BCE"
tradition = "chronological"
earliest = -37
latest = -4
held_by = "John P. Meier; Raymond E. Brown"
summary = """
Meier gives Herod's reign as 37-4 BCE and rejects the proposals for a death in 1 BCE, since his successors counted their reigns from 5-4 BCE. Brown dates Herod's kingship from 37 BC and his death to about 4 BC."""
citations = [
  { source = "meier-1991", locator = "p. 375; p. 414 n. 18" },
  { source = "brown-1997", locator = "ch. 4, What Preceded the 1st Century AD (63–4 BC: Roman Dominance, Herod the Great, Augustus); ch. 4, The First Third of the 1st Century AD" },
]

[[positions]]
id = "temple-20-19"
label = "Temple begun c. 20/19 BCE (Josephus, eighteenth year)"
tradition = "chronological"
earliest = -20
latest = -19
summary = """
Josephus dates the start of the rebuilding to Herod's eighteenth year, 20-19 BCE. The cloisters and outer enclosures took eight years, and the temple itself was built by the priests in a year and six months."""
citations = [
  { source = "josephus-whiston", locator = "Antiquities 15.11.1; 15.11.5–6" },
]

[[attestations]]
artifact = "josephus-antiquities-15-380"
relation = "corroborates"
note = """
Josephus places the start of the rebuilding in the eighteenth year of Herod's reign, which agrees with the 20-19 BCE start."""
citations = [{ source = "josephus-whiston", locator = "Antiquities 15.11.1" }]
