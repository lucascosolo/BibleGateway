id = "herod-reign-temple"
title = "Herod the Great: reign and the rebuilding of the temple"
axis = "narrative"
category = "political"
confidence = "contested"
status = "draft"
summary = """
On the older count, Herod reigns from 37 BCE until his death in 4 BCE, whereas on Steinmann's count he reigns from 36 to 1 BCE. In his eighteenth year (20-19 BCE) he sets out to rebuild the temple, and John 2:20 says the work had taken forty-six years, so it was still going."""
verses = [
  { ref = "Matt.2.1", link = "alludes", note = "Matthew 2:1 says Jesus is born in the days of King Herod." },
  { ref = "Luke.1.5", link = "alludes", note = "Luke 1:5 places its story in the days of Herod, king of Judea." },
  { ref = "John.2.20", link = "alludes", note = "John 2:20 says it took forty-six years to build this temple, a number used to date Herod's temple work." },
]

[[positions]]
id = "schurer-37-4"
label = "37-4 BCE (Schurer)"
tradition = "chronological"
earliest = -37
latest = -4
held_by = "Emil Schürer"
summary = """
Most 20th-century scholarship followed Emil Schürer's 1896 chronology, which put Herod's death in 4 BCE and so his reign at 37-4 BCE."""
citations = [{ source = "wikipedia-herod-the-great", locator = "section on the dates of his reign" }]

[[positions]]
id = "steinmann-36-1"
label = "36-1 BCE (Steinmann)"
tradition = "chronological"
earliest = -36
latest = -1
held_by = "Steinmann"
summary = """
Wikipedia gives Steinmann's chronology of the reign as 36-1 BCE, a later death than the older count allows. The page read does not show his first name."""
citations = [{ source = "wikipedia-herod-the-great", locator = "section on the dates of his reign" }]

[[positions]]
id = "temple-20-19"
label = "Temple begun c. 20/19 BCE (Josephus, eighteenth year)"
tradition = "chronological"
earliest = -20
latest = -19
summary = """
Josephus dates the start of the rebuilding to Herod's eighteenth year, 20-19 BCE. Building the Temple itself took about a year and a half, and the porches and outer walls took another eight years."""
citations = [
  { source = "lexundria-josephus-ant-15-380" },
  { source = "wikipedia-herods-temple" },
  { source = "wikipedia-herod-the-great" },
]

[[positions]]
