label = "Enclosures from 25 BCE, temple building 19 BCE (Mahieu)"
tradition = "archaeological"
earliest = -25
latest = -19
held_by = "Bieke Mahieu"
summary = """
Bieke Mahieu dates work on the Temple enclosures from 25 BCE and work on the Temple building itself to 19 BCE."""
