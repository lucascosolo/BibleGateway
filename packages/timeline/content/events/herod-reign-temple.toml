id = "herod-reign-temple"
title = "Herod the Great: reign and the rebuilding of the temple"
axis = "narrative"
category = "political"
confidence = "contested"
status = "draft"
summary = """
Herod reigns from 37 BCE to his death in 4 BCE on the older reckoning (36-1 BCE on Steinmann's). In his eighteenth year (20-19 BCE) he undertakes to rebuild the temple, work still running when John 2:20 says it had taken forty-six years."""
verses = [
  { ref = "Matt.2.1", link = "alludes", note = "Jesus born in the days of King Herod" },
  { ref = "Luke.1.5", link = "alludes", note = "In the days of Herod, king of Judea" },
  { ref = "John.2.20", link = "alludes", note = "Forty-six years to build this temple" },
]

[[positions]]
