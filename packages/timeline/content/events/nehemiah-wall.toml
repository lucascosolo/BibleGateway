summary = """
Finkelstein and Silberman put Nehemiah's night inspection of Jerusalem around 445 BCE (a line read from the chapter; the surrounding page was not read in full). They present him as the Persian king's cupbearer.
"""
citations = [{ source = "finkelstein-silberman-2002", locator = "p. 301" }]
