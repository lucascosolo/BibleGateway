id = "nehemiah-wall"
title = "Nehemiah rebuilds the wall of Jerusalem"
axis = "narrative"
category = "political"
confidence = "contested"
status = "draft"
summary = """
In the twentieth year of King Artaxerxes (445 or 444 BCE), Nehemiah, the king's cupbearer, is sent to Jerusalem. The wall is finished in fifty-two days, despite opposition from Sanballat the Horonite. Letters found at Elephantine in Egypt, from 407 BCE, name Sanballat's sons and the high priest Johanan. That ties the Nehemiah story to a world we can check outside the Bible."""
verses = [
  { ref = "Neh.2.1", link = "describes", note = "Nehemiah dates his request to the month of Nisan, in the twentieth year of Artaxerxes." },
  { ref = "Neh.2.10", link = "describes", note = "Nehemiah reports that Sanballat the Horonite and Tobiah are upset, which describes the opposition to the project." },
  { ref = "Neh.6.15", link = "describes", note = "Nehemiah reports that the wall is finished in fifty-two days." },
  { ref = "Neh.13.28", link = "alludes", note = "Nehemiah notes that a son of Joiada is son-in-law to Sanballat, which refers back to the opponent met in this story." },
]

[[positions]]
id = "445-444"
label = "445 or 444 BCE (Artaxerxes I, twentieth year)"
tradition = "chronological"
earliest = -445
latest = -444
summary = """
Artaxerxes I ruled from August 465 to December 424 BCE. His twentieth year is therefore 445 or 444 BCE, and the wall went up within 52 days. Wikipedia's Nehemiah article points to p. 140 of the Westminster John Knox Ezra-Nehemiah commentary (1988) for this date. That page was not read, and the article does not show the author's name. Thiele reads Nehemiah 1:1 and 2:1 as counting Artaxerxes' years from Tishri: Kislev fell in the twentieth year and the following Nisan "was still in the same twentieth year", which Persia's own Nisan reckoning would not allow. He notes the double-dated Aramaic papyri from Elephantine also date Persian kings by Judean Tishri years (Horn and Wood, JNES 13, 1954)."""
citations = [
  { source = "wikipedia-nehemiah", locator = "n. 5" },
  { source = "ezra-nehemiah-commentary-1988", locator = "p. 140, as cited by Wikipedia 'Nehemiah' n. 5" },
  { source = "wikipedia-artaxerxes-i" },
  { source = "thiele-1983", locator = "p. 53" },
]

[[attestations]]
artifact = "elephantine-temple-petition-407"
relation = "partially-corroborates"
note = """
A letter of 407 BCE names Sanballat's sons Delaiah and Shelemiah, and Johanan the high priest. Sanballat and Johanan both appear in Nehemiah. But this does not date the wall."""
citations = [{ source = "wikipedia-elephantine-papyri" }, { source = "wikipedia-sanballat" }]

