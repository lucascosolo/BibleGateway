id = "nehemiah-wall"
title = "Nehemiah rebuilds the wall of Jerusalem"
axis = "narrative"
category = "political"
confidence = "contested"
status = "sources-located"
summary = """
In the twentieth year of King Artaxerxes (445 or 444 BCE), Nehemiah, the king's cupbearer, is sent to Jerusalem. The wall is finished in fifty-two days, despite opposition from Sanballat the Horonite. Letters found at Elephantine in Egypt, from 407 BCE, name Sanballat's sons and the high priest Johanan. That ties the Nehemiah story to a world we can check outside the Bible."""
verses = [
  { ref = "Neh.2.1", link = "describes", note = "Nehemiah dates his request to the month of Nisan, in the twentieth year of Artaxerxes." },
  { ref = "Neh.2.10", link = "describes", note = "Nehemiah reports that Sanballat the Horonite and Tobiah are upset, which describes the opposition to the project." },
  { ref = "Neh.6.15", link = "describes", note = "Nehemiah reports that the wall is finished in fifty-two days." },
  { ref = "Neh.13.28", link = "alludes", note = "Nehemiah notes that a son of Joiada is son-in-law to Sanballat, which refers back to the opponent met in this story." },
]

[[positions]]
id = "445-444"
label = "445 or 444 BCE (Artaxerxes I, twentieth year)"
tradition = "chronological"
earliest = -445
latest = -444
summary = """
Artaxerxes I ruled 465-424 BCE (Kitchen, p. 73). His twentieth year is therefore 445 or 444 BCE, and the wall went up within 52 days. Kitchen dates Nehemiah's Years 20-32 of Artaxerxes I to 445-433 (p. 74); the alternative 444 is the editor's count from the accession year, not a figure on a page read. Josephus has Nehemiah come in the twenty-fifth year of "Xerxes" (Antiquities 11.5.6-7). Thiele reads Nehemiah 1:1 and 2:1 as counting Artaxerxes' years from Tishri: Kislev fell in the twentieth year and the following Nisan "was still in the same twentieth year", which Persia's own Nisan reckoning would not allow. He notes the double-dated Aramaic papyri from Elephantine also date Persian kings by Judean Tishri years (Horn and Wood, JNES 13, 1954)."""
citations = [
  { source = "kitchen-2003", locator = "p. 73 (Artaxerxes I, 465-424)" },
  { source = "josephus-whiston", locator = "Antiquities 11.5.6-7" },
  { source = "kitchen-2003", locator = "p. 74" },
  { source = "thiele-1983", locator = "p. 53 (Kislev and Nisan in the same twentieth year; no year numbers)" },
]

[[attestations]]
artifact = "elephantine-temple-petition-407"
relation = "partially-corroborates"
note = """
A letter of 407 BCE appeals to Sanballat, governor of Samaria, and the Elephantine Jews had earlier appealed to Johanan, who is named with the governor of Judea (Kitchen). Sanballat and Johanan both appear in Nehemiah. But this does not date the wall."""
citations = [{ source = "kitchen-2003", locator = "p. 74 (Sanballat, Year 17 of Darius II, 407); p. 77 (appeal after the temple's destruction in 410)" }, { source = "satlow-2014", locator = "pp. 86-87" }]

