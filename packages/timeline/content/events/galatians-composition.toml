id = "galatians-composition"
title = "Composition of Galatians"
axis = "composition"
category = "composition"
confidence = "firm"
status = "draft"
books = ["Gal"]
summary = """
Paul wrote Galatians in anger to churches in Galatia that had been won over to a different gospel. Raymond Brown thinks it more likely written from Ephesus in 54-55 than from Macedonia in 57, with the letter going to churches near Ancyra in north-central Asia Minor. Its authenticity, unity and integrity are not seriously disputed."""
verses = [
  { ref = "Gal.1.1", link = "describes", note = "Paul names himself as the sender." },
  { ref = "Gal.1.6", link = "describes", note = "Paul is astonished that the Galatians so quickly turned to another gospel." },
  { ref = "Gal.1.18-Gal.2.1", link = "dates", note = "The three and fourteen years that anchor Paul's career and so the date of the letter." },
]

