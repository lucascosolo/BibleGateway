id = "galatians-composition"
title = "Composition of Galatians"
axis = "composition"
category = "composition"
confidence = "firm"
status = "sources-located"
books = ["Gal"]
summary = """
Paul wrote Galatians in anger to churches in Galatia that had been won over to a different gospel. Raymond Brown thinks it more likely written from Ephesus in 54-55 than from Macedonia in 57, with the letter going to churches near Ancyra in north-central Asia Minor. Its authenticity, unity and integrity are not seriously disputed."""
verses = [
  { ref = "Gal.1.1", link = "describes", note = "Paul names himself as the sender." },
  { ref = "Gal.1.6", link = "describes", note = "Paul is astonished that the Galatians so quickly turned to another gospel." },
  { ref = "Gal.1.18-Gal.2.1", link = "dates", note = "The three and fourteen years that anchor Paul's career and so the date of the letter." },
]

[[positions]]
id = "brown-ephesus-54-55"
label = "Brown: from Ephesus in 54-55, more likely than 57"
tradition = "critical"
earliest = 54
latest = 55
held_by = "Raymond E. Brown"
summary = """
Raymond Brown prefers 54-55 from Ephesus to 57 from Macedonia, and he treats the letter's authenticity, unity and integrity as settled. His summary line reads: "54–55 from Ephesus is more likely than 57 from Macedonia (Traditional Chronology; see Table 6 in Chapter 16 above for Revisionist Chronology)." On authenticity, unity and integrity he writes: "Not seriously disputed.""""
citations = [{ source = "brown-1997", locator = "ch. 19, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown reasons from the North Galatian theory. Paul "went to Ephesus (Acts 19:1) where he stayed three years (54–56). Word could have reached him that teachers had come and “quickly” (Gal 1:6) won over the Galatians to “another gospel”", prompting the angry writing of Gal in 54 or 55."""
  citations = [{ source = "brown-1997", locator = "ch. 19, Dating" }]
  verses = [{ ref = "Gal.1.6", link = "describes", note = "Galatians 1:6 says the Galatians were quickly won over to another gospel." }]

[[positions]]
id = "carson-moo-before-council-48"
label = "Carson and Moo: just before the Jerusalem Council, about A.D. 48"
tradition = "critical"
earliest = 48
latest = 48
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo, authors of the standard evangelical introduction to the New Testament, hold that Paul wrote Galatians, preferring the South Galatian theory and an early date. They conclude that "Paul wrote Galatians just prior to the Jerusalem Council", and if the council is rightly dated 48 CE, that is the date of the letter."""
citations = [{ source = "carson-moo-2005", locator = "pp. 462-464" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Carson and Moo link the Jerusalem visit of Galatians 2:1-10 with the famine visit of Acts 11:25-30, not Acts 15. Paul gives what looks like a complete list of his visits and never mentions the council's decree, so the letter is most probably earlier than the council."""
  citations = [{ source = "carson-moo-2005", locator = "pp. 463-464" }]
  verses = [{ ref = "Gal.2.1", link = "dates", note = "Galatians 2:1 describes Paul's second Jerusalem visit, which this argument reads as the famine visit of Acts 11." }]

[[positions]]
id = "ehrman-intro-50s"
label = "Ehrman (textbook): a Pauline letter of the 50s"
tradition = "critical"
earliest = 50
latest = 59
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook counts Galatians among the seven undisputed letters, which "virtually all scholars agree were written by Paul himself," situated in the 40s and 50s. He gives no single year, so the span shown, 50 to 59, is the editor's reading of "the 50s.""""
citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 188 approx." }]
