id = "sinai-covenant"
title = "The Sinai covenant and the giving of the law"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "claims-checked"
summary = """
Three months after leaving Egypt, Israel stands at Mount Sinai and enters a covenant, a binding agreement, with God. It includes the Ten Commandments, the Book of the Covenant (a set of laws), the plans for the tabernacle (the portable sanctuary), and the sealing of the agreement. Its date follows the date of the exodus. Scholars dispute whether the form of the covenant can itself be dated (see the linked issue)."""
verses = [
  { ref = "Exod.19.1-Exod.19.25", link = "describes", note = "Exodus describes the arrival at Sinai in the third month, where God appears on the mountain." },
  { ref = "Exod.20.1-Exod.20.21", link = "describes", note = "Exodus gives the Ten Commandments at Sinai." },
  { ref = "Exod.21.1-Exod.23.33", link = "describes", note = "Exodus sets out the Book of the Covenant, a set of laws." },
  { ref = "Exod.24.1-Exod.24.18", link = "describes", note = "Exodus tells how the covenant is sealed and Moses goes up the mountain." },
  { ref = "Exod.31.18", link = "describes", note = "Exodus speaks of the two stone tablets." },
  { ref = "Exod.32.1-Exod.34.35", link = "describes", note = "Exodus tells of the golden calf and of the tablets made again." },
  { ref = "Deut.5.1-Deut.5.22", link = "alludes", note = "Moses recalls the covenant at Horeb and the Ten Commandments, which refers back to Sinai." },
  { ref = "Neh.9.13-Neh.9.14", link = "alludes", note = "Nehemiah's prayer says God came down on Mount Sinai and gave right rules and the Sabbath, which refers back to the covenant." },
  { ref = "Ps.68.7-Ps.68.8", link = "alludes", note = "Psalm 68 says the earth shook at God's presence, and Sinai itself before God, which alludes to the Sinai scene." },
  { ref = "Acts.7.37-Acts.7.44", link = "alludes", note = "Stephen says Moses received living words at Sinai, which refers back to the covenant." },
  { ref = "Gal.3.17-Gal.3.19", link = "alludes", note = "Paul says the law came 430 years after the promise to Abraham, a number used to date the covenant." },
  { ref = "Heb.12.18-Heb.12.21", link = "alludes", note = "Hebrews says 'You have not come to a mountain that can be touched,' which alludes to the scene at Sinai." },
]

[[positions]]
id = "early"
label = "With a 15th-century exodus (c. 1446 BCE)"
tradition = "traditional"
earliest = -1450
latest = -1440
held_by = "Bryant G. Wood"
summary = """
The scholar Bryant G. Wood dates the exodus to about 1446 BC. Exodus 19:1 puts Sinai in the third month after leaving Egypt, so the covenant falls in the same year."""
citations = [{ source = "wood-2005", locator = "p. 477" }]

[[positions]]
id = "late"
label = "With a 13th-century exodus (c. 1260/1250 BCE)"
tradition = "chronological"
earliest = -1260
latest = -1250
held_by = "K. A. Kitchen"
summary = """
The scholar K. A. Kitchen dates the exodus to about 1260/1250 BC (Kitchen p. 307; Wood reports 1260), early in the reign of Rameses II. Sinai follows within months. Kitchen also argues that the covenant texts match the form of Hittite treaties from about 1400 to 1200 BC."""
citations = [{ source = "wood-2005", locator = "pp. 478–479" }, { source = "kitchen-2003", locator = "p. 307 (exodus about 1260/1250, minimum)" }]

[[positions]]
id = "ussher-1491"
label = "Ussher, Annals: Israel at Sinai, 1491 BC"
tradition = "traditional"
earliest = -1491
latest = -1491
held_by = "James Ussher"
summary = """
The chronologist James Ussher dates the exodus to 2513 AM (year of the world), which is 1491 BC. He puts the arrival at Sinai on the third day of the third month of that first year."""
citations = [{ source = "ussher-annals", locator = "1658 printing, pp. 13-15 (Year of the World 2513; Sinai on the third day of the third month)" }]
