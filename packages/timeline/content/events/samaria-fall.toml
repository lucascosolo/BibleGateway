[[positions]]
id = "723"
label = "723 BCE (first half)"
tradition = "chronological"
earliest = -723
latest = -723
held_by = "Edwin R. Thiele; Rodger C. Young"
summary = """
Samaria fell before Tishri 1, 723, which is over fifteen months before Sargon became king in Tebeth 722n. Thiele held the same year first: he writes of "my date of 853 for the battle of Qarqar and 723 for Samaria's fall", noting that "the accepted date for the fall of Samaria was 722, a year later than my date". He places "the accession of Sargon in 722/21, when the latter claimed to have captured Samaria". His final pattern gives "the date 723/22 for the last year of Hoshea and Samaria's fall"."""
citations = [{ source = "thiele-1984", locator = "p. 5, table 'Reigns of the Hebrew kings' (open-access popular restatement of his dates)" }, { source = "thiele-1983", locator = "pp. 17–18, Preface to the Third Edition pp. 23–24, and p. 37 (page images supplied by the user, 2026-10-07)" }, { source = "young-2004-samaria", locator = "p. 583" }, { source = "young-2005", locator = "Table 1, p. 245" }]

[[attestations]]
artifact = "sargon-ii-inscriptions"
relation = "partially-corroborates"
note = "Sargon claims the conquest and says he resettled 27,280 Israelites. Scholars doubt that the capture was really his."
citations = [{ source = "wikipedia-sargon-ii" }]

[[positions]]
id = "fs-720"
label = "720 BCE; Judah then grows"
tradition = "archaeological"
earliest = -720
latest = -720
held_by = "Israel Finkelstein and Neil Asher Silberman"
summary = """
Finkelstein and Silberman date the conquest of Samaria to 720 BCE. After it, they say, Jerusalem grew from about ten or twelve acres to about 150 acres and from about one thousand to fifteen thousand people within a generation, helped by refugees from Israel.
"""
citations = [{ source = "finkelstein-silberman-2002", locator = "p. 243" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  The expansion of Jerusalem across the western hill at the end of the eighth century BCE is their evidence that Judah came of age only after Israel fell.
"""
  citations = [{ source = "finkelstein-silberman-2002", locator = "p. 243" }]
  verses = [{ ref = "2Kgs.17.6", link = "describes" }]

[[positions]]
id = "galil-720"
label = "720 BCE, Hezekiah's sixth year"
tradition = "critical"
earliest = -720
latest = -720
held_by = "Gershon Galil"
summary = """
Galil keeps the Bible's synchronism that Samaria fell in Hezekiah's sixth year (2 Kings 18:10) but dates that year to 720. He has Hezekiah crowned in 726, the last siege beginning in his fourth year (722) and the city falling in 720. He reaches this by treating the "fourteenth year" of 2 Kings 18:13 as a later editor's calculation rather than a record, which frees Hezekiah's accession from 715. On the state of the evidence generally he writes that "only a limited number of dates can be determined with any degree of confidence", and that his system reconciles about ninety percent of the biblical and external data."""
citations = [{ source = "galil-1996", locator = "pp. 8–9; pp. 98–104, the dates on p. 104" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Putting Hezekiah's accession in 715 contradicts seven chronological data, Galil argues, among them Ahaz's sixteen years, the tribute of Ahaz to Tiglath-pileser III in 734, the synchronisms with Hoshea, and "the tradition that Samaria was conquered during the reign of Hezekiah"."""
  citations = [{ source = "galil-1996", locator = "pp. 100–101" }]
  verses = [
    { ref = "2Kgs.18.1", link = "dates", note = "Hezekiah begins to reign in Hoshea's third year" },
    { ref = "2Kgs.18.9-2Kgs.18.10", link = "dates", note = "The siege in his fourth year, the fall in his sixth" },
    { ref = "2Kgs.17.1", link = "dates", note = "Hoshea in the twelfth year of Ahaz" },
  ]
