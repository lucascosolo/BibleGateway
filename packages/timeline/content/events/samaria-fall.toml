summary = """
Finkelstein and Silberman date the conquest of Samaria to 720 BCE. After it, they say, Jerusalem grew from about ten or twelve acres to about 150 acres and from about one thousand to fifteen thousand people within a generation, helped by refugees from Israel.
"""
