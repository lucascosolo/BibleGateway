id = "jerusalem-fall"
title = "The fall of Jerusalem and the destruction of the First Temple"
axis = "narrative"
category = "political"
confidence = "contested"
status = "draft"
summary = """
Babylon breaks through Jerusalem's walls after a long siege, burns the temple and deports much of the population. Scholars agree on the order of events. They differ by one year on the date, 587 or 586 BCE. The Bible gives the dates in the years of each king's reign, and the rules for counting those years are themselves debated."""
verses = [
  { ref = "2Kgs.25.1-2Kgs.25.21", link = "describes" },
  { ref = "Jer.52.12", link = "dates", note = "Jeremiah 52 dates the events in Jerusalem to Nebuchadnezzar's nineteenth year, which supplies a regnal date used for the fall." },
  { ref = "Jer.52.29", link = "background", note = "Jeremiah 52 reports a deportation in the eighteenth year, which gives background for dating the fall." },
]

[[positions]]
id = "586"
label = "586 BCE"
tradition = "chronological"
earliest = -586
latest = -586
held_by = "Edwin R. Thiele"
summary = """
Thiele dates the destruction to 586 BCE, counting from Nebuchadnezzar's nineteenth year. His Chart 31 reads: "586—19 July—Jerusalem taken on 4/9/11—2 Kings 25:2–3" and "586—15 Aug.—19th of Nebuchadnezzar—temple burned on 5/7/19—2 Kings 25:8–9", with the siege begun "588—15 Jan." (2 Kings 25:1). Young records that Thiele "was among those preferring 586"."""
citations = [
  { source = "thiele-1983", locator = "p. 184, Chart 31; the season discussed from p. 186" },
  { source = "young-2004", locator = "p. 21" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
  2 Kings 25:8 and Jeremiah 52:12 date the burning of the temple to Nebuchadnezzar's nineteenth year."""
  citations = [{ source = "thiele-1983" }]
  verses = [
    { ref = "2Kgs.25.8", link = "dates" },
    { ref = "Jer.52.12", link = "dates" },
  ]

[[positions]]
id = "587"
label = "587 BCE"
tradition = "chronological"
earliest = -587
latest = -587
held_by = "Rodger C. Young"
summary = """
This position is Rodger C. Young's. He dates the breach of the walls of Jerusalem to the summer month of Tammuz in 587 BCE."""
citations = [{ source = "young-2004", locator = "pp. 21–38; the conclusion at p. 27" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Young lines up the Judean reign data (Zedekiah's eleventh year, 2 Kings 25:2) with the Babylonian way of counting. That places the breach in Tammuz 587 BCE."""
  citations = [{ source = "young-2004" }]
  verses = [{ ref = "2Kgs.25.2", link = "dates" }]

[[attestations]]
artifact = "lachish-letters"
relation = "consistent"
note = """
The letters were written in Judah's last years before the conquest. In Letter 4, an officer can still see the signals of Lachish but no longer those of Azekah. Jeremiah 34:7 describes the same situation, with those two as the last fortified cities holding out. The letters do not date the fall itself."""
citations = [{ source = "wikipedia-lachish-letters" }]

[[attestations]]
artifact = "babylonian-chronicle-abc5"
relation = "silent"
note = """
This chronicle (ABC 5) ends with Nebuchadnezzar's eleventh year (594 BCE), so it does not reach the fall of the city. It gives the earlier capture of 597 BCE instead."""
citations = [{ source = "livius-abc5" }]

[[positions]]
id = "fs-586"
label = "586 BCE; Judah not left empty"
tradition = "archaeological"
earliest = -586
latest = -586
held_by = "Israel Finkelstein and Neil Asher Silberman"
summary = """
Finkelstein and Silberman date the destruction of Jerusalem to 586 BCE. They say excavations show the city was systematically destroyed, but that life went on north and south of it.
"""
citations = [{ source = "finkelstein-silberman-2002", locator = "p. 307" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  The burned City of David was reoccupied in the Persian period. Tell en-Nasbeh (Mizpah) was not destroyed, so Judah was not "in total ruin and uninhabited".
"""
  citations = [{ source = "finkelstein-silberman-2002", locator = "p. 307" }]
  verses = [{ ref = "2Kgs.25.8-2Kgs.25.10", link = "describes" }]
