id = "matthew-composition"
title = "Composition of the Gospel of Matthew"
axis = "composition"
category = "composition"
confidence = "contested"
status = "draft"
books = ["Matt"]
summary = """
This asks who wrote the Gospel of Matthew and when. It was written after Mark, which it draws on, and most critical scholars date it to the 80s or 90s, after the destruction of the Temple in 70 CE. The church tradition that the tax-collector Matthew wrote it is not accepted by most critical scholars, and the exact date is not settled."""
verses = [
  { ref = "Matt.22.7", link = "dates", note = "The king burns the murderers' city, which may reflect the destruction of Jerusalem." },
  { ref = "Matt.23.36", link = "dates", note = "'All these things will come upon this generation', seen as fulfilled in 70 CE." },
  { ref = "Matt.1.1", link = "describes", note = "The opening of the Gospel." },
]

[[positions]]
id = "brown-80-90"
label = "80 to 90 CE, give or take a decade"
tradition = "critical"
earliest = 70
latest = 100
held_by = "Raymond E. Brown"
summary = """
Brown, a critical scholar, gives his dating in one line: "80–90, give or take a decade." He says the author was a Greek-speaker, probably a Jewish Christian, who was not an eyewitness of Jesus' ministry and drew on Mark and Q. The span of 70 to 100 shown here is the editor's, from "give or take a decade"."""
citations = [{ source = "brown-1997", locator = "ch. 8, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown's main argument is that Matthew depends on Mark: "Probably the best argument for a post-70 date is the dependence of Matt on Mark, a Gospel commonly dated to the 68–73 period." He adds that the king burning the city in 22:7 may reflect the destruction of Jerusalem in AD 70."""
  citations = [{ source = "brown-1997", locator = "ch. 8, Date of Writing" }]
  verses = [{ ref = "Matt.22.7", link = "dates", note = "The king burns the city." }]

[[positions]]
id = "carson-moo-before-70"
label = "Before 70 CE, but not long before; probably Syria"
tradition = "critical"
earliest = 60
latest = 69
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo write the standard evangelical introduction to the New Testament, and they argue against the usual 80-100 CE dating. They place the Gospel in Syria, perhaps Antioch, without certainty. They tie the date to authorship: if the apostle Matthew is the evangelist, a date before 70 is more plausible. Their conclusion is that "Matthew was published before 70, but not long before". The year span shown here is the editor's reading of their dates."""
citations = [{ source = "carson-moo-2005", locator = "pp. 152–156" }]

  [[positions.arguments]]
  stance = "for"
  text = """
They say the burning of the city in Matthew 22:7 is the standard language for a punished rebel city, not knowledge of 70 CE. They add that the temple-tax story (17:24-27) would be hard to leave without comment after 70, when the tax went to the temple of Jupiter in Rome."""
  citations = [{ source = "carson-moo-2005", locator = "pp. 153–156" }]
  verses = [{ ref = "Matt.22.7", link = "dates", note = "Read as stock language for punishing a rebel city, so no proof of a date after 70." }]

[[positions]]
id = "ehrman-intro-80-85"
label = "Around 80 to 85 CE, by an anonymous Greek-speaking Christian"
tradition = "critical"
earliest = 80
latest = 85
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook gives the date as "around 80-85 c.e." and says the author "left his identity anonymous", a Greek-speaking Christian probably from outside Palestine. The span shown here is the two ends of his stated range."""
citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 92 approx." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman says scholars now hold that "Matthew used Mark as one of its sources", and he lists Mark, Q and M among them. That puts Matthew after Mark, which he dates to about 70."""
  citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 92 approx." }]
  verses = [{ ref = "Matt.1.1", link = "describes", note = "The Gospel itself names no author." }]

[[positions]]
id = "streeter-antioch-85"
label = "About 85 CE, at Antioch, after the fall of Jerusalem"
tradition = "critical"
earliest = 82
latest = 88
held_by = "B. H. Streeter (1924)"
summary = """
Streeter's The Four Gospels (1924) is the landmark 1924 study of how the Gospels relate. He places Matthew at Antioch in Syria and dates it to 85, "not as a date mathematically demonstrated" but as one that fits all the evidence. Because 85 is offered as an approximate fixed year, the span shown here is plus or minus three years, which is the editor's reading. He treats the author as an unnamed compiler who reworked Mark and the sayings source Q, not the apostle."""
citations = [{ source = "streeter-1924", locator = "pp. 516–524" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Streeter argues that the changed ending of the Marriage Feast parable, where the king sends armies and destroys the murderers, would be natural only after Jerusalem fell. Luke has the parable in a more original form. He adds that Mark, written about 65, would be about twenty years old, and that the Didache's use of Matthew puts it before about 100."""
  citations = [{ source = "streeter-1924", locator = "pp. 516, 524" }]
  verses = [{ ref = "Matt.22.7", link = "dates", note = "The king's armies destroy the murderers, read as a reflection of 70 CE." }]
