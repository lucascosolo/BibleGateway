id = "philippians-composition"
title = "Composition of Philippians"
axis = "composition"
category = "composition"
confidence = "contested"
status = "draft"
books = ["Phil"]
summary = """
Paul wrote Philippians to the church at Philippi, the Roman colony where he had founded his first church in Europe, while he was in prison. Its authorship is not seriously disputed, but scholars disagree on where he was held. Raymond Brown favours Ephesus around 56, and treats Rome (61-63) and Caesarea (58-60) as the alternatives. Whether it is one letter or several joined is also unsettled."""
verses = [
  { ref = "Phil.1.1", link = "describes", note = "Paul and Timothy write to the Christians at Philippi." },
  { ref = "Phil.1.13", link = "describes", note = "Paul's chains have become known throughout the praetorium, the clue to where he was imprisoned." },
  { ref = "Phil.2.19", link = "background", note = "Paul hopes to send Timothy to them soon." },
]

