id = "philippians-composition"
title = "Composition of Philippians"
axis = "composition"
category = "composition"
confidence = "contested"
status = "sources-located"
books = ["Phil"]
summary = """
Paul wrote Philippians to the church at Philippi, the Roman colony where he had founded his first church in Europe, while he was in prison. Its authorship is not seriously disputed, but scholars disagree on where he was held. Raymond Brown favours Ephesus around 56, and treats Rome (61-63) and Caesarea (58-60) as the alternatives. Whether it is one letter or several joined is also unsettled."""
verses = [
  { ref = "Phil.1.1", link = "describes", note = "Paul and Timothy write to the Christians at Philippi." },
  { ref = "Phil.1.13", link = "describes", note = "Paul's chains have become known throughout the praetorium, the clue to where he was imprisoned." },
  { ref = "Phil.2.19", link = "background", note = "Paul hopes to send Timothy to them soon." },
]

[[positions]]
id = "brown-ephesus-56"
label = "Brown: ca. 56 from Ephesus (or 58-63 from Caesarea or Rome)"
tradition = "critical"
earliest = 56
latest = 63
held_by = "Raymond E. Brown"
summary = """
Brown, a critical scholar, dates the letter by where Paul was held: "Ca. 56 if from Ephesus. (Or 61–63 from Rome, or 58–60 from Caesarea.)" On authenticity he writes: "Not seriously disputed." The span of 56 to 63 shown here covers his three options, with 56 as his lead date; on unity, scholarship is "about evenly divided"."""
citations = [{ source = "brown-1997", locator = "ch. 20, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown argues that Paul may well have been imprisoned at Ephesus: "imprisonment at Ephesus is a distinct possibility", given Paul's talk of "wild beasts" at Ephesus and many earlier imprisonments, and since Timothy was with Paul there."""
  citations = [{ source = "brown-1997", locator = "ch. 20, Place of writing" }]
  verses = [{ ref = "Phil.1.13", link = "describes", note = "Paul's chains are the imprisonment whose location is in question." }]

[[positions]]
id = "carson-moo-mid-50s-to-early-60s"
label = "Carson and Moo: between the mid-50s and the early 60s"
tradition = "critical"
earliest = 55
latest = 62
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo, authors of the standard evangelical introduction to the New Testament, take Philippians to be Paul's and do not settle where he was imprisoned. They give about 61-62 for Rome, a little earlier for Caesarea, and a few years earlier still for Ephesus, and say it "was written during the period from the mid–50s to the early 60s"."""
citations = [{ source = "carson-moo-2005", locator = "pp. 506-507" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Carson and Moo find the case for Ephesus strong but not conclusive, and think the evidence fits more than one city. Because the date depends on which imprisonment Paul means in Philippians 1:13, they decline to say more than the stated range."""
  citations = [{ source = "carson-moo-2005", locator = "pp. 506-507" }]
  verses = [{ ref = "Phil.1.13", link = "dates", note = "Paul's chains refer to an imprisonment whose location fixes the date." }]

[[positions]]
id = "ehrman-intro-50s"
label = "Ehrman (textbook): a Pauline letter of the 50s, from prison"
tradition = "critical"
earliest = 50
latest = 59
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook counts Philippians among the undisputed letters, written by Paul himself from prison in an undisclosed location. It gives no year, so the span of 50 to 59 shown here is the editor's reading of his "50s of the Common Era" for Paul's letters."""
citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 246 approx." }]
