id = "mark-composition"
title = "Composition of the Gospel of Mark"
axis = "composition"
category = "composition"
confidence = "contested"
status = "draft"
books = ["Mark"]
summary = """
This asks who wrote the Gospel of Mark and when. Most scholars place it around the time of the First Jewish Revolt against Rome, either just before or just after the Temple fell in 70 CE, and treat it as the earliest Gospel. Whether it shows knowledge of the Temple's destruction, and whether its author was the Mark of church tradition, are not settled."""
verses = [
  { ref = "Mark.13.2", link = "dates", note = "Jesus foretells that not one stone of the Temple will be left on another." },
  { ref = "Mark.13.14", link = "background", note = "The 'abomination of desolation', read against the revolt of 66-70 CE." },
  { ref = "Mark.1.1", link = "describes", note = "The opening of the Gospel." },
]

[[positions]]
id = "brown-68-73"
label = "Between 60 and 75 CE, most likely 68 to 73"
tradition = "critical"
earliest = 60
latest = 75
held_by = "Raymond E. Brown"
summary = """
Brown, a critical scholar, gives his dating in one line: "60–75, most likely between 68 and 73." He says there is wide scholarly agreement on the late 60s or just after 70, and that the author was a Greek-speaker who was not an eyewitness of Jesus' ministry."""
citations = [{ source = "brown-1997", locator = "ch. 7, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown argues that because Matthew and Luke each used Mark, "a date beyond 75 seems unlikely", and the developed Greek Jesus tradition in Mark implies that several decades have passed since Jesus; "there is wide scholarly agreement that Mark was written in the late 60s or just after 70"."""
  citations = [{ source = "brown-1997", locator = "ch. 7, Date of Writing" }]
  verses = [{ ref = "Mark.13.2", link = "dates", note = "The Temple prediction, read against the Temple's fall in 70 CE." }]

[[positions]]
id = "brown-papias-mid-late-60s"
label = "Just before or after Peter's death, in the mid- or late 60s"
tradition = "traditional"
earliest = 64
latest = 69
held_by = "The Papias tradition, as reported by Raymond E. Brown"
summary = """
Brown states the traditional attribution as "Mark, the follower and “interpreter” of Peter". Of those who credit the Papias tradition he writes that "the usual understanding is that Mark wrote just before or after Peter’s death and thus in the mid- or late 60s". The span shown here is the editor's reading of "mid- or late 60s"."""
citations = [{ source = "brown-1997", locator = "ch. 7, Summary of Basic Information; Date of Writing" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown reports that, for this dating, the Gospel's silence counts as internal support, since it fails "to show any knowledge of the details of the First Jewish Revolt against Rome in AD 66–70 and to mention the fall of Jerusalem" is taken as internal support."""
  citations = [{ source = "brown-1997", locator = "ch. 7, Date of Writing" }]
  verses = [{ ref = "Mark.13.2", link = "dates", note = "A prediction with no report of fulfilment." }]

[[positions]]
id = "carson-moo-late-50s-or-60s"
label = "Late 50s or the 60s, probably in Rome"
tradition = "critical"
earliest = 57
latest = 69
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo write the standard evangelical introduction to the New Testament. They think a Roman origin is the best alternative, given the early tradition. They find the evidence cannot choose between the 50s and the 60s and conclude only that Mark was written "sometime in the late 50s or the 60s". The year span shown here is the editor's reading of that phrase."""
citations = [{ source = "carson-moo-2005", locator = "pp. 179–182" }]

  [[positions.arguments]]
  stance = "for"
  text = """
They argue that Mark 13 shows "very little evidence" of the actual events of 70 CE. In their view its warnings use stock Old Testament and Jewish imagery of a besieged city, so the chapter cannot be used to date the Gospel after the Temple fell."""
  citations = [{ source = "carson-moo-2005", locator = "p. 182" }]
  verses = [{ ref = "Mark.13.14", link = "dates", note = "The 'abomination of desolation' is read as stock imagery, not a report of 70 CE." }]

[[positions]]
id = "ehrman-intro-around-70"
label = "Around 70 CE, by an anonymous Greek-speaking Christian"
tradition = "critical"
earliest = 65
latest = 70
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook says Mark "was written in Greek, around 70 c.e." and that "many scholars believe" it was written late in the Jewish War or soon after the Temple fell. Its author is anonymous, a Greek-speaking Christian probably living outside Palestine. The span shown here is the range on his timeline chart, "65-70", for Mark."""
citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 74 approx." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman suggests current events shaped Mark: the war with Rome and the Temple's destruction would make the end seem near, as Jesus predicts in Mark 8:38 to 9:1 and chapter 13. He treats this as a suggestion ("many scholars believe"), not proof."""
  citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 74 approx." }]
  verses = [{ ref = "Mark.13.2", link = "dates", note = "The Temple prediction, read against the war of 66-70 CE." }, { ref = "Mark.9.1", link = "background", note = "The end said to come within the lifetime of some hearers." }]

[[positions]]
id = "streeter-rome-c65"
label = "About 65 CE, at Rome, before the Temple fell"
tradition = "critical"
earliest = 62
latest = 68
held_by = "B. H. Streeter (1924)"
summary = """
Streeter's The Four Gospels (1924) is the landmark study that made Mark the earliest Gospel and the base of Matthew and Luke. He holds that Mark was written at Rome, in the lifetime of Peter's circle, and says it "was probably written about 65". Because he gives only "about" a year, the span shown here is plus or minus three years, which is the editor's reading."""
citations = [{ source = "streeter-1924", locator = "pp. 489–495, 524" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Streeter argues that Mark 13 expects the Anti-Christ to appear in the Temple, which presumes the Temple still stood. The same expectation is in 2 Thessalonians, so the chapter is more naturally explained as written before 70 than after it. For Rome he points to 1 Peter 5:13, where "Babylon" can only mean the Roman church, and to a belief that Peter and Mark were together there."""
  citations = [{ source = "streeter-1924", locator = "pp. 489–490, 493" }]
  verses = [{ ref = "Mark.13.14", link = "dates", note = "The Anti-Christ expected in the Temple, which implies the Temple still stood." }, { ref = "1Pet.5.13", link = "background", note = "'Babylon' read as Rome, linking Peter and Mark there." }]
