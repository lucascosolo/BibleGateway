id = "babylon-falls-539"
title = "Babylon falls to Cyrus"
axis = "narrative"
category = "political"
confidence = "firm"
status = "sources-located"
summary = """
Cyrus's army takes Babylon in October 539 BCE, which ends the Neo-Babylonian empire. The Nabonidus Chronicle records the battle at Opis, the taking of Sippar, and the entry into Babylon without a battle. Daniel 5 puts the death of Belshazzar on the same night."""
verses = [
  { ref = "Dan.5.30", link = "describes", note = "Daniel 5:30 says Belshazzar is killed that night." },
  { ref = "Dan.5.31", link = "describes", note = "Daniel 5:31 says Darius the Mede receives the kingdom." },
  { ref = "Isa.13.17", link = "alludes", note = "Isaiah 13:17 says Yahweh stirs up the Medes against Babylon." },
  { ref = "Jer.51.11", link = "alludes", note = "Jeremiah 51:11 says Yahweh has stirred up the kings of the Medes against Babylon." },
  { ref = "Isa.45.1", link = "alludes", note = "Isaiah 45:1 speaks of Cyrus, to whom doors are opened and gates not shut." },
]

[[positions]]
id = "october-539"
label = "October 539 BCE (16 Tashritu)"
tradition = "chronological"
earliest = -539
latest = -539
held_by = "A. K. Grayson (editor and translator of ABC 7, per Livius)"
summary = """
Babylon was captured on the 16th of Tashritu, which is 12 October 539 BCE on the Julian calendar, in Nabonidus's seventeenth year. The main source is the Nabonidus Chronicle, in Grayson's translation as reproduced by Livius: "On the sixteenth day, Ugbaru, governor of Gutium, and the army of Cyrus, without battle they entered Babylon". Cyrus himself entered "on the third day of the month Arahsamna". On the Livius page, the entry into Babylon is at iii.15-16 and Cyrus's own entry at iii.18. The month of the sixteenth day falls in a damaged line (iii.12) and cannot be read in the translation as printed, so the match with 12 October 539 rests on the modern reconstruction cited below."""
citations = [
  { source = "livius-abc7", locator = "col. iii 15–16 (sixteenth day); iii 18 (Cyrus enters, 3 Arahsamna)" },
  { source = "wikipedia-fall-of-babylon" },
]

[[attestations]]
artifact = "nabonidus-chronicle-abc7"
relation = "partially-corroborates"
note = """
The Chronicle records Cyrus entering Babylon without a battle in Nabonidus's seventeenth year, which matches the fall of Babylon in Daniel 5. It does not mention Belshazzar's death on the page read, so it supports the event but not that detail."""
citations = [{ source = "livius-abc7" }]

[[attestations]]
artifact = "cyrus-cylinder"
relation = "consistent"
note = """
The Cylinder describes the conquest as happening "without battle", but modern scholars treat that as propaganda (Wikipedia's summary). Herodotus and Xenophon give differing accounts of how the city was taken, so the Cylinder fits the outcome without settling the manner."""
citations = [{ source = "wikipedia-fall-of-babylon" }, { source = "wikipedia-cyrus-cylinder" }]
