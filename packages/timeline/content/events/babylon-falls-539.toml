id = "babylon-falls-539"
title = "Babylon falls to Cyrus"
axis = "narrative"
category = "political"
confidence = "firm"
status = "sources-located"
summary = """
Cyrus's army takes Babylon in October 539 BCE, which ends the Neo-Babylonian empire. The Nabonidus Chronicle records the battle at Opis, the taking of Sippar, and the entry into Babylon without a battle. Daniel 5 puts the death of Belshazzar on the same night."""
verses = [
  { ref = "Dan.5.30", link = "describes", note = "Daniel 5:30 says Belshazzar is killed that night." },
  { ref = "Dan.5.31", link = "describes", note = "Daniel 5:31 says Darius the Mede receives the kingdom." },
  { ref = "Isa.13.17", link = "alludes", note = "Isaiah 13:17 says Yahweh stirs up the Medes against Babylon." },
  { ref = "Jer.51.11", link = "alludes", note = "Jeremiah 51:11 says Yahweh has stirred up the kings of the Medes against Babylon." },
  { ref = "Isa.45.1", link = "alludes", note = "Isaiah 45:1 speaks of Cyrus, to whom doors are opened and gates not shut." },
]

[[positions]]
id = "october-539"
label = "October 539 BCE (16 Tashritu)"
tradition = "chronological"
earliest = -539
latest = -539
held_by = "Nabonidus Chronicle (ANET, trans. A. Leo Oppenheim)"
summary = """
Babylon was captured on the 16th of Tashritu in Nabonidus's seventeenth year, 539 BCE. The main source is the Nabonidus Chronicle, in Oppenheim's ANET translation (p. 306): the battle at Opis is dated to the month of Tashritu, Sippar falls on the 14th, and on the 16th Gobryas (Ugbaru), governor of Gutium, and the army of Cyrus enter Babylon without battle. Cyrus himself enters on the 3rd day of Arahshamnu. Tashritu falls in September-October; a Julian day for the 16th is a modern conversion that no filed source gives, so none is asserted."""
citations = [
  { source = "pritchard-1969", locator = "p. 306, Nabonidus Chronicle iii, trans. A. Leo Oppenheim" },
]

[[attestations]]
artifact = "nabonidus-chronicle-abc7"
relation = "in-tension"
note = """
The Chronicle dates the fall but tells it differently from Daniel 5:30-31. In it Gobryas (Ugbaru), governor of Gutium, and the army of Cyrus enter Babylon "without battle", Nabonidus is arrested when he returns, and Cyrus himself enters on the 3rd of Arahshamnu and installs Gobryas's governors. Daniel instead has Belshazzar, whom it calls king, killed that night and "Darius the Mede" receiving the kingdom; the Chronicle has no king killed and no Darius. No critical discussion of the difference is filed here."""
citations = [{ source = "pritchard-1969", locator = "p. 306, Nabonidus Chronicle iii, trans. A. Leo Oppenheim" }]

[[attestations]]
artifact = "cyrus-cylinder"
relation = "consistent"
note = """
The Cylinder says Marduk made Cyrus enter Babylon without any battle (ANET p. 315), which matches the Chronicle's entry without battle. Kitchen reads Cyrus's return of the gods as propaganda (p. 76), so the Cylinder fits the outcome and is also a royal self-presentation."""
citations = [{ source = "pritchard-1969", locator = "p. 315, Cyrus Cylinder, trans. A. Leo Oppenheim" }, { source = "kitchen-2003", locator = "p. 76" }]
