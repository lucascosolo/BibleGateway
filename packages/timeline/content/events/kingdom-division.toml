id = "kingdom-division"
title = "The division of the kingdom"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "sources-located"
summary = "After Solomon dies, the northern tribes break away from his son Rehoboam and make Jeroboam their king."
verses = [
  { ref = "1Kgs.11.26-1Kgs.11.40", link = "background", note = "Kings reports Ahijah's prophecy and Jeroboam's flight, which gives background to the division." },
  { ref = "1Kgs.12.1-1Kgs.12.24", link = "describes", note = "Kings describes the meeting at Shechem, where the kingdom splits." },
  { ref = "2Chr.10.1-2Chr.11.4", link = "describes", note = "Chronicles tells the same story of the division." },
  { ref = "Isa.7.17", link = "alludes", note = "Isaiah speaks of 'from the day that Ephraim departed from Judah,' which refers back to the division." },
]

[[positions]]
id = "young-932-931"
label = "932-931 BCE"
tradition = "chronological"
earliest = -932
latest = -931
held_by = "Rodger C. Young"
summary = "Young reasons that Solomon died before Tishri 931 (the autumn month that starts the year in this count). So Rehoboam began in 932t, a year counted from autumn. Jeroboam began some time in 931n, a year counted from spring."
citations = [{ source = "young-2003", locator = "pp. 590-591" }, { source = "young-2005", locator = "p. 227 n. 3" }]

[[positions]]
id = "thiele-931-930"
label = "931-930 BCE"
tradition = "chronological"
earliest = -931
latest = -930
held_by = "Edwin R. Thiele"
summary = """
The chronologist Edwin Thiele assumed that Solomon died in the second half of 931n (931t/930n). In his own words he had "fixed 931/30 as the year of the division of the monarchy", and he explains how: "With an interval of 78 years between the accession of Jeroboam I and the death of Ahab, and with the latter taking place in 853 B.C., we thus secure the date 931/930 B.C. as the year of Jeroboam's accession and of the schism between Judah and Israel." He then uses 930 "in the interests of simplicity", adding that 931 "might have been equally appropriate or even more accurate", depending on the season of Jeroboam's rebellion."""
citations = [{ source = "thiele-1984", locator = "p. 5, table 'Reigns of the Hebrew kings': Rehoboam 930-913, Jeroboam I 930-909; gives 930 only, not 931 (open-access popular restatement of his dates)" }, { source = "thiele-1983", locator = "chapter 'The Chronology of Judah and Israel (930–841 B.C.)', opening pages" }, { source = "young-2003", locator = "p. 591" }]

[[positions]]
id = "wiki-932-931"
label = "932/931 BCE"
tradition = "critical"
earliest = -932
latest = -931
summary = "Kitchen dates Rehoboam to about 931-914 and says Jeroboam came to power in 931 with Shoshenq I's help, so the division falls about 932/931."
citations = [{ source = "kitchen-2003", locator = "p. 33 (Rehoboam ca. 931-914); p. 34 (Jeroboam in 931)" }]

[[positions]]
id = "fs-two-highlands"
label = "Two highland entities; Israel a state by 900 BCE"
tradition = "archaeological"
earliest = -930
latest = -900
held_by = "Israel Finkelstein and Neil Asher Silberman"
summary = """
Finkelstein and Silberman head their chapter on the division c. 930-720 BCE. They say there is no archaeological evidence that north and south grew out of an earlier political unity, and that Israel was well on the way to full statehood around 900 BCE while Judah stayed marginal.
"""
citations = [{ source = "finkelstein-silberman-2002", locator = "p. 149 (chapter heading, c. 930-720 BCE)" }, { source = "finkelstein-silberman-2002", locator = "p. 158 (Israel well on the way to statehood around 900 BCE)" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  "Put simply, while Judah was still economically marginal and backward, Israel was booming." Ashlar palaces appear in the north in the early ninth century and in Judah only in the seventh.
"""
  citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 158-159" }]
