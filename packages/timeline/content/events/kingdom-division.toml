[[positions]]
id = "young-932-931"
label = "932-931 BCE"
tradition = "chronological"
earliest = -932
latest = -931
held_by = "Rodger C. Young"
summary = "Young reasons that Solomon died before Tishri 931 (the autumn month that starts the year in this count). So Rehoboam began in 932t, a year counted from autumn. Jeroboam began some time in 931n, a year counted from spring."
citations = [{ source = "young-2003", locator = "pp. 590-591" }, { source = "young-2005", locator = "p. 227 n. 3" }]

[[positions]]
id = "thiele-931-930"
label = "931-930 BCE"
tradition = "chronological"
earliest = -931
latest = -930
held_by = "Edwin R. Thiele"
summary = """
The chronologist Edwin Thiele assumed that Solomon died in the second half of 931n (931t/930n). In his own words he had "fixed 931/30 as the year of the division of the monarchy", and he explains how: "With an interval of 78 years between the accession of Jeroboam I and the death of Ahab, and with the latter taking place in 853 B.C., we thus secure the date 931/930 B.C. as the year of Jeroboam's accession and of the schism between Judah and Israel." He then uses 930 "in the interests of simplicity", adding that 931 "might have been equally appropriate or even more accurate", depending on the season of Jeroboam's rebellion."""
citations = [{ source = "thiele-1984", locator = "p. 5, table 'Reigns of the Hebrew kings' (open-access popular restatement of his dates)" }, { source = "thiele-1983", locator = "chapter 'The Chronology of Judah and Israel (930–841 B.C.)', opening pages (page images supplied by the user, 2026-10-07; page numbers not visible on the images)" }, { source = "young-2003", locator = "p. 591" }, { source = "wikipedia-mysterious-numbers", locator = "Rehoboam 931/0 in the chronology table; second-hand, not Thiele's pages" }]

