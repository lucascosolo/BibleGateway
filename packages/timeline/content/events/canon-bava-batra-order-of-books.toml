id = "canon-bava-batra-order-of-books"
title = "The baraita of Bava Batra 14b-15a: the order and authors of the books"
axis = "canon"
category = "canon"
confidence = "contested"
status = "sources-located"
summary = """
A baraita, a teaching of the early rabbis left out of the Mishnah, is quoted in the Babylonian Talmud at Bava Batra 14b-15a. It gives the first itemised list of the Prophets and the Writings in three divisions, and says who wrote each book: Moses the Torah and Job, Joshua his own book and the last eight verses of the Torah, Samuel his book with Judges and Ruth, and so on. The Talmud that preserves it was compiled centuries later, but critical scholars date the teaching itself to the second century CE. McDonald puts it at 150-180 CE and doubts it spoke for most Jews of that time; Philip Alexander, as Lim reports, dates it before 200 CE. Some scholars use it as evidence of a three-part canon centuries earlier; McDonald calls that an overstatement."""
verses = [
  { ref = "Deut.34.5-Deut.34.12", link = "describes", note = "The baraita assigns these last verses of the Torah to Joshua, and the Talmud then debates it." },
  { ref = "Num.22.2-Num.22.6", link = "background", note = "The baraita says Moses wrote the Balaam story, which begins here." },
  { ref = "Ruth.1.1", link = "names", note = "Ruth, which the baraita assigns to Samuel and places first among the Writings." },
  { ref = "Job.1.1", link = "names", note = "Job, which the baraita assigns to Moses." },
]

[[positions]]
id = "mid-to-late-second-century"
label = "150-180 CE, a teaching of the tannaim"
tradition = "critical"
earliest = 150
latest = 180
held_by = "Lee Martin McDonald"
summary = """
McDonald dates the baraita to 150-180 CE, a teaching of the early rabbinic teachers that was not taken into the Mishnah."""
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 187; p. 58" }]

  [[positions.arguments]]
  stance = "for"
  text = """
McDonald argues that its absence from the Mishnah suggests it was not a widely accepted or well-known tradition when the Mishnah was compiled."""
  citations = [{ source = "mcdonald-2017-vol1", locator = "p. 58" }]

  [[positions.arguments]]
  stance = "against"
  text = """
McDonald rejects the use of the baraita as evidence for a widespread three-part canon in the second and first centuries BCE as an overstatement."""
  citations = [{ source = "mcdonald-2017-vol1", locator = "p. 58" }]

[[positions]]
