id = "1-corinthians-composition"
title = "Composition of 1 Corinthians"
axis = "composition"
category = "composition"
confidence = "firm"
status = "draft"
books = ["1Cor"]
summary = """
Paul wrote 1 Corinthians from Ephesus to the mixed Jewish and Gentile church at Corinth that he had founded, answering a letter and reports from there. It was written late in 56 or very early in 57, since Paul says he will stay at Ephesus until Pentecost. Its authorship is not seriously disputed. A revisionist chronology would put it in 54-55."""
verses = [
  { ref = "1Cor.1.1", link = "describes", note = "Paul and Sosthenes write to the church of God at Corinth." },
  { ref = "1Cor.5.9", link = "background", note = "An earlier, lost letter to the Corinthians." },
  { ref = "1Cor.16.8", link = "dates", note = "I will stay in Ephesus until Pentecost, placing the writing in Ephesus before that feast." },
]

[[positions]]
id = "brown-ephesus-56-57"
