id = "1-corinthians-composition"
title = "Composition of 1 Corinthians"
axis = "composition"
category = "composition"
confidence = "firm"
status = "sources-located"
books = ["1Cor"]
summary = """
Paul wrote 1 Corinthians from Ephesus to the mixed Jewish and Gentile church he had founded at Corinth, answering a letter and reports that had reached him from there. He says he will stay at Ephesus until Pentecost, which puts the writing in late 56 or very early 57. Its authorship is not seriously disputed, though a revisionist chronology would move it to 54-55."""
verses = [
  { ref = "1Cor.1.1-1Cor.1.2", link = "describes", note = "Paul and Sosthenes write to the church of God at Corinth." },
  { ref = "1Cor.5.9", link = "background", note = "1 Corinthians 5:9 mentions an earlier letter to the Corinthians that is now lost, so this is not Paul's first letter to them." },
  { ref = "1Cor.16.8", link = "dates", note = "Paul says he will stay in Ephesus until Pentecost, which places the writing in Ephesus before that feast." },
]

[[positions]]
id = "brown-ephesus-56-57"
label = "Brown: late 56 or very early 57 from Ephesus"
tradition = "critical"
earliest = 56
latest = 57
held_by = "Raymond E. Brown"
summary = """
Raymond Brown dates the letter to late 56 or very early 57, written from Ephesus, and notes the revisionist alternative of 54/55. His summary line reads: "Late 56 or very early 57 from Ephesus (or 54/55 in the Revisionist Chronology)." He treats Pauline authorship as settled ("Not seriously disputed.") and adds that an increasing majority favours the letter's unity, though some see two or more letters interwoven."""
citations = [{ source = "brown-1997", locator = "ch. 22, Summary of Basic Information, PDF p. 562" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown takes the setting from the end of the letter. Paul wants to stay at Ephesus because an opportunity for evangelizing has opened, then plans to come to Corinth via Macedonia: "Paul wants to stay at Ephesus at least till Pentecost (May/June AD 57?)"."""
  citations = [{ source = "brown-1997", locator = "ch. 22, General Analysis of the Message" }]
  verses = [{ ref = "1Cor.16.8", link = "dates", note = "Here Paul says he will stay at Ephesus until Pentecost, the statement Brown uses to set the letter's date and place." }]

[[positions]]
id = "carson-moo-ephesus-55"
label = "Carson and Moo: from Ephesus in early 55"
tradition = "traditional"
earliest = 55
latest = 55
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo, authors of the standard evangelical introduction to the New Testament, hold that Paul wrote 1 Corinthians and date it from the Gallio inscription, which puts Gallio's proconsulship in 51 or 52. From that they conclude that Paul "wrote 1 Corinthians while he was in Ephesus, some time before Pentecost", early in 55. They add that all the dates could be moved one year earlier."""
citations = [{ source = "carson-moo-2005", locator = "pp. 447-448" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Carson and Moo start from the Delphi inscription of Claudius, which fixes Gallio's term, and then count Paul's two and a half years in Ephesus to autumn 55. Paul's own note that he will stay in Ephesus until Pentecost places the letter in his last year there."""
  citations = [{ source = "carson-moo-2005", locator = "pp. 447-448" }]
  verses = [{ ref = "1Cor.16.8", link = "dates", note = "Here Paul says he will stay in Ephesus until Pentecost, which Carson and Moo take to place the letter in his last year there." }]

[[positions]]
id = "ehrman-intro-mid-50s"
label = "Ehrman (textbook): mid-50s, from Ephesus"
tradition = "critical"
earliest = 54
latest = 56
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook says Paul wrote 1 Corinthians from Ephesus, and elsewhere describes the Last Supper tradition in it as something that "was written in the mid-50s" by Paul. He gives no exact years, so the span shown here, 54 to 56, is the editor's reading of the phrase "mid-50s." """
citations = [{ source = "ehrman-brief-intro-2017", locator = "pp. 154, 232-233" }]
