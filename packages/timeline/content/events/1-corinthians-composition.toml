summary = """
Brown's DATE line: "Late 56 or very early 57 from Ephesus (or 54/55 in the Revisionist Chronology)." On authenticity: "Not seriously disputed." He adds that unity is favoured by an increasing majority, though some see two or more letters interwoven."""
