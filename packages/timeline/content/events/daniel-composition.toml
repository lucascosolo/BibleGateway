id = "daniel-composition"
title = "Composition of Daniel 7–12"
axis = "composition"
category = "composition"
confidence = "contested"
status = "draft"
books = ["Dan"]
segment = "Daniel 7–12 (the visions)"
summary = """
When the visions of Daniel were written. The book is set in the 6th century BCE, in the \
Babylonian and Persian courts; most critical scholars date the visions to the persecution under \
the Seleucid king Antiochus IV in the 160s BCE, while conservative scholars hold that part or \
all of them may go back to the 6th century."""
verses = [{ ref = "Dan.7.1-Dan.12.13", link = "describes" }]

[[positions]]
id = "maccabean"
label = "167–164 BCE (Antiochus IV's persecution)"
tradition = "critical"
earliest = -167
latest = -164
held_by = "John J. Collins"
summary = """
Chapters 7–12 were written during the persecution of the Jews under Antiochus IV Epiphanes, \
before the rededication of the temple."""
citations = [{ source = "collins-1993" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  The visions are read as prophecy written after the events they describe up to the reign of \
  Antiochus IV, which fixes their composition within that persecution."""
  citations = [{ source = "collins-1993" }]

[[positions]]
id = "sixth-century"
label = "Sixth century BCE (in part or whole)"
tradition = "traditional"
earliest = -600
latest = -501
held_by = "Joyce G. Baldwin"
summary = """
Part or all of chapters 7–12 may go back to the 6th century BCE, the period in which the book \
is set."""
citations = [{ source = "baldwin-1978" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  The visions need not be prophecy written after the event (vaticinia ex eventu), and so need \
  not be dated by the latest events they describe."""
  citations = [{ source = "baldwin-1978" }]
