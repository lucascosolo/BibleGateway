id = "pentecost"
title = "Pentecost and the outpouring of the Spirit"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
Acts 2 narrates the first Pentecost after the resurrection, when the apostles speak in other \
tongues and Peter preaches in Jerusalem. Its year follows the date given to the crucifixion, \
which is unsettled."""
verses = [
  { ref = "Acts.2.1-Acts.2.41", link = "describes", note = "the day of Pentecost, the tongues, Peter's sermon" },
  { ref = "Joel.2.28-Joel.2.32", link = "background", note = "the prophecy Peter quotes" },
  { ref = "Acts.11.15-Acts.11.16", link = "alludes", note = "Peter recalls the Spirit falling at the beginning" },
]

[[positions]]
id = "33"
label = "33 CE"
tradition = "chronological"
earliest = 33
latest = 33
held_by = "Colin Humphreys"
summary = """
If the crucifixion falls on 3 April 33 CE, as Humphreys argues, the Pentecost of Acts 2 falls \
later in 33 CE. The year is derived from the crucifixion date, not separately attested."""
citations = [{ source = "wikipedia-date-of-crucifixion" }]

