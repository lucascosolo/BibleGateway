id = "pentecost"
title = "Pentecost and the outpouring of the Spirit"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "sources-located"
summary = """
Acts 2 tells of the first Pentecost after the resurrection. The apostles speak in other languages, and Peter preaches in Jerusalem. Its year depends on the year given to the crucifixion, which is unsettled. Both positions below simply take the crucifixion year and have the same holders. No scholar read dates Pentecost on its own."""
verses = [
  { ref = "Acts.2.1-Acts.2.41", link = "describes", note = "Acts describes the day of Pentecost, the speaking in other languages, and Peter's sermon." },
  { ref = "Joel.2.28-Joel.2.32", link = "background", note = "Peter quotes this prophecy of Joel in his Pentecost sermon." },
  { ref = "Acts.11.15-Acts.11.16", link = "alludes", note = "Peter recalls the Spirit coming down at the start, which refers back to Pentecost." },
]

[[positions]]
id = "33"
label = "33 CE"
tradition = "chronological"
earliest = 33
latest = 33
held_by = "Colin J. Humphreys and W. G. Waddington (by inference from their crucifixion date)"
summary = """
Humphreys and Waddington argue that the crucifixion fell on Friday 3 April 33 CE, which was 14 Nisan. Pentecost is the fiftieth day counted from the day after the Passover Sabbath (Leviticus 23:15-16), so on their date the Pentecost of Acts 2 fell about seven weeks later, in late May 33. The year is an inference from the crucifixion date; no source dates Pentecost on its own."""
citations = [
  { source = "humphreys-waddington-1992", locator = "p. 331 and Table 2 on p. 337 for the crucifixion date; the Pentecost inference is the editor's" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
  Acts 2:1 sets the event on "the day of Pentecost", the fiftieth day of the count that begins at Passover. Whatever year the crucifixion took place, that year's Pentecost followed about seven weeks later. This follows from Acts 2:1 and Leviticus 23:15-16 and is the editor's inference."""
  citations = [{ source = "humphreys-waddington-1992", locator = "Table 2 on p. 337 for the crucifixion date only; the Pentecost count is the editor's inference from Acts 2:1 and Leviticus 23:15-16" }]
  verses = [
    { ref = "Acts.2.1", link = "dates", note = "Acts opens the scene with 'When the day of Pentecost had come,' which ties the event to the festival's date." },
    { ref = "Lev.23.15-Lev.23.16", link = "background", note = "Leviticus counts fifty days from the day after the Sabbath, which is the basis of the festival's date." },
  ]

[[positions]]
id = "30"
label = "30 CE"
tradition = "chronological"
earliest = 30
latest = 30
held_by = "John P. Meier; D. A. Carson and Douglas J. Moo (by inference from their crucifixion date)"
summary = """
Meier concludes that the crucifixion took place on Friday 7 April 30 CE, calling 30 "the more likely date", and Carson and Moo find 30 slightly preferable. On that date the Pentecost of Acts 2 fell about seven weeks later, in late May 30. The year is an inference from the crucifixion date; no source dates Pentecost on its own."""
citations = [
  { source = "meier-1991", locator = "pp. 402, 407 for the crucifixion date; the Pentecost inference is the editor's" },
  { source = "carson-moo-2005", locator = "p. 127 for the crucifixion date" },
]
