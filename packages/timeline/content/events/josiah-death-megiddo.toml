summary = """
Young works out from the Babylonian Chronicles that Josiah died in the fourth month of 609. Thiele has the same: "609—Josiah slain at Megiddo by Neco of Egypt (2 Kings 23:29)", with Neco at Megiddo in Tammuz (25 June to 23 July) on his Diagram 20."""
