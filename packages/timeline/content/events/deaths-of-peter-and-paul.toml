id = "deaths-of-peter-and-paul"
title = "The deaths of Peter and Paul"
axis = "narrative"
category = "political"
confidence = "speculative"
status = "claims-checked"
summary = """
This rests on tradition only. 1 Clement says both men were martyred, and Eusebius reports that Paul was beheaded at Rome and Peter was crucified there under Nero. Brown dates both deaths to Nero's persecution after the Great Fire of July 64, but the New Testament does not tell of either death."""
verses = [
  { ref = "John.21.18-John.21.19", link = "alludes", note = "John 21:18-19 says Peter will stretch out his hands, a sign of how he would die." },
  { ref = "2Tim.4.6-2Tim.4.8", link = "alludes", note = "In 2 Timothy 4:6-8 Paul expects to die soon." },
  { ref = "2Pet.1.14", link = "alludes", note = "In 2 Peter 1:14 Peter says he knows his body, his tent, will soon be put off." },
  { ref = "Acts.28.30-Acts.28.31", link = "background", note = "Acts 28:30-31 leaves Paul at Rome, waiting for his trial." },
]

[[positions]]
id = "64-65"
label = "c. 64–65 CE, under Nero"
tradition = "traditional"
earliest = 64
latest = 65
summary = """
Brown reports the respectable tradition that Peter and Paul were both martyred in Rome in Nero's persecution after the fire of July 64, and gives AD 64 or somewhat later (67) for Paul. Eusebius places Peter's crucifixion under Nero as well. Neither Brown nor Eusebius gives a single year, so the 64 to 65 span is the editor's reading of the earliest, post-fire option. Traditional here means the early church accounts."""
citations = [
  { source = "brown-1997", locator = "ch. 4, The Second Third of the 1st Century AD; ch. 16, Paul Arrested in Jerusalem; Imprisoned in Caesarea; Taken to Rome; Death" },
  { source = "newadvent-eusebius-he-2", locator = "2.25.5" },
]

[[positions]]
id = "nero-14"
label = "Fourteenth year of Nero (Jerome)"
tradition = "traditional"
earliest = 67
latest = 68
summary = """
Jerome says Peter held the see at Rome "until the last, that is the fourteenth, year of Nero". He says Paul was beheaded at Rome in "the fourteenth year of Nero", the same year as Peter. Jerome gives no calendar year, but Brown dates Nero's reign 54 to 68, so on a count from the start of the reign his fourteenth year falls in 67 to 68 (the editor's computation). Eusebius's Chronicle was not read."""
citations = [
  { source = "newadvent-jerome-de-viris", locator = "ch. 1 (Peter); ch. 5 (Paul)" },
  { source = "brown-1997", locator = "ch. 4, The Second Third of the 1st Century AD (Nero, 54–68)" },
]

[[attestations]]
artifact = "one-clement-5"
relation = "consistent"
note = """
1 Clement says both men were martyred, Paul "having borne witness before rulers", but it gives no place or date."""
citations = [{ source = "ecw-1-clement-hoole", locator = "ch. 5" }]

[[attestations]]
artifact = "eusebius-he-2-25"
relation = "consistent"
note = """
Eusebius reports the tradition that Paul was beheaded at Rome and Peter was crucified under Nero. The account is late, so it is treated as a tradition rather than as an early witness."""
citations = [{ source = "newadvent-eusebius-he-2", locator = "2.25.5–8" }]

[[positions]]
id = "brown-after-summer-64"
label = "After summer 64 CE, no later than 67 or 68 (Brown, Traditional Chronology)"
tradition = "chronological"
earliest = 64
latest = 68
held_by = "Raymond E. Brown (Traditional Chronology)"
summary = """
Raymond Brown's Table 6 ends: "after summer 64 Death in Rome under Nero." In the text he says Paul was martyred "either about the same time as Peter (AD 64) or somewhat later (67)", and that Peter died "sometime between 64 and 68 during Nero's persecution". The upper year of 68 is Brown's bound for Peter, not for Paul, and the Table itself gives only "after summer 64"."""
citations = [
  { source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" },
  { source = "brown-1997", locator = "ch. 16, Paul Arrested in Jerusalem; Imprisoned in Caesarea; Taken to Rome; Death" },
  { source = "brown-1997", locator = "ch. 33, The Background" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown's Traditional column has Paul a prisoner in Rome for two years, 61-63 (Acts 28:30), and then has him die under Nero after the summer of 64. The table gives no firmer date."""
  citations = [{ source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" }]
  verses = [
    { ref = "Acts.28.30", link = "dates" },
  ]
