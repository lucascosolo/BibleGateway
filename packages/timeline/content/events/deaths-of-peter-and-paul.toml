id = "deaths-of-peter-and-paul"
title = "The deaths of Peter and Paul"
axis = "narrative"
category = "political"
confidence = "speculative"
status = "draft"
summary = """
Rests on tradition only: 1 Clement says both suffered martyrdom, and Eusebius reports that Paul \
was beheaded at Rome and Peter crucified there under Nero. Wikipedia places Paul's death c. 64–65 \
CE; the New Testament does not narrate either death."""
verses = [
  { ref = "John.21.18-John.21.19", link = "alludes", note = "Peter will stretch out his hands, signifying how he would die" },
  { ref = "2Tim.4.6-2Tim.4.8", link = "alludes", note = "Paul expects his departure" },
  { ref = "2Pet.1.14", link = "alludes", note = "Peter knows his tent will soon be put off" },
  { ref = "Acts.28.30-Acts.28.31", link = "background", note = "Paul at Rome awaiting trial" },
]

[[positions]]
id = "64-65"
label = "c. 64–65 CE, under Nero"
tradition = "traditional"
earliest = 64
latest = 65
summary = """
Wikipedia dates Paul's death to c. 64–65 CE in Rome under Nero, citing 1 Clement 5 and \
Eusebius. Eusebius places Peter's crucifixion under Nero as well; neither source gives a year."""
citations = [
  { source = "wikipedia-paul-the-apostle" },
  { source = "newadvent-eusebius-he-2", locator = "2.25.5" },
]

[[positions]]
id = "nero-14"
label = "Fourteenth year of Nero (Jerome)"
tradition = "traditional"
earliest = 67
latest = 68
summary = """
Jerome says Peter held the see at Rome "until the last, that is the fourteenth, year of Nero", \
and that Paul was beheaded at Rome in "the fourteenth year of Nero", the same year as Peter. \
Jerome gives no calendar year. Nero's reign began on 13 October 54 and ended with his death on \
9 June 68, so his fourteenth regnal year runs from October 67 to June 68; Eusebius's Chronicle \
was not read."""
citations = [
  { source = "newadvent-jerome-de-viris", locator = "ch. 1 (Peter); ch. 5 (Paul)" },
  { source = "wikipedia-nero", locator = "lead and reign sections: accession 13 October 54, death 9 June 68" },
]

[[attestations]]
artifact = "one-clement-5"
relation = "consistent"
note = """
Says both men suffered martyrdom, Paul "under the prefects", without place or date."""
citations = [{ source = "ecw-1-clement-hoole", locator = "ch. 5" }]

[[attestations]]
artifact = "eusebius-he-2-25"
relation = "consistent"
note = """
Late tradition: Paul beheaded at Rome, Peter crucified under Nero."""
citations = [{ source = "newadvent-eusebius-he-2", locator = "2.25.5–8" }]
