id = "jude-composition"
title = "Composition of the letter of Jude"
axis = "composition"
category = "composition"
confidence = "contested"
status = "sources-located"
books = ["Jude"]
summary = """
This entry asks who wrote the letter of Jude and when. The letter names Jude, brother of James, whom Ehrman takes to be the brother of Jesus. Ehrman holds that it is a forgery, written "relatively late in the first century, after the age of the apostles" by a highly educated Greek-speaking Christian. He gives no years, so the span of 70 to 100 shown here is an editorial reading of that phrase."""
verses = [
  { ref = "Jude.1.1", link = "describes", note = "The letter names Jude, brother of James, as its author." },
  { ref = "Jude.1.3", link = "background", note = "Ehrman reads the faith here as a body of belief delivered long ago." },
  { ref = "Jude.1.17-Jude.1.18", link = "background", note = "Ehrman notes that the apostles are spoken of as figures of the past." },
  { ref = "Jude.1.4", link = "background", note = "Ehrman reads the charge that opponents turn grace into licentiousness as aimed at a later Paulinism." },
]

[[positions]]
id = "after-the-apostles-late-first-century"
label = "After the age of the apostles, late in the first century"
tradition = "critical"
earliest = 70
latest = 100
held_by = "Bart D. Ehrman"
summary = """
Ehrman holds that Jude the brother of Jesus did not write the letter. He gives no exact years; the span shown here, 70 to 100, follows his phrases, with 70 standing for "after the age of the apostles" and 100 for the end of "the first century"."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 393, 394" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman dates the letter from its own outlook, which he sees as that of a later generation: "the book gives every indication of being produced relatively late in the first century, after the “age of the apostles.”""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 393" }]
  verses = [{ ref = "Jude.1.17-Jude.1.18", link = "background", note = "Jude speaks of the apostles as belonging to the past." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman reads the author's use of the phrase "the faith" as a mark of that later period: "The author speaks of “the faith” as the content of the body of knowledge that makes up the Christian religion""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 393" }]
  verses = [{ ref = "Jude.1.3", link = "background", note = "Jude speaks of the faith as delivered once for all." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman argues from the quality of the Greek that the author was not a peasant missionary: "he writes very good Greek, not the sort of skill one can acquire simply by spending time on the mission field without years of serious literary training.""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 393" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman therefore concludes about the author's identity: "he was not the Aramaicspeaking peasant of Nazareth, the brother of Jesus and James.""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 395" }]
  verses = [{ ref = "Jude.1.1", link = "describes", note = "The letter names Jude as its author." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman finds that the letter's attack on its opponents fits the Pauline tradition after Paul: "the charge makes even better sense against later forms of Paulinism, such as that represented in the book of Ephesians""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 396" }]
  verses = [{ ref = "Jude.1.4", link = "background", note = "Jude charges that opponents have turned grace into licentiousness." }]

[[positions]]
id = "jude-brother-of-jesus"
label = "Written by Jude, the brother of James and of Jesus"
tradition = "traditional"
earliest = 40
latest = 70
held_by = "Richard Bauckham (named by Ehrman as defending authenticity)"
summary = """
Ehrman notes that Bauckham makes a spirited defense of authenticity, meaning that Jude himself wrote the letter. Ehrman gives no years for this view, so the span shown here is the editor's."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 393, 422" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman first grants what the letter claims for itself: "The author of this short text, therefore, is almost certainly claiming to be a brother of both James and Jesus""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 391" }]
  verses = [{ ref = "Jude.1.1", link = "describes", note = "The letter names Jude as its author." }]

  [[positions.arguments]]
  stance = "against"
  text = """
Ehrman is not persuaded by the objection that Jude was too obscure a figure to be chosen as a false author: "The objection has more rhetorical than substantive force, however.""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 391" }]

  [[positions.arguments]]
  stance = "against"
  text = """
Ehrman extends the point to Jude's family, arguing that nothing sets Jude apart from them: "Nothing suggests that their progenitor, Jude, was any different.""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 394" }]

[[positions]]
id = "brown-90-100"
label = "Virtually impossible to tell: a few scholars say the 50s, many 90 to 100"
tradition = "critical"
earliest = 50
latest = 100
held_by = "Raymond E. Brown"
summary = """
Brown, a critical scholar, is cautious about the date: "Virtually impossible to tell. A few scholars place it in the 50s; many in 90–100." The span shown, 50 to 100, takes in both camps he reports, and he himself says 90-100 "may be the most plausible date". On authenticity he says: "Very difficult to decide." He adds that dating may slightly favor pseudonymity."""
citations = [{ source = "brown-1997", locator = "ch. 35, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown argues that if Jude himself wrote it, he was one of the youngest brothers and "could have been alive as late as AD 90–100, which may be the most plausible date for the letter"."""
  citations = [{ source = "brown-1997", locator = "ch. 35, By and to whom, where, and when" }]
  verses = [{ ref = "Jude.1.17", link = "dates", note = "Jude speaks of the apostles as a past generation, which is used to date the letter." }]

[[positions]]
id = "carson-moo-mid-to-late-60s"
label = "Probably the middle to late 60s, no later than about 90, by Jude the Lord's brother"
tradition = "traditional"
earliest = 64
latest = 90
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo write the standard evangelical introduction to the New Testament, and they defend the traditional attribution to Jude, the brother of the Lord and of James. They say that if Jude the brother of the Lord wrote it, "the letter cannot be dated after about A.D. 90", and that if Jude used 2 Peter it comes after 64-65 (they note Bauckham's case for the 50s as well). They conclude: "We should probably date Jude also in the middle-to-late 60s". The span shown here runs from 64-65 to their outer limit of about 90, and is the editor's reading of those dates."""
citations = [{ source = "carson-moo-2005", locator = "pp. 690–692" }]

  [[positions.arguments]]
  stance = "for"
  text = """
They answer the three usual objections to authorship: Galilean origin does not rule out good Greek, verse 17 points to predictions of the apostles and not to a fixed tradition, and a later forger would have stressed the family tie. They conclude there is no reason not to take the letter's claim at face value."""
  citations = [{ source = "carson-moo-2005", locator = "pp. 691–692" }]
  verses = [{ ref = "Jude.1.1", link = "describes", note = "Jude calls himself 'Servant of Jesus Christ and brother of James', which is taken to mean Jude the Lord's brother." }]

[[positions]]
id = "ehrman-intro-late-first-century"
label = "Late first century; probably pseudepigraphic"
tradition = "critical"
earliest = 80
latest = 110
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook repeats the view of his 2013 book: Jude and 2 Peter "appear to be pseudonymous", "many critical scholars" see early Christian pseudepigraphy, and it "does not appear to be likely that Jesus' own brother wrote the book". He gives no firm year, so the span shown here follows his timeline chart, which places the General Epistles at "80-110", together with his remark that "If Jude can be dated near the end of the first century, 2 Peter must be somewhat later"."""
citations = [{ source = "ehrman-brief-intro-2017", locator = "pp. 20, 326, 336 approx." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman argues Jude's brother would have been a lower-class, Aramaic-speaking peasant, whereas the author wrote good Greek and knew apocryphal Jewish books, quoting a lost account of the fight over Moses' body (v. 9) and citing 1 Enoch as Scripture (v. 14)."""
  citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 326 approx." }]
  verses = [{ ref = "Jude.1.1", link = "describes", note = "The letter claims Jude, the brother of James, as its author." }, { ref = "Jude.1.14", link = "background", note = "Jude cites 1 Enoch as Scripture." }]
