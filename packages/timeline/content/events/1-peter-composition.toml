id = "1-peter-composition"
title = "Composition of 1 Peter"
axis = "composition"
category = "composition"
confidence = "contested"
status = "draft"
books = ["1Pet"]
summary = """
This asks who wrote 1 Peter and when. The letter names Peter as its author. Bart Ehrman argues Peter did not write it, and says it is "best located" between Nero and Trajan. He cites a view that "Babylon", a code name for Rome, points to after 70 CE. He warns this does not put it at the time of Pliny's letter, around 112 CE. The year bounds are the editor's reading of that. The traditional date is in Peter's life, which Ehrman places before 70 CE."""
verses = [
  { ref = "1Pet.1.1", link = "describes", note = "The letter names Peter as its author." },
  { ref = "1Pet.4.16", link = "background", note = "Ehrman: the author uses the word Christian as if it were in established use." },
  { ref = "1Pet.4.12-1Pet.4.17", link = "background", note = "Ehrman: suffering simply for the name Christian points to a time after Peter." },
  { ref = "1Pet.5.13", link = "background", note = "Ehrman: Babylon is a veiled name for Rome, which he says makes sense only after 70 CE." },
]

[[positions]]
id = "nero-to-trajan"
label = "Between Nero and Trajan (after 70 CE)"
tradition = "critical"
earliest = 70
latest = 112
held_by = "Bart D. Ehrman"
summary = """
Ehrman holds that Peter did not write 1 Peter. The bounds are the editor's: 70 is the CE year in the "Babylon" argument, and 112 is the Pliny correspondence that Ehrman says should not be used to pin the letter down."""
citations = [{ source = "ehrman-2013", locator = "PDF pp. 295, 320" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Ehrman: "By the time this letter was written, it had become commonplace for followers of Jesus to suffer persecution “as a Christian,” simply “for the name” (4:12–17).""""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 320" }]
  verses = [{ ref = "1Pet.4.12-1Pet.4.17", link = "background", note = "Persecution for the name Christian." }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Ehrman follows C. Hunzinger: "the veiled reference to Rome in the epithet “Babylon,” named as the place from which the author writes (5:13), makes sense only after 70 CE, years after Peter’s death.""""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 320" }]
  verses = [{ ref = "1Pet.5.13", link = "background", note = "Babylon as a name for Rome." }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Ehrman: "the author uses the term Christian (4:16) as if it were in established usage"."""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 319" }]
  verses = [{ ref = "1Pet.4.16", link = "background", note = "The word Christian." }]

  [[positions.arguments]]
  stance = "against"
  text = """
  Ehrman concedes 1 Peter is "the one book scholars have been most inclined to consider authentic". He also says of the date: "When the recognition arose afterward is uncertain"."""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 294, 320" }]

[[positions]]
id = "peter-wrote-it"
label = "Written by Peter, before about 70 CE"
tradition = "traditional"
earliest = 30
latest = 70
held_by = "The letter's own claim (Ehrman names no modern holder in the passages read)"
summary = """
Ehrman names no modern scholar for this view in the passages read. The letter claims Peter as its author. Ehrman places Peter's death before 70 CE, the upper bound. The lower bound, 30, is the editor's and is not from Ehrman."""
citations = [{ source = "ehrman-2013", locator = "PDF pp. 320" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Ehrman reports that Nero's persecution is "traditionally" thought to have led to Peter's martyrdom, which sets Peter's life as the time. He argues the later persecution "for the name" does not fit it."""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 320" }]

[[positions]]
id = "brown-70-90"
label = "More likely 70 to 90 CE, by a disciple of Peter at Rome"
tradition = "critical"
earliest = 70
latest = 90
held_by = "Raymond E. Brown"
summary = """
Brown's DATE line: "If written by Peter, 60–63; more likely 70–90." He thinks it possibly by Peter using a secretary, but more likely by a disciple carrying on Peter's heritage at Rome."""
citations = [{ source = "brown-1997", locator = "ch. 33, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown on "Babylon" as a name for Rome: it "makes better sense after 70, when the Romans had destroyed the second Temple"."""
  citations = [{ source = "brown-1997", locator = "ch. 33, From and to whom, where, and when" }]
  verses = [{ ref = "1Pet.5.13", link = "dates", note = "Babylon as a name for Rome." }]
