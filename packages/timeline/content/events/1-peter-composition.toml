id = "1-peter-composition"
title = "Composition of 1 Peter"
axis = "composition"
category = "composition"
confidence = "contested"
status = "sources-located"
books = ["1Pet"]
summary = """
This asks who wrote 1 Peter and when. The letter names Peter as its author, but Bart Ehrman argues Peter did not write it and says it is "best located" between Nero and Trajan. He cites the view that "Babylon", a code name for Rome, points to a date after 70 CE, while warning that this does not tie the letter to the time of Pliny's letter, around 112 CE. The year bounds shown are the editor's reading of that argument; the traditional date falls in Peter's own life, which Ehrman places before 70 CE."""
verses = [
  { ref = "1Pet.1.1", link = "describes", note = "The letter names Peter as its author." },
  { ref = "1Pet.4.16", link = "background", note = "Ehrman notes that the author uses the word Christian as if it were already in established use." },
  { ref = "1Pet.4.12-1Pet.4.17", link = "background", note = "Ehrman reads suffering simply for the name Christian as pointing to a time after Peter." },
  { ref = "1Pet.5.13", link = "background", note = "Ehrman reads Babylon as a veiled name for Rome, which he says makes sense only after 70 CE." },
]

[[positions]]
id = "nero-to-trajan"
label = "Between Nero and Trajan (after 70 CE)"
tradition = "critical"
earliest = 70
latest = 112
held_by = "Bart D. Ehrman"
summary = """
Ehrman holds that Peter did not write 1 Peter and that it belongs somewhere between Nero and Trajan. The span shown here is the editor's reading of his argument: 70 is the CE year behind the "Babylon" argument, and 112 marks the Pliny correspondence, which Ehrman says should not be used to pin the letter down."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 294, 320" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman argues from the kind of persecution the letter describes. Believers are suffering simply for bearing the name of Christ, which he sees as later than Peter's day: "By the time this letter was written, it had become commonplace for followers of Jesus to suffer persecution “as a Christian,” simply “for the name” (4:12–17).""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 320" }]
  verses = [{ ref = "1Pet.4.12-1Pet.4.17", link = "background", note = "1 Peter 4:12-17 speaks of suffering because one bears the name Christian, the persecution this argument uses to date the letter." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman follows C. Hunzinger in reading the letter's place of writing as a code name for Rome, and he treats that as a dating clue. In his words, "the veiled reference to Rome in the epithet “Babylon,” named as the place from which the author writes (5:13), makes sense only after 70 CE, years after Peter’s death.""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 320" }]
  verses = [{ ref = "1Pet.5.13", link = "background", note = "1 Peter 5:13 sends greetings from Babylon, which this argument reads as a name for Rome and so as a clue to the letter's date." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman also points to the author's vocabulary as a sign of settled usage, noting that "the author uses the term Christian (4:16) as if it were in established usage"."""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 319" }]
  verses = [{ ref = "1Pet.4.16", link = "background", note = "1 Peter 4:16 speaks of suffering as a Christian, a use of the name that this argument weighs in dating the letter." }]

  [[positions.arguments]]
  stance = "against"
  text = """
Ehrman admits that the case is not one-sided. He concedes 1 Peter is "the one book scholars have been most inclined to consider authentic", and on the question of when the later recognition arose he says only: "When the recognition arose afterward is uncertain"."""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 294, 320" }]

[[positions]]
id = "peter-wrote-it"
label = "Written by Peter, before about 70 CE"
tradition = "traditional"
earliest = 30
latest = 70
held_by = "The letter's own claim (Ehrman names no modern holder in the passages read)"
summary = """
Ehrman names no modern scholar for this view in the passages read; the claim comes from the letter itself, which presents Peter as its author. Ehrman places Peter's death before 70 CE, and that is the upper bound of the span. The lower bound, 30, is the editor's own and does not come from Ehrman."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 320" }]

  [[positions.arguments]]
  stance = "for"
  text = """
The traditional view rests on Peter's martyrdom, and Ehrman reports that Nero's persecution is "traditionally" thought to have led to it, which sets Peter's life as the time of writing. He argues that the later persecution "for the name" does not fit that setting."""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 320" }]

[[positions]]
id = "brown-70-90"
label = "More likely 70 to 90 CE, by a disciple of Peter at Rome"
tradition = "critical"
earliest = 70
latest = 90
held_by = "Raymond E. Brown"
summary = """
Raymond Brown allows that Peter may have written the letter with a secretary, but thinks it more likely the work of a disciple carrying on Peter's heritage at Rome. His summary line reads: "If written by Peter, 60–63; more likely 70–90." """
citations = [{ source = "brown-1997", locator = "ch. 33, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown, too, reads "Babylon" as a name for Rome and treats it as a clue to the date. He says it "makes better sense after 70, when the Romans had destroyed the second Temple"."""
  citations = [{ source = "brown-1997", locator = "ch. 33, From and to whom, where, and when" }]
  verses = [{ ref = "1Pet.5.13", link = "dates", note = "1 Peter 5:13 sends greetings from Babylon, which this argument reads as a name for Rome and so as a clue to the letter's date." }]

[[positions]]
id = "carson-moo-62-63"
label = "62-63 CE, by Peter, from Rome"
tradition = "traditional"
earliest = 62
latest = 63
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo write the standard evangelical introduction to the New Testament, and they defend Peter as the author. They read "Babylon" as Rome, so the letter was written there, and say that if Peter wrote it, it "almost surely was written in A.D. 62–63". They set the later limit by leaving time for 2 Peter before Peter's martyrdom."""
citations = [{ source = "carson-moo-2005", locator = "pp. 645–647" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Carson and Moo answer the objection from the letter's Greek by saying the case against Peter is "not at all a strong one". The Greek can be explained if Peter used a secretary, perhaps Silvanus, named in 1 Peter 5:12. They add that the idea of a forged letter being written and accepted in the early church is a bigger problem than the Greek."""
  citations = [{ source = "carson-moo-2005", locator = "pp. 645–646" }]
  verses = [{ ref = "1Pet.5.12", link = "describes", note = "1 Peter 5:12 says the letter was written through Silvanus, which this argument reads as a secretary who could have shaped the Greek." }]

[[positions]]
id = "ehrman-intro-first-century-pseudonymous"
label = "First century, possibly near its end; probably a pseudonymous letter"
tradition = "critical"
earliest = 65
latest = 100
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook repeats his 2013 view in simpler form: it is "probably best to regard 1 Peter as yet another example of Christian pseudepigraphy". He finds the date hard to fix but says that, if the letter belongs to Asia Minor, it "should probably be assigned to the first century, possibly near its end". The span shown here is the editor's reading; 65 is just after Peter's death, around 64, as the textbook gives it elsewhere."""
citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 322" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman reads "Babylon" in 1 Peter 5:13 as a code word for Rome. He also argues that the letter's polished Greek and its use of the Greek Old Testament are hard to credit to a Galilean fisherman, since few in Roman Palestine could read and far fewer could write literary Greek."""
  citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 320" }]
  verses = [{ ref = "1Pet.5.13", link = "dates", note = "1 Peter 5:13 sends greetings from 'Babylon', which this argument reads as a name for Rome and so as a clue to the letter's date." }]
