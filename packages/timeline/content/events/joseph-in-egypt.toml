id = "joseph-in-egypt"
title = "Joseph in Egypt"
axis = "narrative"
category = "biblical-narrative"
confidence = "speculative"
status = "claims-checked"
summary = """
Joseph is sold by his brothers to traders. He rises from slavery and prison to become Pharaoh's vizier, and he saves Egypt and his own family from famine. Many scholars read the story as a late wisdom novella (see the patriarchs issue). The one dating position here sets limits only on when his family arrived."""
verses = [
  { ref = "Gen.37.1-Gen.37.36", link = "describes", note = "Genesis tells how Joseph is sold into Egypt." },
  { ref = "Gen.39.1-Gen.39.23", link = "describes", note = "Genesis describes Joseph in Potiphar's house and in prison." },
  { ref = "Gen.40.1-Gen.41.57", link = "describes", note = "Genesis describes how Joseph interprets dreams, is raised up under Pharaoh, and serves through the years of plenty and famine." },
  { ref = "Gen.42.1-Gen.45.28", link = "describes", note = "Genesis tells how the brothers come to Egypt for grain and Joseph reveals himself." },
  { ref = "Gen.50.15-Gen.50.26", link = "describes", note = "Genesis tells how Joseph forgives his brothers and dies at 110 after making them swear about his bones." },
  { ref = "Exod.13.19", link = "alludes", note = "Exodus says Moses takes Joseph's bones, as Joseph had made Israel swear, which refers back to Joseph's death in Egypt." },
  { ref = "Josh.24.32", link = "alludes", note = "Joshua records that Joseph's bones were buried at Shechem, which refers back to his time in Egypt." },
  { ref = "Ps.105.16-Ps.105.22", link = "alludes", note = "Psalm 105 says God sent a man ahead and that Joseph was sold as a slave and made lord of Pharaoh's house." },
  { ref = "Acts.7.9-Acts.7.16", link = "alludes", note = "Stephen's speech says the jealous patriarchs sold Joseph, but God was with him." },
  { ref = "Heb.11.22", link = "alludes", note = "Hebrews says that by faith Joseph spoke of the exodus and gave orders about his bones." },
]

[[positions]]
id = "mid-19th-century"
label = "Family arrives in Egypt in the mid-19th century BCE"
tradition = "archaeological"
earliest = -1860
latest = -1840
held_by = "Bryant G. Wood"
summary = """
Wood identifies an Asiatic settlement at Pi-Ramesse, from the mid-19th century BC, with Jacob's family soon after they reached Egypt. Joseph's rise came before that arrival (Genesis 45-46). So this is a limit for the end of his rise, not a date for his life."""
citations = [{ source = "wood-2005", locator = "p. 488" }]

[[positions]]
id = "ussher-1715"
label = "Ussher, Annals: Joseph made governor, 1715 BC (age 30)"
tradition = "traditional"
earliest = -1715
latest = -1715
held_by = "James Ussher"
summary = """
Ussher has Joseph, aged 30, explain Pharaoh's dreams and be made governor in 1715 BC. The seven years of famine begin in 1708 BC. Ussher's 1650s count adds up the Bible's own life-spans and reign-lengths. It is not an archaeological date."""
citations = [{ source = "ussher-annals", locator = "1658 printing, p. 10 (Year of the World 2289 and 2296)" }]

[[positions]]
id = "finkelstein-silberman"
label = "Joseph story reflects the 7th-6th centuries BCE (Finkelstein and Silberman)"
tradition = "critical"
dates = "composition"
earliest = -700
latest = -550
held_by = "Israel Finkelstein and Neil Asher Silberman"
summary = """
Finkelstein and Silberman point to details in the Joseph story that fit the seventh and sixth centuries: the Egyptian names Zaphenath-paneah, Potiphar, Potiphera and Asenath were most popular then, and Egypt's fear of invasion from the east makes sense only after the Assyrian attacks. The range runs from the seventh century into the sixth, the date they give the Exodus story."""
citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 66-67" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  The accusation that the brothers are spies who "come to see the weakness of the land" fits an Egypt that was invaded from the east only from the seventh century."""
  citations = [{ source = "finkelstein-silberman-2002", locator = "p. 67" }]
  verses = [{ ref = "Gen.42.9", link = "alludes" }]

[[positions]]
id = "kitchen-mk-hyksos"
label = "Middle Kingdom to Hyksos setting, with later touches (Kitchen)"
tradition = "archaeological"
earliest = -1860
latest = -1540
held_by = "K. A. Kitchen"
summary = """
Kitchen, an Egyptologist who defends the Bible's reliability, says Joseph's setting fits the Twelfth to Hyksos period in the East Delta, about 1860-1540 BCE, and not the Ramesside age. He finds two or three dating horizons in the story: an early core, a thirteenth-century element, and possibly later adjustments."""
citations = [{ source = "kitchen-2003", locator = "pp. 345–348" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  The 20 shekels paid for Joseph match the early second-millennium slave price. Prices rose to 30 shekels and more by the fifteenth to thirteenth centuries and to 50-60 in first-millennium Assyria. Kitchen adds that the names Zaphenath-paneah and Asenath fit the Middle Kingdom."""
  citations = [{ source = "kitchen-2003", locator = "pp. 345–346" }]
  verses = [
    { ref = "Gen.37.28", link = "dates" },
    { ref = "Gen.41.45", link = "dates" },
  ]

  [[positions.arguments]]
  stance = "for"
  text = """
  "The land of Rames(s)es" in Genesis 47:11 is Ramesses II "at the earliest". It is not said by any character but comes from the narrator or a later updater, so Kitchen sees a thirteenth-century horizon in the story. He also notes that Joseph's age of 110 was the Egyptian ideal, most often mentioned in the Ramesside period, and may reflect the same later narrator."""
  citations = [
    { source = "kitchen-2003", locator = "p. 348" },
    { source = "kitchen-2003", locator = "p. 351" },
  ]
  verses = [
    { ref = "Gen.47.11", link = "dates" },
    { ref = "Gen.50.22", link = "dates" },
  ]
