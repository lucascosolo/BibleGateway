id = "joseph-in-egypt"
title = "Joseph in Egypt"
axis = "narrative"
category = "biblical-narrative"
confidence = "speculative"
status = "draft"
summary = """
Joseph, sold by his brothers to traders, rises from slavery and prison to become Pharaoh's vizier and saves Egypt and his family from famine. The story is widely read as a late wisdom novella (see the patriarchs issue); the one dating position here bounds only the arrival of his family."""
verses = [
  { ref = "Gen.37.1-Gen.37.36", link = "describes", note = "Sold into Egypt" },
  { ref = "Gen.39.1-Gen.39.23", link = "describes", note = "Potiphar's house and prison" },
  { ref = "Gen.40.1-Gen.41.57", link = "describes", note = "Dreams interpreted; elevation under Pharaoh; the years of plenty and famine" },
  { ref = "Gen.42.1-Gen.45.28", link = "describes", note = "The brothers come for grain; Joseph reveals himself" },
  { ref = "Gen.50.15-Gen.50.26", link = "describes", note = "Joseph forgives his brothers; his death at 110 and his oath about his bones" },
  { ref = "Exod.13.19", link = "alludes", note = "Moses takes Joseph's bones, as Joseph had made Israel swear" },
  { ref = "Josh.24.32", link = "alludes", note = "Joseph's bones buried at Shechem" },
  { ref = "Ps.105.16-Ps.105.22", link = "alludes", note = "God sent a man ahead, Joseph sold as a slave, made lord of Pharaoh's house" },
  { ref = "Acts.7.9-Acts.7.16", link = "alludes", note = "Stephen: the patriarchs, jealous, sold Joseph, but God was with him" },
  { ref = "Heb.11.22", link = "alludes", note = "By faith Joseph spoke of the exodus and gave instructions about his bones" },
]

[[positions]]
id = "mid-19th-century"
label = "Family arrives in Egypt in the mid-19th century BCE"
tradition = "archaeological"
earliest = -1860
latest = -1840
held_by = "Bryant G. Wood"
summary = """
Wood identifies a mid-19th-century BC Asiatic settlement at Pi-Ramesse with Jacob's family \
shortly after their arrival in Egypt. Joseph's rise precedes that arrival (Genesis 45-46), so \
this is a bracket for the end of his rise, not a date for his life."""
citations = [{ source = "wood-2005", locator = "p. 488" }]

