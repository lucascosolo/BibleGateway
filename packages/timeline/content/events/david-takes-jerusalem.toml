id = "david-takes-jerusalem"
title = "David takes Jerusalem"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
David captures the Jebusite stronghold of Zion and makes it the city of David. Before that he had ruled over Judah from Hebron for seven years and six months."""
verses = [
  { ref = "2Sam.5.6-2Sam.5.10", link = "describes", note = "The capture of the stronghold of Zion" },
  { ref = "1Chr.11.4-1Chr.11.9", link = "describes", note = "The parallel in Chronicles" },
  { ref = "2Sam.5.5", link = "dates", note = "Seven years and six months at Hebron, then thirty-three in Jerusalem" },
  { ref = "Ps.132.13", link = "alludes", note = "'Yahweh has chosen Zion'" },
  { ref = "Ps.78.70", link = "alludes", note = "God chose David his servant" },
]

[[positions]]
id = "c-1002"
label = "c. 1002-1001 BCE (derived)"
tradition = "chronological"
earliest = -1002
latest = -1001
held_by = "Rodger C. Young"
summary = """
This date is worked out by the editor and is not stated by Young. It takes Young's conjectural start of David's reign (1009t?) and subtracts the 7.5 years at Hebron from 2 Samuel 5:5. Treat it as approximate."""
citations = [{ source = "young-2005", locator = "Table 2, p. 246" }]

[[positions]]
id = "fs-village"
label = "A modest highland village in David's time"
tradition = "archaeological"
earliest = -1005
latest = -970
held_by = "Israel Finkelstein and Neil Asher Silberman"
summary = """
Finkelstein and Silberman use David's reign of c. 1005-970 BCE (Galil's dates) and think he did take Jerusalem. They find no evidence that it was more than a typical hill-country village, and no sign of a great empire.
"""
citations = [{ source = "finkelstein-silberman-2002", locator = "p. 131" }, { source = "finkelstein-silberman-2002", locator = "p. 142" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Excavations in the City of David found Middle Bronze and later Iron Age remains but little tenth-century pottery and no monumental building. The "most optimistic assessment" is a limited village.
"""
  citations = [{ source = "finkelstein-silberman-2002", locator = "p. 133" }]
  verses = [{ ref = "2Sam.5.6", link = "describes" }]
