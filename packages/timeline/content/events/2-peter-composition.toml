id = "2-peter-composition"
title = "Composition of 2 Peter"
axis = "composition"
category = "composition"
confidence = "contested"
status = "sources-located"
books = ["2Pet"]
summary = """
This asks who wrote 2 Peter and when. The letter names Simon Peter as its author, but Ehrman says 2 Peter is, more than any other New Testament writing, widely recognised as forged. The only date he gives in the passages read is "the end of the first century, at best" for the situation it assumes, so the range shown below is the editor's bracket around that remark."""
verses = [
  { ref = "2Pet.1.1", link = "describes", note = "The letter names Peter as its author." },
  { ref = "2Pet.1.12-2Pet.1.14", link = "background", note = "Ehrman reads the author's claim to know his death is near as a testament written as fiction." },
  { ref = "2Pet.3.1", link = "background", note = "Ehrman takes the author's reference to an earlier letter to mean 1 Peter." },
  { ref = "2Pet.3.4", link = "background", note = "Ehrman takes the remark that the fathers have died as a sign that much time has passed." },
  { ref = "2Pet.3.15-2Pet.3.16", link = "background", note = "Ehrman notes that the author knows a collection of Paul's letters already treated as scripture." },
]

[[positions]]
id = "end-of-first-century-or-later"
label = "End of the first century or later"
tradition = "critical"
earliest = 100
latest = 150
held_by = "Bart D. Ehrman"
summary = """
Ehrman holds that 2 Peter came into existence long after Peter's death. The lower bound of the span, 100, follows his phrase "end of the first century, at best". The upper bound of 150 is the editor's and is not from Ehrman."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 294, 295" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman points first to the letter's unusual vocabulary, which sets it apart from the rest of the New Testament: "By Elliott’s count, there are proportionally more hapax legomena in 2 Peter than in any other writing of the New Testament": 58 of its 402 words, or 14.4 percent."""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 294" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman reads the letter's complaint about the delay of the end as evidence that a generation had passed: "we are told that “the fathers” have “fallen asleep” (i.e., died) since the original promises of the coming end (3:4).""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 295" }]
  verses = [{ ref = "2Pet.3.4", link = "background", note = "2 Peter 3:4 has scoffers say that the fathers have died, which this argument reads as a sign that much time has passed." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman treats Peter's farewell speech in 1:12–14 as a literary device rather than a real deathbed word: "As with all Testaments, this is a fiction put on the pen of someone already residing comfortably in his tomb.""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 295" }]
  verses = [{ ref = "2Pet.1.12-2Pet.1.14", link = "background", note = "2 Peter 1:12-14 has the author claim to know his death is near, which this argument reads as a feigned testament." }]

  [[positions.arguments]]
  stance = "for"
  text = """
In 3:15–16 the author knows a collection of Paul's letters held as scripture, and Ehrman sees that as a late marker: "It is hard to imagine any such situation before the end of the first century, at best.""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 295" }]
  verses = [{ ref = "2Pet.3.15-2Pet.3.16", link = "background", note = "2 Peter 3:15-16 refers to Paul's letters alongside the other scriptures, which this argument takes as a sign of a collection already in use." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman argues 2 Peter leans heavily on Jude, which pushes it later still: "By Elliott’s count, nineteen of Jude’s twenty-five verses reappear in modified form in 2 Peter." He thinks Jude is itself late, so 2 Peter is "later still"."""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 295" }]

[[positions]]
id = "peter-wrote-it"
label = "Written by Peter, before about 70 CE"
tradition = "traditional"
earliest = 30
latest = 70
held_by = "The letter's own claim (Ehrman names no modern holder in the passages read)"
summary = """
Ehrman names no modern scholar for this view in the passages read; the claim comes from the letter itself, which presents Peter as its author. Ehrman places Peter's death before 70 CE, and that is the upper bound of the span. The lower bound of 30 is the editor's."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 293, 320" }]

  [[positions.arguments]]
  stance = "against"
  text = """
Ehrman does not endorse this view, but he shows that doubt about it is ancient. Didymus the Blind wrote: "We must therefore not be ignorant of the fact that the epistle at hand is forged". Eusebius said: "the second Petrine epistle we have been taught to regard as uncanonical"."""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 294" }]

[[positions]]
id = "brown-130"
label = "About 130 CE, pseudonymous"
tradition = "critical"
earliest = 120
latest = 140
held_by = "Raymond E. Brown"
summary = """
Raymond Brown dates 2 Peter late and calls it pseudonymous, written to present a final message with advice from Peter. His summary line reads: "After Pauline letters; after I Pet and Jude; most likely AD 130, give or take a decade.""""
citations = [{ source = "brown-1997", locator = "ch. 36, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown sees the letter as a response to disappointed hope, written "after the apostolic generation was dead and expectations of the second coming during their lifetime had been disappointed"."""
  citations = [{ source = "brown-1997", locator = "ch. 36, By and to whom, where, and when" }]
  verses = [{ ref = "2Pet.3.4", link = "dates", note = "2 Peter 3:4 has scoffers asking where the promise of his coming is, a delay this argument uses to date the letter." }]

[[positions]]
id = "carson-moo-before-65"
label = "By Peter shortly before his death, before about 65 CE, from Rome"
tradition = "traditional"
earliest = 63
latest = 65
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo write the standard evangelical introduction to the New Testament, and they argue for Peter as the author of 2 Peter as well as 1 Peter. If Peter wrote it, they say, the letter "must be dated before about A.D. 65", the year of his martyrdom under Nero, and he writes from Rome because he senses his death is near. The start of the span, 63, is the editor's, set by their dating of 1 Peter."""
citations = [{ source = "carson-moo-2005", locator = "pp. 659–663" }, { source = "carson-moo-2005", locator = "pp. 646-647" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Carson and Moo answer the case for a late date on several fronts. They argue that Peter's mention of Paul's letters in 2 Peter 3:15-16 does not require a fixed collection or a late date. They also hold that the weak attestation of the letter is exaggerated, and that forged letters were rejected by the early church, so a forgery would be unlikely to be accepted."""
  citations = [{ source = "carson-moo-2005", locator = "pp. 659–662" }]
  verses = [{ ref = "2Pet.3.15-2Pet.3.16", link = "background", note = "Paul's letters are read as known to Peter, with no fixed collection implied." }]

[[positions]]
id = "ehrman-intro-after-jude"
label = "After Jude, so after the first century began to close; pseudonymous"
tradition = "critical"
earliest = 100
latest = 115
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook says "the vast majority of critical scholars agree" that Simon Peter did not write 2 Peter, and counts it among pseudonymous writings in Peter's name. He says that if Jude is near the end of the first century, 2 Peter "must be somewhat later", and elsewhere puts 2 Peter "some thirty years after Matthew". The span of 100 to 115 is the editor's reading of those two statements, taking Matthew at 80 to 85; the view is the same as in his 2013 book."""
citations = [{ source = "ehrman-brief-intro-2017", locator = "pp. 328, 337 approx." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman argues 2 Peter takes much of chapter 2 from Jude, and that 2 Peter 3:15-16 speaks of Paul's letters as scripture ("as they do the other scriptures"). A letter written after Paul's collected letters were read this way cannot be by Peter, who died around 64."""
  citations = [{ source = "ehrman-brief-intro-2017", locator = "pp. 328-330 approx." }]
  verses = [{ ref = "2Pet.3.15-2Pet.3.16", link = "dates", note = "2 Peter 3:15-16 ranks Paul's letters with 'the other scriptures', which this argument uses to date the letter." }, { ref = "2Pet.2.1", link = "background", note = "Chapter 2 is largely taken over from Jude." }]
