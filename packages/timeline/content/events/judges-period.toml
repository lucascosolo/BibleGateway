id = "judges-period"
title = "The period of the judges"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "sources-located"
summary = """
These are the generations between Joshua and the kings. Tribal leaders, the judges, rescue Israel from its oppressors, again and again. The cycle runs from turning away from God, to oppression, to a cry for help, to rescue. The datable anchors sit inside a disputed range. How far the book can be trusted as history is itself debated (see the linked issues). The Introduction to Thiele's book puts the critical view bluntly: the Hebrew stories of the judges "can be dated only in wide and sweeping generalizations", archaeological dating without written finds "can do more than indicate a period, a half or quarter century, or happily a decade" only seldom, and "efforts to demonstrate an accurate chronology simply do not merit serious consideration"."""
verses = [
  { ref = "Judg.2.6-Judg.3.6", link = "describes", note = "Judges opens with an introduction to the repeating cycle of the period and the nations left in the land." },
  { ref = "Judg.3.7-Judg.16.31", link = "describes", note = "Judges tells the stories of the judges, from Othniel to Samson." },
  { ref = "Judg.17.1-Judg.21.25", link = "describes", note = "Judges closes with episodes set at a time when there is no king in Israel." },
  { ref = "Judg.11.26", link = "dates", note = "Jephthah says Israel has held the Arnon region for 300 years, a number used to date the period." },
  { ref = "1Kgs.6.1", link = "dates", note = "Kings counts 480 years from the exodus to Solomon's fourth year, a figure used to date the period." },
  { ref = "1Sam.12.9-1Sam.12.11", link = "alludes", note = "Samuel recalls Jerubbaal, Barak, Jephthah and Samson, which refers back to the judges." },
  { ref = "Ps.78.56-Ps.78.64", link = "alludes", note = "Psalm 78 recalls Israel's rebellion in the time of the judges, up to the fall of Shiloh." },
  { ref = "Ps.106.34-Ps.106.46", link = "alludes", note = "Psalm 106 says they did not destroy the peoples and that God rescued them again and again, which echoes the cycle of the judges." },
  { ref = "Neh.9.26-Neh.9.28", link = "alludes", note = "Nehemiah's prayer recalls disobedience and rescue by deliverers, which refers back to the judges." },
  { ref = "Acts.13.20", link = "alludes", note = "Paul says in Acts that after that God gave them judges until Samuel." },
  { ref = "Heb.11.32-Heb.11.34", link = "alludes", note = "Hebrews names Gideon, Barak, Samson and Jephthah among the faithful, which refers back to the judges." },
]

[[positions]]
id = "wood-frame"
label = "Early-date framework (c. 1300-1073 BCE anchors)"
tradition = "chronological"
earliest = -1300
latest = -1073
held_by = "Bryant G. Wood"
summary = """
In Wood's early-date scheme, Eglon's palace at Jericho dates to about 1300 BC (Judges 3:12-30) and Deborah and Barak to about 1230 BC. Estimates for the start of Jephthah's time as judge run from 1130 BC (Bimson) through 1086 (Walton) and 1078 (L. Wood) to 1073 (Kitchen). The range runs from the first of these anchors to the last estimate. It is not a claim about where the period ends."""
citations = [{ source = "thiele-1983-introduction", locator = "p. 26" }, { source = "wood-2005", locator = "pp. 477, 488" }]

[[positions]]
id = "fs-highland-settlement"
label = "Highland villages c. 1200-1000 BCE (Finkelstein and Silberman)"
tradition = "archaeological"
earliest = -1200
latest = -1000
held_by = "Israel Finkelstein and Neil Asher Silberman"
summary = """
Finkelstein and Silberman describe a third wave of highland settlement beginning around 1200 BCE, with about 250 sites and 45,000 people. They give the Iron Age I period as about 1150-900 BCE. They say the first Israelites were mostly local people who settled after the Canaanite collapse. This is an archaeological horizon, not a date for the book of Judges."""
citations = [{ source = "finkelstein-silberman-2002", locator = "pp. 114-115" }, { source = "finkelstein-silberman-2002", locator = "p. 118" }]
