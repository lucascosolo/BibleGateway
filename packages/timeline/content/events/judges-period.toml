id = "judges-period"
title = "The period of the judges"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
The generations between Joshua and the monarchy, in which tribal leaders (the judges) deliver Israel from oppressors in a repeated cycle of apostasy, oppression, cry and rescue. The datable anchors sit inside a disputed range; the book's historical value is itself debated (see the linked issues)."""
verses = [
  { ref = "Judg.2.6-Judg.3.6", link = "describes", note = "Programmatic introduction: the cycle and the nations left in the land" },
  { ref = "Judg.3.7-Judg.16.31", link = "describes", note = "The accounts of the judges from Othniel to Samson" },
  { ref = "Judg.17.1-Judg.21.25", link = "describes", note = "Closing episodes; no king in Israel" },
  { ref = "Judg.11.26", link = "dates", note = "Jephthah: Israel has held the Arnon region for 300 years" },
  { ref = "1Kgs.6.1", link = "dates", note = "480 years from the exodus to Solomon's fourth year" },
  { ref = "1Sam.12.9-1Sam.12.11", link = "alludes", note = "Samuel recalls Jerubbaal, Barak, Jephthah and Samson" },
  { ref = "Ps.78.56-Ps.78.64", link = "alludes", note = "Israel's rebellion in the time of the judges, up to Shiloh's fall" },
  { ref = "Ps.106.34-Ps.106.46", link = "alludes", note = "They did not destroy the peoples; he often delivered them" },
  { ref = "Neh.9.26-Neh.9.28", link = "alludes", note = "Disobedience and deliverance by saviours" },
  { ref = "Acts.13.20", link = "alludes", note = "Paul: after that he gave them judges until Samuel" },
  { ref = "Heb.11.32-Heb.11.34", link = "alludes", note = "Gideon, Barak, Samson, Jephthah named among the faithful" },
]

[[positions]]
id = "wood-frame"
label = "Early-date framework (c. 1300-1073 BCE anchors)"
tradition = "chronological"
earliest = -1300
latest = -1073
held_by = "Bryant G. Wood"
summary = """
In Wood's early-date scheme Eglon's palace at Jericho dates c. 1300 BC (Judges 3:12-30) and \
Deborah and Barak c. 1230 BC; estimates for the start of Jephthah's judgeship run from 1130 BC \
(Bimson) through 1086 (Walton) and 1078 (L. Wood) to 1073 (Kitchen). The range runs from the \
first of these anchors to the last estimate; it is not a claim about where the period ends."""
citations = [{ source = "wood-2005", locator = "pp. 477, 488" }]
