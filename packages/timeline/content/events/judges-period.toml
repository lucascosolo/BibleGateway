id = "judges-period"
title = "The period of the judges"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
These are the generations between Joshua and the kings. Tribal leaders, the judges, rescue Israel from its oppressors, again and again. The cycle runs from turning away from God, to oppression, to a cry for help, to rescue. The datable anchors sit inside a disputed range. How far the book can be trusted as history is itself debated (see the linked issues)."""
verses = [
  { ref = "Judg.2.6-Judg.3.6", link = "describes", note = "The introduction: the repeating cycle, and the nations left in the land" },
  { ref = "Judg.3.7-Judg.16.31", link = "describes", note = "The stories of the judges, from Othniel to Samson" },
  { ref = "Judg.17.1-Judg.21.25", link = "describes", note = "The closing episodes. There is no king in Israel" },
  { ref = "Judg.11.26", link = "dates", note = "Jephthah says Israel has held the Arnon region for 300 years" },
  { ref = "1Kgs.6.1", link = "dates", note = "480 years from the exodus to Solomon's fourth year" },
  { ref = "1Sam.12.9-1Sam.12.11", link = "alludes", note = "Samuel recalls Jerubbaal, Barak, Jephthah and Samson" },
  { ref = "Ps.78.56-Ps.78.64", link = "alludes", note = "Israel's rebellion in the time of the judges, up to the fall of Shiloh" },
  { ref = "Ps.106.34-Ps.106.46", link = "alludes", note = "They did not destroy the peoples. He rescued them again and again" },
  { ref = "Neh.9.26-Neh.9.28", link = "alludes", note = "Disobedience, and rescue by deliverers" },
  { ref = "Acts.13.20", link = "alludes", note = "Paul says that after that God gave them judges until Samuel" },
  { ref = "Heb.11.32-Heb.11.34", link = "alludes", note = "Gideon, Barak, Samson and Jephthah are named among the faithful" },
]

[[positions]]
id = "wood-frame"
label = "Early-date framework (c. 1300-1073 BCE anchors)"
tradition = "chronological"
earliest = -1300
latest = -1073
held_by = "Bryant G. Wood"
summary = """
In Wood's early-date scheme, Eglon's palace at Jericho dates to about 1300 BC (Judges 3:12-30) and Deborah and Barak to about 1230 BC. Estimates for the start of Jephthah's time as judge run from 1130 BC (Bimson) through 1086 (Walton) and 1078 (L. Wood) to 1073 (Kitchen). The range runs from the first of these anchors to the last estimate. It is not a claim about where the period ends."""
citations = [{ source = "wood-2005", locator = "pp. 477, 488" }]
