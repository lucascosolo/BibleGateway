id = "ezra-mission"
title = "Ezra's mission to Jerusalem"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "claims-checked"
summary = """
Ezra goes up to Jerusalem in the seventh year of "Artaxerxes the king", and the text does not say which Artaxerxes. Artaxerxes I gives 458 BCE, the date Kitchen defends; Artaxerxes II gives 398 BCE, the alternative McDonald records and the reign to which Batten (1913) assigned Ezra; Josephus reads the king as "Xerxes"."""
verses = [
  { ref = "Ezra.7.7", link = "describes", note = "Ezra 7:7 says exiles go up in the seventh year of Artaxerxes." },
  { ref = "Ezra.7.8", link = "describes", note = "Ezra 7:8 says Ezra arrives in the fifth month of the seventh year." },
]

[[positions]]
id = "398"
label = "398 BCE (Artaxerxes II, seventh year)"
tradition = "critical"
earliest = -398
latest = -398
held_by = "Lee Martin McDonald (as the alternative)"
summary = """
McDonald dates Ezra and Nehemiah to about 458 BCE if the king is Artaxerxes I, or to 398 BCE if he is Artaxerxes II, and leaves the choice open."""
citations = [{ source = "mcdonald-2017-vol1", locator = "p. 52" }, { source = "batten-1913-ezra", locator = "pp. 29, 47" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Batten argues that Ezra and Nehemiah could not have worked at the same time: Nehemiah's story makes "no genuine reference" to Ezra, Nehemiah meets mixed marriages as a new problem, and his Jerusalem is empty while Ezra's is full of people. Ezra's prayer thanks God for a wall in Jerusalem, which Batten takes to be Nehemiah's. He puts Ezra in the reign of Artaxerxes II, "in 397 or later", without fixing the year."""
  citations = [{ source = "batten-1913-ezra", locator = "pp. 28-29" }]

[[positions]]
id = "458"
label = "458 BCE (Artaxerxes I, seventh year)"
tradition = "traditional"
earliest = -458
latest = -457
held_by = "K. A. Kitchen"
summary = """
Kitchen places Ezra's visit in Year 7 of Artaxerxes I, 458, and says alternative interpretations fail to account for the evidence any better. Lim reports that Kyong-Jin Lee dates Ezra 7:8 to 458 from the Persian-Egyptian conflict. Josephus puts the arrival in the seventh year of "Xerxes" (his name for the king)."""
citations = [{ source = "kitchen-2003", locator = "p. 74" }, { source = "lim-2013", locator = "p. 60" }, { source = "josephus-whiston", locator = "Antiquities 11.5.1-2" }]
