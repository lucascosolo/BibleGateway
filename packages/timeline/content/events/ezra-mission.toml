id = "ezra-mission"
title = "Ezra's mission to Jerusalem"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
Ezra goes up to Jerusalem in the seventh year of "Artaxerxes the king". Scholars dispute which Artaxerxes this is. Artaxerxes I gives 458 BCE, the most widely accepted date. Artaxerxes II gives 398 BCE. A third group reads "seventh" as a scribe's mistake."""
verses = [
  { ref = "Ezra.7.7", link = "describes", note = "Exiles go up in the seventh year of Artaxerxes" },
  { ref = "Ezra.7.8", link = "describes", note = "Ezra arrives in the fifth month of the seventh year" },
]

[[positions]]
id = "458"
label = "458 BCE (Artaxerxes I, seventh year)"
tradition = "traditional"
earliest = -458
latest = -457
held_by = "Edwin M. Yamauchi"
summary = """
Yamauchi, in the Expositor's Bible Commentary (abridged), calls Artaxerxes I the traditional view and says "which we believe is correct". On that view Ezra arrived in 458 (457)."""
citations = [{ source = "preceptaustin-ezra-7", locator = "quotation from Yamauchi, Expositor's Bible Commentary (Abridged)" }]

[[positions]]
id = "398"
label = "398 BCE (Artaxerxes II, seventh year)"
tradition = "critical"
earliest = -398
latest = -398
held_by = "Albin van Hoonacker"
summary = """
On this view Nehemiah comes before Ezra, and Ezra came in 398 BCE, the seventh year of Artaxerxes II (404-359 BCE). Wikipedia's Albin van Hoonacker article lists two of his works. They are his 1890 "Nehemie et Esdras. Nouvelle hypothese sur la chronologie de l'epoque de la Restauration juive" and his 1892 "Nehemie en l'an 20 d'Artaxerxes I. Esdras en l'an 7 d'Artaxerxes II". These argue for Ezra in year 7 of Artaxerxes II. The 398 conversion is the Ezra article's."""
citations = [{ source = "wikipedia-albin-van-hoonacker", locator = "list of works, 1890 and 1892" }, { source = "wikipedia-ezra" }, { source = "preceptaustin-ezra-7" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Nehemiah and Ezra seem to know nothing of each other, and their missions do not overlap. Reversing the order puts Ezra about fifty years after Nehemiah."""
  citations = [{ source = "wikipedia-artaxerxes-i" }, { source = "wikipedia-ezra" }]
