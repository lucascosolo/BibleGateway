Wikipedia says Acts suggests the conversion occurred four to seven years after the crucifixion; \
the years here are that interval applied to a 30 CE or 33 CE crucifixion (34–40), my computation, \
not a cited scholar's."""
citations = [{ source = "wikipedia-conversion-of-paul" }]

