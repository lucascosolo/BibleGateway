summary = """
Wikipedia reports that Paul's conversion has been dated to 31–36 CE by Bromley (1979), Barnett \
(2002) and Niswonger (1992); the page gives surnames only and does not name the works."""
citations = [{ source = "wikipedia-paul-the-apostle" }]

