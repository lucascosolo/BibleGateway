id = "conversion-of-paul"
title = "The conversion of Paul"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
Paul the persecutor encounters the risen Jesus near Damascus and becomes an apostle. Acts tells \
it three times; Paul alludes to it in Galatians and 1 Corinthians. Scholars date it to 31–36 CE."""
verses = [
  { ref = "Acts.9.1-Acts.9.19", link = "describes", note = "Luke's narrative on the road to Damascus" },
  { ref = "Acts.22.3-Acts.22.16", link = "describes", note = "Paul's account to the crowd in Jerusalem" },
  { ref = "Acts.26.9-Acts.26.18", link = "describes", note = "Paul's account before Agrippa" },
  { ref = "Gal.1.13-Gal.1.17", link = "alludes", note = "God was pleased to reveal his Son to me" },
  { ref = "1Cor.15.8-1Cor.15.10", link = "alludes", note = "last of all he appeared also to me" },
  { ref = "1Cor.9.1", link = "alludes", note = "have I not seen Jesus our Lord" },
  { ref = "1Tim.1.12-1Tim.1.16", link = "alludes", note = "formerly a blasphemer and persecutor" },
]

