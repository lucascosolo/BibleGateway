id = "conversion-of-paul"
title = "The conversion of Paul"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
Paul, who had persecuted Christians, meets the risen Jesus near Damascus and becomes an apostle. Acts tells the story three times, and Paul refers to it in Galatians and 1 Corinthians. Scholars date it to 31-36 CE."""
verses = [
  { ref = "Acts.9.1-Acts.9.19", link = "describes", note = "Acts 9:1-19 is Luke's account of Paul's conversion on the road to Damascus." },
  { ref = "Acts.22.3-Acts.22.16", link = "describes", note = "In Acts 22:3-16 Paul tells the story to the crowd in Jerusalem." },
  { ref = "Acts.26.9-Acts.26.18", link = "describes", note = "In Acts 26:9-18 Paul tells the story again before Agrippa." },
  { ref = "Gal.1.13-Gal.1.17", link = "alludes", note = "In Galatians 1:13-17 Paul says God was pleased to reveal his Son to him." },
  { ref = "1Cor.15.8-1Cor.15.10", link = "alludes", note = "In 1 Corinthians 15:8-10 Paul says the risen Christ appeared last of all to him." },
  { ref = "1Cor.9.1", link = "alludes", note = "In 1 Corinthians 9:1 Paul asks whether he has not seen Jesus our Lord." },
  { ref = "1Tim.1.12-1Tim.1.16", link = "alludes", note = "1 Timothy 1:12-16 describes Paul as formerly a blasphemer and persecutor." },
]

[[positions]]
id = "31-36"
label = "31–36 CE"
tradition = "chronological"
earliest = 31
latest = 36
held_by = "Bromley (1979), Barnett (2002), Niswonger (1992)"
summary = """
Wikipedia reports that Bromley (1979), Barnett (2002) and Niswonger (1992) have dated Paul's conversion to 31-36 CE. The page gives surnames only and does not name their works, so the scholarship behind the range could not be checked further."""
citations = [{ source = "wikipedia-paul-the-apostle" }]

[[positions]]
id = "4-7-years-after"
label = "Four to seven years after the crucifixion"
tradition = "critical"
earliest = 34
latest = 40
summary = """
Wikipedia says Acts suggests the conversion came four to seven years after the crucifixion. The years shown here (34-40) are that gap added to a crucifixion in 30 CE or 33 CE; the sum is the cataloguer's own, not a cited scholar's."""
citations = [{ source = "wikipedia-conversion-of-paul" }]

[[positions]]
id = "33-36"
label = "33-36 CE"
tradition = "chronological"
earliest = 33
latest = 36
summary = """
Wikipedia's Chronology of Jesus (section "Conversion of Paul") gives a general estimate and places it relative to the crucifixion: "The generally accepted scholarly estimate for the date of conversion of Paul is AD 33-36, placing the death of Jesus before this date range." No individual holder is named on that page, and Riesner, Jewett and Luedemann were not found on the pages read."""
citations = [{ source = "wikipedia-chronology-of-jesus", locator = "section Conversion of Paul" }]

[[positions]]
id = "brown-traditional-36"
label = "ca. 36 CE (Brown, Traditional Chronology)"
tradition = "chronological"
earliest = 36
latest = 36
held_by = "Raymond E. Brown (Traditional Chronology)"
summary = """
Raymond Brown follows the Traditional Chronology and puts the conversion at ca. 36. He writes: "many would date Paul's conversion ca. 36, and his escape from Damascus and going to Jerusalem ca. 39." His Table 6 gives 36 (escape and Jerusalem visit 39)."""
citations = [{ source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown reasons from two details in Paul's letters. Gal 1:17-18 implies about three years between the conversion and the Jerusalem visit, and 2 Cor 11:32-33 has Aretas trying to seize Paul at Damascus, where Brown notes Caligula (37-41) gave Aretas control of the city. Hence the visit ca. 39 and the conversion ca. 36."""
  citations = [{ source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" }]
  verses = [
    { ref = "Gal.1.17-Gal.1.18", link = "dates" },
    { ref = "2Cor.11.32-2Cor.11.33", link = "dates" },
  ]

[[positions]]
id = "brown-revisionist-30-34"
label = "30-34 CE (Revisionist chronology, per Brown)"
tradition = "critical"
earliest = 30
latest = 34
held_by = "Revisionist chronology (Knox, Lüdemann, Jewett, Murphy-O'Connor, Donfried, as summarized by Brown)"
summary = """
Brown's Table 6 gives the Revisionist conversion as 30/34, and the individual scholars differ: Buck/Taylor 32, Knox 34 or 37, Lüdemann 30 (33), Jewett Oct. 34, Murphy-O'Connor ca. 33, Donfried 33. Brown himself follows the Traditional column "because it seems more reasonable to me"."""
citations = [{ source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown says these dates depend on the crucifixion date (Lüdemann 27 or 30, Jewett 33 or 30, Donfried 30) and on how far Acts is trusted. The Revisionist column puts the Jerusalem visit at 33/37."""
  citations = [{ source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" }]
  verses = [
    { ref = "Gal.1.17-Gal.1.18", link = "dates" },
    { ref = "2Cor.11.32-2Cor.11.33", link = "dates" },
  ]
