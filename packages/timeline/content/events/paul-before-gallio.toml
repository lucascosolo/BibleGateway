id = "paul-before-gallio"
title = "Paul before Gallio at Corinth"
axis = "narrative"
category = "political"
confidence = "firm"
status = "draft"
summary = """
Paul's opponents bring him before Gallio, the Roman governor of Achaia, at Corinth. Gallio refuses to judge the case. A stone inscription from Delphi, carrying a letter of Emperor Claudius, dates Gallio's time in office to about 51 to 52 CE. That is the best-known date in Paul's life."""
verses = [
  { ref = "Acts.18.12-Acts.18.17", link = "describes", note = "the Jews bring Paul before Gallio's judgment seat" },
  { ref = "Acts.18.1-Acts.18.11", link = "background", note = "Paul's eighteen months in Corinth" },
]

[[positions]]
id = "51-52"
label = "51–52 CE"
tradition = "chronological"
earliest = 51
latest = 52
summary = """
Gallio's time as governor can be dated fairly closely to 51 to 52 CE. The Delphi inscription mentions Claudius's twenty-sixth acclamation (a public salute as victorious emperor), and that corresponds to 52 CE."""
citations = [{ source = "wikipedia-gallio" }]

[[attestations]]
artifact = "gallio-inscription"
relation = "corroborates"
note = """
Claudius calls Gallio "my friend and proconsul". This confirms that Gallio governed Achaia, and roughly when. The stone was found at Delphi and is published as Fouilles de Delphes III 4:286 and SIG II 801d. It cites Claudius's 26th acclamation (Wikipedia, Gallio inscription)."""
citations = [{ source = "wikipedia-gallio-inscription" }, { source = "wikipedia-gallio" }]
