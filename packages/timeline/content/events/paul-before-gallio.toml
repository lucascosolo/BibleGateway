summary = """
Paul's opponents bring him before Gallio, proconsul of Achaia, at Corinth, and Gallio refuses to \
judge. The Delphi inscription of Claudius dates Gallio's tenure to about 51–52 CE, the most \
accurately known date in Paul's life."""
