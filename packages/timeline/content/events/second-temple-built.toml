id = "second-temple-built"
title = "The Second Temple: foundation and completion"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
The exiles return, and in the second year Zerubbabel and Jeshua lay the foundation (Ezra 3). Work then stops. It starts again under the prophets Haggai and Zechariah, in the second year of King Darius. The house is finished on 3 Adar in Darius's sixth year (Ezra 6:15), in spring 516 BCE. Some scholars date the building later."""
verses = [
  { ref = "Ezra.3.8", link = "describes", note = "the second year after they came; Zerubbabel and Jeshua begin" },
  { ref = "Ezra.3.10", link = "describes", note = "the builders lay the foundation of Yahweh's temple" },
  { ref = "Ezra.4.24", link = "describes", note = "the work stops until the second year of Darius" },
  { ref = "Ezra.5.1", link = "describes", note = "Haggai and Zechariah speak to the Jews as prophets" },
  { ref = "Ezra.6.14", link = "describes", note = "the elders build the temple and finish it" },
  { ref = "Ezra.6.15", link = "describes", note = "finished on 3 Adar, in Darius's sixth year" },
  { ref = "Hag.1.1", link = "alludes", note = "the first day of the sixth month, second year of Darius; a message to Zerubbabel and Joshua" },
  { ref = "Hag.2.18", link = "alludes", note = "The day the foundation of Yahweh's temple was laid" },
  { ref = "Zech.1.1", link = "alludes", note = "the eighth month, second year of Darius" },
]

[[positions]]
id = "516"
label = "Completed spring 516 BCE (sixth year of Darius)"
tradition = "traditional"
earliest = -516
latest = -516
summary = """
The Temple was completed on the third of Adar in Darius's sixth year, which is 25 February 516 BCE (Wikipedia's Haggai article). It was "ready for consecration in the spring of 516 BCE". Haggai's messages date to 520 BCE. The Second Temple article puts the foundation of Ezra 3 at 535 BCE."""
citations = [
  { source = "wikipedia-second-temple" },
  { source = "wikipedia-book-of-haggai" },
  { source = "wikipedia-book-of-zechariah" },
]

[[positions]]
id = "later-building"
label = "Built between 450 and 400 BCE"
tradition = "critical"
earliest = -450
latest = -400
summary = """
Wikipedia notes that the Second Temple was constructed "either around 516 BCE or between 450 and 400 BCE". The page read names no scholar for the later date. Some place Haggai at 417 BCE, if the Darius in the book is Darius II."""
citations = [
  { source = "wikipedia-second-temple" },
  { source = "wikipedia-book-of-haggai" },
]
