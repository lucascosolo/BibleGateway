id = "second-temple-built"
title = "The Second Temple: foundation and completion"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "claims-checked"
summary = """
The exiles return, and in the second year Zerubbabel and Jeshua lay the foundation (Ezra 3). Work then stops. It starts again under the prophets Haggai and Zechariah, in the second year of King Darius. The house is finished on 3 Adar in Darius's sixth year (Ezra 6:15), in 516 BCE."""
verses = [
  { ref = "Ezra.3.8", link = "describes", note = "Ezra says that in the second year after they came, Zerubbabel and Jeshua begin the work." },
  { ref = "Ezra.3.10", link = "describes", note = "Ezra says the builders lay the foundation of Yahweh's temple." },
  { ref = "Ezra.4.24", link = "describes", note = "Ezra says the work stops until the second year of Darius." },
  { ref = "Ezra.5.1", link = "describes", note = "Ezra says Haggai and Zechariah speak to the Jews as prophets, which is the setting of the work resuming." },
  { ref = "Ezra.6.14", link = "describes", note = "Ezra says the elders build the temple and finish it." },
  { ref = "Ezra.6.15", link = "describes", note = "Ezra says the temple was finished on 3 Adar, in Darius's sixth year." },
  { ref = "Hag.1.1", link = "alludes", note = "Haggai gives a message to Zerubbabel and Joshua dated the first day of the sixth month, second year of Darius, which alludes to the resumed work." },
  { ref = "Hag.2.18", link = "alludes", note = "Haggai refers to the day the foundation of Yahweh's temple was laid." },
  { ref = "Zech.1.1", link = "alludes", note = "Zechariah's message is dated to the eighth month, second year of Darius, which alludes to the same period." },
]

[[positions]]
id = "516"
label = "Completed 516 BCE (sixth year of Darius)"
tradition = "traditional"
earliest = -516
latest = -516
summary = """
The Temple was completed on the third of Adar in Darius's sixth year, 516 BCE (Satlow, p. 64). Satlow has Haggai and Zechariah urging the work in the preceding years (p. 63). A day-of-year conversion and a 535 BCE date for the foundation are not found in a filed source and are not asserted."""
citations = [{ source = "satlow-2014", locator = "pp. 63-64" }, { source = "kitchen-2003", locator = "p. 71" }]

[[positions]]
id = "scholars-516"
label = "516/515 BCE, the sixth year of Darius I"
tradition = "archaeological"
earliest = -516
latest = -515
held_by = "Israel Finkelstein and Neil Asher Silberman; K. A. Kitchen"
summary = """
The date is one that scholars at both ends of the debate accept, because it rests on a synchronism with the reign of a Persian king. Finkelstein and Silberman write that the construction of the Temple "was then finished in the year 516 BCE. Thus began the era of Second Temple Judaism." Kitchen, from the other end of the debate, summarizes Ezra 1-6 as running from Cyrus's accession in 539 "down to completion of rebuilding the temple at Jerusalem in the sixth year of Darius I (516)", and elsewhere speaks of "the opening of the Second Temple in 515"; the difference is only whether Adar of Darius's sixth year is placed in early 516 or early 515."""
citations = [
  { source = "finkelstein-silberman-2002", locator = "p. 300" },
  { source = "kitchen-2003", locator = "p. 71; p. 107" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
  Ezra 6:15 itself dates the completion to the third of Adar in Darius's sixth year (a biblical detail, with no filed page repeating the month and day), and Haggai 1:1 and Zechariah 1:1 date the resumption of work to his second year. Darius I came to the throne in 522 BCE, so his second year is 520 and his sixth year runs 516/515."""
  citations = [
    { source = "kitchen-2003", locator = "p. 71 (sixth year of Darius I, 516); p. 73 (Darius I, 522-486); p. 376 (Haggai 1:1 and Zechariah 1:1, second year of Darius I)" },
    { source = "finkelstein-silberman-2002", locator = "p. 300 (finished in 516 BCE)" },
  ]
  verses = [
    { ref = "Ezra.6.15", link = "dates" },
    { ref = "Hag.1.1", link = "dates" },
    { ref = "Ezra.5.1-Ezra.5.2", link = "describes", note = "Ezra says Haggai and Zechariah prophesied and the work resumes." },
  ]
