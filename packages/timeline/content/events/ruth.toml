summary = """
Ruth, a Moabite widow, returns to Bethlehem with her mother-in-law Naomi. She gathers leftover grain in Boaz's field and marries him. Their son Obed becomes King David's grandfather. The story is set 'when the judges ruled'. The book itself is generally dated much later (see the linked issue)."""
