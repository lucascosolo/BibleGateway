  { ref = "Ruth.3.1-Ruth.3.18", link = "describes", note = "the night on the threshing floor" },
  { ref = "Ruth.4.1-Ruth.4.17", link = "describes", note = "Boaz settles the claim at the town gate, marries Ruth, and Obed is born" },
