id = "2-thessalonians-composition"
title = "Composition of 2 Thessalonians"
axis = "composition"
category = "composition"
confidence = "contested"
status = "sources-located"
books = ["2Thess"]
summary = """
This asks who wrote 2 Thessalonians and when. The letter names Paul as its author, but Bart Ehrman argues it is a forgery written by someone else in Paul's name, and he gives no year for it in the passages read. The range shown below is therefore the editor's bracket: it starts after 1 Thessalonians, which Ehrman dates "say, 49 CE", and stops at 100 CE, the limit in a claim by Robert Jewett that Ehrman answers. Jewett and Abraham Malherbe defend Paul as author."""
verses = [
  { ref = "2Thess.1.1", link = "describes", note = "The letter names Paul (with Silvanus and Timothy) as its author." },
  { ref = "2Thess.2.2", link = "background", note = "Ehrman reads this as a warning about a letter falsely in Paul's name, a tell of forgery." },
  { ref = "2Thess.3.17", link = "background", note = "The closing says the greeting is in Paul's own hand. Ehrman says a forger might add this to look genuine." },
]

[[positions]]
id = "forgery-after-paul"
label = "A forgery written after Paul (no year given)"
tradition = "critical"
earliest = 50
latest = 100
held_by = "Bart D. Ehrman"
summary = """
Ehrman holds that Paul did not write 2 Thessalonians and that someone else used 1 Thessalonians as a model. He gives no date range in the passages read, so the bounds are the editor's: 50 follows his "say, 49 CE" for 1 Thessalonians, and 100 is the limit in the Jewett claim he quotes."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 210, 221, 279" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman's first argument is that the second letter has nothing of its own to say, which he takes to be how a forger works: "there is not a single major theme in 2 Thessalonians that is not also found in 1 Thessalonians.""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 213" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman finds that the letter sounds like Paul only where it copies. Where the author borrowed from 1 Thessalonians, "of course he sounds like Paul", but where he adds his own views, he stands at odds with Paul."""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 211" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman reads 2:2 as pointing to a letter "as if" by Paul, and he concludes that the author forged a letter to answer a forgery. He writes: "The earlier reference is to a letter “as if” by us, and is by implication denigrated by the author". The result, in his words: "He countered a forgery by producing a forgery.""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 223, 225" }]
  verses = [{ ref = "2Thess.2.2", link = "background", note = "The author warns of a letter falsely in Paul's name." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman thinks the closing claim is suspicious, because the author "did perhaps “protest too much”": “The greeting is in my own hand, the hand of Paul, which is the sign in all my letters. This is how I write”."""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 226" }]
  verses = [{ ref = "2Thess.3.17", link = "background", note = "2 Thessalonians 3:17 claims the greeting is in Paul's own hand, which this argument treats as a forger's device." }]

  [[positions.arguments]]
  stance = "against"
  text = """
Ehrman answers an objection from Jewett, who quotes: "there is scarcely enough time between Paul’s death and C.E 100 for a forgery to gain credence." Ehrman rejects this, noting that ancient authors complained of forgeries in their own lifetimes."""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 221" }]

[[positions]]
id = "paul-wrote-it"
label = "Written by Paul soon after 1 Thessalonians"
tradition = "traditional"
earliest = 49
latest = 50
held_by = "Robert Jewett and Abraham Malherbe (named by Ehrman as holdouts for Pauline authorship)"
summary = """
Ehrman says defenders of authenticity typically place the letter "on the heels" of 1 Thessalonians, which he dates "say, 49 CE". The span of 49 to 50 is the editor's reading of that, since Ehrman gives no year for the second letter."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 210, 220, 279" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Defenders of Paul's authorship can point to numbers. Ehrman reports Malherbe's claim that "the “majority” of biblical scholars continues to hold to authenticity." Ehrman answers that this is only because many scholars cannot accept forgeries in scripture."""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 210" }]

  [[positions.arguments]]
  stance = "against"
  text = """
Ehrman objects that an early date makes the letter's teaching hard to explain: "But how would Paul change his eschatological views so suddenly and decisively?""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 220" }]

[[positions]]
id = "brown-pseudonymous-late-first-century"
label = "Brown: probably pseudonymous, late 1st century (about even odds)"
tradition = "critical"
earliest = 80
latest = 100
held_by = "Raymond E. Brown"
summary = """
Raymond Brown calls scholars "almost evenly divided" on authorship, but leans toward a pseudonymous letter. His summary line reads: "If by Paul, probably ca. AD 51/52, shortly after I Thess. If pseudonymous, probably late 1st century, when increased apocalyptic fervor was manifest." He gives no years for the later option, so the span shown, 80 to 100, is the editor's reading of "late 1st century"."""
citations = [{ source = "brown-1997", locator = "ch. 26, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown points to the close copying between the two letters. II Thess 3:8 repeats I Thess 2:9 almost verbatim, and he asks: "Why would Paul copy himself in this almost mechanical way?" He thinks it more likely the mark of another writer assuming Paul's mantle."""
  citations = [{ source = "brown-1997", locator = "ch. 26, Did Paul Write II Thessalonians?" }]
  verses = [{ ref = "2Thess.3.8", link = "describes", note = "This verse repeats the wording of 1 Thessalonians 2:9 on labor and toil night and day." }]

[[positions]]
id = "carson-moo-corinth-50-51"
label = "Carson and Moo: Paul wrote it from Corinth, late 50 or early 51"
tradition = "critical"
earliest = 50
latest = 51
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo, authors of the standard evangelical introduction to the New Testament, defend the traditional attribution to Paul and put 2 Thessalonians shortly after 1 Thessalonians, written from Corinth. They hold that it was written "either late in A.D. 50 or early in A.D. 51", and conclude that it "should be accepted as a genuine letter of the apostle Paul"."""
citations = [{ source = "carson-moo-2005", locator = "pp. 542-544" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Carson and Moo single out the autograph of 2 Thessalonians 3:17 as the hardest point for a pseudonymous reading. A forger who wrote "in my own hand" and referred to earlier teaching by Paul (2:2, 15) would, quoting Malherbe, have been "audacious to a degree beyond belief". They say Brown offers no evidence that such wording would be read symbolically."""
  citations = [{ source = "carson-moo-2005", locator = "pp. 536-537, 542" }]
  verses = [{ ref = "2Thess.3.17", link = "describes", note = "The letter closes by saying the greeting is in Paul's own hand." }, { ref = "2Thess.2.2", link = "background", note = "2 Thessalonians 2:2 warns against a letter falsely claimed to come from Paul." }]

[[positions]]
id = "ehrman-intro-late-first-century"
label = "Ehrman (textbook): after Paul, possibly near the end of the first century"
tradition = "critical"
earliest = 65
latest = 100
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook calls 2 Thessalonians the letter "whose authorship remains in greatest doubt," but argues that "difficulties make it hard to see how Paul could have written both letters." He supposes the author wrote "sometime after Paul had died, possibly near the end of the first century." He names no years, so the span shown, 65 to 100, is the editor's."""
citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 272 approx." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman contrasts the two letters on the end of the age. In the first, the end comes "like a thief in the night," while in the second the man of lawlessness must appear first. He also reads the claim in 2 Thess 3:17 and the warning about a forged letter in 2:2 as the work of an imitator."""
  citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 272 approx." }]
  verses = [{ ref = "2Thess.2.2", link = "background", note = "2 Thessalonians 2:2 warns against a letter forged in Paul's name." }, { ref = "2Thess.2.3-2Thess.2.4", link = "describes", note = "2 Thessalonians 2:3-4 describes the antichrist figure who must appear before the end." }, { ref = "1Thess.5.2", link = "describes", note = "1 Thessalonians 5:2 says the day comes like a thief in the night." }]
