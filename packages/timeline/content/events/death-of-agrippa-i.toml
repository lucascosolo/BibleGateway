id = "death-of-agrippa-i"
title = "The death of Herod Agrippa I"
axis = "narrative"
category = "political"
confidence = "firm"
status = "draft"
summary = """
Acts and Josephus both report that Herod Agrippa I died suddenly after being acclaimed as a god \
at Caesarea. Josephus gives the circumstances and the length of his reign; the death is dated \
44 CE."""
verses = [
  { ref = "Acts.12.19-Acts.12.23", link = "describes", note = "Tyre and Sidon; struck down for not giving glory to God" },
  { ref = "Acts.12.1-Acts.12.4", link = "background", note = "Herod's earlier persecution of the church" },
]

