id = "death-of-agrippa-i"
title = "The death of Herod Agrippa I"
axis = "narrative"
category = "political"
confidence = "firm"
status = "claims-checked"
summary = """
Acts and Josephus both report that Herod Agrippa I died suddenly after the crowd hailed him as a god at Caesarea. Josephus adds the circumstances and the length of his reign, and the death is dated to 44 CE."""
verses = [
  { ref = "Acts.12.19-Acts.12.23", link = "describes", note = "Acts 12:19-23 tells of Herod at Tyre and Sidon, where he is struck down for not giving glory to God." },
  { ref = "Acts.12.1-Acts.12.4", link = "background", note = "Acts 12:1-4 gives background in Herod's earlier persecution of the church." },
]

[[positions]]
id = "44"
label = "44 CE"
tradition = "chronological"
earliest = 44
latest = 44
summary = """
Meier places Herod Agrippa I's killing of James (Acts 12:1-2) at about 44 CE. That fits Josephus, who counts four years of reign under Caius and three under Claudius."""
citations = [
  { source = "meier-2001", locator = "p. 213" },
  { source = "josephus-whiston", locator = "Antiquities 19.8.2" },
]

[[attestations]]
artifact = "josephus-antiquities-19-343"
relation = "partially-corroborates"
note = """
Both accounts have a crowd hailing Agrippa as a god at Caesarea, followed at once by a fatal illness, though they differ on the details. Josephus describes a silver garment, an owl as an omen, and five days of stomach pain, whereas Acts has an angel and worms."""
citations = [
  { source = "josephus-whiston", locator = "Antiquities 19.8.2" },
]
