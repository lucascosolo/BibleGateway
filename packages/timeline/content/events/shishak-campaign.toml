id = "shishak-campaign"
title = "Shishak's campaign against Judah"
axis = "narrative"
category = "political"
confidence = "contested"
status = "claims-checked"
summary = "In Rehoboam's fifth year, Shishak of Egypt takes Judah's walled cities and the temple treasures. Shishak is usually identified with the pharaoh Shoshenq I, whose list of conquests at Karnak records a campaign. Rodger C. Young cautions that the Egyptian date itself rests on the Bible's chronology."
verses = [
  { ref = "1Kgs.14.25-1Kgs.14.28", link = "describes", note = "Kings dates the campaign to Rehoboam's fifth year and says the treasures are taken." },
  { ref = "2Chr.12.2-2Chr.12.12", link = "describes", note = "Chronicles tells the same story, with Shemaiah's prophecy." },
  { ref = "1Kgs.11.40", link = "background", note = "Kings says Jeroboam had earlier fled to Shishak for safety, which gives background to the campaign." },
]

[[positions]]
id = "c-925"
label = "c. 925 BCE"
tradition = "archaeological"
earliest = -925
latest = -925
summary = "Kitchen dates Shoshenq I to about 945-924 and the victory monuments from his year 21 (about 925); Finkelstein and Silberman put the campaign in 926. Wilson's ANET also gives about 945-924."
citations = [{ source = "kitchen-2003", locator = "pp. 33–34" }, { source = "finkelstein-silberman-2002", locator = "p. 161" }, { source = "pritchard-1969", locator = "p. 263 (The Campaign of Sheshonk I), trans. John A. Wilson" }]

[[positions]]
id = "young-926"
label = "c. 926 BCE (derived)"
tradition = "chronological"
earliest = -926
latest = -926
held_by = "Rodger C. Young"
summary = "This date is worked out from the arithmetic in Young's footnote. Spring 925 pairs with Rehoboam taking the throne in 931t, so taking the throne in 932t gives spring 926. Young says Sheshonq's dates are taken from the Bible's own chronology, so they cannot be used to establish biblical dates."
citations = [{ source = "young-2003", locator = "p. 598 n. 8" }]

[[attestations]]
artifact = "bubastite-portal"
relation = "partially-corroborates"
note = "It lists Palestinian and Syrian towns Shoshenq claimed to have taken, but gives no narrative of the campaign (Wilson). Kitchen reads the rows as route segments through Judah and Israel that name no kings or states. Finkelstein and Silberman count about 150 places, from the south through the hill country to the Jezreel valley and coast, and say Jerusalem was hardly the only target."
citations = [{ source = "pritchard-1969", locator = "pp. 263–264, trans. John A. Wilson" }, { source = "kitchen-2003", locator = "pp. 33–34" }, { source = "finkelstein-silberman-2002", locator = "p. 161" }]

[[positions]]
id = "kitchen-927-926"
label = "Campaign in Shoshenq I's year 19 or 20, 927 or 926 BCE (Kitchen)"
tradition = "archaeological"
earliest = -927
latest = -925
held_by = "K. A. Kitchen"
summary = """
Kitchen, an Egyptologist who defends the Bible's reliability, dates Shoshenq I to about 945-924 BCE and puts his campaign in his year 19 or 20, which is 927 or 926. Rehoboam's fifth year is about 926/925. He says the Egyptian and Hebrew date series are independent of each other yet match well."""
citations = [{ source = "kitchen-2003", locator = "pp. 32–34" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Kitchen writes that "there is no reason whatever to doubt the identity" of the Bible's Shushaq with Shoshenq I. He points to the top of a stela with Shoshenq's cartouches found in the rubble of Megiddo, which he calls the king's "visiting card"."""
  citations = [{ source = "kitchen-2003", locator = "pp. 33–34" }]
  verses = [
    { ref = "1Kgs.14.25", link = "dates" },
    { ref = "2Chr.12.2", link = "dates" },
  ]

  [[positions.arguments]]
  stance = "for"
  text = """
  Against the claim that Shoshenq copied an older list, Kitchen counts 155 ovals at Karnak and finds that, of the usable names, only nine appear in earlier lists. The other ninety-eight are unique to Shoshenq I's list."""
  citations = [{ source = "kitchen-2003", locator = "pp. 496–497" }]
  verses = [{ ref = "1Kgs.14.26", link = "describes" }]
