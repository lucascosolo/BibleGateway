[[positions]]
id = "967"
label = "967 BCE (spring)"
tradition = "chronological"
earliest = -967
latest = -967
held_by = "Rodger C. Young"
summary = "Rodger C. Young counts Solomon's fourth year as 968t (a year counted from autumn). The second month, Ziv, then falls in spring 967 BCE."
citations = [{ source = "young-2003", locator = "p. 599" }, { source = "young-2005", locator = "p. 228 n. 4" }]

[[positions]]
id = "966"
label = "966 BCE"
tradition = "chronological"
earliest = -966
latest = -966
held_by = "Edwin R. Thiele"
summary = "According to Young, the chronologist Edwin Thiele's dates place the foundation in 966 BCE."
citations = [{ source = "young-2005", locator = "pp. 228-229" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Thiele's own reasoning about the calendar behind the date: the temple was begun in the second month of Solomon's fourth year and finished in the eighth month of his eleventh (1 Kings 6:1, 37–38), and the Bible counts that as seven years of building. Months are numbered from Nisan, and counting is inclusive. On a Nisan-to-Nisan regnal year that span is eight years. Only Tishri-to-Tishri regnal years give seven, so Judah reckoned its kings from the autumn, and Solomon's regnal years are placed accordingly. The absolute year is not given on these pages."""
  citations = [{ source = "thiele-1983", locator = "pp. 51–52 and Diagram 5 (page images supplied by the user, 2026-10-07)" }]
  verses = [
    { ref = "1Kgs.6.1", link = "dates" },
    { ref = "1Kgs.6.37-1Kgs.6.38", link = "dates" },
  ]

[[positions]]
id = "fs-no-trace"
label = "No trace of the temple; reign c. 970-931 BCE"
tradition = "archaeological"
earliest = -970
latest = -931
held_by = "Israel Finkelstein and Neil Asher Silberman"
summary = """
Finkelstein and Silberman give Solomon's reign as c. 970-931 BCE (dates they attribute to Galil) and say no trace of the temple or palace has ever been identified. They do not date the foundation itself.
"""
citations = [{ source = "finkelstein-silberman-2002", locator = "p. 131" }, { source = "finkelstein-silberman-2002", locator = "p. 135" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  They say nineteenth- and early twentieth-century digging around the Temple Mount "failed to identify even a trace of Solomon's fabled Temple or palace complex". Some scholars blame Herodian rebuilding.
"""
  citations = [{ source = "finkelstein-silberman-2002", locator = "p. 128" }]
  verses = [{ ref = "1Kgs.6.1", link = "background" }]
