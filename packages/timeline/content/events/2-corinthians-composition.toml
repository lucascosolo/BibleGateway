id = "2-corinthians-composition"
title = "Composition of 2 Corinthians"
axis = "composition"
category = "composition"
confidence = "firm"
status = "draft"
books = ["2Cor"]
summary = """
Paul wrote 2 Corinthians from Macedonia to the Corinthian church, after Titus brought word of how it had received Paul's earlier tearful letter. Raymond Brown dates it to late summer or early autumn 57. Its authorship is not seriously disputed, though most scholars think it joins two to five separate letters. A revisionist chronology would put it in 55-56."""
verses = [
  { ref = "2Cor.1.1", link = "describes", note = "Paul and Timothy write to the church of God at Corinth." },
  { ref = "2Cor.2.12-2Cor.2.13", link = "dates", note = "Paul leaves Troas for Macedonia to meet Titus, the journey that places the writing in Macedonia." },
  { ref = "2Cor.7.5", link = "background", note = "In Macedonia, Paul awaits word from Titus." },
]

