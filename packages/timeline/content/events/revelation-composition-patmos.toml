id = "revelation-composition-patmos"
title = "John on Patmos and the composition of Revelation"
axis = "composition"
category = "composition"
books = ["Rev"]
confidence = "contested"
status = "draft"
summary = """
Revelation says its author John was on Patmos. Irenaeus, quoted by Eusebius, places the vision at \
the end of Domitian's reign (81–96 CE); Wikipedia reports a common date of about 95 CE."""
verses = [
  { ref = "Rev.1.9-Rev.1.11", link = "describes", note = "John on Patmos 'on account of the word of God'" },
]

[[positions]]
id = "domitian"
label = "End of Domitian's reign"
tradition = "traditional"
earliest = 81
latest = 96
held_by = "Irenaeus of Lyons"
summary = """
Irenaeus (Against Heresies 5.30.3, read directly: "towards the end of Domitian's reign"; Eusebius quotes him similarly) says the Apocalypse "was seen not long ago, but almost in our \
own generation, at the end of the reign of Domitian". The years are Domitian's reign, 81–96."""
citations = [
  { source = "newadvent-irenaeus-ah-5", locator = "5.30.3" },
  { source = "newadvent-eusebius-he-5", locator = "5.8.6" },
  { source = "newadvent-eusebius-he-3", locator = "3.18.3" },
  { source = "wikipedia-book-of-revelation" },
]

[[positions]]
id = "about-95"
label = "About 95 CE"
tradition = "chronological"
earliest = 95
latest = 95
summary = """
Wikipedia: Revelation is "commonly dated to about 95 AD", on clues in the visions pointing to \
Domitian's reign. No individual holder is named on the cited page."""
citations = [{ source = "wikipedia-book-of-revelation" }]

[[attestations]]
artifact = "eusebius-he-3-18"
relation = "consistent"
note = """
Eusebius reports John condemned to Patmos in Domitian's persecution, and quotes Irenaeus on \
the date of the vision."""
citations = [{ source = "newadvent-eusebius-he-3", locator = "3.18.1, 3.18.3" }]

[[attestations]]
artifact = "irenaeus-against-heresies-5-30"
relation = "consistent"
note = """
Irenaeus writes that the Apocalypse "was seen no very long time since, but almost in our day, \
towards the end of Domitian's reign". He does not name the author's exile on Patmos in this \
sentence."""
citations = [{ source = "newadvent-irenaeus-ah-5", locator = "5.30.3" }]
