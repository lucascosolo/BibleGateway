id = "revelation-composition-patmos"
title = "John on Patmos and the composition of Revelation"
axis = "composition"
category = "composition"
books = ["Rev"]
confidence = "contested"
status = "draft"
summary = """
Revelation says its author, John, was on the island of Patmos. The early writer Irenaeus, quoted by Eusebius, puts the vision at the end of Emperor Domitian's reign (81 to 96 CE). Wikipedia reports that the usual date is about 95 CE."""
verses = [
  { ref = "Rev.1.9-Rev.1.11", link = "describes", note = "John is on Patmos 'on account of the word of God'" },
]

[[positions]]
id = "domitian"
label = "End of Domitian's reign"
tradition = "traditional"
earliest = 81
latest = 96
held_by = "Irenaeus of Lyons"
summary = """
Irenaeus (Against Heresies 5.30.3, read directly: "towards the end of Domitian's reign"; Eusebius quotes him similarly) says the Apocalypse "was seen not long ago, but almost in our \
own generation, at the end of the reign of Domitian". The years given here are simply the years of Domitian's reign, 81 to 96."""
citations = [
  { source = "newadvent-irenaeus-ah-5", locator = "5.30.3" },
  { source = "newadvent-eusebius-he-5", locator = "5.8.6" },
  { source = "newadvent-eusebius-he-3", locator = "3.18.3" },
  { source = "wikipedia-book-of-revelation" },
]

[[positions]]
id = "about-95"
label = "About 95 CE"
tradition = "chronological"
earliest = 95
latest = 95
summary = """
Wikipedia says Revelation is "commonly dated to about 95 AD", because clues in the visions point to Domitian's reign. The cited page names no one scholar who holds this."""
citations = [{ source = "wikipedia-book-of-revelation" }]

[[attestations]]
artifact = "eusebius-he-3-18"
relation = "consistent"
note = """
Eusebius reports that John was sent to Patmos during Domitian's persecution. He also quotes Irenaeus on the date of the vision."""
citations = [{ source = "newadvent-eusebius-he-3", locator = "3.18.1, 3.18.3" }]

[[attestations]]
artifact = "irenaeus-against-heresies-5-30"
relation = "consistent"
note = """
Irenaeus writes that the Apocalypse "was seen no very long time since, but almost in our day, \
towards the end of Domitian's reign". This sentence does not mention the author's exile on Patmos."""
citations = [{ source = "newadvent-irenaeus-ah-5", locator = "5.30.3" }]

[[positions]]
id = "brown-92-96"
label = "Probably between 92 and 96 CE, by a prophet named John"
tradition = "critical"
earliest = 92
latest = 96
held_by = "Raymond E. Brown"
summary = """
Brown's DATE line: "Probably between AD 92 and 96 at the end of the Emperor Domitian's reign." He says the author was a Jewish Christian prophet named John, neither the son of Zebedee nor the writer of the Gospel or Epistles."""
citations = [{ source = "brown-1997", locator = "ch. 37, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown: for a long time the scholarly majority has held Revelation was written under Domitian, who "ruled after the destruction of the Jerusalem Temple" and "could be considered Nero come back again"."""
  citations = [{ source = "brown-1997", locator = "ch. 37, Date and Life-Situation: Persecution under Domitian?" }]
  verses = [{ ref = "Rev.13.3", link = "dates", note = "The wounded head that is healed, read as Nero returned." }]
