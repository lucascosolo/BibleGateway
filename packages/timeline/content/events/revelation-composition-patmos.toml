id = "revelation-composition-patmos"
title = "John on Patmos and the composition of Revelation"
axis = "composition"
category = "composition"
books = ["Rev"]
confidence = "contested"
status = "draft"
summary = """
Revelation says its author, John, was on the island of Patmos. The early writer Irenaeus, quoted by Eusebius, puts the vision at the end of Emperor Domitian's reign (81 to 96 CE). Wikipedia reports that the usual date is about 95 CE."""
verses = [
  { ref = "Rev.1.9-Rev.1.11", link = "describes", note = "John says he is on Patmos 'on account of the word of God,' which places the writing on Patmos." },
]

[[positions]]
id = "domitian"
label = "End of Domitian's reign"
tradition = "traditional"
earliest = 81
latest = 96
held_by = "Irenaeus of Lyons"
summary = """
Irenaeus (Against Heresies 5.30.3, read directly: "towards the end of Domitian's reign"; Eusebius quotes him similarly) says the Apocalypse "was seen not long ago, but almost in our \
own generation, at the end of the reign of Domitian". The years given here are simply the years of Domitian's reign, 81 to 96."""
citations = [
  { source = "newadvent-irenaeus-ah-5", locator = "5.30.3" },
  { source = "newadvent-eusebius-he-5", locator = "5.8.6" },
  { source = "newadvent-eusebius-he-3", locator = "3.18.3" },
  { source = "wikipedia-book-of-revelation" },
]

[[positions]]
id = "about-95"
label = "About 95 CE"
tradition = "chronological"
earliest = 95
latest = 95
summary = """
Wikipedia says Revelation is "commonly dated to about 95 AD", because clues in the visions point to Domitian's reign. The cited page names no one scholar who holds this."""
citations = [{ source = "wikipedia-book-of-revelation" }]

[[attestations]]
artifact = "eusebius-he-3-18"
relation = "consistent"
note = """
Eusebius reports that John was sent to Patmos during Domitian's persecution. He also quotes Irenaeus on the date of the vision."""
citations = [{ source = "newadvent-eusebius-he-3", locator = "3.18.1, 3.18.3" }]

[[attestations]]
artifact = "irenaeus-against-heresies-5-30"
relation = "consistent"
note = """
Irenaeus writes that the Apocalypse "was seen no very long time since, but almost in our day, \
towards the end of Domitian's reign". This sentence does not mention the author's exile on Patmos."""
citations = [{ source = "newadvent-irenaeus-ah-5", locator = "5.30.3" }]

[[positions]]
id = "brown-92-96"
label = "Probably between 92 and 96 CE, by a prophet named John"
tradition = "critical"
earliest = 92
latest = 96
held_by = "Raymond E. Brown"
summary = """
Brown, a critical scholar, gives his dating in one line: "Probably between AD 92 and 96 at the end of the Emperor Domitian's reign." He says the author was a Jewish Christian prophet named John, neither the son of Zebedee nor the writer of the Gospel or Epistles."""
citations = [{ source = "brown-1997", locator = "ch. 37, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown explains why the Domitian date has long been the scholarly majority view: Domitian "ruled after the destruction of the Jerusalem Temple" and "could be considered Nero come back again"."""
  citations = [{ source = "brown-1997", locator = "ch. 37, Date and Life-Situation: Persecution under Domitian?" }]
  verses = [{ ref = "Rev.13.3", link = "dates", note = "Revelation's wounded head that is healed is read as Nero returned." }]

[[positions]]
id = "carson-moo-late-domitian"
label = "The last years of Domitian, about 95-96 CE"
tradition = "critical"
earliest = 93
latest = 96
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo write the standard evangelical introduction to the New Testament. They hold that John wrote from Patmos, the island of exile in the Aegean, probably sent there by a local Roman official. They weigh six lines of evidence and are "inclined, then, to follow the oldest tradition" and "date Revelation in the last years of Domitian". Because they give no exact start, the span shown here begins in 93, the editor's reading of "last years"; Domitian died in 96."""
citations = [{ source = "carson-moo-2005", locator = "pp. 707–711" }]

  [[positions.arguments]]
  stance = "for"
  text = """
They grant that the seven kings of Revelation 17:9-11 could point to Galba and 68-69 CE, but call this indecisive, since it is unclear whether the kings are current or future and where the count begins. They put more weight on the emperor cult and the state of the seven churches, which fit the 90s better."""
  citations = [{ source = "carson-moo-2005", locator = "pp. 709–711" }]
  verses = [
    { ref = "Rev.1.9", link = "describes", note = "John says he was on Patmos 'because of the word of God and the testimony of Jesus.'" },
    { ref = "Rev.17.10", link = "dates", note = "The seven kings, of whom five have fallen and one is, are read as not decisive for a date." },
  ]

[[positions]]
id = "ehrman-intro-around-95"
label = "Final form around 95 CE under Domitian, with earlier material from the 60s"
tradition = "critical"
earliest = 95
latest = 100
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook says "most investigators" think parts were written in the 60s after Nero's persecution, but the book was "probably around 95 c.e., during the reign of Domitian". His timeline chart lists it at "95-100", which is the span shown here. The author was a Christian prophet named John, "not John the son of Zebedee", and the book is not pseudonymous."""
citations = [{ source = "ehrman-brief-intro-2017", locator = "pp. 20, 344, 350 approx." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman says the code word "Babylon" for Rome came into use among Jews after the destruction of Jerusalem in 70, which points to a later stage of writing than the Nero-era material."""
  citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 344 approx." }]
  verses = [{ ref = "Rev.14.8", link = "dates", note = "'Babylon' is read as a code name for Rome after 70 CE." }]
