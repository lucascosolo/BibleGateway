id = "canon-eusebius-accepted-disputed"
title = "Eusebius sorts the Christian writings into accepted, disputed and spurious"
axis = "canon"
category = "canon"
confidence = "firm"
status = "sources-located"
summary = """
In the Church History, Eusebius of Caesarea counts the votes of the writers he had read. The accepted books are the four Gospels, Acts, Paul's letters, 1 Peter and 1 John, and, if it seems proper, Revelation. The disputed but widely known books are James, Jude, 2 Peter and 2 and 3 John. The spurious include the Acts of Paul, the Shepherd, the Apocalypse of Peter, Barnabas and the Didache, and Revelation appears here too. Metzger reads the muddle as the uncertainty of a historian working before any synod had issued a canon. Eusebius issued the History in several editions, so the passage is dated to a span, not a year."""
verses = [
  { ref = "Jas.1.1", link = "background", note = "James, first of the disputed letters." },
  { ref = "Jude.1.1", link = "background", note = "Jude, among the disputed letters." },
  { ref = "2Pet.1.1", link = "background", note = "2 Peter, among the disputed letters." },
  { ref = "Rev.1.1", link = "background", note = "Revelation, placed both among the accepted and among the spurious." },
]

