id = "paul-arrest-felix-festus"
title = "Paul's arrest and trials before Felix and Festus"
axis = "narrative"
category = "political"
confidence = "contested"
status = "claims-checked"
summary = """
Paul is arrested in Jerusalem and held at Caesarea under the governor Felix. After two years he is heard by Felix's successor, Festus, and appeals to Caesar. Scholars disagree on the year Festus took office, anywhere from about 55 to 61 CE. The scholar F. F. Bruce favors 59."""
verses = [
  { ref = "Acts.21.27-Acts.21.36", link = "describes", note = "Acts describes how Paul is arrested in the temple." },
  { ref = "Acts.23.23-Acts.24.27", link = "describes", note = "Acts describes Paul at Caesarea before Felix and two years in custody." },
  { ref = "Acts.25.1-Acts.26.32", link = "describes", note = "Acts describes Festus, Paul's appeal to Caesar, and the hearing before King Agrippa II." },
]

[[attestations]]
artifact = "josephus-antiquities-20-182"
relation = "corroborates"
note = """
Josephus says Nero sent Porcius Festus to replace Felix, just as Acts 24:27 says. He gives no year, so this does not settle the range of 55 to 61 CE."""
citations = [{ source = "josephus-whiston", locator = "Antiquities 20.8.9" }]

[[positions]]
id = "festus-59"
label = "Festus succeeds Felix c. 59 CE"
tradition = "chronological"
earliest = 59
latest = 59
held_by = "D. A. Carson and Douglas J. Moo (citing F. F. Bruce and others)"
summary = """
Carson and Moo rest their Pauline chronology on what they call a growing consensus that Festus replaced Felix as governor of Judea in 59. Their note on it lists F. F. Bruce among many others."""
citations = [{ source = "carson-moo-2005", locator = "p. 368 and n. 45" }]

[[positions]]
id = "festus-55-61"
label = "Festus's accession between c. 55 and 61 CE"
tradition = "critical"
earliest = 55
latest = 61
summary = """
Carson and Moo report that some scholars argue for a much earlier date, 55 or 56, from the fall of the official Pallas, but they reject it, and that Schürer put Felix's recall in 60 and Ogg in 61. Those figures give the range shown here."""
citations = [{ source = "carson-moo-2005", locator = "p. 368 n. 45" }]

[[positions]]
id = "brown-traditional-57-58"
label = "58-60 CE (Brown, Traditional Chronology)"
tradition = "chronological"
earliest = 58
latest = 60
held_by = "Raymond E. Brown (Traditional Chronology)"
summary = """
Brown's Table 6, Traditional column, has Paul winter at Corinth in 57/58 (where it places Romans) and return to Jerusalem; it dates his arrest in Jerusalem and two years imprisoned in Caesarea to 58-60, the sea journey to Rome to 60-61, and two years a prisoner in Rome to 61-63."""
citations = [{ source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Acts 24:27 says two years passed under Felix before Festus succeeded him. Acts 28:30 gives Paul two full years in Rome. Brown's table runs these as two years in Caesarea and then 61-63 in Rome."""
  citations = [{ source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" }]
  verses = [
    { ref = "Acts.24.27", link = "dates" },
    { ref = "Acts.28.30", link = "dates" },
  ]

[[positions]]
id = "brown-revisionist-52-57"
label = "52-57 CE (Revisionist chronology, per Brown)"
tradition = "critical"
earliest = 52
latest = 57
held_by = "Revisionist chronology (Knox, Lüdemann, Jewett, Murphy-O'Connor, Donfried, as summarized by Brown)"
summary = """
Brown lists the arrest in Jerusalem as Lüdemann 52 (55), Buck/Taylor 53, Knox 53/54, Donfried 56/57, Jewett 57. His Table 6 gives 52-55 or 56-58. Brown himself follows the Traditional column "because it seems more reasonable to me"."""
citations = [{ source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Brown's Observations give each scholar's arrest date, and he says differences about the date of Jesus' crucifixion and the reliability of the data in Acts are responsible for many of the datings."""
  citations = [{ source = "brown-1997", locator = "ch. 16, Table 6 and its Observations" }]
  verses = [
    { ref = "Acts.24.27", link = "dates" },
    { ref = "Acts.28.30", link = "dates" },
  ]
