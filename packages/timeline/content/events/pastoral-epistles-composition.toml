id = "pastoral-epistles-composition"
title = "Composition of the Pastoral Epistles (1 Timothy, 2 Timothy, Titus)"
axis = "composition"
category = "composition"
confidence = "contested"
status = "draft"
books = ["1Tim", "2Tim", "Titus"]
summary = """
This asks who wrote 1 Timothy, 2 Timothy and Titus, and when. Each letter names Paul as author. Ehrman treats the three as one forged group by a later follower, and places them "at the end of the first century at the very earliest". He gives no latest date. The bounds of 90 and 130 are the editor's: 90 renders Ehrman's earliest, and 130 is a round limit before the middle of the second century."""
verses = [
  { ref = "1Tim.1.1", link = "describes", note = "Paul is named as apostle, the letter's claim to authorship." },
  { ref = "Titus.1.1", link = "describes", note = "Paul named as author, the opening Ehrman compares with 1 Timothy 1:1-4." },
  { ref = "1Tim.6.20", link = "describes", note = "Guard what has been entrusted, a phrase shared with 2 Timothy." },
  { ref = "2Tim.4.9-2Tim.4.13", link = "describes", note = "Personal requests to Timothy, which Ehrman calls verisimilitudes." },
  { ref = "1Tim.3.1-1Tim.3.13", link = "background", note = "Ehrman: qualifications for overseers and deacons, a church order already in place." },
]

[[positions]]
id = "after-paul-pseudonymous"
label = "Forged in Paul's name after his death, as a group"
tradition = "critical"
earliest = 90
latest = 130
held_by = "Bart D. Ehrman"
summary = """
Ehrman holds that all three letters were forged by a later follower of Paul and should be read together. He says only that they come from the end of the first century at the earliest. Both year bounds are the editor's."""
citations = [{ source = "ehrman-2013", locator = "PDF pp. 258-259, 262, 273-281" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman on the critical consensus: "the overwhelming preponderance of critical scholars maintaining that all three letters are clearly post-Pauline.""""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 258" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman on 1 Timothy and Titus: "There has been far less disagreement over the joint authorship of 1 Timothy and Titus""""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 262" }]
  verses = [{ ref = "1Tim.1.1", link = "describes", note = "Matched by Titus 1:3." }, { ref = "Titus.1.1", link = "describes", note = "Opening compared with 1 Timothy 1:1." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman on shared phrases: "The injunction of 2 Tim. 1:12 has its counterpart in 1 Tim. 6:20""""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 264" }]
  verses = [{ ref = "1Tim.6.20", link = "describes", note = "Guard what is entrusted." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman on church offices: "They instead presuppose that a church hierarchy already is in place""""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 272" }]
  verses = [{ ref = "1Tim.3.1-1Tim.3.13", link = "background", note = "Overseers and deacons with set qualifications." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman on Scripture: "Here too we are in a period beyond Paul’s time, at the end of the first century at the very earliest""""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 273" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman on the cumulative case: "It is important to stress that all of these various arguments are cumulative""""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 273" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman on the personal notes of 2 Timothy: "where the author cites names, places, and events from his life, thereby assuring the reader that he really is Paul""""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 278" }]
  verses = [{ ref = "2Tim.4.9-2Tim.4.13", link = "describes", note = "Names, places and requests." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman on use of Ephesians: "There is some reason to suspect, on the other hand, that the author was intimately familiar with another Pauline letter, but this one too a forgery.""""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 281" }]

[[positions]]
id = "paul-wrote-them"
label = "Written by Paul himself near the end of his life"
tradition = "traditional"
earliest = 60
latest = 67
held_by = "Luke Timothy Johnson (named by Ehrman as a supporter of authenticity)"
summary = """
Ehrman names Luke Timothy Johnson as a supporter of authenticity but reports no date. The letters' own claim is Paul writing late in life. Both year bounds are the editor's, a bracket before Paul's death."""
citations = [{ source = "ehrman-2013", locator = "PDF pp. 272, 281-282" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman reports the argument from verisimilitude: "Some scholars still find it difficult to believe that a forger would employ such extensive verisimilitudes""""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 281" }]
  verses = [{ ref = "2Tim.4.9-2Tim.4.13", link = "describes", note = "Personal requests in the closing." }]

  [[positions.arguments]]
  stance = "against"
  text = """
Ehrman answers the coauthorship defence: "when it comes to the Deutero-Pauline letters, Johnson wants to argue that the key to their interpretation is a phenomenon for which he cannot—or at least does not—cite a single parallel or analogy from antiquity: joint composition of letters". He asks why that should be preferred to an explanation "for which there are abundant parallels and analogies scattered throughout all of antiquity, the use of literary forgery"."""
  citations = [{ source = "ehrman-2013", locator = "PDF pp. 282" }]
