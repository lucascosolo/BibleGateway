id = "pastoral-epistles-composition"
title = "Composition of the Pastoral Epistles (1 Timothy, 2 Timothy, Titus)"
axis = "composition"
category = "composition"
confidence = "contested"
status = "sources-located"
books = ["1Tim", "2Tim", "Titus"]
summary = """
This entry asks who wrote 1 Timothy, 2 Timothy and Titus, and when. Each letter names Paul as author, but Ehrman treats the three as one group forged by a later follower, and places them "at the end of the first century at the very earliest". He gives no latest date, so the span of 90 to 130 shown here is editorial: 90 renders his earliest date, and 130 is a round limit before the middle of the second century."""
verses = [
  { ref = "1Tim.1.1", link = "describes", note = "Paul is named as apostle, the letter's claim to authorship." },
  { ref = "Titus.1.1", link = "describes", note = "Paul named as author, the opening Ehrman compares with 1 Timothy 1:1-4." },
  { ref = "1Tim.6.20", link = "describes", note = "Guard what has been entrusted, a phrase shared with 2 Timothy." },
  { ref = "2Tim.4.9-2Tim.4.13", link = "describes", note = "Personal requests to Timothy, which Ehrman calls verisimilitudes." },
  { ref = "1Tim.3.1-1Tim.3.13", link = "background", note = "Ehrman reads these qualifications for overseers and deacons as a church order already in place." },
]

[[positions]]
id = "after-paul-pseudonymous"
label = "Forged in Paul's name after his death, as a group"
tradition = "critical"
earliest = 90
latest = 130
held_by = "Bart D. Ehrman"
summary = """
Ehrman holds that all three letters were forged by a later follower of Paul and should be read together. He says only that they come from the end of the first century at the earliest, so the years shown here are the editor's rendering of that phrase."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 258-259, 262, 273-281" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman starts from the state of scholarship, where he finds little dispute: "the overwhelming preponderance of critical scholars maintaining that all three letters are clearly post-Pauline.""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 258" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman adds that the three letters are not usually separated, since their authorship is closely linked: "There has been far less disagreement over the joint authorship of 1 Timothy and Titus""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 262" }]
  verses = [{ ref = "1Tim.1.1", link = "describes", note = "First Timothy 1:1 names Paul as apostle in terms matched by Titus 1:3." }, { ref = "Titus.1.1", link = "describes", note = "Titus 1:1 names Paul as author, in an opening compared with 1 Timothy 1:1." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman points to wording that ties the letters together: "The injunction of 2 Tim. 1:12 has its counterpart in 1 Tim. 6:20""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 264" }]
  verses = [{ ref = "1Tim.6.20", link = "describes", note = "First Timothy 6:20 tells Timothy to guard what is entrusted to him, a phrase shared with 2 Timothy." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman argues that the letters assume a church organization Paul's own letters do not: "They instead presuppose that a church hierarchy already is in place""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 272" }]
  verses = [{ ref = "1Tim.3.1-1Tim.3.13", link = "background", note = "First Timothy 3 lists set qualifications for overseers and deacons." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman finds the same later setting in the way the letters treat Scripture: "Here too we are in a period beyond Paul’s time, at the end of the first century at the very earliest""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 273" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman insists that these points work together and should not be weighed one at a time: "It is important to stress that all of these various arguments are cumulative""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 273" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman reads the personal details in 2 Timothy as part of the forger's method: "where the author cites names, places, and events from his life, thereby assuring the reader that he really is Paul""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 278" }]
  verses = [{ ref = "2Tim.4.9-2Tim.4.13", link = "describes", note = "Second Timothy 4 closes with names, places and personal requests." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman suggests the forger drew on another letter that he also counts as a forgery: "There is some reason to suspect, on the other hand, that the author was intimately familiar with another Pauline letter, but this one too a forgery.""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 281" }]

[[positions]]
id = "paul-wrote-them"
label = "Written by Paul himself near the end of his life"
tradition = "traditional"
earliest = 60
latest = 67
held_by = "Luke Timothy Johnson (named by Ehrman as a supporter of authenticity)"
summary = """
Ehrman names Luke Timothy Johnson as a supporter of authenticity but reports no date for this view. The letters' own claim is that Paul wrote late in life, so the span shown here is the editor's bracket before Paul's death."""
citations = [{ source = "ehrman-2013", locator = "ebook pp. 272, 281-282" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman reports the defenders' argument that the letters' lifelike detail speaks for Paul: "Some scholars still find it difficult to believe that a forger would employ such extensive verisimilitudes""""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 281" }]
  verses = [{ ref = "2Tim.4.9-2Tim.4.13", link = "describes", note = "Second Timothy closes with personal requests to Timothy." }]

  [[positions.arguments]]
  stance = "against"
  text = """
Ehrman answers Johnson's defence by joint composition: "when it comes to the Deutero-Pauline letters, Johnson wants to argue that the key to their interpretation is a phenomenon for which he cannot—or at least does not—cite a single parallel or analogy from antiquity: joint composition of letters". He asks why that should be preferred to an explanation "for which there are abundant parallels and analogies scattered throughout all of antiquity, the use of literary forgery"."""
  citations = [{ source = "ehrman-2013", locator = "ebook pp. 282" }]

[[positions]]
id = "brown-pseudonymous-end-first-century"
label = "Brown: pseudonymous, toward the end of the 1st century (80 to 90 percent of critical scholarship)"
tradition = "critical"
earliest = 80
latest = 100
held_by = "Raymond E. Brown"
summary = """
Brown, a critical scholar, dates Titus and 1 Timothy this way: "If by Paul, ca. AD 65. If pseudonymous (80 to 90 percent of critical scholarship), toward the end of the 1st century, or (less probably) early 2d century." For 2 Timothy he allows the late 60s if it was written first."""
citations = [{ source = "brown-1997", locator = "ch. 29, Summary of Basic Information about Titus" }, { source = "brown-1997", locator = "ch. 30, Summary of Basic Information" }, { source = "brown-1997", locator = "ch. 31, Summary of Basic Information" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown argues from church order: the two-part structure of presbyter/bishops and deacons in Titus and 1 Timothy "is not far from that of Didache 15:1" (ca. AD 100?) and 1 Clement (ca. AD 96), so he places the Pastorals between 80 and 100."""
  citations = [{ source = "brown-1997", locator = "ch. 29, Who Wrote Titus and I Timothy?" }]
  verses = [{ ref = "Titus.1.5", link = "background", note = "Titus is told to appoint presbyters in every town." }, { ref = "1Tim.3.1-1Tim.3.13", link = "background", note = "First Timothy 3 sets out qualifications for overseers and deacons." }]

[[positions]]
id = "carson-moo-paul-after-first-imprisonment"
label = "Carson and Moo: Paul's own, written after his release from Rome (c. 62-66)"
tradition = "critical"
earliest = 62
latest = 66
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo, authors of the standard evangelical introduction to the New Testament, defend Pauline authorship of all three Pastoral Epistles. They hold that Paul was released from the Roman imprisonment of Acts and wrote in the 60s: 1 Timothy "probably the early 60s", 2 Timothy in 64 or 65 as more likely, and Titus "not later than the middle 60s"."""
citations = [{ source = "carson-moo-2005", locator = "pp. 571-572, 578, 583" }]

  [[positions.arguments]]
  stance = "for"
  text = """
Carson and Moo argue that "all the historical references in these letters ring true as statements coming from the life of Paul". They ask whether a later admirer would have had Paul call himself chief of sinners (1 Timothy 1:15) or recall that nobody stood by him (2 Timothy 4:16), and say no early church father knowingly accepted a pseudonymous book into the canon."""
  citations = [{ source = "carson-moo-2005", locator = "pp. 567-568" }]
  verses = [{ ref = "1Tim.1.15", link = "describes", note = "First Timothy 1:15 has Paul call himself the chief of sinners." }, { ref = "2Tim.4.16", link = "describes", note = "Second Timothy 4:16 has Paul say that nobody stood by him." }, { ref = "Titus.1.5", link = "dates", note = "Titus 1:5 says Titus was left in Crete." }]

[[positions]]
id = "ehrman-intro-end-first-century"
label = "Ehrman (textbook): not Paul, possibly near the end of the first century"
tradition = "critical"
earliest = 85
latest = 110
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook concludes that the Pastorals "appear not to have been written by Paul" but "sometime later, possibly near the end of the first century," by an otherwise unknown member of one of Paul's churches. The span of 85 to 110 shown here is the editor's, chosen to allow for his link to second-century church structure."""
citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 283 approx." }]

  [[positions.arguments]]
  stance = "for"
  text = """
He supports this from church order, which he finds already developed: "The clerical structure of these letters appears far removed from what we find in the letters of Paul," and is closer to second-century authors."""
  citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 283 approx." }]
  verses = [{ ref = "1Tim.3.1-1Tim.3.7", link = "describes", note = "First Timothy 3:1-7 lists the qualifications for the overseer." }, { ref = "Titus.1.5", link = "describes", note = "Titus 1:5 tells Titus to appoint elders in every town." }]
