id = "john-baptist-ministry"
title = "The ministry of John the Baptist"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
Luke dates the moment God's word came to John to the fifteenth year of Tiberius. Counting from Augustus's death in September 14 CE, scholars place the start of John's ministry in late 28 or early 29 CE."""
verses = [
  { ref = "Luke.3.1-Luke.3.2", link = "dates", note = "Luke dates the start of John's ministry to the fifteenth year of Tiberius, with Pilate governor of Judea." },
  { ref = "Luke.3.3-Luke.3.20", link = "describes", note = "Luke describes John's preaching, his baptizing and his imprisonment." },
  { ref = "Matt.3.1-Matt.3.12", link = "describes", note = "Matthew describes John preaching in the wilderness of Judea." },
  { ref = "Mark.1.2-Mark.1.8", link = "describes", note = "Mark describes John as the forerunner who baptizes." },
  { ref = "John.1.19-John.1.28", link = "describes", note = "John's Gospel describes his testimony at Bethany beyond the Jordan." },
  { ref = "Acts.13.24-Acts.13.25", link = "alludes", note = "In Acts, Paul recalls John's baptism of repentance, which refers back to this ministry." },
]

[[attestations]]
artifact = "josephus-antiquities-18-116"
relation = "consistent"
note = """
Josephus reports on John the Baptist independently. He tells of John's call to baptism and good living, and of his execution by Herod at Machaerus. He does not date John to Tiberius's fifteenth year, and he names no year and no Pilate. So he neither confirms nor contradicts Luke 3:1-2."""
citations = [{ source = "lexundria-josephus-ant-18-116", locator = "18.116-119" }]

[[positions]]
id = "28-29"
label = "Late 28 or early 29 CE"
tradition = "chronological"
earliest = 28
latest = 29
summary = """
Tiberius's reign began at Augustus's death in September 14 CE. So Luke 3:1-2 implies that John's ministry began in late 28 or early 29 CE. The page cited names no individual scholar who holds this."""
citations = [{ source = "wikipedia-chronology-of-jesus" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Luke names Tiberius's fifteenth year, Pontius Pilate as governor, and Herod as tetrarch of Galilee as the setting of John's call."""
  citations = [{ source = "wikipedia-chronology-of-jesus" }]
  verses = [{ ref = "Luke.3.1", link = "dates" }]

[[positions]]
id = "meier-28"
label = "End of 27 or early 28 CE (Meier)"
tradition = "critical"
earliest = 27
latest = 28
held_by = "John P. Meier"
summary = """
Meier takes the fifteenth year of Tiberius, counted from 14 CE, as most likely 28 CE, and has John begin around the end of 27 or the beginning of 28 CE, with Jesus baptized soon after. He calls this a "preliminary, not definitive, judgment", since Luke's reckoning could give 27 or 29. John's execution by Antipas fell in or before 30 or 33 on the Gospels' order, and in any case before the defeat by Aretas IV in 36 CE, which is where Josephus mentions it."""
citations = [
  { source = "meier-1991", locator = "pp. 383–384, 405" },
  { source = "meier-1994", locator = "pp. 22, 174" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
  Luke most likely counted Tiberius's years from Augustus's death in 14 CE, and almost every way of counting puts at least part of 28 CE in the fifteenth year. Counting by the Julian calendar without an accession year, 28 CE coincides exactly with it."""
  citations = [{ source = "meier-1991", locator = "pp. 383–384" }]
  verses = [{ ref = "Luke.3.1-Luke.3.2", link = "dates" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Josephus links Antipas's execution of John at Machaerus to the war with Aretas IV, so Josephus is the main source for his death, and Mark's story has errors and folkloric traits. The execution is therefore dated only to before 36 CE at the latest."""
  citations = [{ source = "meier-1994", locator = "pp. 22, 172–175" }]
  verses = [{ ref = "Mark.6.17-Mark.6.29", link = "describes" }]
