id = "john-baptist-ministry"
title = "The ministry of John the Baptist"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
Luke dates the moment God's word came to John to the fifteenth year of Tiberius. Counting from Augustus's death in September 14 CE, scholars place the start of John's ministry in late 28 or early 29 CE."""
verses = [
  { ref = "Luke.3.1-Luke.3.2", link = "dates", note = "The fifteenth year of Tiberius, with Pilate governor of Judea" },
  { ref = "Luke.3.3-Luke.3.20", link = "describes", note = "His preaching, his baptizing and his imprisonment" },
  { ref = "Matt.3.1-Matt.3.12", link = "describes", note = "John in the wilderness of Judea" },
  { ref = "Mark.1.2-Mark.1.8", link = "describes", note = "The forerunner, baptizing" },
  { ref = "John.1.19-John.1.28", link = "describes", note = "His testimony at Bethany beyond the Jordan" },
  { ref = "Acts.13.24-Acts.13.25", link = "alludes", note = "Paul recalls John's baptism of repentance" },
]

[[attestations]]
artifact = "josephus-antiquities-18-116"
relation = "consistent"
note = """
Josephus reports on John the Baptist independently. He tells of John's call to baptism and good living, and of his execution by Herod at Machaerus. He does not date John to Tiberius's fifteenth year, and he names no year and no Pilate. So he neither confirms nor contradicts Luke 3:1-2."""
citations = [{ source = "lexundria-josephus-ant-18-116", locator = "18.116-119" }]

[[positions]]
id = "28-29"
label = "Late 28 or early 29 CE"
tradition = "chronological"
earliest = 28
latest = 29
summary = """
Tiberius's reign began at Augustus's death in September 14 CE. So Luke 3:1-2 implies that John's ministry began in late 28 or early 29 CE. The page cited names no individual scholar who holds this."""
citations = [{ source = "wikipedia-chronology-of-jesus" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Luke names Tiberius's fifteenth year, Pontius Pilate as governor, and Herod as tetrarch of Galilee as the setting of John's call."""
  citations = [{ source = "wikipedia-chronology-of-jesus" }]
  verses = [{ ref = "Luke.3.1", link = "dates" }]
