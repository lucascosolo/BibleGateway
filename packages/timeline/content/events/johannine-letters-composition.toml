id = "johannine-letters-composition"
title = "Composition of 1, 2 and 3 John"
axis = "composition"
category = "composition"
confidence = "contested"
status = "sources-located"
books = ["1John", "2John", "3John"]
summary = """
This asks who wrote the three letters of John and when. None of them names its author in the usual way, and critical scholars place all three around the year 100, after the Gospel of John, as the Johannine community split. Whether one person wrote all three, and whether the Gospel's author wrote any, are not settled."""
verses = [
  { ref = "1John.2.18-1John.2.19", link = "describes", note = "Former members have left the community and are called antichrists." },
  { ref = "2John.1.1", link = "describes", note = "The writer calls himself the presbyter." },
  { ref = "3John.1.9-3John.1.10", link = "background", note = "Third John describes Diotrephes, who resists the presbyter's authority, as background to the letters' setting." },
]

[[positions]]
id = "brown-around-100"
label = "About 100 CE (3 John shortly after), after the Gospel, during a schism"
tradition = "critical"
earliest = 100
latest = 100
held_by = "Raymond E. Brown"
summary = """
Brown, a critical scholar, dates 1 John after the Gospel: "Most likely after the Gospel according to John; thus ca. AD 100." Of 1 John's author he says "probably not" the Gospel's writer. He places 2 John at about the same time ("ca. AD 100") and 3 John "shortly after AD 100". Brown gives no span, so the single year shown here is his "ca. AD 100"."""
citations = [
  { source = "brown-1997", locator = "ch. 12, Summary of Basic Information" },
  { source = "brown-1997", locator = "ch. 13, Summary of Basic Information" },
  { source = "brown-1997", locator = "ch. 14, Summary of Basic Information" },
]

  [[positions.arguments]]
  stance = "for"
  text = """
Brown ties the letters to a break inside the Johannine community: "The phase during which the Johannine Epistles, I and II John, were written (ca. AD 100). The community split in two", and many seceded, in the view of the author of 1 John 2:18–19."""
  citations = [{ source = "brown-1997", locator = "ch. 11, History of the Johannine Community" }]
  verses = [{ ref = "1John.2.18-1John.2.19", link = "dates", note = "First John speaks of former members leaving the community, the secession that is used to date the letter." }]

[[positions]]
id = "carson-moo-early-90s"
label = "The early 90s, by the apostle John, probably at Ephesus"
tradition = "traditional"
earliest = 90
latest = 93
held_by = "D. A. Carson and Douglas J. Moo"
summary = """
Carson and Moo write the standard evangelical introduction to the New Testament, and they defend the apostle John as the author of the three letters, probably writing from Ephesus. They place the letters after the Gospel, which they date at 80-85 CE, because the letters answer an early form of Gnosticism. They conclude it "appears best to date the Johannine epistles to the early 90s". The end of the span shown here is the editor's reading of that phrase."""
citations = [{ source = "carson-moo-2005", locator = "pp. 674–676" }]

  [[positions.arguments]]
  stance = "for"
  text = """
They argue that the writer's authority over several congregations, seen in the way he brands opponents as liars and antichrists and in 3 John 9, is most simply explained if he was an apostle. They say the main reasons for rejecting John come from reconstructions of a Johannine community, not from hard evidence."""
  citations = [{ source = "carson-moo-2005", locator = "pp. 674–675" }]
  verses = [{ ref = "3John.1.9", link = "describes", note = "Third John describes Diotrephes as loving to be first, which is read as a power play against an apostle's authority." }]

[[positions]]
id = "ehrman-intro-end-first-century"
label = "Near the end of the first century, by a member of the Johannine community"
tradition = "critical"
earliest = 90
latest = 100
held_by = "Bart D. Ehrman (Brief Introduction)"
summary = """
Ehrman's textbook says 1, 2 and 3 John "were written by a member of the Johannine community, near the end of the first century", and that the author was not the person who wrote the Gospel of John, though his views were very similar. He gives no year, so the span of 90 to 100 shown here is the editor's reading of "near the end of the first century"."""
citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 336 approx." }]

  [[positions.arguments]]
  stance = "for"
  text = """
Ehrman points to themes the letters share with the Fourth Gospel, often in the same words (light and darkness, the commandment to love one another). He takes this to show that all four books come from one community."""
  citations = [{ source = "ehrman-brief-intro-2017", locator = "p. 330 approx." }]
  verses = [{ ref = "1John.2.7", link = "describes", note = "First John speaks of the commandment as both old and new, as in John 13:34, which links the letter to the Gospel." }, { ref = "John.13.34", link = "describes", note = "John 13:34 gives the new commandment that 1 John shares, which links the two writings." }]
