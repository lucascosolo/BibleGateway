id = "canon-jerome-prologus-galeatus"
title = "Jerome's Helmeted Prologue sets the Hebrew books apart from the apocrypha"
axis = "canon"
category = "canon"
confidence = "firm"
status = "draft"
summary = """
Introducing his Latin translation of Samuel and Kings from the Hebrew, Jerome surveyed the Hebrew scriptures. He counts twenty-two books to match the Hebrew alphabet, or twenty-four if Ruth and Lamentations are counted separately, a number he compares with the twenty-four elders of Revelation. Whatever is not in his list, he says, is apocryphal: Wisdom, Sirach, Judith, Tobit and the Shepherd are not in the canon. The Latin church kept the Greek books, but the prologue became the main patristic authority for the shorter Old Testament. McDonald notes that Jerome's list broadly follows the Hebrew order of the books, as few Christian lists do."""
verses = [
  { ref = "Rev.4.4", link = "background", note = "The twenty-four elders, whom Jerome compares with the twenty-four books." },
  { ref = "1Sam.1.1", link = "background", note = "Samuel, the first book of the translation the prologue introduces." },
  { ref = "Ruth.1.1", link = "background", note = "Ruth, which Jerome says some count separately among the Writings." },
  { ref = "Lam.1.1", link = "background", note = "Lamentations, the other book some count separately." },
]

