id = "abraham-covenant"
title = "The covenant with Abraham"
axis = "narrative"
category = "biblical-narrative"
confidence = "speculative"
status = "draft"
summary = """
God's covenant with Abram: the promise of land and offspring sealed in the ritual of Genesis 15, renewed with circumcision as its sign in Genesis 17. Historicity is a separate question (see the linked issue)."""
verses = [
  { ref = "Gen.12.1-Gen.12.3", link = "describes", note = "The initial promise: a great nation and blessing for all families" },
  { ref = "Gen.15.1-Gen.15.21", link = "describes", note = "The covenant between the pieces; the land promised from the river of Egypt to the Euphrates" },
  { ref = "Gen.17.1-Gen.17.27", link = "describes", note = "Covenant renewed; name changed to Abraham; circumcision as the sign" },
  { ref = "Gen.22.15-Gen.22.18", link = "describes", note = "The promise reaffirmed after the binding of Isaac" },
  { ref = "Exod.2.24", link = "alludes", note = "God remembered his covenant with Abraham, Isaac and Jacob" },
  { ref = "Ps.105.8-Ps.105.11", link = "alludes", note = "He remembers his covenant forever, the covenant made with Abraham" },
  { ref = "Neh.9.7-Neh.9.8", link = "alludes", note = "God made a covenant with Abraham to give his descendants the land" },
  { ref = "Acts.7.8", link = "alludes", note = "Stephen: God gave him the covenant of circumcision" },
  { ref = "Rom.4.1-Rom.4.13", link = "alludes", note = "Paul: Abraham was counted righteous by faith, before circumcision" },
  { ref = "Gal.3.15-Gal.3.18", link = "alludes", note = "Paul: the promise to Abraham and his offspring precedes the law" },
  { ref = "Heb.11.17-Heb.11.19", link = "alludes", note = "Abraham, having received the promises, offered Isaac" },
]

