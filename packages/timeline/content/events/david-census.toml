id = "david-census"
title = "David's census and the threshing-floor"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "draft"
summary = """
David counts the people and a plague follows. David then buys the threshing-floor and builds an altar there. The place is later linked with the temple site. The Bible gives no year of his reign."""
verses = [
  { ref = "2Sam.24.1-2Sam.24.25", link = "describes", note = "The census, the plague and the purchase of the threshing-floor" },
  { ref = "1Chr.21.1-1Chr.22.1", link = "describes", note = "The parallel in Chronicles. Chapter 22:1 names it the site of the house" },
  { ref = "2Chr.3.1", link = "alludes", note = "Solomon builds on Mount Moriah, where Yahweh appeared to David at the threshing-floor" },
]

