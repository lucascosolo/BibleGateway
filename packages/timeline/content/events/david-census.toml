id = "david-census"
title = "David's census and the threshing-floor"
axis = "narrative"
category = "biblical-narrative"
confidence = "contested"
status = "claims-checked"
summary = """
David counts the people and a plague follows. David then buys the threshing-floor and builds an altar there, and the place is later linked with the temple site. The Bible gives no year of his reign for the census."""
verses = [
  { ref = "2Sam.24.1-2Sam.24.25", link = "describes", note = "2 Samuel 24 tells of the census, the plague and the purchase of the threshing-floor." },
  { ref = "1Chr.21.1-1Chr.22.1", link = "describes", note = "1 Chronicles 21:1-22:1 is the parallel account, and 22:1 names the threshing-floor as the site of the house." },
  { ref = "2Chr.3.1", link = "alludes", note = "2 Chronicles 3:1 says Solomon builds on Mount Moriah, where Yahweh appeared to David at the threshing-floor." },
]

[[positions]]
id = "fs-david-reign"
label = "Within David's reign, c. 1005-970 BCE (bounds, after Finkelstein and Silberman)"
tradition = "archaeological"
earliest = -1005
latest = -970
held_by = "Israel Finkelstein and Neil Asher Silberman"
summary = """
Finkelstein and Silberman give no date for the census, so these bounds are only the limits of David's reign as their table of the kings of the united monarchy gives it, ca. 1005-970 BCE after Gershon Galil's chronology. The same table finds no archaeological evidence for David's conquests or his empire."""
citations = [{ source = "finkelstein-silberman-2002", locator = "p. 131 (Table Two: David ca. 1005-970, after Galil)" }]

