id = "moabite-revolt"
title = "The Moabite revolt"
axis = "narrative"
category = "political"
confidence = "contested"
status = "sources-located"
summary = "Moab, led by King Mesha, rebels against Israel, and King Jehoram marches against it. A stone monument called the Mesha Stele tells the story from Moab's side."
verses = [
  { ref = "2Kgs.3.4-2Kgs.3.27", link = "describes", note = "Kings describes Mesha's revolt and the war that follows." },
  { ref = "2Kgs.1.1", link = "background", note = "Kings says Moab revolted after Ahab's death, which gives context for the revolt dated here." },
  { ref = "Isa.15.1-Isa.16.14", link = "alludes", note = "This oracle against Moab names the nation, though not the revolt itself." },
  { ref = "Jer.48.1-Jer.48.47", link = "alludes", note = "This oracle against Moab names the nation, though not the revolt itself." },
]

[[positions]]
id = "joram-reign"
label = "852-841 BCE (bounds)"
tradition = "chronological"
earliest = -852
latest = -841
held_by = "Rodger C. Young"
summary = "These dates are only outer limits. They are the years of Joram's reign from Rodger C. Young's Table 1. The Mesha Stele itself is dated to about 840."
citations = [{ source = "young-2005", locator = "Table 1, p. 245" }]

[[attestations]]
artifact = "mesha-stele"
relation = "in-tension"
note = "Mesha records the same revolt but contradicts Kings on when and how it ended. He says Israel held Medeba in Omri's time and half the time of his son, forty years, before Chemosh restored it in Mesha's own time, where 2 Kings 1:1 and 3:5 put the revolt after Ahab's death; and he says Israel 'hath perished for ever', where 2 Kings 3:24-27 has Israel defeat Moab before withdrawing."
citations = [{ source = "pritchard-1969", locator = "p. 320, Moabite Stone, trans. W. F. Albright" }, { source = "kitchen-2003", locator = "pp. 34–35" }]

[[positions]]
id = "kitchen-mesha-840"
label = "Revolt by about 850 BCE; stele no later than about 840/835 BCE (Kitchen)"
tradition = "archaeological"
earliest = -852
latest = -835
held_by = "K. A. Kitchen"
summary = """
Kitchen, an Egyptologist who defends the Bible's reliability, takes Jehoram's accession as about 852 and says Mesha's successful rebellion was hardly later than about 850. He calls about 840/835 the latest credible date for carving the stele, and even that too late."""
citations = [{ source = "kitchen-2003", locator = "p. 35" }]

  [[positions.arguments]]
  stance = "for"
  text = """
  Kitchen says Mesha's rebuilding could take "a couple of years to five or ten years at most", and that the stele was not a memorial written after his death. The Bible and the stele agree that Omri's dynasty ruled Moab as a vassal for many years."""
  citations = [{ source = "kitchen-2003", locator = "p. 35" }]
  verses = [{ ref = "2Kgs.3.4", link = "describes" }, { ref = "2Kgs.3.5", link = "describes" }]
