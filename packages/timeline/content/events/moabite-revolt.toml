id = "moabite-revolt"
title = "The Moabite revolt"
axis = "narrative"
category = "political"
confidence = "contested"
status = "sources-located"
summary = "Moab, led by King Mesha, rebels against Israel, and King Jehoram marches against it. A stone monument called the Mesha Stele tells the story from Moab's side."
verses = [
  { ref = "2Kgs.3.4-2Kgs.3.27", link = "describes", note = "Kings describes Mesha's revolt and the war that follows." },
  { ref = "2Kgs.1.1", link = "background", note = "Kings says Moab revolted after Ahab's death, which gives context for the revolt dated here." },
  { ref = "Isa.15.1-Isa.16.14", link = "alludes", note = "The oracle on Moab alludes to the nation involved in the revolt." },
  { ref = "Jer.48.1-Jer.48.47", link = "alludes", note = "The oracle on Moab alludes to the nation involved in the revolt." },
]

[[positions]]
id = "joram-reign"
label = "852-841 BCE (bounds)"
tradition = "chronological"
earliest = -852
latest = -841
held_by = "Rodger C. Young"
summary = "These dates are only outer limits. They are the years of Joram's reign from Rodger C. Young's Table 1. The Mesha Stele itself is dated to about 840."
