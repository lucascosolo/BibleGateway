id = "alexander-levant-332"
title = "Alexander's conquest of the Levant"
axis = "narrative"
category = "political"
confidence = "contested"
status = "draft"
summary = """
Alexander besieges and takes Tyre (January to July 332 BCE) and then moves south against Gaza (October 332 BCE). Daniel 8 and 11 are the passages usually brought to bear on the Greek conquest: Wikipedia's Daniel 8 article gives Collins (1984) as "Scholars agree that the goat's first horn, which is broken, is Alexander the Great, and the four horns ... the four generals who divided his empire", and its Daniel 11 article says verses 2-4 cover Alexander's conquests and the breakup of his empire (no scholar cited there). No Jerusalem episode was confirmed in sources read."""
verses = [
  { ref = "Dan.8.5-Dan.8.8", link = "alludes", note = "The goat from the west with one notable horn, broken, replaced by four; Collins (1984) via Wikipedia identifies the horn as Alexander" },
  { ref = "Dan.11.3", link = "alludes", note = "A mighty king who rules with great dominion; Daniel 11:2-4 read as Alexander and the breakup of his empire (Wikipedia, no scholar cited)" },
]

