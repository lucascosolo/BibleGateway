id = "alexander-levant-332"
title = "Alexander's conquest of the Levant"
axis = "narrative"
category = "political"
confidence = "contested"
status = "draft"
summary = """
Alexander besieges and takes Tyre from January to July 332 BCE. He then moves south against Gaza in October 332 BCE. Scholars usually read Daniel 8 and 11 as describing the Greek conquest. Wikipedia's Daniel 8 article gives Collins (1984): "Scholars agree that the goat's first horn, which is broken, is Alexander the Great, and the four horns ... the four generals who divided his empire". Its Daniel 11 article says verses 2-4 cover Alexander's conquests and the breakup of his empire, with no scholar cited. No visit to Jerusalem was confirmed in the sources read."""
verses = [
  { ref = "Dan.8.5-Dan.8.8", link = "alludes", note = "A goat from the west has one notable horn. It breaks and is replaced by four. Collins (1984), quoted by Wikipedia, identifies the horn as Alexander" },
  { ref = "Dan.11.3", link = "alludes", note = "A mighty king rules with great power. Daniel 11:2-4 is read as Alexander and the breakup of his empire (Wikipedia, no scholar cited)" },
]

[[positions]]
id = "332"
label = "332 BCE (Tyre January-July; Gaza October)"
tradition = "chronological"
earliest = -332
latest = -332
summary = """
The siege of Tyre lasted from January to July 332 BCE. Alexander then moved south to Gaza, which was besieged in October 332 BCE."""
citations = [{ source = "arrian-chinnock-1884", locator = "pp. 134–135: Tyre taken in Hecatombaion, archon Anicetus (= late July/early August 332), with Diodorus 17.46 for the seven months; p. 140 for the march from Gaza to Pelusium" }, { source = "wikipedia-siege-of-tyre-332", locator = "cites Arrian, Anabasis 2.24.4 and Diodorus 17.46.4 for casualties only; the months are not attributed there" }, { source = "wikipedia-alexander-the-great" }, { source = "wikipedia-daniel-8" }, { source = "wikipedia-daniel-11" }]

[[attestations]]
artifact = "arrian-anabasis-2-24"
relation = "corroborates"
note = """
Arrian gives the one firm date in the campaign: Tyre fell "in the month Hecatombaion, when Anicetus was archon at Athens", that is in the summer of 332 BCE. He then has Alexander move south to Gaza and on to Egypt. Arrian is a second-century writer working from the lost memoirs of Ptolemy and Aristobulus, so the date is secondhand but is the earliest surviving one. He does not mention Jerusalem; the visit to the city is told only by Josephus."""
citations = [{ source = "arrian-chinnock-1884", locator = "pp. 134–135, 140" }]
