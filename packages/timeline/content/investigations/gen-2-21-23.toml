id = "gen-2-21-23"
title = "Rib or side? Genesis 2:21-23"
status = "claims-checked"
ref = "Gen.2.21-Gen.2.23"
summary = """
God takes one of the man's tsela'ot and builds the woman from it. Every English edition in Jot says rib; elsewhere in the Hebrew Bible the same word means the side of the ark, the tabernacle, a hill or a building. The question is what it means here, and what the answer does to the story."""

[[witnesses]]
siglum = "MT"
name = "Masoretic Text (Leningrad Codex)"
reading = "אַחַת מִצַּלְעֹתָיו … הַצֵּלָע"
translation = "one of his tsela'ot … the tsela'"
language = "hbo"
note = "A plural noun in verse 21 (one of several, or one of two) and the singular in verse 22."
citations = [{ source = "oshb-wlc", locator = "Gen 2:21–22" }]

[[witnesses]]
siglum = "LXX"
name = "Septuagint (Brenton's Greek text)"
reading = "μίαν τῶν πλευρῶν αὐτοῦ … τὴν πλευρὰν"
translation = "one of his pleurai … the pleura"
language = "grc"
note = "Jot's Septuagint edition does not yet carry Genesis; the Greek is read from Brenton's printed text."
citations = [{ source = "brenton-lxx-greek", locator = "Gen 2:21–22" }]

[[witnesses]]
siglum = "Vg"
name = "Latin Vulgate (Clementine edition of 1598)"
reading = "unam de costis ejus … costam"
translation = "one of his costae … the costa"
language = "la"
citations = [{ source = "vulgate-clementine", locator = "Gen 2:21–22" }]

