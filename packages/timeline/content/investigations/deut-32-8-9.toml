name = "Latin Vulgate (Clementine edition of 1598)"
reading = "juxta numerum filiorum Israël"
translation = "according to the number of the sons of Israel"
language = "la"
note = "Agrees with the Masoretic Text. The Old Latin, which rests on the Greek, read angels of God (angelorum Dei) instead."
citations = [
