id = "deut-32-8-9"
title = "Sons of Israel or sons of God? Deuteronomy 32:8-9"
status = "claims-checked"
ref = "Deut.32.8-Deut.32.9"
summary = """
When the Most High divided the nations, he fixed their boundaries by the number of someone: the sons of Israel in the Masoretic Hebrew, the sons of God in a Qumran scroll and in the Greek. Six of Jot's eight English editions follow the Hebrew; the Berean Standard Bible prints the Qumran reading and Brenton's Septuagint the Greek majority, angels of God."""

[[witnesses]]
siglum = "MT"
name = "Masoretic Text (Leningrad Codex)"
reading = "בְּנֵי יִשְׂרָאֵל"
translation = "the sons of Israel"
language = "hbo"
note = "Tov lists the Samaritan Pentateuch and the Peshitta with it; Heiser adds the later Greek revisions of Aquila, Symmachus and Theodotion."
citations = [
  { source = "oshb-wlc", locator = "Deut 32:8" },
  { source = "tov-thetorah", locator = "table of variants" },
  { source = "heiser-2001", locator = "p. 52" },
]

[[witnesses]]
siglum = "4QDeut^j"
name = "Deuteronomy scroll j from Qumran Cave 4"
reading = "בני אלוהים"
translation = "the sons of God"
language = "hbo"
note = "Heiser counts the Qumran support as “very ancient manuscript evidence”. Tov thinks the scroll's longer word may have grown from an earlier בני אל, sons of El."
citations = [
  { source = "tov-2012", locator = "p. 248 (table) and p. 249 n. 78" },
  { source = "tov-thetorah", locator = "table of variants and n. 6" },
  { source = "heiser-2001", locator = "p. 55" },
]

[[witnesses]]
siglum = "LXX"
name = "Septuagint, most manuscripts"
reading = "ἀγγέλων θεοῦ"
translation = "the angels of God"
language = "grc"
note = "The majority Greek reading and the one Brenton prints. Heiser calls it “interpretive”: like the minority reading it presupposes a Hebrew sons of God, which the Greek of Job 1:6 and 2:1 also renders as angels of God (οἱ ἄγγελοι τοῦ θεοῦ)."
citations = [
  { source = "tov-2012", locator = "p. 248 (table)" },
  { source = "tov-thetorah", locator = "table of variants and n. 4" },
  { source = "heiser-2001", locator = "pp. 52–53" },
  { source = "brenton-lxx-greek", locator = "Deut 32:8" },
]

[[witnesses]]
siglum = "LXX 848"
name = "Septuagint, papyrus 848 (P. Fouad Inv. 266) and manuscript 106 corrected"
reading = "υἱῶν θεοῦ"
translation = "the sons of God"
language = "grc"
note = "A minority Greek reading in an early papyrus; Wevers adopted it in the Göttingen critical edition of Deuteronomy despite its fewer attestations."
citations = [
  { source = "tov-2012", locator = "p. 248 (table)" },
  { source = "tov-thetorah", locator = "table of variants and n. 2" },
  { source = "heiser-2001", locator = "p. 53 n. 4" },
]

[[witnesses]]
