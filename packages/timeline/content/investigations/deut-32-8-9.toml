[[differences]]
kind = "textual"
text = """
The witnesses differ in one word, and Emanuel Tov, emeritus J. L. Magnes Professor of Bible at the Hebrew University and editor of the Discoveries in the Judean Desert series, explains the difference as a deliberate scribal change. In his reconstruction the original Song spoke of an assembly of the gods, as in Psalm 82 and 1 Kings 22:19, and a scribe who “did not feel at ease with this polytheistic picture” replaced sons of El with sons of Israel, changing the passage's direction with one word. He calls MT's wording “a conscious intervention in the text by a scribe uncomfortable with the polytheistic picture of divine beings”. If the scroll's longer word (Elohim) is original rather than El, he would class the change as “theological in a general sense” rather than anti-polytheistic."""
held_by = "Emanuel Tov"
citations = [
  { source = "tov-2012", locator = "pp. 248–249 and p. 249 n. 78" },
  { source = "tov-thetorah", locator = "body text and author note" },
]

[[differences]]
kind = "interpretive"
text = """
Read with sons of God, verses 8-9 describe the Most High allotting the nations among divine beings while keeping Jacob as his own portion. Michael S. Heiser, writing in Bibliotheca Sacra as a PhD candidate in Hebrew and Semitic Studies at the University of Wisconsin–Madison, argues that the Old Testament's divine council (1 Kings 22:19-23; Psalm 82) “provides a decisive argument in favor of the Septuagint/Qumran reading”: after Babel God assigned each of the seventy nations of Genesis 10 to the sons of God, whom he reads as fallen, and who match the seventy sons of El at Ugarit. Unlike Tov, who reconstructs an originally polytheistic picture, Heiser holds that the reading “in no way requires one to view Israelite religion as polytheistic”."""
held_by = "Michael S. Heiser"
citations = [
  { source = "heiser-2001", locator = "pp. 52–55, 59–61, 71–74" },
  { source = "tov-2012", locator = "pp. 248–249" },
]

[[challenges]]
text = """
That sons of Israel is the original wording. Heiser grants it “a preponderance of the support”: the Masoretic Text with the Samaritan Pentateuch and the Peshitta, the later Greek revisions and the Vulgate. Its traditional explanation ties the number to the seventy of Jacob's household who went down to Egypt (Genesis 46:27; Exodus 1:5; Deuteronomy 10:22); Targum Pseudo-Jonathan already read it both of angels and of those seventy. David E. Stevens defended the Masoretic reading in Bibliotheca Sacra in 1997 and later accepted sons of God. None of the filed sources holds this view now: it is reported here through Tov, who calls the Masoretic claim “strange”, and Heiser, who answers it at length; a current defence of the Masoretic reading has not been filed."""
citations = [
  { source = "tov-thetorah", locator = "table of variants, body text and n. 4" },
  { source = "tov-2012", locator = "p. 249 n. 79" },
  { source = "heiser-2001", locator = "pp. 52–55 and p. 55 n. 12" },
]
